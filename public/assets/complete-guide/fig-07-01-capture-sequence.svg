<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">図7-1 捕獲の基本的な流れ</title>
  <desc id="desc">自分の前列穴と向かいの相手前列穴がともに占有されて捕獲が成立すると、相手穴のketeをすべて取り、対応する側のkichwaから自分側へ蒔く。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="960" height="500" fill="#fff"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700">捕獲: 相手のketeを自分側で蒔き直す</text>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="160" y="85" font-size="18" font-weight="700">1. 捕獲成立</text>
    <text x="480" y="85" font-size="18" font-weight="700">2. 相手穴を空にする</text>
    <text x="800" y="85" font-size="18" font-weight="700">3. kichwaから蒔く</text>
  </g>
  <g transform="translate(160 205)" font-family="sans-serif" text-anchor="middle"><circle cy="-55" r="44" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text y="-48" font-size="25">3</text><circle cy="55" r="44" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/><text y="62" font-size="25">2</text><line y1="8" y2="-8" stroke="#dc2626" stroke-width="5" stroke-dasharray="8 5"/></g>
  <g transform="translate(480 205)" font-family="sans-serif" text-anchor="middle"><circle cy="-55" r="44" fill="#fff" stroke="#2563eb" stroke-width="4"/><text y="-48" font-size="25">0</text><circle cy="55" r="44" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/><text y="62" font-size="25">2</text><g fill="#2563eb"><circle cx="-25" cy="145" r="9"/><circle cy="145" r="9"/><circle cx="25" cy="145" r="9"/></g></g>
  <g transform="translate(800 205)" font-family="sans-serif" text-anchor="middle"><circle cx="-80" cy="55" r="35" fill="#fef3c7" stroke="#111827" stroke-width="5"/><text x="-80" y="62" font-size="24">1</text><text x="-80" y="120" font-size="18">kichwa</text><circle cx="20" cy="55" r="35" fill="#fff" stroke="#6b7280" stroke-width="3"/><circle cx="120" cy="55" r="35" fill="#fff" stroke="#6b7280" stroke-width="3"/><text x="20" y="62" font-size="24">1</text><text x="120" y="62" font-size="24">1</text></g>
  <line x1="230" y1="205" x2="390" y2="205" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/><line x1="550" y1="205" x2="650" y2="205" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="430" text-anchor="middle" font-family="sans-serif" font-size="16">右の3穴は蒔く前に0個。捕獲した3個をkichwaから各1個ずつ置く。</text>
  <text x="480" y="465" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b5563">部分局面。蒔き方向は捕獲位置とkichwa・kimbiの規則で決まる。</text>
</svg>
