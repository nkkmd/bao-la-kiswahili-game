<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">図9-2 nyumbaからの2個蒔き</title>
  <desc id="desc">認められる条件でnyumbaからtakataを始めるときは、手元から1個をnyumbaへ入れた後、全内容ではなく2個だけを取り出し、選んだ方向へ1個ずつ蒔く。6個から始める例ではnyumbaに5個残り、6個以上を条件とする機能は一時停止する。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="900" height="390" fill="#fff"/>
  <text x="450" y="40" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700">nyumbaからは2個だけ取り出す</text>
  <rect x="95" y="115" width="120" height="120" rx="18" fill="#fef08a" stroke="#92400e" stroke-width="4"/><text x="155" y="185" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700">6</text>
  <line x1="230" y1="175" x2="340" y2="175" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="365" y="115" width="120" height="120" rx="18" fill="#fef08a" stroke="#92400e" stroke-width="4"/><text x="425" y="185" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700">5</text>
  <g fill="#ea580c"><circle cx="390" cy="285" r="12"/><circle cx="460" cy="285" r="12"/></g>
  <line x1="510" y1="175" x2="600" y2="175" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <g fill="#fff" stroke="#6b7280" stroke-width="3"><circle cx="660" cy="175" r="52"/><circle cx="790" cy="175" r="52"/></g><text x="660" y="184" text-anchor="middle" font-family="sans-serif" font-size="28">1</text><text x="790" y="184" text-anchor="middle" font-family="sans-serif" font-size="28">1</text>
  <g font-family="sans-serif" font-size="17" text-anchor="middle"><text x="155" y="270">開始前</text><text x="425" y="315">手元から1個入れ</text><text x="425" y="340">2個を取り出す</text><text x="725" y="270">選んだ方向へ蒔く</text></g>
  <text x="450" y="365" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b5563">6個に1個を加えてから2個を蒔くため5個残る。6個以上を条件とする機能は一時停止。</text>
</svg>
