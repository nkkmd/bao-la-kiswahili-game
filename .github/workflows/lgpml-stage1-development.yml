name: LGPML Stage 1 Development
on:
  push:
    branches: [research/g3-08-local-geometry-persistence-memory-length]
    paths: [doc/local-geometry-persistence-memory-length/authorizations/lgpml-stage1-trigger.txt]
concurrency:
  group: lgpml-stage1-development-v1
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 6}
      - name: Verify source-bound authorization
        run: node tools/experiments/verify-lgpml-stage1-authorization.js
      - name: Durable pre-computation lease
        run: |
          mkdir -p artifacts/lease
          printf '%s\n' "LGPML-S1-DEVELOPMENT-2026-09-03-v1" > artifacts/lease/stage.txt
          git rev-parse HEAD > artifacts/lease/trigger-head.txt
          git rev-parse HEAD^ > artifacts/lease/authorization-parent.txt
          sha256sum doc/local-geometry-persistence-memory-length/authorizations/STAGE_1_SCIENTIFIC_AUTHORIZATION.json > artifacts/lease/authorization.sha256
      - uses: actions/upload-artifact@v4
        with: {name: "lgpml-stage1-lease-${{ github.run_id }}", path: artifacts/lease, if-no-files-found: error}
      - name: Execute exactly one authorized fresh development computation
        run: |
          mkdir -p artifacts/local/local-geometry-persistence-memory-length/stage1
          node tools/experiments/run-lgpml-stage1-development.js --output artifacts/local/local-geometry-persistence-memory-length/stage1/scientific-result.json
      - name: Upload result before repository mirror
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "lgpml-stage1-result-${{ github.run_id }}", path: artifacts/local/local-geometry-persistence-memory-length/stage1/scientific-result.json, if-no-files-found: error}
