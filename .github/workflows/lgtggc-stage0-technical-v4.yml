name: LGTGGC Stage 0 Technical V4
on:
  push:
    branches:
      - research/g3-12-local-game-tree-geometry-generalization-counterexample
    paths:
      - doc/local-game-tree-geometry-generalization-counterexample/authorizations/lgtggc-stage0-v4-trigger.txt
concurrency:
  group: lgtggc-stage0-v4-technical
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  stage0-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax-check corrected technical tooling
        run: |
          node --check tools/experiments/lib/lgtggc-stage0-production.js
          node --check tools/experiments/lib/lgtggc-stage0-independent.js
          node --check tools/experiments/run-lgtggc-stage0-technical.js
          node --check tools/experiments/verify-lgtggc-stage0-v4-authorization.js
      - name: Verify v4 authorization and exact source binding
        run: node tools/experiments/verify-lgtggc-stage0-v4-authorization.js
      - name: Materialize durable v4 pre-computation lease
        run: |
          mkdir -p artifacts/lease
          printf '%s\n' 'LGTGGC-S0-TECHNICAL-2026-09-04-v4' > artifacts/lease/stage.txt
          git rev-parse HEAD > artifacts/lease/trigger-head.txt
          sha256sum doc/local-game-tree-geometry-generalization-counterexample/authorizations/STAGE_0_TECHNICAL_AUTHORIZATION_V4.json > artifacts/lease/authorization.sha256
          printf '%s\n' 'v1RunId=33847428204' 'v1FreshScientificSeedAccess=false' 'freshScientificSeedAccess=false' 'protectedDepth10Access=false' 'depth11Access=false' > artifacts/lease/firewall.txt
      - name: Upload v4 lease before technical computation
        uses: actions/upload-artifact@v4
        with:
          name: lgtggc-stage0-v4-lease-${{ github.run_id }}
          path: artifacts/lease
          if-no-files-found: error
      - name: Execute corrected technical fixture
        run: |
          mkdir -p artifacts/local/local-game-tree-geometry-generalization-counterexample/stage0-v4
          node tools/experiments/run-lgtggc-stage0-technical.js --output artifacts/local/local-game-tree-geometry-generalization-counterexample/stage0-v4/STAGE_0_TECHNICAL_RESULT.json
      - name: Enforce frozen Stage 0 resource ceilings
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='artifacts/local/local-game-tree-geometry-generalization-counterexample/stage0-v4/STAGE_0_TECHNICAL_RESULT.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8')),bytes=fs.statSync(p).size;
          if(x.stageId!=='LGTGGC-S0-TECHNICAL-2026-09-04-v4'||x.stageDisposition!=='STAGE0-PASS') throw new Error('Stage 0 v4 not PASS');
          if(x.telemetry.elapsedMs>900000) throw new Error('elapsed ceiling');
          if(x.telemetry.peakRssBytes>2147483648) throw new Error('RSS ceiling');
          if(bytes>134217728) throw new Error('artifact ceiling');
          if(x.core.firewall.freshScientificSeedAccess!==false||x.core.firewall.protectedDepth10Access!==false||x.core.firewall.depth11Access!==false) throw new Error('firewall');
          console.log(JSON.stringify({resourceGate:'PASS',bytes,elapsedMs:x.telemetry.elapsedMs,peakRssBytes:x.telemetry.peakRssBytes}));
          NODE
      - name: Upload v4 technical result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lgtggc-stage0-v4-result-${{ github.run_id }}
          path: artifacts/local/local-game-tree-geometry-generalization-counterexample/stage0-v4/STAGE_0_TECHNICAL_RESULT.json
          if-no-files-found: error
