name: LGTTCI Stage 1R pre-execution validation

on:
  pull_request:
    paths:
      - '.github/workflows/lgttci-stage1r-preflight.yml'
      - '.github/workflows/lgttci-stage1r-github-actions.yml'
      - '.github/actions/lgttci-stage1r-acquire-slot/action.yml'
      - 'tools/experiments/run-lgttci-stage1r-*.js'
      - 'tools/experiments/*lgttci-stage1r-actions*.js'
      - 'doc/local-game-tree-geometry-transfer-compatibility-instrument/prereg/STAGE_1R_RETEST_SPEC.json'
      - 'doc/local-game-tree-geometry-transfer-compatibility-instrument/prereg/STAGE_1R_GITHUB_ACTIONS_EXECUTION_AMENDMENT_V1.json'
      - 'doc/local-game-tree-geometry-transfer-compatibility-instrument/checkpoints/2026-09-17-stage1-execution-interrupted.md'

permissions:
  contents: read

jobs:
  technical-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check tools/experiments/run-lgttci-stage1r-source-unit.js
          node --check tools/experiments/run-lgttci-stage1r-source-orchestrator.js
          node --check tools/experiments/run-lgttci-stage1r-measurement-task.js
          node --check tools/experiments/run-lgttci-stage1r-aggregate.js
          node --check tools/experiments/verify-lgttci-stage1r-actions-authorization.js
          node --check tools/experiments/generate-lgttci-stage1r-actions-matrices.js
          node --check tools/experiments/classify-lgttci-stage1r-actions-artifacts.js
          node --check tools/experiments/bundle-lgttci-stage1r-actions-source.js
          node --check tools/experiments/validate-lgttci-stage1r-actions-design.js
          ruby -e 'require "yaml"; YAML.load_file(".github/actions/lgttci-stage1r-acquire-slot/action.yml"); YAML.load_file(".github/workflows/lgttci-stage1r-github-actions.yml")'
      - name: Detect pre-execution applicability
        id: phase
        shell: bash
        run: |
          AUTH=doc/local-game-tree-geometry-transfer-compatibility-instrument/authorizations/STAGE_1R_EXECUTION_AUTHORIZATION.json
          RESULT=doc/local-game-tree-geometry-transfer-compatibility-instrument/results/stage-1r/STAGE_1R_COMPATIBILITY_RESULT.json
          if [[ -e "$AUTH" || -e "$RESULT" ]]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Stage 1R has already executed; pre-execution absence assertions are no longer applicable."
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Assert no final authorization and no fresh result
        if: steps.phase.outputs.active == 'true'
        run: |
          test ! -e doc/local-game-tree-geometry-transfer-compatibility-instrument/authorizations/STAGE_1R_EXECUTION_AUTHORIZATION.json
          test ! -e doc/local-game-tree-geometry-transfer-compatibility-instrument/results/stage-1r/STAGE_1R_COMPATIBILITY_RESULT.json
      - name: Validate GitHub Actions execution design
        if: steps.phase.outputs.active == 'true'
        run: |
          node tools/experiments/validate-lgttci-stage1r-actions-design.js
          node tools/experiments/generate-lgttci-stage1r-actions-matrices.js > /tmp/stage1r-matrices.json
          node - <<'NODE'
          const m=require('/tmp/stage1r-matrices.json');
          if(m.sfcdf.include.length!==96) throw new Error('SFCDF matrix mismatch');
          if(m.silgm.include.length!==192) throw new Error('SILGM matrix mismatch');
          if(m.gcld.include.length!==96) throw new Error('GCLD matrix mismatch');
          if(m.measurement.include.length!==22) throw new Error('measurement matrix mismatch');
          NODE
      - name: Technical fixture source smoke
        if: steps.phase.outputs.active == 'true'
        run: |
          rm -rf /tmp/lgttci-stage1r-fixture
          mkdir -p /tmp/lgttci-stage1r-fixture/source/SFCDF /tmp/lgttci-stage1r-fixture/source/SILGM /tmp/lgttci-stage1r-fixture/source/GCLD
          node tools/experiments/run-lgttci-stage1r-source-unit.js --technical-fixture --block SFCDF --slot-seed 44010001 --effective-seed 44010001 --output /tmp/lgttci-stage1r-fixture/source/SFCDF/44010001.json
          node tools/experiments/run-lgttci-stage1r-source-unit.js --technical-fixture --block SILGM --slot-seed 44010001 --effective-seed 44010001 --output /tmp/lgttci-stage1r-fixture/source/SILGM/44010001.json
          node tools/experiments/run-lgttci-stage1r-source-unit.js --technical-fixture --block GCLD --slot-seed 44010001 --effective-seed 44010001 --output /tmp/lgttci-stage1r-fixture/source/GCLD/44010001.json
          node -e 'for (const p of process.argv.slice(1)) JSON.parse(require("fs").readFileSync(p,"utf8"))' /tmp/lgttci-stage1r-fixture/source/*/*.json
