name: GCLD Stage 1 Development
on:
  push:
    branches:
      - research/g3-10-geometry-conditioned-longitudinal-dynamics
    paths:
      - doc/geometry-conditioned-longitudinal-dynamics/authorizations/gcld-stage1-trigger.txt
concurrency:
  group: gcld-stage1-development
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  stage1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Syntax-check frozen GCLD Stage 1 tooling before fresh access
        run: |
          node --check tools/experiments/lib/gcld-production.js
          node --check tools/experiments/lib/gcld-independent.js
          node --check tools/experiments/run-gcld-stage1-development.js
          node --check tools/experiments/verify-gcld-stage1-authorization.js
      - name: Verify Stage 1 authorization and exact source binding
        run: node tools/experiments/verify-gcld-stage1-authorization.js
      - name: Materialize durable pre-computation lease before Stage 1 fresh seed access
        run: |
          mkdir -p artifacts/lease
          printf '%s\n' "GCLD-S1-DEVELOPMENT-2026-09-03-v1" > artifacts/lease/stage.txt
          git rev-parse HEAD > artifacts/lease/trigger-head.txt
          git rev-parse HEAD^ > artifacts/lease/authorization-parent.txt
          sha256sum doc/geometry-conditioned-longitudinal-dynamics/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION.json > artifacts/lease/authorization.sha256
      - name: Upload lease before scientific computation
        uses: actions/upload-artifact@v4
        with:
          name: gcld-stage1-lease-${{ github.run_id }}
          path: artifacts/lease
          if-no-files-found: error
      - name: Execute exactly one authorized Stage 1 scientific computation
        run: |
          mkdir -p artifacts/local/geometry-conditioned-longitudinal-dynamics/stage1
          node tools/experiments/run-gcld-stage1-development.js --output-dir artifacts/local/geometry-conditioned-longitudinal-dynamics/stage1
      - name: Upload canonical Stage 1 artifact before repository mirror
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcld-stage1-result-${{ github.run_id }}
          path: artifacts/local/geometry-conditioned-longitudinal-dynamics/stage1
          if-no-files-found: error
