name: CLGR G3-09 Final Consistency Audit

on:
  push:
    branches:
      - research/g3-09-continuous-local-geometry-representation
    paths:
      - doc/continuous-local-geometry-representation/executions/clgr-g3-09-final-consistency-audit-trigger.json

permissions:
  contents: write

concurrency:
  group: clgr-g3-09-final-consistency-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify audit syntax
        run: python3 -m py_compile tools/experiments/audit-clgr-g3-09-final-consistency.py
      - name: Run final repository and document consistency audit
        run: python3 tools/experiments/audit-clgr-g3-09-final-consistency.py
      - name: Commit final audit checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doc/continuous-local-geometry-representation/checkpoints/2026-09-03-final-repository-document-consistency-pass.md
          git diff --cached --check
          git commit -m 'Record G3-09 final consistency audit'
          git push origin HEAD:research/g3-09-continuous-local-geometry-representation
