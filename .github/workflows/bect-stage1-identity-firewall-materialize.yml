name: BECT Stage 1 Identity Firewall Materialize

on:
  push:
    branches:
      - research/g3-05-branch-expansion-compression-transition
    paths:
      - doc/branch-expansion-compression-transition/authorizations/STAGE1_IDENTITY_FIREWALL_TRIGGER

permissions:
  contents: read

concurrency:
  group: bect-stage1-identity-firewall-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify materializer and upstream bindings
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tools/experiments/materialize-bect-upstream-identity-firewall.js)" = "7913f0684d5028a0f5ab093525b3a4a37f6253ad"
          test "$(git hash-object doc/structural-forcing-corridor-decision-funnel/prereg/UPSTREAM_IDENTITY_FIREWALL.json)" = "9bc9debfa8df428eece243ca2ce49baf5707b9bf"
          test "$(git hash-object doc/structural-forcing-corridor-decision-funnel/prereg/STAGE_2_FORMAL_INPUT.json)" = "88563b39f2e9fec2bdf0e00eb40ec9debbba9ff0"
          test "$(git hash-object doc/structural-forcing-corridor-decision-funnel/results/stage-2/scientific-result.json)" = "099c45134e2816aac7bafdd5aab5ade03903c64a"
      - name: Materialize identity-only firewall
        run: node tools/experiments/materialize-bect-upstream-identity-firewall.js
      - name: Verify identity-only output boundary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const m=require('./doc/branch-expansion-compression-transition/prereg/UPSTREAM_IDENTITY_FIREWALL.json');
          if(m.scientificOutcomeFieldsRetained!==false)throw Error('scientific outcomes retained');
          if(m.g303DiagnosticScientificFieldsRetained!==false)throw Error('G3-03 scientific fields retained');
          if(m.g304ScientificOutcomeFieldsRetained!==false)throw Error('G3-04 scientific fields retained');
          if(m.freshBectStage1SeedAccess!==false||m.freshBectStage2SeedAccess!==false||m.protectedDepth10Access!==false)throw Error('protected evidence boundary changed');
          for(const k of ['rootRawSha256','sourceTrajectorySha256','openingPrefixSha256'])if(!Array.isArray(m.identitySets[k]))throw Error(`missing identity set ${k}`);
          console.log(`identityCoreSha256=${m.identityCoreSha256}`);
          console.log(`identityCounts=${JSON.stringify(m.identityCounts)}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: bect-stage1-identity-firewall-${{ github.run_id }}
          path: doc/branch-expansion-compression-transition/prereg/UPSTREAM_IDENTITY_FIREWALL.json
          if-no-files-found: error
          retention-days: 90
