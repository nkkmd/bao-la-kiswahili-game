name: SFCDF Stage 1 Development

on:
  push:
    branches:
      - research/g3-04-structural-forcing-corridor-decision-funnel
    paths:
      - doc/structural-forcing-corridor-decision-funnel/authorizations/STAGE1_EXECUTION_TRIGGER

permissions:
  contents: write

env:
  BRANCH: research/g3-04-structural-forcing-corridor-decision-funnel
  DOC: doc/structural-forcing-corridor-decision-funnel

concurrency:
  group: sfcdf-stage1-development-single-execution
  cancel-in-progress: false

jobs:
  lease:
    runs-on: ubuntu-24.04
    outputs:
      execute: ${{ steps.lease.outputs.execute }}
      lease_sha: ${{ steps.lease.outputs.lease_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - id: lease
        name: Acquire durable pre-computation lease
        shell: bash
        run: |
          set -euo pipefail
          AUTH="$DOC/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION.json"
          MARKER="$DOC/executions/stage-1-execution-started.json"
          RESULT="$DOC/results/stage-1/scientific-result.json"
          test -f "$AUTH"
          if test -f "$MARKER" || test -f "$RESULT"; then
            echo "execute=false" >> "$GITHUB_OUTPUT"
            echo "lease_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const a=require('./doc/structural-forcing-corridor-decision-funnel/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION.json');
          if(a.authorizationDecision!=='STAGE1-AUTHORIZED'||a.maxScientificExecutions!==1)throw Error('Stage 1 authorization invalid');
          for(const [p,h] of Object.entries(a.sourceBlobBindings||{})){
            const got=cp.execFileSync('git',['hash-object',p],{encoding:'utf8'}).trim();
            if(got!==h)throw Error(`source blob mismatch ${p}: ${got} != ${h}`);
          }
          NODE
          BASE=$(node -p "require('./$AUTH').authorizedScientificContentHead")
          NONCE=$(node -p "require('./$AUTH').authorizationNonce")
          git merge-base --is-ancestor "$BASE" HEAD
          while IFS= read -r p; do
            case "$p" in
              "$DOC/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION.json"|\
              "$DOC/checkpoints/2026-09-02-stage-1-development-authorization.md"|\
              "$DOC/authorizations/STAGE1_EXECUTION_TRIGGER") ;;
              *) echo "non-allowlisted post-authorization advancement: $p" >&2; exit 1;;
            esac
          done < <(git diff --name-only "$BASE"..HEAD)
          PARENT=$(git rev-parse HEAD)
          mkdir -p "$DOC/executions"
          cat > "$MARKER" <<EOF
          {
            "schemaVersion": 1,
            "studyId": "SFCDF-STUDY1",
            "stageId": "SFCDF-S1-DEVELOPMENT-2026-09-02-v1",
            "workflowRunId": ${GITHUB_RUN_ID},
            "authorizationNonce": "${NONCE}",
            "authorizedScientificContentHead": "${BASE}",
            "leaseParentSha": "${PARENT}",
            "freshScientificComputationStartedAtLeaseCreation": false,
            "maxScientificExecutions": 1
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MARKER"
          git commit -m "Acquire G3-04 Stage 1 execution lease"
          git push origin HEAD:"$BRANCH"
          LEASE_SHA=$(git rev-parse HEAD)
          echo "execute=true" >> "$GITHUB_OUTPUT"
          echo "lease_sha=$LEASE_SHA" >> "$GITHUB_OUTPUT"

  scientific:
    needs: lease
    if: needs.lease.outputs.execute == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.lease.outputs.lease_sha }}
          fetch-depth: 1
      - name: Execute the single authorized fresh Stage 1 computation
        env:
          SFCDF_EXECUTION_LEASE_CONFIRMED: "true"
          SFCDF_LEASE_COMMIT_SHA: ${{ needs.lease.outputs.lease_sha }}
        run: node tools/experiments/run-sfcdf-stage1-development.js
      - name: Upload canonical result before repository mirror
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfcdf-stage1-development-result-${{ github.run_id }}
          path: doc/structural-forcing-corridor-decision-funnel/results/stage-1/
          if-no-files-found: error
          retention-days: 90

  mirror:
    needs: [lease, scientific]
    if: always() && needs.lease.outputs.execute == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Download durable canonical artifact
        uses: actions/download-artifact@v4
        with:
          name: sfcdf-stage1-development-result-${{ github.run_id }}
          path: /tmp/sfcdf-stage1-artifact
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - name: Mirror exact uploaded bytes without recomputation
        shell: bash
        run: |
          set -euo pipefail
          test -f "$DOC/executions/stage-1-execution-started.json"
          test ! -f "$DOC/results/stage-1/scientific-result.json"
          mkdir -p "$DOC/results/stage-1"
          for name in scientific-result.json telemetry.json execution-summary.json; do
            src=$(find /tmp/sfcdf-stage1-artifact -type f -name "$name" -print -quit)
            test -n "$src"
            cp "$src" "$DOC/results/stage-1/$name"
          done
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DOC/results/stage-1"
          git commit -m "Mirror G3-04 Stage 1 canonical result"
          git push origin HEAD:"$BRANCH"
