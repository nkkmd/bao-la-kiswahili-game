name: MDFT Stage 1 Runner Readiness

on:
  push:
    branches:
      - research/g2-08-machine-decision-failure-taxonomy
    paths:
      - '.github/workflows/mdft-stage1-runner-readiness.yml'
      - 'tools/experiments/run-mdft-stage1-development.js'

permissions:
  contents: read

jobs:
  runner-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout prospective source
        uses: actions/checkout@v4
      - name: Validate scientific wrapper without execution
        run: |
          set -euo pipefail
          node --version
          git rev-parse HEAD
          node --check tools/experiments/run-mdft-stage1-development.js
          test ! -f doc/machine-decision-failure-taxonomy/authorizations/STAGE_1_EXECUTION_AUTHORIZATION.json
          node -e 'const fs=require("fs"),crypto=require("crypto"); const s=JSON.parse(fs.readFileSync("doc/machine-decision-failure-taxonomy/preregistration/STAGE_1_DEVELOPMENT_SPEC.json","utf8")); const stable=x=>x===null||typeof x!=="object"?JSON.stringify(x):Array.isArray(x)?`[${x.map(stable).join(",")}]`:`{${Object.keys(x).sort().map(k=>`${JSON.stringify(k)}:${stable(x[k])}`).join(",")}}`; const c=JSON.parse(JSON.stringify(s)); delete c.specSha256; const h=crypto.createHash("sha256").update(stable(c)).digest("hex"); if(h!==s.specSha256||h!=="85090d7820a1f3afcb8633b54d07aca408df648554f80262eb9e54ef9d8fe203") throw new Error(`spec hash mismatch ${h}`);'
          echo 'runner readiness PASS; no scientific execution performed'
