name: TMGC Stage 1 Tooling Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - research/g2-09-tactical-motif-generalization-counterexample
    paths:
      - '.github/workflows/tmgc-stage1-tooling-smoke.yml'
      - '.github/workflows/tmgc-stage1-development.yml'
      - 'tools/experiments/run-tmgc-stage1-tooling-smoke.js'
      - 'tools/experiments/run-tmgc-stage1-source-shard.js'
      - 'tools/experiments/aggregate-tmgc-stage1-source.js'
      - 'tools/experiments/measure-tmgc-stage1-shard.js'
      - 'tools/experiments/aggregate-tmgc-stage1-results.js'
      - 'tools/experiments/lib/tmgc-stage1-production.js'
      - 'tools/experiments/lib/tmgc-stage1-independent.js'
      - 'tools/experiments/lib/tmgc-stage1-boundary-production.js'
      - 'tools/experiments/lib/tmgc-stage1-boundary-independent.js'
      - 'doc/tactical-motif-generalization-counterexample/preregistration/STAGE_1_TOOLING_SMOKE_SPEC.json'
      - 'doc/tactical-motif-generalization-counterexample/preregistration/STAGE_1_2_BOUNDARY_CONTRACT.json'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check Stage 1 scientific tooling
        run: |
          node --check tools/experiments/run-tmgc-stage1-source-shard.js
          node --check tools/experiments/aggregate-tmgc-stage1-source.js
          node --check tools/experiments/measure-tmgc-stage1-shard.js
          node --check tools/experiments/aggregate-tmgc-stage1-results.js
          node --check tools/experiments/lib/tmgc-stage1-production.js
          node --check tools/experiments/lib/tmgc-stage1-independent.js
          node --check tools/experiments/lib/tmgc-stage1-boundary-production.js
          node --check tools/experiments/lib/tmgc-stage1-boundary-independent.js
      - name: Run technical-only tooling smoke
        run: |
          set -o pipefail
          mkdir -p artifacts/local/tmgc-stage1-tooling-smoke
          /usr/bin/time -v node tools/experiments/run-tmgc-stage1-tooling-smoke.js artifacts/local/tmgc-stage1-tooling-smoke 2>&1 | tee tmgc-stage1-tooling-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmgc-stage1-tooling-smoke-${{ github.sha }}
          path: |
            artifacts/local/tmgc-stage1-tooling-smoke/**
            tmgc-stage1-tooling-smoke.log
          if-no-files-found: error
          retention-days: 30
