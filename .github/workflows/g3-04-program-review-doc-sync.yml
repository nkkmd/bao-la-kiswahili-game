name: G3-04 Program Review Documentation Sync

on:
  push:
    branches:
      - research/g3-03-transposition-tree-graph-divergence
    paths:
      - doc/research-generation-3/G3_04_PROGRAM_REVIEW_DOC_SYNC_TRIGGER

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Sync current-facing documentation only
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, required=True):
              p=Path(path); s=p.read_text()
              if old not in s:
                  if required: raise SystemExit(f'missing expected text in {path}: {old[:100]!r}')
                  return False
              p.write_text(s.replace(old,new))
              return True

          # Research Generation 3 current status.
          p='doc/research-generation-3/CURRENT_STATUS.md'
          replace(p,
            'Program status = ACTIVE / G3-03 CLOSED TECHNICAL-INVALID / NEXT STUDY REVIEW REQUIRED',
            'Program status = ACTIVE / G3-03 CLOSED TECHNICAL-INVALID / G3-04 AUTHORIZED / PREREG FREEZE REQUIRED')
          replace(p,
            'Active scientific research branch = research/g3-03-transposition-tree-graph-divergence / CLOSURE DOCUMENTATION IN PROGRESS',
            'Active scientific research branch = none / G3-04 STUDY DEFINITION NOT YET FROZEN')
          replace(p,
            'Next scientific action = separate post-G3-03 current-state program review; no G3-04 or later fresh evidence is authorized',
            'Next scientific action = prospective G3-04 Study-definition / preregistration freeze; no G3-04 fresh evidence is authorized before freeze and separate Stage authorization')
          replace(p,
            'The next safe scientific action is a separate **post-G3-03 current-state program review**. Only if that review explicitly authorizes a next Study may a new prospective Study ID/protocol/seed block be frozen. No new fresh evidence may be generated before that authorization and freeze.',
            'The separate **post-G3-03 current-state program review** is complete and formally decided **`G3-04-AUTHORIZED`**. The next safe scientific action is a new prospective G3-04 Study-definition / preregistration freeze. This program authorization does not authorize fresh evidence; no G3-04 scientific evidence may be generated before the freeze and separate Stage authorization. Canonical review: `../research-program-decisions/2026-09-02-post-g3-03-g3-04-authorization-review.md`.')

          # RG3 README current boundary.
          p='doc/research-generation-3/README.md'
          replace(p,
            '次の安全な科学作業は、G3-03 closureを前提にした**separate post-G3-03 current-state program review**である。G3-04またはlater Studyは自動authorizeされない。新しいStudyを行う場合はreview後にnew prospective Study ID / protocol / seed / evidence firewallをoutcome前にfreezeする。',
            'separate post-G3-03 current-state program reviewは完了し、formal decisionは **`G3-04-AUTHORIZED`** である。次の安全な科学作業はG3-04のnew prospective Study ID / protocol / seed / evidence firewallをfresh evidence前にfreezeすることである。このprogram authorization自体はfresh scientific executionをauthorizeしない。')

          # Future agenda current header and Wave A status.
          p='doc/FUTURE_RESEARCH_AGENDA.md'
          replace(p,
            'Research Generation 3: **Active / G3-03 `TCTGD-STUDY1` closed `TECHNICAL-INVALID` / formal promoted candidate set `[]` / Stage 2 `NOT-AUTHORIZED-NOT-EXECUTED` / post-G3-03 program review required (2026-09-02)**',
            'Research Generation 3: **Active / G3-03 `TCTGD-STUDY1` closed `TECHNICAL-INVALID` / G3-04 `AUTHORIZED` for prospective Study-definition only / fresh evidence not yet authorized (2026-09-02)**')
          replace(p,
            '次のcore Studyを開始する前にseparate post-G3-03 program reviewを要求する。',
            'separate post-G3-03 program reviewは完了し、`G3-04-AUTHORIZED`となった。次はG3-04のprospective Study-definition / preregistration freezeであり、fresh evidenceはまだ未承認である。')
          replace(p,
            '- **G3-03 — Transposition Concentration / Tree-to-Graph Divergence Study 1**: tree occurrenceとunique RAW graphの乖離、multi-parent、reconvergenceをexactに測定する。symmetry quotientは使用しない。**P0**',
            '- **G3-03 — Transposition Concentration / Tree-to-Graph Divergence Study 1**: `TCTGD-STUDY1`として実行・closure済み。single authorized Stage 1でcanonical scientific coreはcross-implementation一致したが、prototype-sensitive in-memory equality gateにより`TECHNICAL-INVALID`。formal promoted candidate set `[]`、Stage 2 `NOT-AUTHORIZED-NOT-EXECUTED`。**P0 / CLOSED / TECHNICAL-INVALID**')
          replace(p,
            '- **G3-04 — Structural Forcing-Corridor / Decision-Funnel Study 1**: reply narrowingが持続するcorridorと、多数branchが少数RAW stateへ収束するfunnelを検証する。`forcing`はstructural forcingのみを意味する。**P0**',
            '- **G3-04 — Structural Forcing-Corridor / Decision-Funnel Study 1**: reply narrowingが持続するcorridorと、多数branchが少数RAW stateへ収束するfunnelを検証する。`forcing`はstructural forcingのみを意味する。post-G3-03 reviewで**`G3-04-AUTHORIZED`**（prospective Study-definitionのみ）。fresh evidenceは未承認。**P0 / AUTHORIZED-FOR-PREREG**')

          # Central research index current-state sentences only.
          p='doc/RESEARCH_INDEX.md'
          replace(p,
            'Next action requires a separate post-G3-03 program review.',
            'The separate post-G3-03 program review is complete: `G3-04-AUTHORIZED` for prospective Study-definition / preregistration only; fresh G3-04 evidence remains unauthorized until freeze and separate Stage authorization.')

          # Root README current-state sentence if present.
          p='README.md'
          replace(p,
            'post-G3-03 program review required',
            'post-G3-03 review complete / G3-04 AUTHORIZED for prospective prereg only',
            required=False)

          print('G3_04_PROGRAM_REVIEW_DOC_SYNC=PASS')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md doc/research-generation-3/CURRENT_STATUS.md doc/research-generation-3/README.md
          git commit -m "Sync documentation after G3-04 authorization review"
          git push origin HEAD:main
