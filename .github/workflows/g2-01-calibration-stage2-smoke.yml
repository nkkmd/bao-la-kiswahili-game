name: G2-01 Stage 2 technical smoke

on:
  push:
    branches:
      - research/g2-01-position-evaluation-empirical-outcome-calibration-replication
    paths:
      - '.github/workflows/g2-01-calibration-stage2-smoke.yml'
      - 'tools/experiments/lib/g2-01-calibration-stage2-common.js'
      - 'tools/experiments/validate-g2-01-calibration-stage2-spec.js'
      - 'tools/experiments/run-g2-01-calibration-stage2.js'
      - 'tools/experiments/verify-g2-01-calibration-stage2-independent.js'
      - 'tools/experiments/evaluate-g2-01-calibration-stage2.js'
      - 'tools/experiments/run-g2-01-calibration-stage2-smoke.js'
      - 'tools/experiments/verify-g2-01-calibration-stage2-smoke-independent.js'
      - 'doc/position-evaluation-empirical-outcome-calibration-replication/results/STAGE_1_REFERENCE_UNIVERSE_MANIFEST.json'

permissions:
  actions: read
  contents: read

jobs:
  stage2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit Stage 2 code and frozen contract
        run: |
          node --check tools/experiments/lib/g2-01-calibration-stage2-common.js
          node --check tools/experiments/validate-g2-01-calibration-stage2-spec.js
          node --check tools/experiments/run-g2-01-calibration-stage2.js
          node --check tools/experiments/verify-g2-01-calibration-stage2-independent.js
          node --check tools/experiments/evaluate-g2-01-calibration-stage2.js
          node --check tools/experiments/run-g2-01-calibration-stage2-smoke.js
          node --check tools/experiments/verify-g2-01-calibration-stage2-smoke-independent.js
          node test/g2-01-calibration-replication-contract.test.js
          node tools/experiments/validate-g2-01-calibration-stage2-spec.js
      - uses: actions/download-artifact@v4
        with:
          name: peocr-stage1-development-v1
          path: /tmp/peocr-stage1
          repository: nkkmd/bao-la-kiswahili-game
          run-id: 33017663172
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Stage 2 production technical smoke
        run: node tools/experiments/run-g2-01-calibration-stage2-smoke.js --stage1-output /tmp/peocr-stage1
      - name: Independently verify Stage 2 technical smoke
        run: node tools/experiments/verify-g2-01-calibration-stage2-smoke-independent.js --stage1-output /tmp/peocr-stage1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peocr-stage2-smoke-v1
          path: artifacts/local/position-evaluation-empirical-outcome-calibration-replication/stage2-smoke-v1
          if-no-files-found: error
          retention-days: 90
