name: BECT G3-05 Post-Sync Boundary Cleanup

on:
  push:
    branches:
      - research/g3-05-branch-expansion-compression-transition
    paths:
      - doc/branch-expansion-compression-transition/authorizations/POSTSYNC_BOUNDARY_CLEANUP_TRIGGER

permissions:
  contents: write

concurrency:
  group: bect-g3-05-postsync-boundary-cleanup-v1
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/g3-05-branch-expansion-compression-transition
          fetch-depth: 0
      - name: Verify immutable closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum doc/branch-expansion-compression-transition/results/stage-1/scientific-result.json | awk '{print $1}')" = "a21ad5449dfa090e4ff2ed87ebc64a48b5fb0755eabd0dcfe375358bde7d0b96"
          node - <<'NODE'
          const r=require('./doc/branch-expansion-compression-transition/results/stage-1/scientific-result.json');
          if(r.stageDisposition!=='TECHNICAL-INVALID'||r.actualScientificExecutions!==1||!r.seedBlockConsumed||!r.noRescueBoundaryCrossed)throw Error('closure drift');
          NODE
      - name: Remove stale pre-G3-05 current-facing boundaries
        run: node tools/experiments/finalize-bect-g3-05-postsync-boundaries.js
      - name: Audit current-facing boundary and immutable files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- doc/research-generation-3/PROGRAM_PLAN.md
          git diff --exit-code -- doc/branch-expansion-compression-transition/prereg/
          git diff --exit-code -- doc/branch-expansion-compression-transition/results/
          grep -q 'post-G3-05 current-state G3-06 authorization review' doc/research-generation-3/CURRENT_STATUS.md
          grep -q 'G3-06はまだauthorizeされていない' doc/research-generation-3/README.md
          grep -q 'G3-02 / G3-03 / G3-04 / G3-05' doc/research-generation-3/CURRENT_STATUS.md
          grep -q 'G3-02 / G3-03 / G3-04 / G3-05' doc/research-generation-3/README.md
          ! grep -q 'G3-05はまだauthorizeされていない' doc/research-generation-3/README.md
          ! grep -q 'post-G3-04 current-state G3-05 authorization review' doc/research-generation-3/CURRENT_STATUS.md
      - name: Commit boundary cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sawa"
          git config user.email "72678394+nkkmd@users.noreply.github.com"
          git add doc/FUTURE_RESEARCH_AGENDA.md doc/research-generation-3/CURRENT_STATUS.md doc/research-generation-3/README.md
          if git diff --cached --quiet; then
            echo 'No boundary cleanup changes needed.'
            exit 0
          fi
          git commit -m "Finalize post-G3-05 program boundary documentation"
          git push origin HEAD:research/g3-05-branch-expansion-compression-transition
