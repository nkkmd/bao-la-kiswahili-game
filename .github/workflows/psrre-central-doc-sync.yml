name: PSRRE Central Documentation Sync

# Archived after PSRRE-STUDY1 closure: no manual dispatch is exposed on main.
on:
  push:
    branches:
      - research/pre-g2-11-strategic-regime-representation-eligibility
    paths:
      - 'tools/experiments/finalize-psrre-central-docs.py'
      - '.github/workflows/psrre-central-doc-sync.yml'
      - 'doc/prospective-strategic-regime-representation-eligibility/checkpoints/2026-08-30-central-documentation-sync-request.md'

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/pre-g2-11-strategic-regime-representation-eligibility

      - name: Materialize central documentation
        run: python3 tools/experiments/finalize-psrre-central-docs.py

      - name: Normalize generated index whitespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('doc/RESEARCH_INDEX.md')
          lines = path.read_text(encoding='utf-8').splitlines()
          prefixes = (
              '**研究題目:** Baoにおける戦略状態・regime表現の新規構築とprospective eligibility検証',
              '**Program position:** Pre-G2-11 dependency-resolution prerequisite',
          )
          lines = [line.rstrip() if line.startswith(prefixes) else line for line in lines]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Documentation whitespace audit
        run: git diff --check

      - name: Commit synchronized documentation
        run: |
          if git diff --quiet; then
            echo 'No central documentation changes required.'
            exit 0
          fi
          git config user.name 'Sawa'
          git config user.email '72678394+nkkmd@users.noreply.github.com'
          git add README.md \
            doc/RESEARCH_INDEX.md \
            doc/FUTURE_RESEARCH_AGENDA.md \
            doc/research-program-decisions/2026-08-26-second-generation-pure-research-agenda.md \
            doc/research-program-decisions/2026-08-30-pre-g2-11-strategic-representation-prerequisite-selection.md
          git commit -m 'Synchronize PSRRE closure across central documentation [skip ci]'
          git push origin HEAD:research/pre-g2-11-strategic-regime-representation-eligibility
