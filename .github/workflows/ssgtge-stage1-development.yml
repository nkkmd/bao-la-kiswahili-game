name: SSGTGE Stage 1 Development

# Development-only estimator selection from immutable G2-05 depth 0..9 summaries.
# Fresh depth-10/depth-11 generation or read is prohibited.
on:
  push:
    branches:
      - research/g2-12-state-space-game-tree-growth-estimation
    paths:
      - 'doc/state-space-game-tree-growth-estimation/authorizations/STAGE_1_DEVELOPMENT_EXECUTE.json'

permissions:
  contents: read

jobs:
  development-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Environment and source integrity
        shell: bash
        run: |
          set -euo pipefail
          node --version
          git rev-parse HEAD
          git rev-parse HEAD^
          git status --short
          node --check tools/experiments/lib/ssgtge-production.js
          node --check tools/experiments/lib/ssgtge-independent.js
          node --check tools/experiments/run-ssgtge-stage1-development.js
          node --check tools/experiments/verify-ssgtge-stage1-independent.js

      - name: Run production development selection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/local/state-space-game-tree-growth-estimation/stage1-development-v1
          /usr/bin/time -v node tools/experiments/run-ssgtge-stage1-development.js \
            artifacts/local/state-space-game-tree-growth-estimation/stage1-development-v1 \
            2>&1 | tee artifacts-ssgtge-stage1-production.log

      - name: Run structurally independent development verification
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v node tools/experiments/verify-ssgtge-stage1-independent.js \
            artifacts/local/state-space-game-tree-growth-estimation/stage1-development-v1 \
            2>&1 | tee artifacts-ssgtge-stage1-independent.log

      - name: Preserve development artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssgtge-stage1-development-${{ github.sha }}
          path: |
            artifacts/local/state-space-game-tree-growth-estimation/stage1-development-v1/**
            artifacts-ssgtge-stage1-production.log
            artifacts-ssgtge-stage1-independent.log
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
