name: SILGM Stage 0 Technical v1
on:
  push:
    branches:
      - research/g3-07-search-instability-local-geometry-mechanism
    paths:
      - doc/search-instability-local-geometry-mechanism/authorizations/silgm-stage0-v1-trigger.txt
concurrency:
  group: silgm-stage0-technical-v1
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  stage0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Syntax-check frozen Stage 0 tooling
        run: |
          node --check tools/experiments/lib/silgm-production.js
          node --check tools/experiments/lib/silgm-independent.js
          node --check tools/experiments/run-silgm-stage0-technical.js
          node --check tools/experiments/verify-silgm-stage0-authorization.js
      - name: Verify exact Stage 0 authorization and source binding
        run: node tools/experiments/verify-silgm-stage0-authorization.js
      - name: Materialize durable pre-computation lease
        run: |
          mkdir -p artifacts/lease
          printf '%s\n' "SILGM-S0-TECHNICAL-2026-09-03-v1" > artifacts/lease/stage.txt
          git rev-parse HEAD > artifacts/lease/trigger-head.txt
          git rev-parse HEAD^ > artifacts/lease/tooling-parent.txt
          sha256sum doc/search-instability-local-geometry-mechanism/authorizations/STAGE_0_TECHNICAL_AUTHORIZATION.json > artifacts/lease/authorization.sha256
      - name: Upload lease before computation
        uses: actions/upload-artifact@v4
        with:
          name: silgm-stage0-v1-lease-${{ github.run_id }}
          path: artifacts/lease
          if-no-files-found: error
      - name: Execute exactly one authorized technical Stage 0 computation
        run: |
          mkdir -p artifacts/local/search-instability-local-geometry-mechanism/stage0-v1
          node tools/experiments/run-silgm-stage0-technical.js artifacts/local/search-instability-local-geometry-mechanism/stage0-v1/STAGE_0_TECHNICAL_RESULT.json
      - name: Upload Stage 0 result before any repository mirror
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silgm-stage0-v1-result-${{ github.run_id }}
          path: artifacts/local/search-instability-local-geometry-mechanism/stage0-v1/STAGE_0_TECHNICAL_RESULT.json
          if-no-files-found: error
