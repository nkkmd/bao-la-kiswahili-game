name: TMGC Stage 0 Contract Validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/g2-09-tactical-motif-generalization-counterexample
    paths:
      - '.github/workflows/tmgc-stage0-contract.yml'
      - 'tools/experiments/validate-tmgc-stage0-contract.js'
      - 'doc/tactical-motif-generalization-counterexample/preregistration/STUDY_CONTRACT.json'
      - 'doc/tactical-motif-generalization-counterexample/preregistration/STAGE_0_SOURCE_PREFLIGHT_SPEC.json'
      - 'doc/tactical-motif-generalization-counterexample/preregistration/STAGE_1_2_BOUNDARY_CONTRACT.json'
      - 'doc/tactical-motif-generalization-counterexample/preregistration/UPSTREAM_C03_FROZEN_REFERENCE.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen TMGC contract
        run: node tools/experiments/validate-tmgc-stage0-contract.js | tee tmgc-stage0-contract-result.json
      - name: Preserve result
        uses: actions/upload-artifact@v4
        with:
          name: tmgc-stage0-contract-${{ github.sha }}
          path: tmgc-stage0-contract-result.json
          if-no-files-found: error
          retention-days: 30
