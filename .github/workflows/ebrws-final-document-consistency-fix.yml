name: EBRWS final document consistency fix

on:
  push:
    branches:
      - research/g3-02-effective-branching-reply-width-structure
    paths:
      - "doc/effective-branching-reply-width-structure/checkpoints/2026-09-02-final-document-consistency-fix-trigger.md"

permissions:
  contents: write

jobs:
  docs-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/g3-02-effective-branching-reply-width-structure
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Materialize final consistency fixes
        run: node tools/experiments/materialize-ebrws-final-document-consistency-fixes.js

      - name: Validate patch
        run: |
          git diff --check
          git diff --exit-code -- doc/research-generation-3/PROGRAM_PLAN.md

      - name: Commit docs-only fixes
        run: |
          git config user.name "Sawa"
          git config user.email "72678394+nkkmd@users.noreply.github.com"
          git add README.md \
            doc/FUTURE_RESEARCH_AGENDA.md \
            doc/RESEARCH_INDEX.md \
            doc/research-generation-3/README.md \
            doc/effective-branching-reply-width-structure/README.md \
            doc/effective-branching-reply-width-structure/REPRODUCIBILITY_INDEX.md
          git commit -m "Finalize G3-02 current-facing document consistency"
          git push origin HEAD:research/g3-02-effective-branching-reply-width-structure
