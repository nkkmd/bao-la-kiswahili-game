name: GCSREA G4-09 Stage 2 exact-census premeasurement audit

on:
  push:
    branches:
      - research/g4-09-search-reliability-exact-agreement
    paths:
      - doc/geometry-conditioned-search-reliability-exact-agreement/authorizations/STAGE_2_EXACT_PREMEASUREMENT_AUDIT_TRIGGER.json

permissions:
  contents: read

concurrency:
  group: gcsrea-g4-09-stage2-exact-premeasurement-audit
  cancel-in-progress: false

jobs:
  exact-census-premeasurement-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout premeasurement source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax checks
        run: |
          set -euo pipefail
          node --check tools/experiments/run-gcsrea-stage2-exact-census.js
          node --check tools/experiments/lib/gcsrea-exact-agreement-production.js
          node --check tools/experiments/lib/gcsrea-exact-agreement-independent.js
          node --check tools/experiments/verify-gcsrea-stage1-exact-oracle-preflight.js

      - name: Re-verify exact oracle integrity without search measurement
        run: |
          set -euo pipefail
          mkdir -p artifacts/gcsrea-stage2-exact-premeasurement
          node tools/experiments/verify-gcsrea-stage1-exact-oracle-preflight.js \
            artifacts/gcsrea-stage2-exact-premeasurement/EXACT_ORACLE_INTEGRITY_PREFLIGHT.json

      - name: Run measurement-runner structural preflight only
        run: |
          set -euo pipefail
          node tools/experiments/run-gcsrea-stage2-exact-census.js \
            --preflight-only \
            --output artifacts/gcsrea-stage2-exact-premeasurement/PREMEASUREMENT_STRUCTURAL_RESULT.json

      - name: Verify protected boundary
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const x=JSON.parse(fs.readFileSync('artifacts/gcsrea-stage2-exact-premeasurement/PREMEASUREMENT_STRUCTURAL_RESULT.json','utf8'));
          const need=(v,m)=>{if(!v)throw new Error(m);};
          need(x.disposition==='STAGE2-EXACT-CENSUS-PREMEASUREMENT-STRUCTURAL-PASS','structural preflight failed');
          need(x.fixedDomainCount===8&&x.forcedRootCount===2&&x.nontrivialRootCount===6,'fixed census mismatch');
          need(x.legalIdentityProductionIndependentExact===true,'legal identity mismatch');
          need(x.actualFixed8SearchMeasurements===0&&x.productionSearchExecutions===0&&x.independentSearchExecutions===0,'search executed during premeasurement audit');
          need(x.generalStage2FreshSeedReads===0&&x.g410Depth11AccessCount===0&&x.scientificMeasurementPerformed===false,'protected boundary violation');
          NODE

      - name: Record audit metadata and hashes
        run: |
          set -euo pipefail
          node <<'NODE' > artifacts/gcsrea-stage2-exact-premeasurement/ACTIONS_EXECUTION_METADATA.json
          const row={
            schemaVersion:1,
            studyId:'GCSREA-STUDY1',
            stageId:'GCSREA-S2-EXACT-CENSUS-2026-09-27-v1',
            workflowRunId:Number(process.env.GITHUB_RUN_ID),
            workflowRunAttempt:Number(process.env.GITHUB_RUN_ATTEMPT),
            sourceSha:process.env.GITHUB_SHA,
            auditClass:'PREMEASUREMENT-STRUCTURAL / NO-SEARCH-EXECUTION',
            actualFixed8SearchMeasurements:0,
            productionSearchExecutions:0,
            independentSearchExecutions:0,
            generalStage2FreshSeedReads:0,
            g410Depth11AccessCount:0,
            scientificMeasurementPerformed:false
          };
          process.stdout.write(JSON.stringify(row,null,2)+'\n');
          NODE
          find artifacts/gcsrea-stage2-exact-premeasurement -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > artifacts/gcsrea-stage2-exact-premeasurement/SHA256SUMS.txt

      - name: Upload premeasurement audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: gcsrea-stage2-exact-premeasurement-${{ github.run_id }}
          path: artifacts/gcsrea-stage2-exact-premeasurement
          if-no-files-found: error
          retention-days: 90
