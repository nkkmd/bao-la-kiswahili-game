name: G5 BEFCS Joined Workload
on:
  push:
    branches: [research/g5-befcs-joined-preflight]
    paths: ['tools/research/g5-befcs-joined/**', 'test/g5-befcs-joined.test.cjs', 'doc/research-generation-5/befcs-joined-20261013/**', '.github/workflows/g5-befcs-joined-preflight.yml']
  pull_request:
    paths: ['tools/research/g5-befcs-joined/**', 'test/g5-befcs-joined.test.cjs', 'doc/research-generation-5/befcs-joined-20261013/**', '.github/workflows/g5-befcs-joined-preflight.yml']
permissions:
  contents: read
jobs:
  joined:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Validate refusal and immutable inputs
        run: |
          node --test test/g5-befcs-joined.test.cjs test/g5-befcs-supervisor.test.cjs test/g5-befcs-contained.test.cjs test/g5-befcs-envelope.test.cjs test/g5-befcs-pipeline.test.cjs
          node tools/research/g5-befcs-joined/run.cjs --bindings
      - name: Prepare exclusive 256 MiB fixture filesystem
        run: |
          node -e "const f=require('fs');f.mkdirSync('artifacts/local/befcs-joined',{recursive:true});const fd=f.openSync('artifacts/local/JOINED.img','wx');f.ftruncateSync(fd,268435456);f.closeSync(fd);"
          sudo mkfs.ext4 -q -F -m 0 artifacts/local/JOINED.img
          sudo mount -o loop,nosuid,nodev,noexec artifacts/local/JOINED.img artifacts/local/befcs-joined
          sudo chown "$(id -u):$(id -g)" artifacts/local/befcs-joined
          sudo chmod a+rx artifacts/local/befcs-joined/lost+found
      - name: Execute joined 128 source workload and early kernel stop
        run: node tools/research/g5-befcs-joined/run.cjs --ci-live
      - name: Preserve all stopped evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: befcs-joined-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/local/befcs-joined/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
      - name: Close only fixture mount
        if: always()
        run: sudo umount artifacts/local/befcs-joined || true
