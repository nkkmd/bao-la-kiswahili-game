name: RG3 Program Closure Agenda Ordering

on:
  push:
    branches:
      - research/g3-final-program-closure
    paths:
      - doc/research-generation-3/authorizations/rg3-program-closure-agenda-ordering-trigger.txt

permissions:
  contents: write

jobs:
  ordering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh main reference
        run: git fetch origin main --no-tags
      - name: Preserve helper for post-removal audit
        run: cp tools/experiments/finalize-rg3-agenda-ordering.py /tmp/finalize-rg3-agenda-ordering.py
      - name: Normalize agenda presentation order
        run: python3 tools/experiments/finalize-rg3-agenda-ordering.py --apply
      - name: Remove one-time write-capable tooling before final audit
        run: |
          git rm .github/workflows/rg3-program-closure-agenda-ordering.yml
          git rm tools/experiments/finalize-rg3-agenda-ordering.py
          git rm doc/research-generation-3/authorizations/rg3-program-closure-agenda-ordering-trigger.txt
      - name: Verify final agenda ordering and closure boundaries
        run: python3 /tmp/finalize-rg3-agenda-ordering.py --audit
      - name: Verify historical program plan unchanged
        run: test "$(git hash-object doc/research-generation-3/PROGRAM_PLAN.md)" = "2bb90c11f1625f63f40a7eab8a3de7774505a1ac"
      - name: Verify clean patch formatting
        run: git diff --check
      - name: Commit normalized final agenda ordering
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/research-generation-3/README.md doc/research-generation-3/CURRENT_STATUS.md doc/research-generation-3/checkpoints/2026-09-04-research-generation-3-final-polish-consistency-pass.md
          git diff --cached --quiet && { echo "No staged changes"; exit 1; }
          git commit -m "Normalize Research Generation 3 final agenda ordering"
          git push origin HEAD:research/g3-final-program-closure
