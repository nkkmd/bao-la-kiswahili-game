name: LWSRT G4-03 Stage 0 technical validation

on:
  push:
    branches:
      - "research/g4-03-width-ranking-transfer"
    paths:
      - "public/engine.js"
      - "public/ai.js"
      - "tools/experiments/run-lwsrt-stage0-technical.js"
      - "tools/experiments/lib/lgttci-compatibility-production.js"
      - "tools/experiments/lib/lgttci-compatibility-independent.js"
      - "tools/experiments/lib/lgtggc-stage0-production.js"
      - "tools/experiments/lib/lgtggc-stage0-independent.js"
      - "tools/experiments/lib/silgm-production.js"
      - "tools/experiments/lib/silgm-independent.js"
      - "tools/experiments/lib/search-reliability-decision-robustness.js"
      - "doc/local-width-search-ranking-transfer/**"
      - ".github/workflows/lwsrt-stage0-technical.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage0-technical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen branch state
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check Stage 0
        run: node --check tools/experiments/run-lwsrt-stage0-technical.js

      - name: Run technical-only Stage 0
        run: node tools/experiments/run-lwsrt-stage0-technical.js artifacts/lwsrt-stage0/result.json

      - name: Upload Stage 0 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lwsrt-stage0-result
          path: artifacts/lwsrt-stage0/result.json
          if-no-files-found: error
          retention-days: 30
