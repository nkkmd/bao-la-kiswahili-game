name: AI-GEN3 release verification
on:
  pull_request:
    paths:
      - 'public/engine.js'
      - 'public/ai.js'
      - 'public/ai-config.js'
      - 'public/ai-worker.js'
      - 'public/main.js'
      - 'public/index.html'
      - 'public/privacy.html'
      - 'public/robots.txt'
      - 'public/sitemap.xml'
      - 'public/style.css'
      - 'public/locale.js'
      - 'public/review-suggestion.js'
      - 'public/manifest.webmanifest'
      - 'public/service-worker.js'
      - 'test/ai-config.test.js'
      - 'test/ai-generation-release.test.js'
      - 'test/locale.test.js'
      - 'test/seo.test.js'
      - 'doc/ai-engineering/public-ai-improvement-program-5/**'
      - 'tools/engineering/audit-pbai-p5-results.py'
      - 'tools/takasia/check-current-assets.cjs'
      - 'tools/takasia/run-historical-ci.cjs'
      - '.github/workflows/pbai-c011-staged-release.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Verify current engine, AI, config, UI and Worker behavior
        run: |
          for test_file in \
            test/engine.test.js \
            test/ai-config.test.js \
            test/ai-generation-release.test.js \
            test/locale.test.js \
            test/seo.test.js \
            test/ai.test.js \
            test/search.test.js \
            test/tactical.test.js \
            test/ai-worker.test.js \
            test/worker-integration.test.js \
            test/pbai-p4-transitions.test.js \
            test/diagnostics-ui.test.js \
            test/namua-mtaji-transition-engine.test.js \
            test/benchmark.test.js
          do
            node "$test_file"
          done
      - name: 旧releaseのassertと資産ハッシュを固定版で検証
        run: node tools/takasia/run-historical-ci.cjs gen3
      - name: 完了済みP5の証拠を旧実行経路で検証
        run: node tools/takasia/run-historical-ci.cjs p5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: takasia-history-gen3-p5
          path: artifacts/local/takasia-history/
          if-no-files-found: error
