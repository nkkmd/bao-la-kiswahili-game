name: PBAI-P11 expert正式再試験
on:
  pull_request:
    paths:
      - '.github/workflows/pbai-p11-formal.yml'
      - 'doc/ai-engineering/public-ai-improvement-program-11/**'
      - 'tools/engineering/*pbai-p11*'
      - 'tools/engineering/lib/pbai-p11*'
permissions:
  contents: read
  actions: read
jobs:
  authorize:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 既知データによる事前確認
        run: |
          python tools/engineering/test-pbai-p11-control.py
          node tools/engineering/test-pbai-p11-known.cjs
      - name: 単一の実行IDへの事前結付けを待つ
        id: authorize
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/engineering/authorize-pbai-p11.cjs
      - name: 一度限りの開始記録
        if: steps.authorize.outputs.allowed == 'true'
        run: python tools/engineering/control-pbai-p11.py init
      - uses: actions/upload-artifact@v4
        if: always() && steps.authorize.outputs.allowed == 'true'
        with:
          name: pbai-p11-checkpoint-initial
          path: artifacts/pbai-p11/run/
          if-no-files-found: error
          retention-days: 7
  b000:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 165
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: pbai-p11-checkpoint-initial
          path: artifacts/pbai-p11/run/
      - name: 保存点の検証と未消費8ペアの対局
        run: python tools/engineering/control-pbai-p11.py batch 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pbai-p11-checkpoint-000
          path: artifacts/pbai-p11/run/
          if-no-files-found: error
          retention-days: 7
