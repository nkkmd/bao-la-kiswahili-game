name: G3-08 Main Integration Finalize

on:
  push:
    branches:
      - research/g3-08-main-integration-finalize
    paths:
      - doc/local-geometry-persistence-memory-length/triggers/MAIN_INTEGRATION_FINALIZE.txt

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - name: Verify branch and trigger-only commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "research/g3-08-main-integration-finalize"
          test "$(git diff --name-only HEAD^ HEAD)" = "doc/local-geometry-persistence-memory-length/triggers/MAIN_INTEGRATION_FINALIZE.txt"
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "72bd208267359f461e9dbbde938bb952eb01b91c"
      - name: Finalize integration metadata
        run: python3 tools/experiments/finalize-g3-08-main-integration.py
      - name: Verify documentation-only patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | tee /tmp/changed.txt
          test -s /tmp/changed.txt
          ! grep -E '(^public/|^test/|results/stage-1/scientific-result.json$|/prereg/|tools/experiments/lib/|run-lgpml|verify-lgpml)' /tmp/changed.txt
          test "$(git hash-object doc/research-generation-3/PROGRAM_PLAN.md)" = "2bb90c11f1625f63f40a7eab8a3de7774505a1ac"
      - name: Commit integration lifecycle documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md doc
          git commit -m 'Record G3-08 main integration completion'
          git push origin HEAD:research/g3-08-main-integration-finalize
