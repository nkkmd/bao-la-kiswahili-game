name: FDEGHV G3-11 final documentation sync

on:
  push:
    branches:
      - research/g3-11-fresh-depth10-exact-geometry-holdout
    paths:
      - doc/fresh-depth10-exact-geometry-holdout/authorizations/FINAL_DOC_SYNC.json

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard scientific source and historical plan
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object doc/research-generation-3/PROGRAM_PLAN.md)" = "2bb90c11f1625f63f40a7eab8a3de7774505a1ac"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "e537199a959c0808cbef6cf8aaeb1caab91e3702"
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('doc/fresh-depth10-exact-geometry-holdout/results/stage-1/STAGE_1_FORMAL_RESULT.json').read_text())
          assert r['formalDecision']=='EXACT-WITHIN-FROZEN-DEPTH-10-DOMAIN'
          assert r['scientificResultCoreSha256']=='5cfaffe66b8b2a2bf710c6acbc28cfa714bc4bab5dd48b8cae8b50ef42162bd9'
          assert r['fullIndependentExactRecomputationPassed'] is True
          assert r['depth11Accessed'] is False
          assert r['sameEvidenceRerunAuthorized'] is False
          PY

      - name: Synchronize current-facing documentation
        shell: bash
        run: |
          set -euo pipefail
          before_plan="$(git hash-object doc/research-generation-3/PROGRAM_PLAN.md)"
          python3 tools/experiments/fdeeghv-final-doc-sync.py
          after_plan="$(git hash-object doc/research-generation-3/PROGRAM_PLAN.md)"
          test "$before_plan" = "$after_plan"
          test "$after_plan" = "2bb90c11f1625f63f40a7eab8a3de7774505a1ac"
          git diff --exit-code -- doc/research-generation-3/PROGRAM_PLAN.md

      - name: Final semantic guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'FDEGHV-STUDY1' README.md
          grep -q 'EXACT-WITHIN-FROZEN-DEPTH-10-DOMAIN' doc/RESEARCH_INDEX.md
          grep -q 'protected depth-10 CONSUMED EXACTLY ONCE' doc/FUTURE_RESEARCH_AGENDA.md
          grep -q 'G3-11 main integration = NOT AUTHORIZED / NOT PERFORMED' doc/research-generation-3/README.md
          grep -q 'G3-11 main integration = NOT AUTHORIZED / NOT PERFORMED' doc/research-generation-3/CURRENT_STATUS.md
          ! grep -q 'PRE-HOLDOUT-FREEZE' doc/fresh-depth10-exact-geometry-holdout/README.md
          ! grep -q 'PRE-HOLDOUT-FREEZE' doc/fresh-depth10-exact-geometry-holdout/CURRENT_STATUS.md
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "e537199a959c0808cbef6cf8aaeb1caab91e3702"

      - name: Commit synchronized documentation to research branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md \
            doc/RESEARCH_INDEX.md \
            doc/FUTURE_RESEARCH_AGENDA.md \
            doc/research-generation-3/README.md \
            doc/research-generation-3/CURRENT_STATUS.md \
            doc/fresh-depth10-exact-geometry-holdout/README.md \
            doc/fresh-depth10-exact-geometry-holdout/CURRENT_STATUS.md
          git commit -m "Synchronize G3-11 formal closure documentation"
          git push origin HEAD:research/g3-11-fresh-depth10-exact-geometry-holdout
