name: G2-01 Stage 1 scientific generation

on:
  push:
    branches:
      - research/g2-01-position-evaluation-empirical-outcome-calibration-replication
    paths:
      - 'doc/position-evaluation-empirical-outcome-calibration-replication/preregistration/STAGE_1_DEVELOPMENT_AUTHORIZATION.json'

permissions:
  contents: read

jobs:
  stage1-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit contract and Stage 1 spec
        run: |
          node test/g2-01-calibration-replication-contract.test.js
          node tools/experiments/validate-g2-01-calibration-stage1-spec.js
      - name: Generate and measure fresh Stage 1 development corpus
        run: node tools/experiments/run-g2-01-calibration-stage1.js --phase all
      - name: Independently replay and verify Stage 1
        run: node tools/experiments/verify-g2-01-calibration-stage1-independent.js
      - name: Apply frozen readiness gates and fit PAVA mapping
        run: node tools/experiments/analyze-g2-01-calibration-stage1.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peocr-stage1-development-v1
          path: artifacts/local/position-evaluation-empirical-outcome-calibration-replication/stage1-development-v1
          if-no-files-found: error
          retention-days: 90
