name: Phase Transition Independent Confirmation

on:
  pull_request:
    paths:
      - "config/experiments/phase-transition-independent-confirmation-v2.json"
      - "config/experiments/phase-transition-independent-confirmation-execution-policy-v1.json"
      - "tools/experiments/evaluate-phase-transition-independent-confirmation.js"
      - "tools/experiments/analyze-confirmation-trajectory-duplication.js"
      - "tools/experiments/prepare-phase-transition-independent-confirmation-execution.js"
      - "tools/experiments/run-phase-transition-independent-confirmation-formal.js"
      - "tools/experiments/verify-phase-transition-independent-confirmation.js"
      - "test/phase-transition-independent-confirmation.test.js"
      - "test/phase-transition-independent-confirmation-formal.test.js"
      - ".github/workflows/phase-transition-independent-confirmation.yml"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          node test/phase-transition-independent-confirmation.test.js
          node test/phase-transition-independent-confirmation-formal.test.js
