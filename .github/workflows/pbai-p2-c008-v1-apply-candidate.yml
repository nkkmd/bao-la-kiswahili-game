name: PBAI-P2 C008 apply candidate

on:
  push:
    branches:
      - engineering/pbai-p2-c008-v1-development
    paths:
      - 'tools/engineering/apply-pbai-p2-c008-v1-candidate.js'
      - '.github/workflows/pbai-p2-c008-v1-apply-candidate.yml'

permissions:
  contents: write

jobs:
  apply-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engineering/pbai-p2-c008-v1-development
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify pre-implementation boundary
        run: |
          test "$(sha256sum public/ai.js | awk '{print $1}')" = "2823dbcf96c7a47489301ecd768a63975aa8b4e12b62cc4629fc8283ef5dff9e"
          test "$(sha256sum public/engine.js | awk '{print $1}')" = "e6acf1fe4d97db67dbcfadc3a785e802342ae0b0cbaec35f53eb8e77424cfc1c"
          node --check tools/engineering/apply-pbai-p2-c008-v1-candidate.js

      - name: Apply exact frozen candidate transform
        run: node tools/engineering/apply-pbai-p2-c008-v1-candidate.js

      - name: Verify candidate source surface
        run: |
          node --check public/ai.js
          changed_public="$(git diff --name-only -- public/)"
          test "$changed_public" = "public/ai.js" || {
            echo 'candidate transformer modified unexpected public files' >&2
            printf '%s\n' "$changed_public" >&2
            exit 1
          }
          grep -q 'pbaiC008RootFlipConfirmation' public/ai.js
          test "$(sha256sum public/engine.js | awk '{print $1}')" = "e6acf1fe4d97db67dbcfadc3a785e802342ae0b0cbaec35f53eb8e77424cfc1c"

      - name: Commit candidate source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/ai.js
          git commit -m 'Implement PBAI-P2 C008-v1 candidate'
          git push origin HEAD:engineering/pbai-p2-c008-v1-development
