name: SILGM Stage 2 Preauthorization Static Audit v1

on:
  push:
    branches:
      - research/g3-07-search-instability-local-geometry-mechanism
    paths:
      - doc/search-instability-local-geometry-mechanism/triggers/STAGE_2_PREAUTH_STATIC_AUDIT_TRIGGER.json

permissions:
  contents: read

concurrency:
  group: silgm-stage2-preauthorization-static-v1
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Syntax-check Stage 2 preauthorization tooling
        run: |
          node --check tools/experiments/lib/silgm-stage2-production.js
          node --check tools/experiments/lib/silgm-stage2-independent.js
          node --check tools/experiments/run-silgm-stage2-formal.js
          node --check tools/experiments/verify-silgm-stage2-preauthorization.js
      - name: Verify frozen Stage 2 source binding and firewalls
        run: |
          mkdir -p artifacts/local/search-instability-local-geometry-mechanism/stage2-preauthorization-v1
          node tools/experiments/verify-silgm-stage2-preauthorization.js \
            --output artifacts/local/search-instability-local-geometry-mechanism/stage2-preauthorization-v1/PREAUTH_AUDIT_RESULT.json
      - name: Verify Stage 2 runner fails closed while unarmed
        run: node tools/experiments/run-silgm-stage2-formal.js --unarmed-smoke
      - name: Upload preauthorization audit before repository mirror
        uses: actions/upload-artifact@v4
        with:
          name: silgm-stage2-preauthorization-v1-${{ github.run_id }}
          path: artifacts/local/search-instability-local-geometry-mechanism/stage2-preauthorization-v1/PREAUTH_AUDIT_RESULT.json
          if-no-files-found: error
          overwrite: false
