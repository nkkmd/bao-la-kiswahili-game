name: FDEGHV G3-11 Stage 0 technical

on:
  push:
    branches:
      - research/g3-11-fresh-depth10-exact-geometry-holdout
    paths:
      - doc/fresh-depth10-exact-geometry-holdout/authorizations/STAGE_0_EXECUTE.json

permissions:
  contents: write

jobs:
  technical:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Run technical-only controls
        id: technical
        shell: bash
        run: |
          set +e
          export FDEGHV_STAGE0_OUT="$RUNNER_TEMP/fdeeghv-stage0"
          node tools/experiments/run-fdeeghv-stage0-technical.js
          code=$?
          echo "$code" > "$RUNNER_TEMP/fdeeghv-stage0-exit-code"
          exit 0
      - name: Upload durable Stage 0 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdeeghv-stage0-technical-${{ github.run_id }}
          path: ${{ runner.temp }}/fdeeghv-stage0/
          if-no-files-found: error
          retention-days: 90
      - name: Mirror result and synchronize pre-access wording
        shell: bash
        run: |
          code=$(cat "$RUNNER_TEMP/fdeeghv-stage0-exit-code")
          mkdir -p doc/fresh-depth10-exact-geometry-holdout/results/stage-0
          cp "$RUNNER_TEMP/fdeeghv-stage0/STAGE_0_TECHNICAL_RESULT.json" doc/fresh-depth10-exact-geometry-holdout/results/stage-0/STAGE_0_TECHNICAL_RESULT.json
          if [ "$code" = "0" ]; then
            before_plan=$(git hash-object doc/research-generation-3/PROGRAM_PLAN.md)
            python3 tools/experiments/fdeeghv-preaccess-doc-sync.py
            after_plan=$(git hash-object doc/research-generation-3/PROGRAM_PLAN.md)
            test "$before_plan" = "$after_plan"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/fresh-depth10-exact-geometry-holdout/results/stage-0/STAGE_0_TECHNICAL_RESULT.json doc/FUTURE_RESEARCH_AGENDA.md
          git commit -m "Record G3-11 Stage 0 technical result" || true
          git push origin HEAD:research/g3-11-fresh-depth10-exact-geometry-holdout
          if [ "$code" != "0" ]; then exit "$code"; fi
