name: BRMGI Stage 1 Development
on:
  push:
    branches:
      - research/g3-06-bao-rule-mechanism-geometry-intervention
    paths:
      - doc/bao-rule-mechanism-geometry-intervention/authorizations/brmgi-stage1-trigger.txt
concurrency:
  group: brmgi-stage1-development-v1
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Verify Stage 1 authorization chain and source blobs
        run: node tools/experiments/verify-brmgi-stage1-authorization.js
      - name: Materialize durable scientific lease
        run: |
          mkdir -p artifacts/stage1-lease
          printf '%s\n' "BRMGI-S1-DEVELOPMENT-2026-09-02-v1" > artifacts/stage1-lease/stage.txt
          git rev-parse HEAD > artifacts/stage1-lease/trigger-head.txt
          cp doc/bao-rule-mechanism-geometry-intervention/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION.json artifacts/stage1-lease/authorization.json
      - name: Upload lease before fresh computation
        uses: actions/upload-artifact@v4
        with:
          name: brmgi-stage1-development-lease-${{ github.run_id }}
          path: artifacts/stage1-lease
          if-no-files-found: error
      - name: Execute exactly one fresh Stage 1 computation
        shell: bash
        run: |
          set -euo pipefail
          NONCE=$(node -e 'process.stdout.write(require("./doc/bao-rule-mechanism-geometry-intervention/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION.json").authorizationNonce)')
          BRMGI_STAGE1_EXECUTION_NONCE="$NONCE" node tools/experiments/run-brmgi-stage1-development.js
      - name: Upload scientific result before repository mirror
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brmgi-stage1-development-result-${{ github.run_id }}
          path: doc/bao-rule-mechanism-geometry-intervention/results/stage-1/
          if-no-files-found: error
