name: LGPML Stage 2 Input Materialization
on:
  push:
    branches: [research/g3-08-local-geometry-persistence-memory-length]
    paths: [doc/local-geometry-persistence-memory-length/authorizations/lgpml-stage2-input-materialization-trigger.txt]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 3}
      - name: Verify trigger-only request and canonical Stage 1 result
        run: |
          test "$(git diff --name-only HEAD^ HEAD)" = "doc/local-geometry-persistence-memory-length/authorizations/lgpml-stage2-input-materialization-trigger.txt"
          test -f doc/local-geometry-persistence-memory-length/results/stage-1/scientific-result.json
          test ! -e doc/local-geometry-persistence-memory-length/prereg/STAGE_1_IDENTITY_EXCLUSION_FOR_STAGE_2.json
          test ! -e doc/local-geometry-persistence-memory-length/prereg/STAGE_2_FORMAL_INPUT.json
      - name: Syntax check materializer
        run: node --check tools/experiments/materialize-lgpml-stage2-inputs.js
      - name: Materialize identity-only and formal candidate inputs
        run: node tools/experiments/materialize-lgpml-stage2-inputs.js
      - name: Verify scientific-row firewall
        run: |
          node - <<'NODE'
          const a=require('./doc/local-geometry-persistence-memory-length/prereg/STAGE_1_IDENTITY_EXCLUSION_FOR_STAGE_2.json');
          const b=require('./doc/local-geometry-persistence-memory-length/prereg/STAGE_2_FORMAL_INPUT.json');
          if(a.scientificOutcomeFieldsRetained!==false||a.stage1ScientificMeasurementRowsRetained!==false) process.exit(2);
          if(b.stage1ScientificMeasurementRowsRetained!==false||b.stage2SeedAccess!==false) process.exit(3);
          NODE
      - name: Commit bounded Stage 2 inputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/local-geometry-persistence-memory-length/prereg/STAGE_1_IDENTITY_EXCLUSION_FOR_STAGE_2.json doc/local-geometry-persistence-memory-length/prereg/STAGE_2_FORMAL_INPUT.json
          git commit -m "Materialize LGPML Stage 2 identity and formal inputs"
          git push origin HEAD:research/g3-08-local-geometry-persistence-memory-length
