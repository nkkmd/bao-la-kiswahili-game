name: Critical positions Stage 1 contract validation

on:
  push:
    branches:
      - research/critical-positions-outcome-branching
    paths:
      - "public/engine.js"
      - "public/ai.js"
      - "public/ai-weights.js"
      - "tools/experiments/lib/critical-positions-stage1-contract.js"
      - "tools/experiments/lib/critical-positions-stage1-corpus.js"
      - "tools/experiments/validate-critical-positions-stage1-spec.js"
      - "test/critical-positions-stage1-contract.test.js"
      - "doc/critical-positions-outcome-branching/preregistration/STAGE_1_EXPLORATORY_SPEC.json"
      - "doc/critical-positions-outcome-branching/preregistration/STAGE_1_EXPLORATORY_AUTHORIZATION.json"
      - ".github/workflows/critical-positions-stage1-contract.yml"
  pull_request:
    paths:
      - "tools/experiments/lib/critical-positions-stage1-contract.js"
      - "tools/experiments/lib/critical-positions-stage1-corpus.js"
      - "tools/experiments/validate-critical-positions-stage1-spec.js"
      - "test/critical-positions-stage1-contract.test.js"
      - "doc/critical-positions-outcome-branching/preregistration/STAGE_1_EXPLORATORY_SPEC.json"
      - "doc/critical-positions-outcome-branching/preregistration/STAGE_1_EXPLORATORY_AUTHORIZATION.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate frozen Stage 1 spec
        run: node tools/experiments/validate-critical-positions-stage1-spec.js
      - name: Validate Stage 1 contract semantics
        run: node test/critical-positions-stage1-contract.test.js
      - name: Validate exact source-bound Stage 1 authorization
        run: |
          node - <<'NODE'
          const C = require('./tools/experiments/lib/critical-positions-stage1-corpus.js');
          const loaded = C.loadSpec();
          const { authorization } = C.loadAuthorization(loaded.specSha256);
          if (authorization.stage1GenerationAuthorized !== true) process.exit(1);
          if (authorization.scientificInferenceAuthorized !== false) process.exit(1);
          if (authorization.confirmatoryReuseAllowed !== false) process.exit(1);
          if (authorization.stage2GenerationAuthorized !== false) process.exit(1);
          console.log('Stage 1 authorization matches frozen spec and exact scientific source hashes');
          NODE
