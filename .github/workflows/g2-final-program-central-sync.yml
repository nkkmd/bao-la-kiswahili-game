name: G2 final program central documentation sync

on:
  push:
    branches:
      - research/g2-final-program-closure
    paths:
      - doc/research-generation-2/authorizations/CENTRAL_SYNC_EXECUTE.json

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: research/g2-final-program-closure
          fetch-depth: 0

      - name: Validate authorization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('doc/research-generation-2/authorizations/CENTRAL_SYNC_EXECUTE.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['schemaVersion'] == 1
          assert data['centralDocumentationSyncAuthorized'] is True
          assert data['scientificExecutionAuthorized'] is False
          assert data['mainIntegrationAuthorized'] is False
          assert data['targetBranch'] == 'research/g2-final-program-closure'
          expected = {
              'README.md',
              'doc/RESEARCH_INDEX.md',
              'doc/FUTURE_RESEARCH_AGENDA.md',
              'doc/research-program-decisions/2026-08-26-second-generation-pure-research-agenda.md',
          }
          assert set(data['allowedPaths']) == expected
          PY

      - name: Synchronize central documents
        shell: bash
        run: |
          set -euo pipefail
          python tools/maintenance/sync-g2-final-program-docs.py

      - name: Verify diff scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          python - <<'PY'
          import subprocess
          allowed = {
              'README.md',
              'doc/RESEARCH_INDEX.md',
              'doc/FUTURE_RESEARCH_AGENDA.md',
              'doc/research-program-decisions/2026-08-26-second-generation-pure-research-agenda.md',
          }
          changed = set(filter(None, subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()))
          assert changed, 'no central documentation changes produced'
          assert changed <= allowed, (changed, allowed)
          PY

      - name: Commit synchronized central documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md doc/research-program-decisions/2026-08-26-second-generation-pure-research-agenda.md
          git commit -m "Synchronize Research Generation 2 program closure docs"
          git push origin HEAD:research/g2-final-program-closure
