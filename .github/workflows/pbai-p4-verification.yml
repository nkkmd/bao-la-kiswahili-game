name: PBAI-P4 candidate regression and evidence verification
on:
  pull_request:
    paths:
      - 'public/engine.js'
      - 'public/ai.js'
      - 'test/pbai-p4-transitions.test.js'
      - 'tools/engineering/*pbai-p4*'
      - 'tools/engineering/lib/pbai-p4*'
      - 'doc/ai-engineering/public-ai-improvement-program-4/**'
      - 'artifacts/pbai-p4/**'
      - '.github/workflows/pbai-p4-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Run existing behavior and candidate integration regressions
        run: |
          node test/engine.test.js
          node test/ai.test.js
          node test/search.test.js
          node test/tactical.test.js
          node test/ai-worker.test.js
          node test/worker-integration.test.js
          node test/ai-config.test.js
          node test/diagnostics-ui.test.js
          node test/namua-mtaji-transition-engine.test.js
          node test/pbai-p4-transitions.test.js
      - name: Audit archived observations without repeating timed measurements
        run: python3 tools/engineering/audit-pbai-p4-artifacts.py
      - name: Independently reconstruct known source and game records
        run: |
          for stage in development validation holdout; do
            if test -f "artifacts/pbai-p4/$stage/gate.json"; then
              node tools/engineering/verify-pbai-p4-stage-independent.js "$stage" --check
              python3 tools/engineering/verify-pbai-p4-metrics-independent.py "$stage" --check
            fi
          done
