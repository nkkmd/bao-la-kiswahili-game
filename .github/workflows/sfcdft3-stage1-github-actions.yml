name: SFCDFT3 Stage 1 GitHub Actions execution

on:
  push:
    branches:
      - research/g4-02-sfcdft-study3-prereg
    paths:
      - doc/structural-forcing-corridor-tree-raw-transfer/authorizations/STUDY_3_STAGE_1_EXECUTION_AUTHORIZATION.json

permissions:
  contents: read
  actions: read

concurrency:
  group: sfcdft3-stage1-fresh-execution
  cancel-in-progress: false

jobs:
  gate:
    name: Study3 authorization and frozen matrix gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source: ${{ steps.matrices.outputs.source }}
      measurement: ${{ steps.matrices.outputs.measurement }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Reject workflow rerun attempts
        run: test "$GITHUB_RUN_ATTEMPT" = '1'
      - name: Require first creation of final Study3 authorization
        run: |
          set -euo pipefail
          auth='doc/structural-forcing-corridor-tree-raw-transfer/authorizations/STUDY_3_STAGE_1_EXECUTION_AUTHORIZATION.json'
          test -f "$auth"
          if git cat-file -e "${GITHUB_SHA}^:${auth}" 2>/dev/null; then echo 'final authorization existed in parent' >&2; exit 1; fi
      - name: Verify frozen Study3 authorization and binding
        run: node tools/experiments/verify-sfcdft3-stage1-actions-authorization.js
      - name: Generate frozen matrices
        id: matrices
        run: node tools/experiments/generate-sfcdft3-stage1-actions-matrices.js

  acquire-primary:
    name: Study3 primary quartet ${{ matrix.s1 }}-${{ matrix.s4 }}
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.gate.outputs.source) }}
    steps:
      - uses: actions/checkout@v4
      - id: s1
        continue-on-error: true
        uses: ./.github/actions/sfcdft3-stage1-acquire-slot
        with: {slot-seed: '${{ matrix.s1 }}', role: PRIMARY}
      - id: s2
        continue-on-error: true
        uses: ./.github/actions/sfcdft3-stage1-acquire-slot
        with: {slot-seed: '${{ matrix.s2 }}', role: PRIMARY}
      - id: s3
        continue-on-error: true
        uses: ./.github/actions/sfcdft3-stage1-acquire-slot
        with: {slot-seed: '${{ matrix.s3 }}', role: PRIMARY}
      - id: s4
        continue-on-error: true
        uses: ./.github/actions/sfcdft3-stage1-acquire-slot
        with: {slot-seed: '${{ matrix.s4 }}', role: PRIMARY}
      - name: Propagate quartet failure after all possible slots
        if: always()
        run: test '${{ steps.s1.outcome }}' = success && test '${{ steps.s2.outcome }}' = success && test '${{ steps.s3.outcome }}' = success && test '${{ steps.s4.outcome }}' = success

  classify-primary:
    name: Classify Study3 primary acquisition
    if: ${{ always() && needs.gate.result == 'success' }}
    needs: [gate, acquire-primary]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      fatal: ${{ steps.classify.outputs.fatal }}
      retry_a: ${{ steps.classify.outputs.retry_a }}
      retry_b: ${{ steps.classify.outputs.retry_b }}
    steps:
      - uses: actions/checkout@v4
      - name: List immutable artifacts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[].name' > artifact-names.txt
      - id: classify
        run: node tools/experiments/classify-sfcdft3-stage1-actions-artifacts.js --mode primary --names artifact-names.txt --summary primary-classification.json
      - uses: actions/upload-artifact@v4
        with: {name: sfcdft3-s1-primary-classification, path: primary-classification.json, retention-days: 90}

  retry-primary-a:
    name: Study3 safe pre-read retry A ${{ matrix.slot }}
    needs: classify-primary
    if: ${{ needs.classify-primary.outputs.fatal != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.classify-primary.outputs.retry_a) }}
    steps:
      - if: ${{ matrix.slot != 0 }}
        uses: actions/checkout@v4
      - if: ${{ matrix.slot != 0 }}
        uses: ./.github/actions/sfcdft3-stage1-acquire-slot
        with: {slot-seed: '${{ matrix.slot }}', role: PRIMARY}

  retry-primary-b:
    name: Study3 safe pre-read retry B ${{ matrix.slot }}
    needs: classify-primary
    if: ${{ needs.classify-primary.outputs.fatal != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.classify-primary.outputs.retry_b) }}
    steps:
      - if: ${{ matrix.slot != 0 }}
        uses: actions/checkout@v4
      - if: ${{ matrix.slot != 0 }}
        uses: ./.github/actions/sfcdft3-stage1-acquire-slot
        with: {slot-seed: '${{ matrix.slot }}', role: PRIMARY}

  classify-post-retry:
    name: Classify Study3 after safe pre-read retry
    if: ${{ always() && needs.gate.result == 'success' }}
    needs: [gate, classify-primary, retry-primary-a, retry-primary-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      fatal: ${{ steps.classify.outputs.fatal }}
      reserve_matrix: ${{ steps.classify.outputs.reserve_matrix }}
      reserve_count: ${{ steps.classify.outputs.reserve_count }}
    steps:
      - uses: actions/checkout@v4
      - name: List immutable artifacts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[].name' > artifact-names.txt
      - id: classify
        run: node tools/experiments/classify-sfcdft3-stage1-actions-artifacts.js --mode post-retry --names artifact-names.txt --summary post-retry-classification.json
      - uses: actions/upload-artifact@v4
        with: {name: sfcdft3-s1-post-retry-classification, path: post-retry-classification.json, retention-days: 90}

  reserve:
    name: Study3 paired reserve ${{ matrix.slot }}
    needs: classify-post-retry
    if: ${{ needs.classify-post-retry.outputs.fatal != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.classify-post-retry.outputs.reserve_matrix) }}
    steps:
      - if: ${{ matrix.slot != 0 }}
        uses: actions/checkout@v4
      - if: ${{ matrix.slot != 0 }}
        uses: ./.github/actions/sfcdft3-stage1-acquire-slot
        with: {slot-seed: '${{ matrix.slot }}', role: PAIRED-RESERVE}

  classify-final:
    name: Final Study3 source acquisition classification
    if: ${{ always() && needs.gate.result == 'success' }}
    needs: [gate, classify-post-retry, reserve]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.classify.outputs.ready }}
      fatal: ${{ steps.classify.outputs.fatal }}
      source_count: ${{ steps.classify.outputs.source_count }}
    steps:
      - uses: actions/checkout@v4
      - name: List immutable artifacts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[].name' > artifact-names.txt
      - id: classify
        run: node tools/experiments/classify-sfcdft3-stage1-actions-artifacts.js --mode final --names artifact-names.txt --summary final-classification.json
      - uses: actions/upload-artifact@v4
        with: {name: sfcdft3-s1-final-classification, path: final-classification.json, retention-days: 90}
      - name: Require complete source acquisition
        run: test '${{ steps.classify.outputs.ready }}' = 'true'

  bundle-source:
    name: Build sealed Study3 identity-filtered source bundle
    needs: [gate, classify-final]
    if: ${{ needs.classify-final.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      selection_ready: ${{ steps.selection.outputs.selection_ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: sfcdft3-s1-source-*, path: raw-source-artifacts}
      - name: Bundle, firewall and freeze selected pairs
        run: node tools/experiments/bundle-sfcdft3-stage1-source.js --input raw-source-artifacts --output artifacts/sfcdft3-stage1/bundle
      - id: selection
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const r=require('./artifacts/sfcdft3-stage1/bundle/SELECTED_SOURCE_MANIFEST.json');console.log(`selection_ready=${r.selectionReady?'true':'false'}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: sfcdft3-s1-source-bundle-${{ github.run_id }}
          path: artifacts/sfcdft3-stage1/bundle
          if-no-files-found: error
          retention-days: 90

  measure:
    name: Study3 seed-free measurement task ${{ matrix.task }}
    needs: [gate, bundle-source]
    if: ${{ needs.bundle-source.outputs.selection_ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.gate.outputs.measurement) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: 'sfcdft3-s1-source-bundle-${{ github.run_id }}', path: source-bundle}
      - name: Measure sealed roots without fresh seed access
        run: |
          mkdir -p "artifacts/sfcdft3-stage1/measurement/${{ matrix.task }}"
          node tools/experiments/run-sfcdft3-stage1-measurement-task.js --bundle source-bundle --task '${{ matrix.task }}' --output "artifacts/sfcdft3-stage1/measurement/${{ matrix.task }}/result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sfcdft3-s1-measurement-${{ matrix.task }}
          path: artifacts/sfcdft3-stage1/measurement/${{ matrix.task }}/result.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Aggregate Study3 Stage1 compatibility result
    if: ${{ always() && needs.bundle-source.result == 'success' }}
    needs: [bundle-source, measure]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: 'sfcdft3-s1-source-bundle-${{ github.run_id }}', path: source-bundle}
      - if: ${{ needs.bundle-source.outputs.selection_ready == 'true' }}
        uses: actions/download-artifact@v4
        with: {pattern: sfcdft3-s1-measurement-*, path: measurements}
      - if: ${{ needs.bundle-source.outputs.selection_ready != 'true' }}
        run: mkdir -p measurements
      - name: Aggregate without fresh seed access
        run: |
          mkdir -p artifacts/sfcdft3-stage1/final
          node tools/experiments/run-sfcdft3-stage1-aggregate.js --bundle source-bundle --measurements measurements --output artifacts/sfcdft3-stage1/final/STUDY_3_STAGE_1_COMPATIBILITY_RESULT.json
      - name: Verify compatibility-only output boundary
        run: |
          node - <<'NODE'
          const r=require('./artifacts/sfcdft3-stage1/final/STUDY_3_STAGE_1_COMPATIBILITY_RESULT.json');
          if(r.studyId!=='SFCDFT-STUDY3')throw new Error('identity mismatch');
          if(r.scientificEffectGenerated!==false||r.effectDirectionGenerated!==false||r.pValueGenerated!==false||r.generalizationDecisionGenerated!==false||r.counterexampleDecisionGenerated!==false)throw new Error('Stage1 output boundary violated');
          if(!['FORMAL-PREPARATION-ELIGIBLE','NON-ESTIMABLE'].includes(r.decision))throw new Error(`unexpected decision ${r.decision}`);
          console.log(JSON.stringify({decision:r.decision,selectedPairCount:r.selectedPairCount,measurementTaskCount:r.measurementTaskCount,engineGuardCensoringCount:r.engineGuardCensoringCount,deterministicCoreSha256:r.deterministicCoreSha256}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: sfcdft3-s1-final-result-${{ github.run_id }}
          path: artifacts/sfcdft3-stage1/final/STUDY_3_STAGE_1_COMPATIBILITY_RESULT.json
          if-no-files-found: error
          retention-days: 90
