name: LGTGMF Stage 0 Technical

on:
  push:
    branches:
      - research/g3-01-local-game-tree-geometry-measurement-foundation
    paths:
      - 'doc/local-game-tree-geometry-measurement-foundation/authorizations/STAGE_0_TECHNICAL_EXECUTE.json'

permissions:
  contents: read

jobs:
  technical-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify authorization and source integrity
        shell: bash
        run: |
          set -euo pipefail
          node --version
          git rev-parse HEAD
          git rev-parse HEAD^
          git status --short
          node - <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const auth = JSON.parse(fs.readFileSync('doc/local-game-tree-geometry-measurement-foundation/authorizations/STAGE_0_TECHNICAL_EXECUTE.json', 'utf8'));
          const parent = execFileSync('git', ['rev-parse', 'HEAD^'], {encoding:'utf8'}).trim();
          if (auth.studyId !== 'LGTGMF-STUDY1') throw new Error('studyId mismatch');
          if (auth.stageId !== 'LGTGMF-S0-TECHNICAL-2026-08-31-v1') throw new Error('stageId mismatch');
          if (auth.implementationFreezeCommit !== parent) throw new Error(`implementation parent mismatch ${parent}`);
          if (auth.scientificSeedConsumptionAuthorized !== false) throw new Error('scientific seed authorization must be false');
          if (auth.standardRootDepth10GenerationAuthorized !== false || auth.standardRootDepth10ReadAuthorized !== false) throw new Error('depth-10 firewall invalid');
          NODE
          node --check tools/experiments/lib/lgtgmf-production.js
          node --check tools/experiments/lib/lgtgmf-independent.js
          node --check tools/experiments/run-lgtgmf-stage0-technical.js
          node --check tools/experiments/verify-lgtgmf-stage0-independent.js
          if grep -q "lgtgmf-production" tools/experiments/lib/lgtgmf-independent.js tools/experiments/verify-lgtgmf-stage0-independent.js; then
            echo 'Independent path imports production implementation' >&2
            exit 1
          fi
          sha256sum \
            tools/experiments/lib/lgtgmf-production.js \
            tools/experiments/lib/lgtgmf-independent.js \
            tools/experiments/run-lgtgmf-stage0-technical.js \
            tools/experiments/verify-lgtgmf-stage0-independent.js \
            doc/local-game-tree-geometry-measurement-foundation/preregistration/STAGE_0_TECHNICAL_SPEC.json

      - name: Run production Stage 0 technical validation
        shell: bash
        run: |
          set -euo pipefail
          OUT=artifacts/local/local-game-tree-geometry-measurement-foundation/stage0-technical-v1
          mkdir -p "$OUT"
          /usr/bin/time -v node tools/experiments/run-lgtgmf-stage0-technical.js "$OUT" 2>&1 | tee lgtgmf-stage0-production.log

      - name: Run structurally independent Stage 0 verification
        shell: bash
        run: |
          set -euo pipefail
          OUT=artifacts/local/local-game-tree-geometry-measurement-foundation/stage0-technical-v1
          /usr/bin/time -v node tools/experiments/verify-lgtgmf-stage0-independent.js "$OUT" 2>&1 | tee lgtgmf-stage0-independent.log

      - name: Preserve technical-only artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lgtgmf-stage0-technical-${{ github.sha }}
          path: |
            artifacts/local/local-game-tree-geometry-measurement-foundation/stage0-technical-v1/**
            lgtgmf-stage0-production.log
            lgtgmf-stage0-independent.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
