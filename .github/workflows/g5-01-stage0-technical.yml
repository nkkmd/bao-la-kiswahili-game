name: G5-01 Stage 0 Technical

on:
  push:
    branches: [research/g5-01-measurement-readiness]
    paths:
      - 'tools/research/g5-01/**'
      - 'test/g5-01-stage0.test.cjs'
      - 'doc/research-generation-5/g5-01/**'
      - '.github/workflows/g5-01-stage0-technical.yml'
  pull_request:
    paths:
      - 'tools/research/g5-01/**'
      - 'test/g5-01-stage0.test.cjs'
      - 'doc/research-generation-5/**'
      - '.github/workflows/g5-01-stage0-technical.yml'

permissions:
  contents: read

concurrency:
  group: g5-01-technical-${{ github.ref }}
  cancel-in-progress: false

jobs:
  technical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify technical binding and interruption recovery
        run: node --test test/g5-01-stage0.test.cjs
      - name: Run known fixtures only
        run: node tools/research/g5-01/run.cjs artifacts/local/g5-01-ci
      - name: Independently verify technical result
        run: python3 tools/research/g5-01/verify.py artifacts/local/g5-01-ci/result.json artifacts/local/g5-01-ci/verification.json
      - name: Preserve technical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-01-technical-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/local/g5-01-ci/
          if-no-files-found: warn
          retention-days: 30
