name: REWR central document integration

on:
  push:
    branches:
      - research/restricted-endgame-winning-regions
    paths:
      - ".github/workflows/rewr-central-doc-integration.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/restricted-endgame-winning-regions
          fetch-depth: 0
      - name: Integrate central research documents
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Central research index: insert completed Study 1 before future-research section.
          p = Path('doc/RESEARCH_INDEX.md')
          text = p.read_text()
          marker = '\n---\n\n## 将来研究\n'
          assert marker in text, 'RESEARCH_INDEX future-research marker missing'
          assert '### 12. Restricted Endgame / Winning Regions — Study 1' not in text
          block = r'''
---

### 12. Restricted Endgame / Winning Regions — Study 1

**研究題目:** Baoにおける限定終盤と必勝圏の完全解析 — constrained endgame state spaces における exact game-theoretic value, cycle structure, and distance-to-win の列挙・後退解析  
