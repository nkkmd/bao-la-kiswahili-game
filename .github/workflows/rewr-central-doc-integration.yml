```text
state key = fc1e124884276ba44b6d153580db9a7ddfc194d8b5e1b0d898e16de45f427d33
Player 0 to move
value = WIN
absolute forced winner = Player 0
DTF = 3
unique optimal move = capture:mtaji:1:4:left:::false
