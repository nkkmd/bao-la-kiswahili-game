name: RG5 Primary Readiness Review

on:
  push:
    branches: [research/g5-primary-readiness-review]
    paths:
      - 'tools/research/g5-readiness/**'
      - 'test/g5-readiness.test.cjs'
      - 'doc/research-generation-5/readiness-review-20261012/**'
      - '.github/workflows/g5-primary-readiness-review.yml'
  pull_request:
    paths:
      - 'tools/research/g5-readiness/**'
      - 'test/g5-readiness.test.cjs'
      - 'doc/research-generation-5/**'
      - '.github/workflows/g5-primary-readiness-review.yml'

permissions:
  contents: read

jobs:
  read-only-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify current editorial boundary and archived bindings
        run: |
          python3 tools/research/g5-checkpoint/test-verify-current.py
          python3 tools/research/g5-checkpoint/verify-current.py --hashes-only
      - name: Test information and conditional precision gates
        run: |
          git worktree add --detach "$RUNNER_TEMP/g5-legacy-verification" 43e145da1eb66cab38b56e96b52c0f3a4282b302
          cd "$RUNNER_TEMP/g5-legacy-verification"
          node --test test/g5-readiness.test.cjs
      - name: Replay four saved studies and review result without fresh generation
        run: (cd "$RUNNER_TEMP/g5-legacy-verification" && node tools/research/g5-readiness/review.cjs --check)
