name: SILGM Stage 2 Formal Input Materialization v1
on:
  push:
    branches: [research/g3-07-search-instability-local-geometry-mechanism]
    paths: [doc/search-instability-local-geometry-mechanism/authorizations/silgm-stage2-input-materialization-trigger.txt]
permissions:
  contents: read
concurrency:
  group: silgm-stage2-input-materialization-v1
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check materializer
        run: node --check tools/experiments/materialize-silgm-stage2-formal-input.js
      - name: Materialize allowed Stage 2 input only
        run: |
          mkdir -p artifacts/local/search-instability-local-geometry-mechanism/stage2-input
          node tools/experiments/materialize-silgm-stage2-formal-input.js --output artifacts/local/search-instability-local-geometry-mechanism/stage2-input/STAGE_2_FORMAL_INPUT.json
      - name: Upload Stage 2 input artifact
        uses: actions/upload-artifact@v4
        with:
          name: silgm-stage2-input-v1-${{ github.run_id }}
          path: artifacts/local/search-instability-local-geometry-mechanism/stage2-input/STAGE_2_FORMAL_INPUT.json
          if-no-files-found: error
          overwrite: false
