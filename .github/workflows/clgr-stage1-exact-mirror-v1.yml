name: CLGR Stage 1 Exact Artifact Mirror v1

on:
  push:
    branches:
      - research/g3-09-continuous-local-geometry-representation
    paths:
      - doc/continuous-local-geometry-representation/executions/clgr-stage1-exact-mirror-v1-trigger.json

permissions:
  contents: write
  actions: read

concurrency:
  group: clgr-stage1-exact-mirror-v1
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Download immutable Stage 1 artifact
        uses: actions/download-artifact@v4
        with:
          name: clgr-stage1-v1-result-33750400172
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: nkkmd/bao-la-kiswahili-game
          run-id: 33750400172
      - name: Verify exact artifact file hashes and canonical result
        run: |
          cd artifact
          printf '%s  %s\n' '65bc1eee59b26f16eccc616eea98dd32c5c497a3703dfd2de22a77373c8d337a' STAGE_1_SELECTION.json | sha256sum -c -
          printf '%s  %s\n' '446b68c5679e493a500b71423b91022ffcda6bfaf54eeb8792aaa8a822d38483' STAGE_1_ROOT_MEASUREMENTS_PRODUCTION.json | sha256sum -c -
          printf '%s  %s\n' '446b68c5679e493a500b71423b91022ffcda6bfaf54eeb8792aaa8a822d38483' STAGE_1_ROOT_MEASUREMENTS_INDEPENDENT.json | sha256sum -c -
          printf '%s  %s\n' 'd3ebbd626d596c898c1744be0c6a2213bcfa1cb3ae9271dcf613c0c5cb979a05' STAGE_1_COORDINATES.json | sha256sum -c -
          printf '%s  %s\n' '4095e1f665774e62e19867250ea06152c8e78b2906e6aaf42a8a89b031bf0290' STAGE_1_DISTANCE_ROWS.json | sha256sum -c -
          printf '%s  %s\n' 'a9171cb19bb01921682fff35ecb3a11d945e9273cde45b2b783edf8a3c393278' STAGE_1_NEIGHBORHOODS.json | sha256sum -c -
          printf '%s  %s\n' '965f1a87ae97e7b7f81cc45f95040df3dde9a0be16d16be55c6c392e1ff33c17' STAGE_1_IDENTITY_EXCLUSION_FOR_STAGE_2.json | sha256sum -c -
          printf '%s  %s\n' '77d811f5d49996131f866029313ba1830ed2ad6a98d1ef12806abf3923d48e09' STAGE_1_DEVELOPMENT_RESULT.json | sha256sum -c -
          node -e 'const r=require("./STAGE_1_DEVELOPMENT_RESULT.json"); if(r.stageDisposition!=="STAGE1-PASS"||r.stage2Eligible!==true||r.canonicalScientificResultSha256!=="1e63937dc5967276f68253c9efa819554b0ea3b346f471c04dea92cbd90dc529"||r.stage1SeedBlockConsumed!==true||r.sameEvidenceRerunAuthorized!==false||r.protectedDepth10Access!==false) process.exit(1);'
      - name: Mirror exact bytes into repository
        run: |
          mkdir -p doc/continuous-local-geometry-representation/results/stage-1
          cp artifact/STAGE_1_*.json doc/continuous-local-geometry-representation/results/stage-1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doc/continuous-local-geometry-representation/results/stage-1
          git commit -m 'Mirror exact CLGR Stage 1 artifact bytes'
          git push origin HEAD:research/g3-09-continuous-local-geometry-representation
