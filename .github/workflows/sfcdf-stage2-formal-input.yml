name: SFCDF Stage 2 Formal Input Materialization

on:
  push:
    branches:
      - research/g3-04-structural-forcing-corridor-decision-funnel
    paths:
      - doc/structural-forcing-corridor-decision-funnel/authorizations/STAGE2_FORMAL_INPUT_TRIGGER

permissions:
  contents: write

env:
  BRANCH: research/g3-04-structural-forcing-corridor-decision-funnel
  DOC: doc/structural-forcing-corridor-decision-funnel

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - name: Verify pre-Stage-2 scientific boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f "$DOC/results/stage-1/scientific-result.json"
          test ! -f "$DOC/prereg/STAGE_2_FORMAL_INPUT.json"
          test ! -f "$DOC/results/stage-2/scientific-result.json"
          test ! -f "$DOC/executions/stage-2-execution-started.json"
          node - <<'NODE'
          const s=require('./doc/structural-forcing-corridor-decision-funnel/results/stage-1/scientific-result.json');
          const p=require('./doc/structural-forcing-corridor-decision-funnel/prereg/STUDY_1_SPEC.json');
          if(s.stageDisposition!=='STAGE1-PASS'||!s.stage2AuthorizationEligible)throw Error('Stage 1 not eligible for Stage 2 preparation');
          if(p.protectedEvidence.standardInitialRawRootCompleteExactDepth10Holdout!=='SEALED / NOT GENERATED / NOT READ')throw Error('protected depth10 boundary changed');
          NODE
      - name: Materialize minimal formal input without Stage 2 seed access
        run: node tools/experiments/materialize-sfcdf-stage2-formal-input.js
      - name: Upload formal input before repository mirror
        uses: actions/upload-artifact@v4
        with:
          name: sfcdf-stage2-formal-input-${{ github.run_id }}
          path: doc/structural-forcing-corridor-decision-funnel/prereg/STAGE_2_FORMAL_INPUT.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit materialized formal input
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DOC/prereg/STAGE_2_FORMAL_INPUT.json"
          git commit -m "Materialize G3-04 Stage 2 formal input"
          git push origin HEAD:"$BRANCH"
