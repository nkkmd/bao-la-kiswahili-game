name: GTTD G4-04 Stage 2 pre-fresh validation

on:
  push:
    branches:
      - "research/g4-04-geometry-trajectory-transfer"
    paths:
      - "doc/geometry-trajectory-dynamics-transfer/authorizations/STAGE_2_PREEXECUTION_BINDING.json"

permissions:
  contents: read
  actions: read

jobs:
  stage2-prefresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frozen branch state
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check Stage 2 implementation
        run: |
          set -euo pipefail
          node --check tools/experiments/run-gttd-stage2-preflight.js
          node --check tools/experiments/run-gttd-stage2-formal.js
          node --check tools/experiments/lib/gttd-stage2-inference.js
          node --check tools/experiments/lib/gttd-stage2-firewall.js
          node --check tools/experiments/lib/gttd-stage2-source.js

      - name: Download immutable Stage 1 and G4-01 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gttd-stage2/g4
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10846181741/zip > /tmp/gttd-stage2/stage1.zip
          echo "fa14e0c56d7d7f7088684eb715b1bf26b307cb22459741dfe4a7629cf40b3183  /tmp/gttd-stage2/stage1.zip" | sha256sum -c -
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/10517090411/zip > /tmp/gttd-stage2/g4.zip
          echo "3e1312fbd2fed104dc25ea53448b5f76feee2f37bc2b34ef09274e4df690a65b  /tmp/gttd-stage2/g4.zip" | sha256sum -c -
          unzip -q /tmp/gttd-stage2/g4.zip -d /tmp/gttd-stage2/g4
          test -d /tmp/gttd-stage2/g4/source/GCLD

      - name: Verify frozen blob binding
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),path=require('node:path');
          const b=JSON.parse(fs.readFileSync('doc/geometry-trajectory-dynamics-transfer/authorizations/STAGE_2_PREEXECUTION_BINDING.json','utf8'));
          function blob(rel){const x=fs.readFileSync(path.join(process.cwd(),rel));return crypto.createHash('sha1').update(Buffer.from(`blob ${x.length}\0`)).update(x).digest('hex')}
          function need(x,m){if(!x)throw new Error(m)}
          need(b.status==='FROZEN-PRE-FRESH','binding status mismatch');
          need(b.freshScientificSeedAccessAtBinding===0&&b.stage2ScientificExecutionStarted===false,'binding not pre-fresh');
          for(const [rel,expected] of Object.entries(b.gitBlobShaByPath||{})) need(blob(rel)===expected,`bound blob mismatch ${rel}`);
          NODE

      - name: Run seed-free Stage 2 preflight
        run: |
          set -euo pipefail
          node tools/experiments/run-gttd-stage2-preflight.js \
            --stage1-artifact-zip /tmp/gttd-stage2/stage1.zip \
            --g4-source-dir /tmp/gttd-stage2/g4/source/GCLD \
            --output artifacts/gttd-stage2-preflight/STAGE_2_PREFLIGHT_RESULT.json

      - name: Upload preflight result
        uses: actions/upload-artifact@v4
        with:
          name: gttd-stage2-preflight
          path: artifacts/gttd-stage2-preflight
          if-no-files-found: error
          retention-days: 90
