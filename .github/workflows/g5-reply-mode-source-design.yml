name: RG5 Reply Mode Source Design
on:
  push:
    branches: [research/g5-reply-mode-source-design]
    paths:
      - 'tools/research/g5-source-design/**'
      - 'test/g5-source-design.test.cjs'
      - 'doc/research-generation-5/source-design-20261013/**'
      - '.github/workflows/g5-reply-mode-source-design.yml'
  pull_request:
    paths:
      - 'tools/research/g5-source-design/**'
      - 'test/g5-source-design.test.cjs'
      - 'doc/research-generation-5/**'
      - '.github/workflows/g5-reply-mode-source-design.yml'
permissions:
  contents: read
jobs:
  saved-structure-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify current editorial boundary and archived bindings
        run: |
          python3 tools/research/g5-checkpoint/test-verify-current.py
          python3 tools/research/g5-checkpoint/verify-current.py --hashes-only
      - name: Test outcome blind structural selection
        run: |
          git worktree add --detach "$RUNNER_TEMP/g5-legacy-verification" 43e145da1eb66cab38b56e96b52c0f3a4282b302
          cd "$RUNNER_TEMP/g5-legacy-verification"
          node --test test/g5-source-design.test.cjs
      - name: Check saved structural audit
        run: (cd "$RUNNER_TEMP/g5-legacy-verification" && node tools/research/g5-source-design/audit.cjs --check)
      - name: Recheck prior evidence and readiness review
        run: (cd "$RUNNER_TEMP/g5-legacy-verification" && node tools/research/g5-readiness/review.cjs --check)
