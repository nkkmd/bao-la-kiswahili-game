name: BECT Stage 1 Development

on:
  push:
    branches:
      - research/g3-05-branch-expansion-compression-transition
    paths:
      - doc/branch-expansion-compression-transition/authorizations/STAGE1_EXECUTION_TRIGGER

permissions:
  contents: read

concurrency:
  group: bect-stage1-development-v1
  cancel-in-progress: false

jobs:
  lease:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      lease_commit_sha: ${{ steps.lease.outputs.lease_commit_sha }}
      authorization_nonce: ${{ steps.lease.outputs.authorization_nonce }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify authorization, source bindings, execution count, and branch advancement
        shell: bash
        run: |
          set -euo pipefail
          AUTH=doc/branch-expansion-compression-transition/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION.json
          test -f "$AUTH"
          node - <<'NODE'
          const a=require('./doc/branch-expansion-compression-transition/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION.json');
          if(a.studyId!=='BECT-STUDY1'||a.stageId!=='BECT-S1-DEVELOPMENT-2026-09-02-v1'||a.decision!=='STAGE1-AUTHORIZED')throw Error('Stage 1 authorization invalid');
          if(a.maxScientificExecutions!==1||a.seedStart!==31510001||a.seedEnd!==31510240)throw Error('authorization execution/seed contract invalid');
          if(a.protectedDepth10AccessAuthorized!==false)throw Error('protected holdout authorization invalid');
          NODE
          test "$(git hash-object public/engine.js)" = "2f7885fa1ae38ddef5f14bbe2fecd4ca4fb84c7c"
          test "$(git hash-object tools/experiments/lib/lgtgmiv-stage1-production.js)" = "a4664f01535d6abbf6f83821befbb2fafd55cde6"
          test "$(git hash-object tools/experiments/lib/lgtgmiv-stage1-independent.js)" = "0c7239ac7acf146e9aee63dae66194681b8631d6"
          test "$(git hash-object tools/experiments/lib/bect-production.js)" = "b8fa63e941b4da1fec0969155c09754eae151a56"
          test "$(git hash-object tools/experiments/lib/bect-independent.js)" = "bb085c648d2f4f3d7d44f206f04036e95f94980b"
          test "$(git hash-object tools/experiments/lib/bect-stage1-production.js)" = "32995ed7e666b7cff7a6bb43946a30cdc86a7668"
          test "$(git hash-object tools/experiments/lib/bect-stage1-independent.js)" = "fcc150bdfcfbb1727ea6e0fdd4f336d1ae36e1e6"
          test "$(git hash-object tools/experiments/run-bect-stage1-development.js)" = "127cb10ea23d18f0a32c2adc2d8c499de4c19b04"
          test "$(git hash-object doc/branch-expansion-compression-transition/prereg/STUDY_1_SPEC.json)" = "c9d938631d256a239c5e21a82e9869143aa1d0fb"
          test "$(git hash-object doc/branch-expansion-compression-transition/prereg/STUDY_1_SPEC_CLARIFICATION_1.json)" = "90869977c1977bbc10f4834228ee69b9151ce250"
          test "$(git hash-object doc/branch-expansion-compression-transition/prereg/STUDY_1_SPEC_CLARIFICATION_2.json)" = "87e78b008024301a26f78d1ac488d8489f9bd02b"
          test "$(git hash-object doc/branch-expansion-compression-transition/prereg/UPSTREAM_IDENTITY_FIREWALL.json)" = "123430eb0cbe100bf50e068ee4c4ee7dc52c2ca8"
          test "$(git hash-object doc/branch-expansion-compression-transition/results/stage-0-v2/STAGE_0_TECHNICAL_RESULT.json)" = "1f3f74e437753741950329517dc574b0b27d7429"
          git fetch origin research/g3-05-branch-expansion-compression-transition
          if git show origin/research/g3-05-branch-expansion-compression-transition:doc/branch-expansion-compression-transition/executions/stage-1-execution-started.json >/dev/null 2>&1; then
            echo 'durable Stage 1 lease already exists' >&2; exit 1
          fi
          AUTH_BASE=$(node -p "require('./$AUTH').authorizedScientificContentHead")
          git merge-base --is-ancestor "$AUTH_BASE" "$GITHUB_SHA"
          test "$(git rev-list --count "$AUTH_BASE..$GITHUB_SHA")" -eq 2
          git diff --name-only "$AUTH_BASE" "$GITHUB_SHA" | while IFS= read -r p; do
            case "$p" in
              doc/branch-expansion-compression-transition/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION.json) ;;
              doc/branch-expansion-compression-transition/authorizations/STAGE1_EXECUTION_TRIGGER) ;;
              *) echo "unauthorized post-baseline advancement: $p" >&2; exit 1 ;;
            esac
          done
      - name: Write durable pre-computation lease
        id: lease
        shell: bash
        run: |
          set -euo pipefail
          AUTH=doc/branch-expansion-compression-transition/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION.json
          NONCE=$(node -p "require('./$AUTH').authorizationNonce")
          BASE=$(node -p "require('./$AUTH').authorizedScientificContentHead")
          git config user.name "Sawa"
          git config user.email "72678394+nkkmd@users.noreply.github.com"
          mkdir -p doc/branch-expansion-compression-transition/executions
          cat > doc/branch-expansion-compression-transition/executions/stage-1-execution-started.json <<EOF
          {
            "schemaVersion": 1,
            "studyId": "BECT-STUDY1",
            "stageId": "BECT-S1-DEVELOPMENT-2026-09-02-v1",
            "workflowRunId": ${GITHUB_RUN_ID},
            "authorizationNonce": "${NONCE}",
            "authorizedScientificContentHead": "${BASE}",
            "executionTriggerCommit": "${GITHUB_SHA}",
            "seedBlock": "31510001..31510240",
            "preComputationLease": true
          }
          EOF
          git add doc/branch-expansion-compression-transition/executions/stage-1-execution-started.json
          git commit -m "Record BECT Stage 1 execution lease"
          git push origin HEAD:research/g3-05-branch-expansion-compression-transition
          LEASE_SHA=$(git rev-parse HEAD)
          echo "lease_commit_sha=$LEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "authorization_nonce=$NONCE" >> "$GITHUB_OUTPUT"
  scientific:
    needs: lease
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Execute exactly one authorized fresh Stage 1 computation
        id: scientific
        shell: bash
        env:
          BECT_AUTHORIZATION_NONCE: ${{ needs.lease.outputs.authorization_nonce }}
          BECT_LEASE_COMMIT_SHA: ${{ needs.lease.outputs.lease_commit_sha }}
        run: |
          set +e
          node tools/experiments/run-bect-stage1-development.js
          CODE=$?
          echo "runner_exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit "$CODE"
      - name: Upload durable scientific result before any repository mirror
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bect-stage1-development-result-${{ github.run_id }}
          path: doc/branch-expansion-compression-transition/results/stage-1/
          if-no-files-found: error
          retention-days: 90
