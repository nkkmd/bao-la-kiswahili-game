name: LGTGGC Stage 1 Development Execute
on:
  push:
    branches:
      - research/g3-12-local-game-tree-geometry-generalization-counterexample
    paths:
      - doc/local-game-tree-geometry-generalization-counterexample/authorizations/lgtggc-stage1-execute-trigger.txt
concurrency:
  group: lgtggc-stage1-development-first-fresh
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen authorization and source bindings
        run: node tools/experiments/verify-lgtggc-stage1-authorization.js
      - name: Materialize durable pre-computation lease
        run: |
          mkdir -p artifacts/lease
          git rev-parse HEAD > artifacts/lease/trigger-head.txt
          printf '%s\n' 'LGTGGC-S1-DEVELOPMENT-2026-09-04-v1' > artifacts/lease/stage.txt
          sha256sum doc/local-game-tree-geometry-generalization-counterexample/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION.json > artifacts/lease/authorization.sha256
          sha256sum doc/local-game-tree-geometry-generalization-counterexample/authorizations/STAGE_1_DEVELOPMENT_EXECUTE.json > artifacts/lease/execute.sha256
          printf '%s\n' 'maximumScientificExecutions=1' 'formalInferenceAuthorized=false' 'stage2SeedAccess=false' 'protectedDepth10Access=false' 'depth11Access=false' > artifacts/lease/firewall.txt
      - name: Upload lease before first fresh access
        uses: actions/upload-artifact@v4
        with:
          name: lgtggc-stage1-lease-${{ github.run_id }}
          path: artifacts/lease
          if-no-files-found: error
      - name: Execute SFCDF transfer development block
        run: node tools/experiments/run-lgtggc-stage1-sfcdf.js
      - name: Execute SILGM transfer development block
        run: node tools/experiments/run-lgtggc-stage1-silgm.js
      - name: Execute GCLD transfer development block
        run: node tools/experiments/run-lgtggc-stage1-gcld.js
      - name: Finalize development result
        run: node tools/experiments/finalize-lgtggc-stage1-development.js
      - name: Enforce development firewall
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='artifacts/local/lgtggc-stage1/stage1-result.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(x.formalInferencePerformed!==false||x.pValuesComputed!==false||x.effectBasedPromotionPerformed!==false) throw new Error('development inference firewall');
          if(x.stage2SeedAccess!==false||x.protectedDepth10Access!==false||x.depth11Access!==false||x.g2_12EstimatorScientificInput!==false) throw new Error('protected evidence firewall');
          console.log(JSON.stringify({stageDisposition:x.stageDisposition,developmentCoreSha256:x.developmentCoreSha256}));
          NODE
      - name: Upload complete Stage 1 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lgtggc-stage1-result-${{ github.run_id }}
          path: artifacts/local/lgtggc-stage1
          if-no-files-found: error
