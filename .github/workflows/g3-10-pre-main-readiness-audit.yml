name: G3-10 Pre-Main Readiness Audit

on:
  push:
    branches:
      - research/g3-10-geometry-conditioned-longitudinal-dynamics
    paths:
      - doc/geometry-conditioned-longitudinal-dynamics/authorizations/G3_10_PRE_MAIN_READINESS_TRIGGER

permissions:
  contents: write

concurrency:
  group: g3-10-pre-main-readiness-audit-v3
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/g3-10-geometry-conditioned-longitudinal-dynamics
          fetch-depth: 0

      - name: Repair final current-facing chronology and indexing gaps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          def replace_required(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label}: required text not found")
              return text.replace(old, new, 1)

          def insert_after_prefix(text, prefix, addition_lines, marker, label):
              if marker in text:
                  return text
              lines = text.splitlines()
              hits = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(hits) != 1:
                  raise SystemExit(f"{label}: expected one prefix match, got {len(hits)}")
              i = hits[0]
              lines[i+1:i+1] = addition_lines
              return '\n'.join(lines) + ('\n' if text.endswith('\n') else '')

          # Root README: make the G3-10 prerequisite chain directly discoverable.
          p = Path('README.md')
          t = p.read_text(encoding='utf-8')
          t = insert_after_prefix(
              t,
              '- [`doc/geometry-conditioned-longitudinal-dynamics/README.md`]',
              [
                  '<!-- G3-10-PREREQUISITE-CHAIN-ROOT -->',
                  '- [`doc/canonical-resource-robust-continuous-local-geometry-representation/README.md`](doc/canonical-resource-robust-continuous-local-geometry-representation/README.md): G3-10直前の独立prerequisite `CRCLGR-STUDY1`。`CRCLGR-R1-EXACT-SQUASHED-L1`を`FORMAL-ELIGIBLE-RESOURCE-BOUNDED-CONTINUOUS-REPRESENTATION`として確立し、後続のseparate reviewでG3-10 dependencyを満たした。',
                  '- [`doc/resource-robust-continuous-local-geometry-representation/README.md`](doc/resource-robust-continuous-local-geometry-representation/README.md): 先行prerequisite `RRCLGR-STUDY1`。fresh Stage 1でstructured digest type errorにより`CLOSED / TECHNICAL-INVALID`。同Studyを救済せず、後続CRCLGRを独立Studyとして実施した。',
              ],
              '<!-- G3-10-PREREQUISITE-CHAIN-ROOT -->',
              'root prerequisite chain',
          )
          stale = '`LGTGMIV-STUDY1`のformal closureを受理し、G3-02を自動開始せず別authorization reviewを要求するcurrent program decision。'
          if stale in t:
              t = t.replace(stale, '`LGTGMIV-STUDY1`のformal closureを受理し、G3-02を自動開始せず別authorization reviewを要求したLGTGMIV closure時点のhistorical program decision。', 1)
          p.write_text(t, encoding='utf-8')

          # Central research index: link both prerequisites and the later authorization review.
          p = Path('doc/RESEARCH_INDEX.md')
          t = p.read_text(encoding='utf-8')
          if '<!-- G3-10-PREREQUISITE-CHAIN-INDEX -->' not in t:
              needle = '- [`research-program-decisions/2026-09-04-g3-10-formal-complete-closure.md`](research-program-decisions/2026-09-04-g3-10-formal-complete-closure.md)'
              block = needle + '\n\n<!-- G3-10-PREREQUISITE-CHAIN-INDEX -->\n**G3-10 prerequisite chain:**\n\n- [`resource-robust-continuous-local-geometry-representation/README.md`](resource-robust-continuous-local-geometry-representation/README.md) — `RRCLGR-STUDY1` / `CLOSED / TECHNICAL-INVALID`; first independent resource-robust prerequisite, no rescue\n- [`canonical-resource-robust-continuous-local-geometry-representation/README.md`](canonical-resource-robust-continuous-local-geometry-representation/README.md) — `CRCLGR-STUDY1` / `FORMAL-ELIGIBLE-RESOURCE-BOUNDED-CONTINUOUS-REPRESENTATION`; formal G3-10 input representation\n- [`research-program-decisions/2026-09-03-post-crclgr-g3-10-authorization-review.md`](research-program-decisions/2026-09-03-post-crclgr-g3-10-authorization-review.md) — separate current-state review that yielded `G3-10-AUTHORIZED`'
              t = replace_required(t, needle, block, 'research index prerequisite chain')
          p.write_text(t, encoding='utf-8')

          # RG3 entry page: put the prerequisite chain in read-first navigation.
          p = Path('doc/research-generation-3/README.md')
          t = p.read_text(encoding='utf-8')
          t = insert_after_prefix(
              t,
              '- [`checkpoints/2026-09-04-g3-10-formal-complete-closure.md`]',
              [
                  '<!-- G3-10-PREREQUISITE-CHAIN-READ-FIRST -->',
                  '- [`../canonical-resource-robust-continuous-local-geometry-representation/README.md`](../canonical-resource-robust-continuous-local-geometry-representation/README.md) — G3-10入力representationをformal eligibleとしたCRCLGR入口',
                  '- [`../canonical-resource-robust-continuous-local-geometry-representation/STUDY_1_FINAL_REPORT.md`](../canonical-resource-robust-continuous-local-geometry-representation/STUDY_1_FINAL_REPORT.md) — CRCLGR formal eligibilityとbounded claim boundary',
                  '- [`../research-program-decisions/2026-09-03-post-crclgr-g3-10-authorization-review.md`](../research-program-decisions/2026-09-03-post-crclgr-g3-10-authorization-review.md) — separate reviewによる`G3-10-AUTHORIZED` decision',
                  '- [`../resource-robust-continuous-local-geometry-representation/README.md`](../resource-robust-continuous-local-geometry-representation/README.md) — predecessor RRCLGR technical-invalid closure入口',
                  '- [`../resource-robust-continuous-local-geometry-representation/STUDY_1_FINAL_REPORT.md`](../resource-robust-continuous-local-geometry-representation/STUDY_1_FINAL_REPORT.md) — RRCLGR closure-time no-rescue / successor boundary正本',
              ],
              '<!-- G3-10-PREREQUISITE-CHAIN-READ-FIRST -->',
              'RG3 prerequisite read-first chain',
          )
          p.write_text(t, encoding='utf-8')

          # CRCLGR current-facing status: distinguish closure-time gate from later chronology.
          p = Path('doc/canonical-resource-robust-continuous-local-geometry-representation/CURRENT_STATUS.md')
          t = p.read_text(encoding='utf-8')
          if 'Updated: 2026-09-03' in t:
              t = t.replace('Updated: 2026-09-03', 'Updated: 2026-09-04', 1)
          t = replace_required(t, 'G3-10 = NOT AUTHORIZED pending separate post-CRCLGR review', 'G3-10 downstream chronology = later separate post-CRCLGR review yielded G3-10-AUTHORIZED; GCLD-STUDY1 subsequently CLOSED / FORMAL-COMPLETE', 'CRCLGR current G3-10')
          t = replace_required(t, 'main integration = NOT AUTHORIZED / NOT PERFORMED', 'repository integration = CRCLGR history carried into G3-10 research branch / combined main integration NOT AUTHORIZED / NOT PERFORMED', 'CRCLGR current integration')
          if 'CRCLGR closure時点ではG3-10を自動authorizeせず' not in t:
              marker = 'No same-evidence rerun, seed extension, root replacement, representation redesign or resource-ceiling relaxation is authorized for CRCLGR-STUDY1.'
              note = 'CRCLGR closure時点ではG3-10を自動authorizeせずseparate reviewを要求した。そのreviewはその後完了して`G3-10-AUTHORIZED`となり、GCLD-STUDY1も`CLOSED / FORMAL-COMPLETE`まで完了した。この後続chronologyはCRCLGRのformal decisionやclaim boundaryを変更しない。\n\n' + marker
              t = replace_required(t, marker, note, 'CRCLGR current chronology note')
          p.write_text(t, encoding='utf-8')

          # CRCLGR README: current navigation note without rewriting historical final-report decisions.
          p = Path('doc/canonical-resource-robust-continuous-local-geometry-representation/README.md')
          t = p.read_text(encoding='utf-8')
          old = 'G3-10はこのStudyのformal eligibilityによって自動的にはauthorizedされない。別のpost-prerequisite current-state authorization reviewが必要である。'
          new = 'CRCLGR closure時点では、G3-10はこのStudyのformal eligibilityだけでは自動authorizeせず、別のpost-prerequisite current-state authorization reviewを必要とした。そのreviewはその後独立に完了して`G3-10-AUTHORIZED`となり、後続`GCLD-STUDY1`は`CLOSED / FORMAL-COMPLETE`まで完了した。これはCRCLGRのformal decisionを事後変更するものではない。'
          t = replace_required(t, old, new, 'CRCLGR README chronology')
          t = replace_required(t, 'G3-10 = NOT AUTHORIZED pending separate review', 'G3-10 at CRCLGR closure = NOT AUTHORIZED pending separate review\nsubsequent G3-10 = AUTHORIZED by separate review / GCLD-STUDY1 CLOSED FORMAL-COMPLETE', 'CRCLGR README safety chronology')
          t = replace_required(t, 'main integration = NOT AUTHORIZED / NOT PERFORMED', 'combined successor-branch main integration = NOT AUTHORIZED / NOT PERFORMED', 'CRCLGR README integration')
          p.write_text(t, encoding='utf-8')

          # RRCLGR current-facing status: the successor is no longer hypothetical.
          p = Path('doc/resource-robust-continuous-local-geometry-representation/CURRENT_STATUS.md')
          t = p.read_text(encoding='utf-8')
          if 'Updated: 2026-09-03' in t:
              t = t.replace('Updated: 2026-09-03', 'Updated: 2026-09-04', 1)
          t = replace_required(t, 'G3-10 = NOT AUTHORIZED', 'G3-10 downstream chronology = successor CRCLGR later established formal eligibility; separate post-CRCLGR review then yielded G3-10-AUTHORIZED; GCLD-STUDY1 CLOSED / FORMAL-COMPLETE', 'RRCLGR current G3-10')
          t = replace_required(t, 'main integration = NOT AUTHORIZED / NOT PERFORMED', 'repository integration = RRCLGR history carried into successor G3-10 branch / combined main integration NOT AUTHORIZED / NOT PERFORMED', 'RRCLGR current integration')
          if '## Next permitted action' in t:
              t = t.split('## Next permitted action', 1)[0].rstrip() + '''\n\n## Subsequent program chronology\n\nRRCLGR closure後、同Studyを修正・rerunするのではなく、fresh namespaceとcanonical structured-digest contractを持つ独立後継`CRCLGR-STUDY1`がprospectively開始された。CRCLGRは`FORMAL-ELIGIBLE-RESOURCE-BOUNDED-CONTINUOUS-REPRESENTATION`で完了し、その後のseparate current-state reviewでG3-10がauthorizedされた。`GCLD-STUDY1`も現在は`CLOSED / FORMAL-COMPLETE`である。\n\nこの後続chronologyはRRCLGRの`CLOSED / TECHNICAL-INVALID`、Stage 2未実行、scientific summary非承認、no-rescue boundaryを一切変更しない。RRCLGR-STUDY1内に残るscientific actionはない。\n'''
          p.write_text(t, encoding='utf-8')

          # RRCLGR README: current downstream chronology while preserving the technical-invalid closure.
          p = Path('doc/resource-robust-continuous-local-geometry-representation/README.md')
          t = p.read_text(encoding='utf-8')
          t = replace_required(t, 'G3-10 = NOT AUTHORIZED', 'G3-10 at RRCLGR closure = NOT AUTHORIZED\nsubsequent G3-10 chronology = CRCLGR formal eligible → separate review G3-10-AUTHORIZED → GCLD-STUDY1 CLOSED FORMAL-COMPLETE', 'RRCLGR README chronology')
          t = replace_required(t, 'main integration = NOT AUTHORIZED / NOT PERFORMED', 'combined successor-branch main integration = NOT AUTHORIZED / NOT PERFORMED', 'RRCLGR README integration')
          old = '今後continuous representation prerequisiteを再検証する場合は、RRCLGR-STUDY1のrepairではなく、fresh seed namespaceと新たなprospective contractを持つ独立Study/versionとして開始しなければならない。'
          new = 'RRCLGR closure時点では、continuous representation prerequisiteを再検証する場合はRRCLGR-STUDY1のrepairではなく、fresh seed namespaceと新たなprospective contractを持つ独立Study/versionとして開始する必要があった。その条件を満たす後継`CRCLGR-STUDY1`がその後独立に実施されformal eligibleで閉じた。RRCLGR自体のdecisionは変更しない。'
          t = replace_required(t, old, new, 'RRCLGR README successor chronology')
          p.write_text(t, encoding='utf-8')

          # GCLD current status: record this final doc-only audit run.
          p = Path('doc/geometry-conditioned-longitudinal-dynamics/CURRENT_STATUS.md')
          t = p.read_text(encoding='utf-8')
          run_id = os.environ.get('GITHUB_RUN_ID', 'UNKNOWN')
          anchor = 'pre-main readiness audit run = 33817654425'
          if 'final cross-document consistency audit run =' not in t:
              t = replace_required(t, anchor, anchor + f'\nfinal cross-document consistency audit run = {run_id}', 'GCLD final audit provenance')
          p.write_text(t, encoding='utf-8')
          PY

      - name: Verify scientific, historical and current-facing invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object doc/research-generation-3/PROGRAM_PLAN.md)" = "2bb90c11f1625f63f40a7eab8a3de7774505a1ac"
          test "$(sha256sum doc/geometry-conditioned-longitudinal-dynamics/results/stage-2/STAGE_2_FORMAL_RESULT.json | awk '{print $1}')" = "08f31652fb599cf9db9b839cbc07f8aabe06aed69215208ec0556e6ec3a5bf7a"
          grep -Fq 'G3-10 = GCLD-STUDY1 / CLOSED / FORMAL-COMPLETE' doc/research-generation-3/CURRENT_STATUS.md
          grep -Fq 'C4-CHRONOLOGY-CONDITIONED-CIRCULATION = NOT-CONFIRMED' doc/geometry-conditioned-longitudinal-dynamics/CURRENT_STATUS.md
          grep -Fq 'repository readiness = PRE-MAIN-INTEGRATION-READY' doc/geometry-conditioned-longitudinal-dynamics/CURRENT_STATUS.md
          grep -Fq 'main integration = NOT AUTHORIZED / NOT PERFORMED' doc/geometry-conditioned-longitudinal-dynamics/CURRENT_STATUS.md
          grep -Fq '<!-- G3-10-PREREQUISITE-CHAIN-ROOT -->' README.md
          grep -Fq '<!-- G3-10-PREREQUISITE-CHAIN-INDEX -->' doc/RESEARCH_INDEX.md
          grep -Fq '<!-- G3-10-PREREQUISITE-CHAIN-READ-FIRST -->' doc/research-generation-3/README.md
          grep -Fq 'GCLD-STUDY1 subsequently CLOSED / FORMAL-COMPLETE' doc/canonical-resource-robust-continuous-local-geometry-representation/CURRENT_STATUS.md
          grep -Fq 'GCLD-STUDY1 CLOSED / FORMAL-COMPLETE' doc/resource-robust-continuous-local-geometry-representation/CURRENT_STATUS.md
          ! grep -Fq 'G3-10 = NOT AUTHORIZED pending separate post-CRCLGR review' doc/canonical-resource-robust-continuous-local-geometry-representation/CURRENT_STATUS.md
          ! grep -Fq '## Next permitted action' doc/resource-robust-continuous-local-geometry-representation/CURRENT_STATUS.md
          ! grep -Fq '別authorization reviewを要求するcurrent program decision。' README.md
          grep -Fq 'Research Generation 3: **Active / G3-10 `GCLD-STUDY1` CLOSED `FORMAL-COMPLETE`' doc/FUTURE_RESEARCH_AGENDA.md

      - name: Commit only final current-facing consistency repairs
        shell: bash
        run: |
          set -euo pipefail
          files=(
            README.md
            doc/RESEARCH_INDEX.md
            doc/research-generation-3/README.md
            doc/canonical-resource-robust-continuous-local-geometry-representation/CURRENT_STATUS.md
            doc/canonical-resource-robust-continuous-local-geometry-representation/README.md
            doc/resource-robust-continuous-local-geometry-representation/CURRENT_STATUS.md
            doc/resource-robust-continuous-local-geometry-representation/README.md
            doc/geometry-conditioned-longitudinal-dynamics/CURRENT_STATUS.md
          )
          git add "${files[@]}"
          git diff --cached --name-only | sort > /tmp/actual.txt
          printf '%s\n' "${files[@]}" | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          ! git diff --cached --name-only | grep -Fx 'doc/research-generation-3/PROGRAM_PLAN.md'
          ! git diff --cached --name-only | grep -F '/results/'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete final G3-10 current-facing consistency pass"
          git push origin HEAD:research/g3-10-geometry-conditioned-longitudinal-dynamics
