name: GCLD Stage 2 Formal

on:
  push:
    branches:
      - research/g3-10-geometry-conditioned-longitudinal-dynamics
    paths:
      - doc/geometry-conditioned-longitudinal-dynamics/authorizations/STAGE_2_FORMAL_TRIGGER

permissions:
  contents: read

concurrency:
  group: gcld-stage2-formal-v1
  cancel-in-progress: false

jobs:
  stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out exact Stage 2 trigger branch
        uses: actions/checkout@v4
        with:
          ref: research/g3-10-geometry-conditioned-longitudinal-dynamics
          fetch-depth: 0

      - name: Syntax-check frozen Stage 2 tooling before fresh access
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/experiments/run-gcld-stage2-formal.js
          node --check tools/experiments/verify-gcld-stage2-authorization.js
          node --check tools/experiments/verify-gcld-stage2-formal-result.js

      - name: Verify source-bound Stage 2 authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_NUMBER}" = "1"
          node tools/experiments/verify-gcld-stage2-authorization.js

      - name: Materialize durable pre-computation lease before fresh seed access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/gcld-stage2-lease
          node - <<'NODE'
          const fs=require('node:fs');
          const a=require('./doc/geometry-conditioned-longitudinal-dynamics/authorizations/STAGE_2_FORMAL_AUTHORIZATION.json');
          const lease={
            schemaVersion:1,
            studyId:a.studyId,
            stageId:a.stageId,
            authorizationDecision:a.authorizationDecision,
            authorizationCommit:a.authorizationCommit,
            authorizedToolingCommit:a.authorizedToolingCommit,
            triggerCommit:process.env.GITHUB_SHA,
            workflowRunId:process.env.GITHUB_RUN_ID,
            workflowRunNumber:Number(process.env.GITHUB_RUN_NUMBER),
            stage2SeedStart:a.stage2SeedStart,
            stage2SeedEnd:a.stage2SeedEnd,
            maxScientificExecutions:1,
            scientificComputationStarted:false,
            sameEvidenceRerunAuthorized:false,
            protectedDepth10AccessAuthorized:false,
            mainIntegrationAuthorized:false
          };
          fs.writeFileSync('artifacts/gcld-stage2-lease/GCLD_STAGE2_LEASE.json',JSON.stringify(lease,null,2)+'\n');
          NODE

      - name: Upload lease before scientific computation
        uses: actions/upload-artifact@v4
        with:
          name: gcld-stage2-lease-${{ github.run_id }}
          path: artifacts/gcld-stage2-lease/GCLD_STAGE2_LEASE.json
          if-no-files-found: error
          retention-days: 90

      - name: Execute exactly one authorized Stage 2 formal computation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/gcld-stage2-result
          mkdir -p artifacts/gcld-stage2-result
          node tools/experiments/run-gcld-stage2-formal.js --output-dir artifacts/gcld-stage2-result

      - name: Independently verify canonical formal result
        shell: bash
        run: |
          set -euo pipefail
          node tools/experiments/verify-gcld-stage2-formal-result.js --result-dir artifacts/gcld-stage2-result

      - name: Upload canonical Stage 2 artifact before repository mirror
        uses: actions/upload-artifact@v4
        with:
          name: gcld-stage2-result-${{ github.run_id }}
          path: artifacts/gcld-stage2-result/*
          if-no-files-found: error
          retention-days: 90
