name: UMSSR Stage 1 Scientific Development

# Scientific consume-once workflow. Triggered only by explicit Stage 1 authorization artifact.
on:
  push:
    branches:
      - research/g2-10-unified-multiaxial-strategic-state-representation
    paths:
      - 'doc/unified-multiaxial-strategic-state-representation/authorizations/STAGE_1_EXECUTION_AUTHORIZATION.json'

permissions:
  contents: read

jobs:
  scientific-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Environment
        run: |
          node --version
          git rev-parse HEAD
          git rev-parse HEAD^
          git status --short
      - name: Syntax checks
        run: |
          node --check tools/experiments/run-umssr-stage1-development.js
          node --check tools/experiments/lib/umssr-stage1-production.js
          node --check tools/experiments/lib/umssr-stage1-independent.js
      - name: Run consume-once scientific development
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/local/umssr-stage1-development
          /usr/bin/time -v node tools/experiments/run-umssr-stage1-development.js artifacts/local/umssr-stage1-development \
            2>&1 | tee artifacts-umssr-stage1-development.log
      - name: Preserve scientific artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umssr-stage1-development-${{ github.sha }}
          path: |
            artifacts/local/umssr-stage1-development/**
            artifacts-umssr-stage1-development.log
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
