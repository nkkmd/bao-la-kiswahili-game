name: EBRWS technical-invalid central document sync

on:
  push:
    branches:
      - research/g3-02-effective-branching-reply-width-structure
    paths:
      - ".github/workflows/ebrws-technical-invalid-central-doc-sync.yml"
      - "tools/experiments/materialize-ebrws-technical-invalid-central-docs.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ebrws-technical-invalid-central-doc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/g3-02-effective-branching-reply-width-structure
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Materialize final Actions-history audit addenda
        run: node tools/experiments/materialize-ebrws-final-actions-audit-addenda.js

      - name: Materialize current-facing closure state
        run: node tools/experiments/materialize-ebrws-technical-invalid-central-docs.js

      - name: Assert historical PROGRAM_PLAN unchanged in this sync
        shell: bash
        run: |
          if ! git diff --quiet -- doc/research-generation-3/PROGRAM_PLAN.md; then
            echo "Historical PROGRAM_PLAN.md changed unexpectedly" >&2
            exit 1
          fi

      - name: Commit synchronized closure documents
        shell: bash
        run: |
          git config user.name "Sawa"
          git config user.email "72678394+nkkmd@users.noreply.github.com"
          git add README.md \
                  doc/RESEARCH_INDEX.md \
                  doc/FUTURE_RESEARCH_AGENDA.md \
                  doc/effective-branching-reply-width-structure/README.md \
                  doc/effective-branching-reply-width-structure/STUDY_1_OVERVIEW.md \
                  doc/effective-branching-reply-width-structure/STUDY_1_FINAL_REPORT.md \
                  doc/effective-branching-reply-width-structure/REPRODUCIBILITY_INDEX.md \
                  doc/research-generation-3/README.md \
                  doc/research-generation-3/CURRENT_STATUS.md
          if git diff --cached --quiet; then
            echo "No closure document changes"
          else
            git commit -m "Synchronize EBRWS final Actions-history audit"
            git push origin HEAD:research/g3-02-effective-branching-reply-width-structure
          fi
