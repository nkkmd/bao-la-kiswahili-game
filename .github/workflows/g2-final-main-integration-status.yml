name: Research Generation 2 main integration status sync

on:
  push:
    branches:
      - main
    paths:
      - doc/research-generation-2/authorizations/MAIN_INTEGRATION_STATUS_EXECUTE.json

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate authorization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('doc/research-generation-2/authorizations/MAIN_INTEGRATION_STATUS_EXECUTE.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['schemaVersion'] == 1
          assert d['mainIntegrationStatusSyncAuthorized'] is True
          assert d['scientificExecutionAuthorized'] is False
          assert d['scientificDecisionChangeAuthorized'] is False
          assert d['targetBranch'] == 'main'
          assert d['fastForwardIntegratedSha'] == '5210f70df6faca528fc1bd419808bc7664d7a447'
          expected = {
            'doc/research-generation-2/CURRENT_STATUS.md',
            'doc/research-generation-2/FINAL_SYNTHESIS.md',
            'doc/research-generation-2/PROGRAM_FINAL_RESULT.json',
            'doc/research-program-decisions/2026-08-31-research-generation-2-program-closure.md',
            'doc/research-generation-2/checkpoints/2026-08-31-main-integration-complete.md',
          }
          assert set(d['allowedPaths']) == expected
          PY

      - name: Synchronize integration state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'{label}: expected 1 anchor, found {n}')
              return text.replace(old, new, 1)

          p = Path('doc/research-generation-2/CURRENT_STATUS.md')
          text = p.read_text(encoding='utf-8')
          text = replace_once(text,
              'Program status = CLOSED ON RESEARCH BRANCH / PENDING MAIN INTEGRATION',
              'Program status = CLOSED / INTEGRATED TO MAIN', 'CURRENT_STATUS program status')
          text = replace_once(text,
              'Central documentation synchronization = COMPLETE ON CLOSURE BRANCH',
              'Central documentation synchronization = COMPLETE / INTEGRATED TO MAIN', 'CURRENT_STATUS central sync')
          text = replace_once(text,
              'Main integration = NOT PERFORMED',
              'Main integration = COMPLETE', 'CURRENT_STATUS main integration')
          old = 'このstatusはclosure research branch上の状態である。`main`への統合は実施していない。最終文書整合監査は完了しており、明示的な統合指示がある場合にのみfast-forward integrationを行う。'
          new = '`main`へのfast-forward integrationは2026-08-31に完了した。Research Generation 2 core programは中央文書・program-level正本・最終整合監査を含めて`main`上に統合済みである。'
          text = replace_once(text, old, new, 'CURRENT_STATUS final paragraph')
          p.write_text(text, encoding='utf-8')

          p = Path('doc/research-generation-2/FINAL_SYNTHESIS.md')
          text = p.read_text(encoding='utf-8')
          text = replace_once(text,
              '状態: **PROGRAM CLOSED ON RESEARCH BRANCH / PENDING MAIN INTEGRATION**',
              '状態: **PROGRAM CLOSED / INTEGRATED TO MAIN**', 'FINAL_SYNTHESIS state')
          p.write_text(text, encoding='utf-8')

          p = Path('doc/research-generation-2/PROGRAM_FINAL_RESULT.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['programStatus'] == 'CLOSED-PENDING-MAIN-INTEGRATION'
          assert d['mainIntegration'] == 'NOT-PERFORMED'
          d['programStatus'] = 'CLOSED'
          d['mainIntegration'] = 'COMPLETE'
          d['mainIntegrationFastForwardSha'] = '5210f70df6faca528fc1bd419808bc7664d7a447'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          p = Path('doc/research-program-decisions/2026-08-31-research-generation-2-program-closure.md')
          text = p.read_text(encoding='utf-8')
          old = 'このclosure branchの中央文書同期と最終監査後、明示的な指示がある場合にのみ`main`へ統合する。'
          new = '中央文書同期と最終監査を完了後、明示的な統合指示に基づき2026-08-31に`main`へfast-forward integrationを完了した。科学的decision、claim boundary、G2-H01のdeferred / non-blocking状態は変更していない。'
          text = replace_once(text, old, new, 'program closure integration sentence')
          p.write_text(text, encoding='utf-8')

          checkpoint = Path('doc/research-generation-2/checkpoints/2026-08-31-main-integration-complete.md')
          if checkpoint.exists():
              raise RuntimeError('integration checkpoint already exists')
          checkpoint.write_text('''# 2026-08-31 — Research Generation 2 main integration complete\n\n## Integration\n\nResearch Generation 2 program closure branchをremote `main`へforceなしのfast-forwardで統合した。\n\n```text\npre-integration main = 9f64aba1aa2364621196c1aeccda02bf74217f20\nclosure branch audited head = 5210f70df6faca528fc1bd419808bc7664d7a447\ncompare before integration = ahead 26 / behind 0\nmerge base = 9f64aba1aa2364621196c1aeccda02bf74217f20\nfast-forward target = 5210f70df6faca528fc1bd419808bc7664d7a447\nforce = false\n```
\n## Scientific state unchanged\n\n```text\nResearch Generation 2 core = CLOSED\nG2-11 = NON-ESTIMABLE / NOT-AUTHORIZED-NOT-EXECUTED / Study ID not assigned\nG2-11 scientific outcome generated = false\nG2-H01 = DEFERRED / INDEPENDENT / NON-BLOCKING\nvalidated transform set = []\nvalidated strategic-regime representation = none\nG2-12 = TECHNICAL-INVALID / selectedEstimator null\nfresh depth 10/11 = not generated / not read\nwhole-Bao state-space/game-tree estimate = not authorized\n```
\n本integrationはrepository stateの統合であり、既存Studyのformal decision、threshold、population、seed、scientific artifactを変更しない。\n\n## Post-integration status synchronization\n\n`CURRENT_STATUS.md`、`FINAL_SYNTHESIS.md`、`PROGRAM_FINAL_RESULT.json`、program closure decisionのintegration-state表記だけをmain統合済みへ同期した。同期用temporary workflowは完了確認後に削除する。\n''', encoding='utf-8')
          PY

      - name: Verify diff scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
            'doc/research-generation-2/CURRENT_STATUS.md',
            'doc/research-generation-2/FINAL_SYNTHESIS.md',
            'doc/research-generation-2/PROGRAM_FINAL_RESULT.json',
            'doc/research-program-decisions/2026-08-31-research-generation-2-program-closure.md',
            'doc/research-generation-2/checkpoints/2026-08-31-main-integration-complete.md',
          }
          changed = set(filter(None, subprocess.check_output(['git','status','--short'], text=True).splitlines()))
          paths = {line[3:] for line in changed}
          assert paths == expected, (paths, expected)
          PY

      - name: Commit integration-state synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/research-generation-2/CURRENT_STATUS.md \
                  doc/research-generation-2/FINAL_SYNTHESIS.md \
                  doc/research-generation-2/PROGRAM_FINAL_RESULT.json \
                  doc/research-generation-2/checkpoints/2026-08-31-main-integration-complete.md \
                  doc/research-program-decisions/2026-08-31-research-generation-2-program-closure.md
          git commit -m "Record Research Generation 2 main integration completion"
          git push origin HEAD:main
