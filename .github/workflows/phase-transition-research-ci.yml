name: Phase Transition Research CI

on:
  pull_request:
    paths:
      - "doc/PHASE_TRANSITION_RESEARCH_PLAN.md"
      - "doc/phase-transition/**"
      - "schemas/phase-transition-observation.schema.json"
      - "tools/experiments/**"
      - "test/phase-transition-*.test.js"
      - "test/forced-capture-regimes.test.js"
      - "test/phase-transition-*.test.py"
      - "notebooks/phase-transition/**"
      - ".github/workflows/phase-transition-research-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Run phase-transition tests
        run: |
          node test/phase-transition-features.test.js
          node test/phase-transition-fixture.test.js
          node test/phase-transition-runner.test.js
          node test/phase-transition-candidate-audit.test.js
          node test/forced-capture-regimes.test.js
          python test/phase-transition-analysis.test.py
          python test/phase-transition-forcing-ablation.test.py
          python test/phase-transition-archetypes.test.py
      - name: Generate fixture artifacts
        run: node tools/experiments/generate-phase-transition-fixture.js
      - name: Verify fixture artifacts
        run: node tools/experiments/verify-phase-transition-artifacts.js
      - name: Run shortened diversity smoke research
        run: |
          node tools/experiments/run-phase-transition-research.js \
            --games 4 \
            --seed 20260721 \
            --max-ply 10 \
            --opening-plies 4 \
            --baseline-games 1 \
            --level easy \
            --max-depth 1 \
            --output artifacts/phase-transition/ci-diversity-smoke
          node tools/experiments/verify-phase-transition-artifacts.js \
            --input artifacts/phase-transition/ci-diversity-smoke
          node -e 'const m=require("./artifacts/phase-transition/ci-diversity-smoke/manifest.json"); if(!m.diversity.passesPilotGate) throw new Error(JSON.stringify(m.diversity))'
      - name: Rebuild and audit six priority regimes
        run: node tools/experiments/run-priority-forced-capture-regime-audit.js
      - name: Rebuild pilot-v2 and analyze all A candidates
        run: |
          node tools/experiments/run-phase-transition-research.js \
            --profile pilot-v2 \
            --output artifacts/phase-transition/pilot-v2-current-source
          node tools/experiments/verify-phase-transition-artifacts.js \
            --input artifacts/phase-transition/pilot-v2-current-source
          python tools/experiments/analyze-phase-transition-archetypes.py \
            --input artifacts/phase-transition/pilot-v2-current-source \
            --output artifacts/local/phase-transition-archetypes-current-source
          node tools/experiments/analyze-forced-capture-regimes.js \
            --observations artifacts/phase-transition/pilot-v2-current-source/observations.jsonl \
            --candidates artifacts/local/phase-transition-archetypes-current-source/candidate-archetypes.csv \
            --output artifacts/local/phase-transition-forced-capture-regimes-current-source
      - name: Validate schema, notebooks, and analysis syntax
        run: |
          node -e 'JSON.parse(require("node:fs").readFileSync("schemas/phase-transition-observation.schema.json", "utf8"))'
          for notebook in notebooks/phase-transition/*.ipynb; do node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$notebook"; done
          node --check tools/experiments/extract-phase-transition-candidate-audit.js
          node --check tools/experiments/analyze-forced-capture-regimes.js
          node --check tools/experiments/run-priority-forced-capture-regime-audit.js
          python -m py_compile tools/experiments/analyze-phase-transition-pilot.py
          python -m py_compile tools/experiments/analyze-phase-transition-forcing-ablation.py
          python -m py_compile tools/experiments/analyze-phase-transition-archetypes.py
      - name: Upload phase-transition artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase-transition-ci-artifacts
          path: |
            artifacts/phase-transition/fixture/
            artifacts/phase-transition/ci-diversity-smoke/
            artifacts/local/priority-forced-capture-regime-audit/
            artifacts/local/phase-transition-archetypes-current-source/
            artifacts/local/phase-transition-forced-capture-regimes-current-source/
          if-no-files-found: error
