name: Game record verification

on:
  pull_request:
    paths:
      - 'public/game-record.js'
      - 'public/game-record-replay.js'
      - 'public/game-record-contribution-config.js'
      - 'public/game-record-contribution.js'
      - 'public/index.html'
      - 'public/main.js'
      - 'public/style.css'
      - 'public/privacy.html'
      - 'public/service-worker.js'
      - 'cloudflare/game-record-ingest/**'
      - 'doc/GAME_RECORD.md'
      - 'doc/GAME_RECORD_CONTRIBUTION.md'
      - 'doc/SYSTEM_DESIGN.md'
      - 'test/game-record.test.js'
      - 'test/game-record-replay.test.js'
      - 'test/game-record-ui.test.js'
      - 'test/game-record-browser-hook.test.js'
      - 'test/game-record-contribution-config.test.js'
      - 'test/game-record-contribution-worker.test.mjs'
      - 'test/game-record-contribution-fetch-metadata.test.mjs'
      - '.github/workflows/game-record-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Verify game record format and browser integration
        run: |
          node --test \
            test/game-record.test.js \
            test/game-record-replay.test.js \
            test/game-record-ui.test.js \
            test/game-record-browser-hook.test.js \
            test/game-record-contribution-config.test.js \
            test/game-record-contribution-worker.test.mjs \
            test/game-record-contribution-fetch-metadata.test.mjs
      - name: Verify adjacent public UI regressions
        run: |
          node --test \
            test/engine.test.js \
            test/locale.test.js \
            test/diagnostics-ui.test.js \
            test/ai-generation-release.test.js
      - name: Package public directory for device testing
        uses: actions/upload-artifact@v4
        with:
          name: game-record-contribution-public
          path: public/
          if-no-files-found: error
          retention-days: 7
