name: Game record verification

on:
  pull_request:
    paths:
      - 'public/game-record.js'
      - 'public/rule-versions.js'
      - 'public/engine-r002.js'
      - 'public/engine.js'
      - 'public/diagnostics.js'
      - 'test/takasia-record.test.mjs'
      - 'tools/takasia/record-fixtures.json'
      - 'tools/takasia/check-record-fixtures.cjs'
      - 'public/game-record-replay.js'
      - 'public/game-record-contribution-config.js'
      - 'public/game-record-contribution.js'
      - 'public/index.html'
      - 'public/main.js'
      - 'public/style.css'
      - 'public/privacy.html'
      - 'public/service-worker.js'
      - 'cloudflare/game-record-ingest/**'
      - 'doc/GAME_RECORD.md'
      - 'doc/GAME_RECORD_CONTRIBUTION.md'
      - 'doc/SYSTEM_DESIGN.md'
      - 'test/game-record.test.js'
      - 'test/game-record-replay.test.js'
      - 'test/game-record-ui.test.js'
      - 'test/game-record-browser-hook.test.js'
      - 'test/game-record-contribution-config.test.js'
      - 'test/game-record-contribution-worker.test.mjs'
      - 'test/game-record-contribution-fetch-metadata.test.mjs'
      - 'test/ai-generation-release.test.js'
      - 'tools/takasia/check-current-assets.cjs'
      - '.github/workflows/game-record-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  takasia-record-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify saved standard-initial regression fixtures
        run: node tools/takasia/check-record-fixtures.cjs --check
      - name: Verify versioned records, diagnostics and receiver
        run: |
          node --test test/takasia-record.test.mjs test/game-record.test.js test/game-record-replay.test.js test/game-record-browser-hook.test.js test/game-record-ui.test.js test/game-record-contribution-worker.test.mjs test/game-record-contribution-fetch-metadata.test.mjs test/game-record-contribution-config.test.js test/diagnostics.test.js test/diagnostic-to-fixture.test.js test/diagnostic-download.test.js test/diagnostics-ui.test.js test/locale.test.js
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Verify game record format and browser integration
        run: |
          node --test \
            test/game-record.test.js \
            test/game-record-replay.test.js \
            test/game-record-ui.test.js \
            test/game-record-browser-hook.test.js \
            test/game-record-contribution-config.test.js \
            test/game-record-contribution-worker.test.mjs \
            test/game-record-contribution-fetch-metadata.test.mjs
      - name: Verify adjacent public UI regressions
        run: |
          node --test \
            test/engine.test.js \
            test/locale.test.js \
            test/diagnostics-ui.test.js \
            test/ai-generation-release.test.js
      - name: Package public directory for device testing
        uses: actions/upload-artifact@v4
        with:
          name: game-record-contribution-public
          path: public/
          if-no-files-found: error
          retention-days: 7

