name: Phase Transition Move Quality

on:
  pull_request:
    paths:
      - "tools/experiments/analyze-phase-transition-move-quality.js"
      - "tools/experiments/analyze-forced-capture-regime-controls.js"
      - "test/phase-transition-move-quality.test.js"
      - ".github/workflows/phase-transition-move-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  move-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pandas
      - run: node test/phase-transition-move-quality.test.js
      - name: Rebuild corpus, candidates, controls, and move quality
        run: |
          node tools/experiments/run-phase-transition-research.js --profile pilot-v2 --output artifacts/phase-transition/pilot-v2-current-source
          python tools/experiments/analyze-phase-transition-archetypes.py --input artifacts/phase-transition/pilot-v2-current-source --output artifacts/local/phase-transition-archetypes-current-source
          node tools/experiments/analyze-forced-capture-regime-controls.js --observations artifacts/phase-transition/pilot-v2-current-source/observations.jsonl --candidates artifacts/local/phase-transition-archetypes-current-source/archetype-members.csv --output artifacts/local/phase-transition-regime-controls-current-source
          node tools/experiments/analyze-phase-transition-move-quality.js --games artifacts/phase-transition/pilot-v2-current-source/games --candidates artifacts/local/phase-transition-regime-controls-current-source/candidate-control-metrics.csv --output artifacts/local/phase-transition-move-quality-current-source
      - uses: actions/upload-artifact@v4
        with:
          name: phase-transition-move-quality
          path: artifacts/local/phase-transition-move-quality-current-source/
          if-no-files-found: error
