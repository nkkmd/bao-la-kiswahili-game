name: PCEM final agenda section sync

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pcem-final-agenda-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Synchronize Future Research Agenda section 4.7
        run: python tools/experiments/pcem-final-agenda-sync.py
      - name: Commit synchronized agenda section
        run: |
          if git diff --quiet -- doc/FUTURE_RESEARCH_AGENDA.md; then
            echo 'No agenda change required.'
            exit 0
          fi
          git diff --check
          git config user.name 'Sawa'
          git config user.email '72678394+nkkmd@users.noreply.github.com'
          git add doc/FUTURE_RESEARCH_AGENDA.md
          git commit -m 'docs(pcem): close Future Research Agenda section 4.7'
          git push origin HEAD:research/practical-comeback-error-inducing-moves
