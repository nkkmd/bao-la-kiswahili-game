name: G3-09 Main Integration Finalize

on:
  push:
    branches:
      - integration/g3-09-main-finalize-run
    paths:
      - 'doc/continuous-local-geometry-representation/executions/g3-09-main-integration-finalize-trigger.txt'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run post-integration lifecycle finalizer
        run: python3 tools/experiments/finalize-g3-09-main-integration.py
      - name: Commit lifecycle metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md doc/RESEARCH_INDEX.md doc/research-generation-3/README.md doc/research-generation-3/CURRENT_STATUS.md doc/research-generation-3/checkpoints/2026-09-03-g3-09-main-integration-complete.md doc/continuous-local-geometry-representation/README.md doc/continuous-local-geometry-representation/CURRENT_STATUS.md doc/continuous-local-geometry-representation/DECISION_REGISTER.md doc/continuous-local-geometry-representation/REPRODUCIBILITY_INDEX.md
          git diff --cached --quiet && { echo 'No lifecycle changes'; exit 1; }
          git commit -m 'Record G3-09 main integration completion'
          git push origin HEAD:integration/g3-09-main-finalize-run
