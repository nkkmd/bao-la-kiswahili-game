name: PBAI-P2 closure documentation sync

on:
  push:
    branches:
      - engineering/pbai-p2-program-initialization
    paths:
      - '.github/workflows/pbai-p2-program-closure-doc-sync.yml'

permissions:
  contents: write

jobs:
  sync-closure-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engineering/pbai-p2-program-initialization
          fetch-depth: 0

      - name: Verify public source remains untouched
        run: |
          git fetch origin main
          test -z "$(git diff --name-only origin/main...HEAD -- public/)"

      - name: Finalize closure index wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('doc/AI_ENGINEERING_INDEX.md')
          s = p.read_text()
          old = '- 現在進行中のPBAI-P2比較基準: **`AI-GEN2-BASELINE-2026-09-01-v1`**'
          new = '- PBAI-P2 exact baseline: **`AI-GEN2-BASELINE-2026-09-01-v1`**'
          if s.count(old) != 1:
              raise SystemExit(f'expected one stale index label, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          test -z "$(git diff --name-only -- public/)"
          git diff --check

      - name: Commit final closure index wording
        run: |
          git config user.name Sawa
          git config user.email 72678394+nkkmd@users.noreply.github.com
          git add doc/AI_ENGINEERING_INDEX.md
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "Finalize PBAI-P2 closure index wording"
          git push origin HEAD:engineering/pbai-p2-program-initialization
