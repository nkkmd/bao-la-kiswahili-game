name: PBAI-P1 C004 contract freeze

on:
  pull_request:
    branches: [main]
    paths:
      - 'doc/AI_ENGINEERING_INDEX.md'
      - 'doc/ai-engineering/public-ai-improvement-program-1/README.md'
      - 'doc/ai-engineering/public-ai-improvement-program-1/CURRENT_STATUS.md'
      - 'doc/ai-engineering/public-ai-improvement-program-1/CANDIDATE_REGISTER.md'
      - 'doc/ai-engineering/public-ai-improvement-program-1/DECISION_REGISTER.md'
      - 'doc/ai-engineering/public-ai-improvement-program-1/candidates/PBAI-C004-v1*.json'
      - 'doc/engineering-program-decisions/2026-08-26-pbai-c004-v1-development-authorization.md'
      - 'tools/engineering/lib/pbai-p1-decision-population.js'
      - 'tools/engineering/materialize-pbai-c004-predevelopment-support.js'
      - 'tools/engineering/validate-pbai-c004-predevelopment-support-spec.js'
      - 'tools/engineering/validate-pbai-c004-contract.js'
      - 'test/public-ai-improvement-program1-contract.test.js'
      - '.github/workflows/pbai-p1-c004-predevelopment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify contract change contains no public implementation
        run: |
          changed="$(git diff --name-only origin/main...HEAD -- public/)"
          test -z "$changed" || {
            echo 'PBAI-C004-v1 contract freeze must not modify public/.' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
      - name: Verify frozen baseline source hashes
        run: |
          test "$(sha256sum public/engine.js | awk '{print $1}')" = "e6acf1fe4d97db67dbcfadc3a785e802342ae0b0cbaec35f53eb8e77424cfc1c"
          test "$(sha256sum public/ai.js | awk '{print $1}')" = "2823dbcf96c7a47489301ecd768a63975aa8b4e12b62cc4629fc8283ef5dff9e"
      - name: Validate frozen global gates and C004 contracts
        run: |
          node tools/engineering/validate-pbai-p1-gate-spec.js
          node tools/engineering/validate-pbai-c004-predevelopment-support-spec.js
          node tools/engineering/validate-pbai-c004-contract.js
      - name: Verify current PBAI-P1 program contract
        run: node test/public-ai-improvement-program1-contract.test.js
      - name: Validation and holdout execution firewall
        run: |
          ! grep -R --line-number -E '3140[0-9]{4}|3150[0-9]{4}' \
            tools/engineering/materialize-pbai-c004-predevelopment-support.js || {
              echo 'Predevelopment runner must not reference validation/holdout seed values.' >&2
              exit 1
            }
      - name: Reproduce committed baseline-only support result
        run: |
          mkdir -p artifacts/pbai-p1/c004
          node tools/engineering/materialize-pbai-c004-predevelopment-support.js \
            --output artifacts/pbai-p1/c004/predevelopment-support.json >/dev/null
          node - <<'NODE'
          const fs = require('node:fs');
          const actual = JSON.parse(fs.readFileSync('artifacts/pbai-p1/c004/predevelopment-support.json', 'utf8'));
          const frozen = JSON.parse(fs.readFileSync('doc/ai-engineering/public-ai-improvement-program-1/candidates/PBAI-C004-v1-predevelopment-support-result.json', 'utf8'));
          const fail = (message) => { throw new Error(message); };
          if (actual.candidateImplementationObserved !== false) fail('candidate implementation observed');
          if (actual.candidateCodeUsed !== false) fail('candidate code used');
          if (actual.candidateBenefitMetricsObserved !== false) fail('candidate benefit metrics observed');
          if (actual.validationSeedsAccessed !== false) fail('validation seeds accessed');
          if (actual.releaseHoldoutSeedsAccessed !== false) fail('holdout seeds accessed');
          if (actual.publicCodeChanged !== false) fail('public code changed');
          if (actual.population.digest !== frozen.developmentPopulation.populationDigest) fail('population digest mismatch');
          if (actual.measurement.d23TopSetDisjoint !== frozen.measurement.d23TopSetDisjoint) fail('D23 support mismatch');
          if (actual.measurement.d23TopSetOverlap !== frozen.measurement.d23TopSetOverlap) fail('overlap count mismatch');
          if ((actual.measurement.d23TopSetOverlap - actual.measurement.deterministicCanonicalBestStableAmongOverlap)
              !== frozen.measurement.deterministicCanonicalBestChangedAmongOverlap) fail('boundary count mismatch');
          if (actual.targetSupport.eligible !== frozen.targetSupport.eligible) fail('eligible count mismatch');
          if (actual.targetSupport.supportPass !== true) fail('support must pass');
          console.log(JSON.stringify({
            digest: actual.population.digest,
            primaryTargets: actual.targetSupport.eligible,
            boundary: actual.measurement.d23TopSetOverlap - actual.measurement.deterministicCanonicalBestStableAmongOverlap,
            stableBestControls: actual.measurement.deterministicCanonicalBestStableAmongOverlap,
            decision: actual.decision,
          }, null, 2));
          NODE
      - name: Verify C002 remains closed and holdout remains blocked
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const c002 = JSON.parse(fs.readFileSync('doc/ai-engineering/public-ai-improvement-program-1/candidates/PBAI-C002-v1-development-result.json', 'utf8'));
          const c004 = JSON.parse(fs.readFileSync('doc/ai-engineering/public-ai-improvement-program-1/candidates/PBAI-C004-v1.json', 'utf8'));
          if (c002.finalDevelopmentStatus !== 'NON-ESTIMABLE-HOLD') throw new Error('C002 HOLD changed');
          if (c002.decision.developmentAuthorizationContinues !== false) throw new Error('C002 authorization revived');
          if (c004.validationAndHoldoutFirewall.releaseHoldoutExecutionAuthorizedNow !== false) throw new Error('holdout authorization leaked');
          if (c004.candidateImplementationObservedBeforeFreeze !== false) throw new Error('candidate implementation observed before freeze');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pbai-c004-contract-support-reproduction
          path: artifacts/pbai-p1/c004/predevelopment-support.json
          if-no-files-found: error
