name: PBAI-P1 C004 predevelopment support

on:
  pull_request:
    branches: [main]
    paths:
      - 'doc/ai-engineering/public-ai-improvement-program-1/candidates/PBAI-C004-v1-predevelopment-support-spec.json'
      - 'tools/engineering/lib/pbai-p1-decision-population.js'
      - 'tools/engineering/materialize-pbai-c004-predevelopment-support.js'
      - 'tools/engineering/validate-pbai-c004-predevelopment-support-spec.js'
      - '.github/workflows/pbai-p1-c004-predevelopment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  support-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify no public candidate implementation exists
        run: |
          changed="$(git diff --name-only origin/main...HEAD -- public/)"
          test -z "$changed" || {
            echo 'C004 predevelopment probe must not modify public/.' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
      - name: Verify frozen baseline source hashes
        run: |
          test "$(sha256sum public/engine.js | awk '{print $1}')" = "e6acf1fe4d97db67dbcfadc3a785e802342ae0b0cbaec35f53eb8e77424cfc1c"
          test "$(sha256sum public/ai.js | awk '{print $1}')" = "2823dbcf96c7a47489301ecd768a63975aa8b4e12b62cc4629fc8283ef5dff9e"
      - name: Validate frozen global gates and C004 support spec
        run: |
          node tools/engineering/validate-pbai-p1-gate-spec.js
          node tools/engineering/validate-pbai-c004-predevelopment-support-spec.js
      - name: Verify current PBAI-P1 program contract
        run: node test/public-ai-improvement-program1-contract.test.js
      - name: Validation and holdout seed firewall
        run: |
          ! grep -R --line-number -E '3140[0-9]{4}|3150[0-9]{4}' \
            tools/engineering/materialize-pbai-c004-predevelopment-support.js \
            doc/ai-engineering/public-ai-improvement-program-1/candidates/PBAI-C004-v1-predevelopment-support-spec.json || {
              echo 'C004 predevelopment probe references validation/holdout seeds.' >&2
              exit 1
            }
      - name: Materialize baseline-only development support
        run: |
          mkdir -p artifacts/pbai-p1/c004
          node tools/engineering/materialize-pbai-c004-predevelopment-support.js \
            --output artifacts/pbai-p1/c004/predevelopment-support.json \
            | tee artifacts/pbai-p1/c004/predevelopment-support.stdout.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('artifacts/pbai-p1/c004/predevelopment-support.json', 'utf8'));
          if (report.candidateImplementationObserved !== false) throw new Error('candidate implementation observed');
          if (report.candidateCodeUsed !== false) throw new Error('candidate code used');
          if (report.candidateBenefitMetricsObserved !== false) throw new Error('candidate benefit metrics observed');
          if (report.validationSeedsAccessed !== false) throw new Error('validation seeds accessed');
          if (report.releaseHoldoutSeedsAccessed !== false) throw new Error('release holdout seeds accessed');
          if (report.publicCodeChanged !== false) throw new Error('public code changed');
          console.log(JSON.stringify({
            population: report.population,
            measurement: report.measurement,
            targetSupport: report.targetSupport,
            decision: report.decision,
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pbai-c004-predevelopment-support
          path: artifacts/pbai-p1/c004/predevelopment-support.json
          if-no-files-found: error
