name: MLGMR G4-07 Stage 0 technical validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/g4-07-multiscale-geometry-memory-return
    paths:
      - doc/multiscale-local-geometry-memory-return/executions/STAGE_0_TRIGGER.json

permissions:
  contents: read

concurrency:
  group: mlgmr-g4-07-stage0-technical
  cancel-in-progress: false

jobs:
  stage0-technical:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout frozen branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check Stage 0
        run: |
          node --check tools/experiments/lib/mlgmr-production.js
          node --check tools/experiments/lib/mlgmr-independent.js
          node --check tools/experiments/run-mlgmr-stage0-technical.js
          node --check tools/experiments/verify-mlgmr-stage0-binding.js

      - name: Verify frozen execution binding
        run: node tools/experiments/verify-mlgmr-stage0-binding.js

      - name: Run technical-only Stage 0
        run: node tools/experiments/run-mlgmr-stage0-technical.js artifacts/mlgmr-stage0/result.json

      - name: Upload Stage 0 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlgmr-stage0-result
          path: artifacts/mlgmr-stage0/result.json
          if-no-files-found: error
          retention-days: 30
