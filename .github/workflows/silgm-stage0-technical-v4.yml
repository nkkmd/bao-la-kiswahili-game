name: SILGM Stage 0 Technical v4
on:
  push:
    branches:
      - research/g3-07-search-instability-local-geometry-mechanism
    paths:
      - doc/search-instability-local-geometry-mechanism/authorizations/silgm-stage0-v4-trigger.txt
concurrency:
  group: silgm-stage0-technical-v4
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  stage0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Syntax-check frozen Stage 0 v4 tooling
        run: |
          node --check tools/experiments/run-silgm-stage0-technical-v4.js
          node --check tools/experiments/verify-silgm-stage0-v4-authorization.js
          node --check tools/experiments/lib/silgm-production.js
          node --check tools/experiments/lib/silgm-independent.js
      - name: Verify exact Stage 0 v4 authorization and source binding
        run: node tools/experiments/verify-silgm-stage0-v4-authorization.js
      - name: Verify v4 materialization without computation
        run: node tools/experiments/run-silgm-stage0-technical-v4.js --verify-only
      - name: Materialize durable pre-computation lease
        run: |
          mkdir -p artifacts/lease-v4
          printf '%s\n' "SILGM-S0-TECHNICAL-2026-09-03-v4" > artifacts/lease-v4/stage.txt
          git rev-parse HEAD > artifacts/lease-v4/trigger-head.txt
          git rev-parse HEAD^ > artifacts/lease-v4/tooling-parent.txt
          sha256sum doc/search-instability-local-geometry-mechanism/authorizations/STAGE_0_TECHNICAL_AUTHORIZATION_V4.json > artifacts/lease-v4/authorization.sha256
      - name: Upload v4 lease before computation
        uses: actions/upload-artifact@v4
        with:
          name: silgm-stage0-v4-lease-${{ github.run_id }}
          path: artifacts/lease-v4
          if-no-files-found: error
      - name: Execute exactly one authorized technical Stage 0 v4 computation
        run: |
          mkdir -p artifacts/local/search-instability-local-geometry-mechanism/stage0-v4
          node tools/experiments/run-silgm-stage0-technical-v4.js --output artifacts/local/search-instability-local-geometry-mechanism/stage0-v4/STAGE_0_TECHNICAL_RESULT.json
      - name: Upload Stage 0 v4 result before repository mirror
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silgm-stage0-v4-result-${{ github.run_id }}
          path: artifacts/local/search-instability-local-geometry-mechanism/stage0-v4/STAGE_0_TECHNICAL_RESULT.json
          if-no-files-found: error
