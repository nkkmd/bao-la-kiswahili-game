name: G4-03 main integration record materializer

on:
  push:
    branches:
      - research/g4-03-main-integration-record
    paths:
      - '.github/workflows/g4-03-main-integration-record.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout integration-record branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update live-state documents only
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {n}: {old!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # G4-03 local live-state
          replace_once(
              'doc/local-width-search-ranking-transfer/CURRENT_STATUS.md',
              'main integration authorized = false',
              'main integration = COMPLETE / PR #164 / merge commit 73ac1920177c2451669e5ceeccaed53e34459df9')
          replace_once(
              'doc/local-width-search-ranking-transfer/CURRENT_STATUS.md',
              '`main`統合はStudy closureとは別であり、ユーザーの明示指示があるまで行わない。',
              '`main`統合はユーザーの明示指示に基づきPR #164で完了した。merge commitは`73ac1920177c2451669e5ceeccaed53e34459df9`。')
          replace_once(
              'doc/local-width-search-ranking-transfer/README.md',
              'G4-03の研究作業は完了しているが、研究ブランチは`main`から隔離したままである。`main`統合はユーザーの明示指示があるまで行わない。',
              'G4-03はユーザーの明示指示に基づきPR #164で`main`へ統合済みである。merge commitは`73ac1920177c2451669e5ceeccaed53e34459df9`。')

          # RG4 live-state
          replace_once(
              'doc/research-generation-4/CURRENT_STATUS.md',
              'G4-03 = COMPLETE / STAGE2-COMPLETE-WITH-NON-ESTIMABLE / NOT YET MAIN INTEGRATED',
              'G4-03 = COMPLETE / STAGE2-COMPLETE-WITH-NON-ESTIMABLE / MAIN INTEGRATED')
          replace_once(
              'doc/research-generation-4/CURRENT_STATUS.md',
              '| `G4-03` | `COMPLETE / STAGE2-COMPLETE-WITH-NON-ESTIMABLE / NOT YET MAIN INTEGRATED` |',
              '| `G4-03` | `COMPLETE / STAGE2-COMPLETE-WITH-NON-ESTIMABLE / MAIN INTEGRATED` |')
          replace_once(
              'doc/research-generation-4/CURRENT_STATUS.md',
              'G4-03を`main`へ統合する場合も別工程であり、ユーザーの明示指示が必要である。',
              'G4-03の`main`統合はユーザーの明示指示に基づきPR #164で完了した。')
          replace_once(
              'doc/research-generation-4/README.md',
              '| A | `G4-03` | G3-07由来width / search-ranking transfer | `COMPLETE / STAGE2-COMPLETE-WITH-NON-ESTIMABLE` |',
              '| A | `G4-03` | G3-07由来width / search-ranking transfer | `COMPLETE / STAGE2-COMPLETE-WITH-NON-ESTIMABLE / MAIN INTEGRATED` |')
          replace_once(
              'doc/research-generation-4/README.md',
              'G4-03の`main`統合も別工程であり、ユーザーの明示指示まで行わない。',
              'G4-03の`main`統合はユーザーの明示指示に基づきPR #164で完了した。')

          # Resume live-state and boundary
          replace_once(
              'doc/research-generation-4/RESUME_HERE.md',
              'G4-03 = COMPLETE / STAGE2-COMPLETE-WITH-NON-ESTIMABLE / NOT YET MAIN INTEGRATED',
              'G4-03 = COMPLETE / STAGE2-COMPLETE-WITH-NON-ESTIMABLE / MAIN INTEGRATED')
          replace_once(
              'doc/research-generation-4/RESUME_HERE.md',
              'G4-03 research branchはまだ`main`へ統合していない。\n\nG4-03 closure後の整合性監査を終え、ユーザーから明示指示がある場合にのみPR / main integrationへ進む。',
              'G4-03はPR #164で`main`へ統合済みである。merge commitは`73ac1920177c2451669e5ceeccaed53e34459df9`。\n\n以後、G4-03をrepair/reopenせず、RG4を継続する場合はG4-04の個別authorization reviewから開始する。')
          replace_once(
              'doc/research-generation-4/RESUME_HERE.md',
              '- ユーザー明示指示前のG4-03 main integration\n',
              '')

          # Central live-state indexes
          replace_once(
              'doc/FUTURE_RESEARCH_AGENDA.md',
              'G4-03 = COMPLETE / STAGE2-COMPLETE-WITH-NON-ESTIMABLE / NOT YET MAIN INTEGRATED',
              'G4-03 = COMPLETE / STAGE2-COMPLETE-WITH-NON-ESTIMABLE / MAIN INTEGRATED')
          replace_once(
              'doc/FUTURE_RESEARCH_AGENDA.md',
              '| A | `G4-03` | G3-07由来width / search-ranking transfer | `COMPLETE / STAGE2-COMPLETE-WITH-NON-ESTIMABLE` |',
              '| A | `G4-03` | G3-07由来width / search-ranking transfer | `COMPLETE / STAGE2-COMPLETE-WITH-NON-ESTIMABLE / MAIN INTEGRATED` |')
          replace_once(
              'doc/RESEARCH_INDEX.md',
              '| `G4-03` / [`LWSRT-STUDY1`](local-width-search-ranking-transfer/) | width / search-ranking transfer | `COMPLETE / STAGE2-COMPLETE-WITH-NON-ESTIMABLE` |',
              '| `G4-03` / [`LWSRT-STUDY1`](local-width-search-ranking-transfer/) | width / search-ranking transfer | `COMPLETE / STAGE2-COMPLETE-WITH-NON-ESTIMABLE / MAIN INTEGRATED` |')

          checkpoint = Path('doc/research-generation-4/checkpoints/2026-09-24-g4-03-main-integration-complete.md')
          if checkpoint.exists():
              raise SystemExit(f'{checkpoint}: already exists')
          checkpoint.write_text('''# G4-03 main integration complete\n\nDate: 2026-09-24\n\nG4-03 / `LWSRT-STUDY1` のclosed research branchを、ユーザーの明示指示に基づきPR #164で`main`へ統合した。\n\n## Integration identity\n\n```text\npre-merge main = dfc80a8fbf4487f7d6eb24e28908849d51a141ee\nresearch head at merge = a60eb34a14bc37c70c9f62341ee04fb14dd92e47\nPR = #164\nmerge commit = 73ac1920177c2451669e5ceeccaed53e34459df9\nmerge method = merge commit\nG4-03 scientific disposition = STAGE2-COMPLETE-WITH-NON-ESTIMABLE\npublic AI change = false\n```\n\n## Pre-merge validation\n\n統合前に、G4-03固有のclosure validationと既存研究のrepository-wide auditsを確認した。\n\n```text\nG4-03 closure validation = run 36003837510 / SUCCESS\nSSGTC closure consistency audit = run 36003845392 / SUCCESS\nDRSSE Study 1 Closure CI = run 36003845284 / SUCCESS\nPCEM closure consistency audit = run 36003845337 / SUCCESS\nSecond-generation research agenda audit = run 36003845330 / SUCCESS\nPhase Transition Research CI = run 36003845299 / SUCCESS\n```\n\nPR作成時の監査で、`doc/FUTURE_RESEARCH_AGENDA.md`がG4-03以前から途中欠落していたことを検出した。過去の正常版から欠落していた研究記録を復元し、G4-03最新状態を重ねた後、上記監査をすべて再実行して成功を確認してからmergeした。\n\n## Scientific boundary after integration\n\n- G4-03 Stage 1 / Stage 2をrerunしない。\n- G4-03 seedを救済目的で再読しない。\n- seed extension、root replacement、threshold relearningを行わない。\n- G3-11 depth-10 / G4-10 depth-11 protected evidenceへ追加アクセスしない。\n- G4-03結果をwhole-Bao universal lawへ拡張しない。\n- 研究結果をpublic AIへ自動反映しない。\n\n次のcore candidateはG4-04だが、G4-01/G4-03の結果だけで自動認可せず、個別authorization reviewから開始する。\n''', encoding='utf-8')
          PY

      - name: Verify integration status materialization
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'G4-03 = COMPLETE / STAGE2-COMPLETE-WITH-NON-ESTIMABLE / MAIN INTEGRATED' doc/research-generation-4/CURRENT_STATUS.md
          grep -Fq 'PR #164' doc/research-generation-4/checkpoints/2026-09-24-g4-03-main-integration-complete.md
          ! grep -Fq 'G4-03 = COMPLETE / STAGE2-COMPLETE-WITH-NON-ESTIMABLE / NOT YET MAIN INTEGRATED' doc/FUTURE_RESEARCH_AGENDA.md
          ! grep -Fq 'G4-03 research branchはまだ`main`へ統合していない。' doc/research-generation-4/RESUME_HERE.md

      - name: Commit materialized integration record and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/g4-03-main-integration-record.yml
          git config user.name 'Sawa'
          git config user.email '72678394+nkkmd@users.noreply.github.com'
          git add -A
          git commit -m 'docs: record G4-03 main integration'
          git push origin HEAD:research/g4-03-main-integration-record
