name: BRSGT Stage 2 Formal Holdout

on:
  push:
    branches:
      - research/g4-08-rule-semantic-geometry-transition
    paths:
      - doc/rule-semantic-geometry-transition/executions/STAGE_2_TRIGGER.json

permissions:
  contents: read
  actions: read

concurrency:
  group: brsgt-stage2-formal-one-shot
  cancel-in-progress: false

jobs:
  stage2-formal:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax checks
        run: |
          node --check tools/experiments/run-brsgt-stage2-formal.js
          node --check tools/experiments/run-brsgt-stage2-authorized.js
          node --check tools/experiments/verify-brsgt-stage2-binding.js
          node --check tools/experiments/lib/brsgt-stage2-firewall.js
          node --check tools/experiments/lib/brsgt-stage2-inference-production.js
          node --check tools/experiments/lib/brsgt-stage2-inference-independent.js
          node --check tools/experiments/lib/brsgt-production.js
          node --check tools/experiments/lib/brsgt-independent.js

      - name: Verify one-shot authorization and frozen source binding
        env:
          BRSGT_STAGE2_EXECUTION_TRIGGER_OK: '1'
        run: node tools/experiments/verify-brsgt-stage2-binding.js

      - name: Download frozen G4-01 identity source artifact
        uses: actions/download-artifact@v4
        with:
          name: lgttci-stage1r-recovery-source-bundle
          path: upstream/brsgt-stage2/g4-01
          repository: nkkmd/bao-la-kiswahili-game
          run-id: 35265290422
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen G4-04 Stage 1 identity artifact
        uses: actions/download-artifact@v4
        with:
          name: gttd-stage1-result
          path: upstream/brsgt-stage2/g4-04-stage1
          repository: nkkmd/bao-la-kiswahili-game
          run-id: 36089520136
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen G4-04 Stage 2 identity artifact
        uses: actions/download-artifact@v4
        with:
          name: gttd-stage2-formal
          path: upstream/brsgt-stage2/g4-04-stage2
          repository: nkkmd/bao-la-kiswahili-game
          run-id: 36095831961
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen G4-07 Stage 1 identity artifact
        uses: actions/download-artifact@v4
        with:
          name: mlgmr-stage1-development-result
          path: upstream/brsgt-stage2/g4-07-stage1
          repository: nkkmd/bao-la-kiswahili-game
          run-id: 36247459779
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen G4-07 Stage 2 identity artifact
        uses: actions/download-artifact@v4
        with:
          name: mlgmr-stage2-formal-result
          path: upstream/brsgt-stage2/g4-07-stage2
          repository: nkkmd/bao-la-kiswahili-game
          run-id: 36278926636
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download frozen G4-08 Stage 1 v3 identity artifact
        uses: actions/download-artifact@v4
        with:
          name: brsgt-stage1-v3-development-36303568642-1
          path: upstream/brsgt-stage2/g4-08-stage1-v3
          repository: nkkmd/bao-la-kiswahili-game
          run-id: 36303568642
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize frozen G4-08 Stage 1 v3 identity artifact
        run: |
          set -euo pipefail
          src='upstream/brsgt-stage2/g4-08-stage1-v3/doc/rule-semantic-geometry-transition/results/stage-1-v3/STAGE_1_IDENTITY_EXCLUSION_FOR_STAGE_2.json'
          dst='upstream/brsgt-stage2/g4-08-stage1-v3/STAGE_1_IDENTITY_EXCLUSION_FOR_STAGE_2.json'
          test -f "$src"
          cp "$src" "$dst"

      - name: Verify frozen upstream identity sources
        run: |
          test -d upstream/brsgt-stage2/g4-01/source/GCLD
          test -f upstream/brsgt-stage2/g4-04-stage1/STAGE_1_IDENTITY_EXCLUSION_FOR_STAGE_2.json
          test -f upstream/brsgt-stage2/g4-04-stage2/STAGE_2_CANDIDATE_MANIFEST.json
          test -f upstream/brsgt-stage2/g4-07-stage1/STAGE_1_IDENTITY_EXCLUSION_FOR_STAGE_2.json
          test -f upstream/brsgt-stage2/g4-07-stage2/STAGE_2_CANDIDATE_MANIFEST.json
          test -f upstream/brsgt-stage2/g4-08-stage1-v3/STAGE_1_IDENTITY_EXCLUSION_FOR_STAGE_2.json

      - name: Record execution context before fresh access
        run: |
          mkdir -p doc/rule-semantic-geometry-transition/results/stage-2
          node - <<'NODE'
          const fs = require('node:fs');
          const row = {
            schemaVersion: 1,
            studyId: 'BRSGT-STUDY1',
            stageId: 'BRSGT-S2-FORMAL-2026-09-27-v1',
            evidenceClass: 'FRESH-FORMAL-HOLDOUT',
            repository: process.env.GITHUB_REPOSITORY,
            sourceSha: process.env.GITHUB_SHA,
            refName: process.env.GITHUB_REF_NAME,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            freshScientificSeedReadsAtContextWrite: 0,
            stage1EffectDirectionReadForFamilySelection: false,
            g4_10Depth11AccessCount: 0,
            publicAiChanged: false
          };
          fs.writeFileSync('doc/rule-semantic-geometry-transition/results/stage-2/STAGE_2_EXECUTION_CONTEXT.json', JSON.stringify(row, null, 2) + '\n');
          NODE

      - name: Run one-shot fresh Stage 2 formal holdout
        env:
          BRSGT_STAGE2_UPSTREAM_DIR: ${{ github.workspace }}/upstream/brsgt-stage2
          BRSGT_STAGE2_EXECUTION_TRIGGER_OK: '1'
        run: node tools/experiments/run-brsgt-stage2-authorized.js --output doc/rule-semantic-geometry-transition/results/stage-2

      - name: Hash available Stage 2 artifacts
        if: always()
        run: |
          set -e
          mkdir -p doc/rule-semantic-geometry-transition/results/stage-2
          cd doc/rule-semantic-geometry-transition/results/stage-2
          : > SHA256SUMS.txt
          for f in STAGE_2_EXECUTION_CONTEXT.json STAGE_2_RESULT.json STAGE_2_CANDIDATE_MANIFEST.json STAGE_2_FIREWALL_SUMMARY.json STAGE_2_FAILURE.json; do
            if [ -f "$f" ]; then sha256sum "$f" >> SHA256SUMS.txt; fi
          done
          cat SHA256SUMS.txt

      - name: Upload Stage 2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brsgt-stage2-formal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            doc/rule-semantic-geometry-transition/results/stage-2/STAGE_2_EXECUTION_CONTEXT.json
            doc/rule-semantic-geometry-transition/results/stage-2/STAGE_2_RESULT.json
            doc/rule-semantic-geometry-transition/results/stage-2/STAGE_2_CANDIDATE_MANIFEST.json
            doc/rule-semantic-geometry-transition/results/stage-2/STAGE_2_FIREWALL_SUMMARY.json
            doc/rule-semantic-geometry-transition/results/stage-2/STAGE_2_FAILURE.json
            doc/rule-semantic-geometry-transition/results/stage-2/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
