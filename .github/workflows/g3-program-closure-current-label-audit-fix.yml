name: RG3 Program Closure Current Label Audit Fix

on:
  push:
    branches:
      - research/g3-final-program-closure
    paths:
      - doc/research-generation-3/authorizations/g3-program-closure-current-label-audit-fix-trigger.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply current-facing label corrections
        run: python3 tools/experiments/finalize-g3-program-closure-current-labels.py
      - name: Verify historical program plan unchanged
        run: test "$(git rev-parse HEAD:doc/research-generation-3/PROGRAM_PLAN.md)" = "2bb90c11f1625f63f40a7eab8a3de7774505a1ac"
      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/RESEARCH_INDEX.md doc/research-generation-3/CURRENT_STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Research Generation 3 current-facing closure labels"
          git push origin HEAD:research/g3-final-program-closure
