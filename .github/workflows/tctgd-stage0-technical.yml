name: TCTGD Stage 0 Technical

on:
  workflow_dispatch:
  push:
    branches:
      - research/g3-03-transposition-tree-graph-divergence
    paths:
      - doc/transposition-concentration-tree-graph-divergence/authorizations/STAGE0_RUN_TRIGGER

permissions:
  contents: read

concurrency:
  group: tctgd-stage0-technical
  cancel-in-progress: false

jobs:
  technical-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm technical-only authorization boundary
        run: |
          test -f doc/transposition-concentration-tree-graph-divergence/authorizations/2026-09-02-stage-0-technical-authorization.md
          test -f doc/transposition-concentration-tree-graph-divergence/prereg/STUDY_1_SPEC.json
          test -f tools/experiments/run-tctgd-stage0-technical.js
      - name: Run frozen synthetic Stage 0
        run: |
          node tools/experiments/run-tctgd-stage0-technical.js --output=tctgd-stage0-result.json
      - name: Upload durable Stage 0 result
        uses: actions/upload-artifact@v4
        with:
          name: tctgd-stage0-technical-result
          path: tctgd-stage0-result.json
          if-no-files-found: error
          retention-days: 90
