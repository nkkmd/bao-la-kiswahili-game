name: Second-generation research agenda audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'doc/FUTURE_RESEARCH_AGENDA.md'
      - 'doc/RESEARCH_INDEX.md'
      - 'doc/research-program-decisions/2026-08-26-second-generation-pure-research-agenda.md'
      - 'test/second-generation-research-agenda.test.js'
      - '.github/workflows/second-generation-research-agenda-audit.yml'

permissions:
  contents: read

jobs:
  agenda-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify second-generation pure research agenda
        run: node test/second-generation-research-agenda.test.js
