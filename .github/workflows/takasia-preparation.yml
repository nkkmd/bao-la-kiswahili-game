name: Takasia engine and AI verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/takasia/**'
      - 'test/takasia-contract.test.cjs'
      - 'test/takasia-engine.test.cjs'
      - 'public/engine.js'
      - 'public/ai*.js'
      - 'public/main.js'
      - 'test/takasia-ai*.cjs'
      - 'doc/ai-engineering/takasia-update/**'
      - '.github/workflows/takasia-preparation.yml'
  push:
    branches:
      - 'feat/takasia-preparation-20261008'
    paths:
      - 'tools/takasia/**'
      - 'test/takasia-contract.test.cjs'
      - 'test/takasia-engine.test.cjs'
      - 'public/engine.js'
      - 'public/ai*.js'
      - 'public/main.js'
      - 'test/takasia-ai*.cjs'
      - '.github/workflows/takasia-preparation.yml'

permissions:
  contents: read

jobs:
  fixture-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify fixture contract in JavaScript and Python
        run: node --test test/takasia-contract.test.cjs
      - name: Verify independent Python calculation
        run: python3 tools/takasia/verify.py
      - name: Verify engine implementation and existing transitions
        run: |
          node tools/takasia/check-engine.cjs
          node --test test/takasia-engine.test.cjs test/engine.test.js test/namua-mtaji-transition-engine.test.js
      - name: Verify AI keys, routes, rollback and actual Worker
        run: node --test test/takasia-ai.test.cjs test/takasia-ai-worker.test.cjs test/ai.test.js test/search.test.js test/ai-config.test.js test/ai-worker.test.js test/worker-integration.test.js

  ai-budget-verification:
    needs: fixture-verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify 72 fixed AI budget conditions with incremental results
        run: node tools/takasia/benchmark-ai.cjs artifacts/local/takasia-ai
      - name: Preserve completed rows even after interruption
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: takasia-ai-budget-results
          path: artifacts/local/takasia-ai/
          if-no-files-found: error
