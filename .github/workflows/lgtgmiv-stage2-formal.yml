name: LGTGMIV Stage 2 Formal Holdout Execution

on:
  push:
    branches:
      - research/pre-g3-02-local-game-tree-geometry-measurement-instrument-verification
    paths:
      - doc/local-game-tree-geometry-measurement-instrument-verification/authorizations/2026-09-01-stage-2-execution-trigger.md

permissions:
  contents: write

concurrency:
  group: lgtgmiv-stage2-formal-one-shot
  cancel-in-progress: false

jobs:
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify prospective authorization and one-shot boundary
        run: |
          test -e doc/local-game-tree-geometry-measurement-instrument-verification/authorizations/2026-09-01-stage-2-formal-authorization.md
          test -e doc/local-game-tree-geometry-measurement-instrument-verification/checkpoints/2026-09-01-stage-2-tooling-smoke-pass.md
          test ! -e doc/local-game-tree-geometry-measurement-instrument-verification/results/stage-2/scientific-result.json
      - name: Execute authorized one-shot fresh formal holdout
        run: node tools/experiments/run-lgtgmiv-stage2-formal.js
      - name: Commit immutable Stage 2 result artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/local-game-tree-geometry-measurement-instrument-verification/results/stage-2/scientific-result.json
          git add doc/local-game-tree-geometry-measurement-instrument-verification/results/stage-2/telemetry.json
          git add doc/local-game-tree-geometry-measurement-instrument-verification/results/stage-2/execution-summary.json
          git commit -m "Record LGTGMIV Stage 2 formal result"
          git push
