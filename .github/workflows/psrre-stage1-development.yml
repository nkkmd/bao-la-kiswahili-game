name: PSRRE Stage 1 Development

# Consume-once scientific development. Triggered only by explicit Stage 1 authorization artifact.
on:
  workflow_dispatch:
  push:
    branches:
      - research/pre-g2-11-strategic-regime-representation-eligibility
    paths:
      - 'doc/prospective-strategic-regime-representation-eligibility/authorizations/STAGE_1_EXECUTION_AUTHORIZATION.json'

permissions:
  contents: read

jobs:
  scientific-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout frozen authorized source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Environment and syntax
        run: |
          node --version
          git rev-parse HEAD
          git rev-parse HEAD^
          git status --short
          node --check tools/experiments/run-psrre-stage1-development.js
          node --check tools/experiments/lib/psrre-stage1-production.js
          node --check tools/experiments/lib/psrre-stage1-independent.js

      - name: Verify authorization seed block
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const spec = JSON.parse(fs.readFileSync('doc/prospective-strategic-regime-representation-eligibility/prereg/STAGE_1_DEVELOPMENT_SPEC.json','utf8'));
          const auth = JSON.parse(fs.readFileSync('doc/prospective-strategic-regime-representation-eligibility/authorizations/STAGE_1_EXECUTION_AUTHORIZATION.json','utf8'));
          if (!auth.authorized) throw new Error('Stage 1 not authorized');
          if (auth.seedBlock.start !== 29510001 || auth.seedBlock.end !== 29514096) throw new Error('authorized seed block drift');
          if (spec.seedBlock.seedStart !== auth.seedBlock.start || spec.seedBlock.seedEnd !== auth.seedBlock.end) throw new Error('spec/auth seed mismatch');
          if (auth.stage2ScientificExecutionAuthorized !== false || auth.g2_11Authorized !== false) throw new Error('downstream authorization unexpectedly true');
          NODE

      - name: Run PSRRE Stage 1 scientific development
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/local/psrre-stage1-development
          /usr/bin/time -v node tools/experiments/run-psrre-stage1-development.js artifacts/local/psrre-stage1-development \
            2>&1 | tee artifacts-psrre-stage1-development.log

      - name: Preserve scientific artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psrre-stage1-development-${{ github.sha }}
          path: |
            artifacts/local/psrre-stage1-development/**
            artifacts-psrre-stage1-development.log
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
