name: SSGTC Stage 2 formal bounded quantification

on:
  pull_request:
    paths:
      - "public/engine.js"
      - "tools/experiments/run-ssgtc-stage2-formal.js"
      - "tools/experiments/verify-ssgtc-stage2-independent.js"
      - "tools/experiments/lib/ssgtc-representation-*.js"
      - "doc/state-space-game-tree-complexity/preregistration/STAGE_2_FORMAL_SPEC.json"
      - "doc/state-space-game-tree-complexity/checkpoints/**"
      - ".github/workflows/ssgtc-stage2-formal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage2-formal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run frozen Stage 2 formal production enumeration
        env:
          SSGTC_STAGE2_OUT: ${{ runner.temp }}/ssgtc-stage2-formal-v1
        run: node tools/experiments/run-ssgtc-stage2-formal.js

      - name: Run separate-process Stage 2 independent verification
        env:
          SSGTC_STAGE2_OUT: ${{ runner.temp }}/ssgtc-stage2-formal-v1
        run: node tools/experiments/verify-ssgtc-stage2-independent.js

      - name: Upload Stage 2 formal artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssgtc-stage2-formal-v1
          path: ${{ runner.temp }}/ssgtc-stage2-formal-v1
          if-no-files-found: warn
