name: Pre-G2-11 Repository Prep Finalize

on:
  push:
    branches:
      - maintenance/pre-g2-11-strategic-representation-prerequisite
    paths:
      - 'tools/experiments/finalize-pre-g2-11-repository-prep.py'
      - '.github/workflows/pre-g2-11-repository-prep-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout preparation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize documentation synchronization
        run: |
          python3 tools/experiments/finalize-pre-g2-11-repository-prep.py
          git diff --check

      - name: Enforce documentation-only allowlist
        run: |
          python3 - <<'PY'
          import subprocess
          allowed = {
              'doc/FUTURE_RESEARCH_AGENDA.md',
              'doc/research-program-decisions/2026-08-26-second-generation-pure-research-agenda.md',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit('unexpected finalizer paths: ' + ', '.join(unexpected))
          print('allowlist PASS')
          PY

      - name: Commit final repository prep synchronization
        run: |
          if git diff --quiet; then
            echo 'No final repository prep changes required.'
            exit 0
          fi
          git config user.name 'Sawa'
          git config user.email '72678394+nkkmd@users.noreply.github.com'
          git add doc/FUTURE_RESEARCH_AGENDA.md \
            doc/research-program-decisions/2026-08-26-second-generation-pure-research-agenda.md
          git commit -m 'docs(research): complete pre-G2-11 program handoff state'
          git push origin HEAD:maintenance/pre-g2-11-strategic-representation-prerequisite
