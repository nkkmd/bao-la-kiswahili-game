name: Pre-G2-11 Repository Prep Audit

on:
  push:
    branches:
      - maintenance/pre-g2-11-strategic-representation-prerequisite
    paths:
      - 'doc/FUTURE_RESEARCH_AGENDA.md'
      - 'doc/RESEARCH_INDEX.md'
      - 'doc/research-program-decisions/2026-08-26-second-generation-pure-research-agenda.md'
      - 'doc/research-program-decisions/2026-08-30-pre-g2-11-strategic-representation-prerequisite-selection.md'
      - 'tools/experiments/audit-pre-g2-11-repository-prep.py'
      - '.github/workflows/pre-g2-11-repository-prep-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout preparation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run repository preparation audit
        run: python3 tools/experiments/audit-pre-g2-11-repository-prep.py
