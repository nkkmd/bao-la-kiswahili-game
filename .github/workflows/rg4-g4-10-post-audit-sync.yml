name: RG4 G4-10 post-audit status sync

on:
  push:
    branches:
      - research/g4-10-fresh-depth11-exact-reachability-topology
    paths:
      - .github/workflows/rg4-g4-10-post-audit-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Synchronize post-audit status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def one(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {n}')
              p.write_text(text.replace(old, new, 1))

          one(
            'doc/research-generation-4/CURRENT_STATUS.md',
            '次はResearch Generation 4 final synthesisとpre-main documentation consistency auditを行う。',
            'Research Generation 4 final synthesisとpre-main consistency auditは完了した。監査判定は`PASS / READY FOR SEPARATE MAIN-INTEGRATION GATE`。次は別gateとして`main`統合を判断する。',
            'RG4 CURRENT_STATUS next step')

          one(
            'doc/research-generation-4/CURRENT_STATUS.md',
            '- [`RESUME_HERE.md`](RESUME_HERE.md)',
            '- [`FINAL_SYNTHESIS.md`](FINAL_SYNTHESIS.md)\n- [`RESUME_HERE.md`](RESUME_HERE.md)\n- [`checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md`](checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md) — pre-main audit PASS',
            'RG4 CURRENT_STATUS canonical links')

          one(
            'doc/research-generation-4/README.md',
            'G4-01〜G4-10はすべてformal closureを持つ。Program Planはpositive resultの数をcompletion条件としていないため、G4-10のpreregistered resource closure `NON-ESTIMABLE`を含め、RG4 core scientific agendaは完了条件を満たす方向にある。\n\n最終判断は[`FINAL_SYNTHESIS.md`](FINAL_SYNTHESIS.md)とpre-main consistency auditで固定する。',
            'G4-01〜G4-10はすべてformal closureを持つ。Program Planはpositive resultの数をcompletion条件としていないため、G4-10のpreregistered resource closure `NON-ESTIMABLE`を含め、RG4 core scientific agendaは完了した。\n\n[`FINAL_SYNTHESIS.md`](FINAL_SYNTHESIS.md)と[`checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md`](checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md)でProgram-level conclusionとpre-main audit PASSを固定した。',
            'RG4 README program completion')

          one(
            'doc/research-generation-4/README.md',
            '7. [`PROGRAM_PLAN.md`](PROGRAM_PLAN.md) — frozen prospective contract / outcome-editしない',
            '7. [`checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md`](checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md) — pre-main consistency audit PASS\n8. [`PROGRAM_PLAN.md`](PROGRAM_PLAN.md) — frozen prospective contract / outcome-editしない',
            'RG4 README reading links')

          one(
            'doc/research-generation-4/README.md',
            'G4-10に対する追加scientific executionは行わない。次に行うのはRG4 final synthesis、current-facing文書同期、日本語品質・リンク・状態整合監査、pre-main auditである。\n\n`main`統合はStudy closureから分離した別gateとする。',
            'G4-10に対する追加scientific executionは行わない。RG4 final synthesis、current-facing文書同期、リンク・状態整合確認、pre-main consistency auditは完了した。\n\n次に許可されるrepository operationは、Study closureと監査から分離した別gateとしての`main`統合判断である。明示的な統合作業までresearch branchに留める。',
            'RG4 README next work')

          resume = Path('doc/research-generation-4/RESUME_HERE.md')
          text = resume.read_text()
          text = text.replace(
            '8. [`PROGRAM_PLAN.md`](PROGRAM_PLAN.md)はprospective frozen planとして変更せず参照する。',
            '8. [`checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md`](checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md)でpre-main audit PASSを確認する。\n9. [`PROGRAM_PLAN.md`](PROGRAM_PLAN.md)はprospective frozen planとして変更せず参照する。',
            1)
          old = '''## 次の作業\n\nG4-10に対する追加scientific executionは行わない。\n\n次に許可されるのは、Research Generation 4のcurrent-facing文書・研究索引・future agenda・リンク・canonical provenanceを照合する**pre-main consistency audit**である。\n\n監査で不整合が見つかった場合はresearch branch上で文書のみ修正する。科学結果、resource ceiling、formal classification、no-rescue boundaryは変更しない。\n\n監査PASS後も`main`統合は別gateとし、明示的に統合作業へ進むまでresearch branchに留める。'''
          new = '''## 次の作業\n\nG4-10に対する追加scientific executionは行わない。\n\nResearch Generation 4 final synthesis、current-facing文書同期、研究索引・future agenda更新、pre-main consistency auditは完了した。監査判定は **`PASS / READY FOR SEPARATE MAIN-INTEGRATION GATE`**。\n\n次に許可されるrepository operationは、別gateとしての`main`統合判断である。明示的に統合作業へ進むまではresearch branchに留め、科学結果、resource ceiling、formal classification、no-rescue boundaryを変更しない。'''
          if text.count(old) != 1:
              raise SystemExit('RESUME next-work block mismatch')
          resume.write_text(text.replace(old, new, 1))

          one(
            'doc/fresh-depth11-exact-reachability-topology/CURRENT_STATUS.md',
            '次はG4-10 closure document、Research Generation 4 current-facing文書の同期、最終整合監査である。`main`統合は別gateとする。',
            'G4-10 closure document、Research Generation 4 final synthesis、current-facing文書同期、pre-main consistency auditは完了した。監査は`PASS / READY FOR SEPARATE MAIN-INTEGRATION GATE`。`main`統合は引き続き別gateであり、まだ実施していない。',
            'G4-10 CURRENT_STATUS next step')
          PY
      - name: Assert post-audit state
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'PASS / READY FOR SEPARATE MAIN-INTEGRATION GATE' doc/research-generation-4/CURRENT_STATUS.md
          grep -Fq 'pre-main consistency auditは完了した' doc/research-generation-4/README.md
          grep -Fq 'PASS / READY FOR SEPARATE MAIN-INTEGRATION GATE' doc/research-generation-4/RESUME_HERE.md
          grep -Fq 'PASS / READY FOR SEPARATE MAIN-INTEGRATION GATE' doc/fresh-depth11-exact-reachability-topology/CURRENT_STATUS.md
      - name: Commit status sync and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/rg4-g4-10-post-audit-sync.yml
          git add doc/research-generation-4/CURRENT_STATUS.md doc/research-generation-4/README.md doc/research-generation-4/RESUME_HERE.md doc/fresh-depth11-exact-reachability-topology/CURRENT_STATUS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(rg4): mark G4-10 pre-main audit complete'
          git push origin HEAD:research/g4-10-fresh-depth11-exact-reachability-topology
