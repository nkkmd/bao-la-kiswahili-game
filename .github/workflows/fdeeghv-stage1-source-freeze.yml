name: FDEGHV G3-11 Stage 1 source freeze

on:
  push:
    branches:
      - research/g3-11-fresh-depth10-exact-geometry-holdout
    paths:
      - doc/fresh-depth10-exact-geometry-holdout/authorizations/PREACCESS_SOURCE_FREEZE_EXECUTE.json

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Materialize exact preaccess source freeze
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fdeeghv-source-freeze"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root=Path.cwd()
          auth=json.loads((root/'doc/fresh-depth10-exact-geometry-holdout/authorizations/PREACCESS_SOURCE_FREEZE_EXECUTE.json').read_text())
          assert auth['authorizationDecision']=='PREACCESS-SOURCE-FREEZE-AUTHORIZED'
          assert auth['scientificInferenceAuthorized'] is False
          assert auth['protectedDepth10AccessAuthorized'] is False
          s0p=root/'doc/fresh-depth10-exact-geometry-holdout/results/stage-0/STAGE_0_TECHNICAL_RESULT.json'
          hp=root/'doc/fresh-depth10-exact-geometry-holdout/results/preaccess/PREACCESS_HARDENING_RESULT.json'
          sp=root/'doc/fresh-depth10-exact-geometry-holdout/prereg/STAGE_1_FORMAL_SPEC.json'
          s0=json.loads(s0p.read_text()); h=json.loads(hp.read_text()); spec=json.loads(sp.read_text())
          assert s0['stageDisposition']=='STAGE0-PASS' and s0['protectedDepth10Access'] is False
          assert h['disposition']=='PREACCESS-HARDENING-PASS' and h['protectedDepth10Access'] is False
          assert spec['formalDomain']['targetDepth']==10 and spec['formalDomain']['depth11AccessAuthorized'] is False
          paths=[
            '.github/workflows/fdeeghv-stage1-formal.yml',
            'doc/fresh-depth10-exact-geometry-holdout/prereg/STAGE_1_FORMAL_SPEC.json',
            'public/engine.js',
            'tools/experiments/run-fdeeghv-stage1-formal.js',
            'tools/experiments/verify-fdeeghv-stage1-independent-v2.js',
            'tools/experiments/finalize-fdeeghv-stage1-artifact.js',
            'tools/experiments/lib/fdeeghv-contract.js',
            'tools/experiments/lib/drsse-production.js',
            'tools/experiments/lib/drsse-independent.js'
          ]
          blobs={p:subprocess.check_output(['git','hash-object',p],text=True).strip() for p in paths}
          sha=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          ceiling_keys=[
            'maxCumulativeDistinctRawStates','maxDepthLabelledEdges','maxParentStateExpansions',
            'maxMoveEvaluations','maxCumulativeTreeNodeOccurrences','maxResidentSetBytes',
            'maxWallClockSeconds','maxUncompressedArtifactBytes'
          ]
          out={
            'schemaVersion':1,
            'programLabel':'G3-11',
            'studyId':'FDEGHV-STUDY1',
            'stageId':'FDEGHV-S1-FORMAL-HOLDOUT-2026-09-04-v1',
            'disposition':'PREACCESS-SOURCE-FREEZE-PASS',
            'scientificInferencePerformed':False,
            'protectedDepth10Access':False,
            'sourceMainSha':'e537199a959c0808cbef6cf8aaeb1caab91e3702',
            'freezeCommit':os.environ['GITHUB_SHA'],
            'specSha256':sha(sp),
            'stage0ResultSha256':sha(s0p),
            'preaccessHardeningResultSha256':sha(hp),
            'resourceCeiling':{k:spec['resourceProfile'][k] for k in ceiling_keys},
            'sourceGitBlobSha':blobs,
            'historicalProgramPlanGitBlobSha':subprocess.check_output(['git','hash-object','doc/research-generation-3/PROGRAM_PLAN.md'],text=True).strip(),
            'protectedDepth10State':'SEALED / NOT GENERATED / NOT READ / NOT PEEKED',
            'g2_12EstimatorScientificInputAuthorized':False,
            'sameEvidenceRerunAuthorized':False,
            'depth11AccessAuthorized':False
          }
          Path(os.environ['RUNNER_TEMP'],'fdeeghv-source-freeze','PREACCESS_SOURCE_FREEZE.json').write_text(json.dumps(out,indent=2)+'\n')
          print('FDEGHV_PREACCESS_SOURCE_FREEZE=PASS')
          PY
      - name: Upload source-freeze artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdeeghv-stage1-source-freeze-${{ github.run_id }}
          path: ${{ runner.temp }}/fdeeghv-source-freeze/PREACCESS_SOURCE_FREEZE.json
          if-no-files-found: error
          retention-days: 90
      - name: Mirror durable source-freeze manifest
        shell: bash
        run: |
          dst="doc/fresh-depth10-exact-geometry-holdout/prereg/PREACCESS_SOURCE_FREEZE.json"
          cp "$RUNNER_TEMP/fdeeghv-source-freeze/PREACCESS_SOURCE_FREEZE.json" "$dst"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dst"
          git commit -m "Freeze G3-11 Stage 1 protected-access source identity"
          git push origin HEAD:research/g3-11-fresh-depth10-exact-geometry-holdout
