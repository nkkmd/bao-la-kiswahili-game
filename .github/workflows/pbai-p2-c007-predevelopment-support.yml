name: PBAI-P2 C007 baseline-only TT support

on:
  pull_request:
    branches: [main]
    paths:
      - 'doc/ai-engineering/public-ai-improvement-program-2/candidates/PBAI-C006-v1-predevelopment-support-result.json'
      - 'doc/ai-engineering/public-ai-improvement-program-2/candidates/PBAI-C007-v1-predevelopment-support-spec.json'
      - 'doc/ai-engineering/public-ai-improvement-program-2/checkpoints/2026-09-01-c006-predevelopment-support-closure.md'
      - 'tools/engineering/materialize-pbai-p2-c007-predevelopment-support.js'
      - 'tools/engineering/verify-pbai-p2-c007-predevelopment-support-independent.js'
      - '.github/workflows/pbai-p2-c007-predevelopment-support.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-only-tt-support:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify no public implementation
        run: |
          changed="$(git diff --name-only origin/main...HEAD -- public/)"
          test -z "$changed" || {
            echo 'PBAI-C007 support must not modify public/.' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }

      - name: Verify source and C006 dependency
        run: |
          test "$(sha256sum public/engine.js | awk '{print $1}')" = "e6acf1fe4d97db67dbcfadc3a785e802342ae0b0cbaec35f53eb8e77424cfc1c"
          test "$(sha256sum public/ai.js | awk '{print $1}')" = "2823dbcf96c7a47489301ecd768a63975aa8b4e12b62cc4629fc8283ef5dff9e"
          node - <<'NODE'
          const fs = require('node:fs');
          const c006 = JSON.parse(fs.readFileSync('doc/ai-engineering/public-ai-improvement-program-2/candidates/PBAI-C006-v1-predevelopment-support-result.json', 'utf8'));
          const spec = JSON.parse(fs.readFileSync('doc/ai-engineering/public-ai-improvement-program-2/candidates/PBAI-C007-v1-predevelopment-support-spec.json', 'utf8'));
          if (c006.decision.disposition !== 'WITHDRAWN-NO-ACTIONABLE-IDENTITY-DEFECT') throw new Error('C006 dependency state changed');
          if (c006.decision.candidateImplementationAuthorized !== false) throw new Error('C006 implementation authorization leaked');
          if (spec.dependency.dependencyPass !== true || spec.dependency.observedC006Disposition !== c006.decision.disposition) throw new Error('C007 dependency mismatch');
          if (spec.status !== 'FROZEN-BEFORE-DYNAMIC-SUPPORT-OUTCOME') throw new Error('C007 support spec not frozen');
          if (spec.population.seedStart !== 43100001 || spec.population.seedEnd !== 43101024 || spec.population.seedCount !== 1024) throw new Error('C007 support seed block changed');
          if (spec.population.rootSelection.targetTotal !== 256 || spec.population.rootSelection.targetPerPhase !== 128) throw new Error('C007 root target changed');
          if (spec.baselineSearch.maxDepth !== 5 || spec.baselineSearch.normalizeTtMateScores !== false) throw new Error('C007 search contract changed');
          if (spec.gate.minimumIncomingShallowerThanExistingEvents !== 32 || spec.gate.minimumRootsWithIncomingShallowerEvent !== 16) throw new Error('C007 support gates changed');
          if (spec.candidateCodeAllowed !== false || spec.publicImplementationChangeAllowed !== false) throw new Error('candidate implementation leaked');
          if (spec.researchGeneration3Influence !== false) throw new Error('G3 firewall failed');
          NODE

      - name: Verify runners remain support-only
        run: |
          for f in \
            tools/engineering/materialize-pbai-p2-c007-predevelopment-support.js \
            tools/engineering/verify-pbai-p2-c007-predevelopment-support-independent.js; do
            ! grep -E '(^|[^0-9])(42[1-9][0-9]{5}|430[0-9]{5}|43[2-9][0-9]{5})([^0-9]|$)' "$f" || {
              echo "Non-C007 support seed literal found in $f" >&2
              exit 1
            }
            ! grep -E "require\(.*(experiments|research-generation-3|local-game-tree)" "$f" || {
              echo "Forbidden research/tool import found in $f" >&2
              exit 1
            }
          done

      - name: Materialize C007 baseline-only TT support
        run: |
          mkdir -p artifacts/pbai-p2/c007
          node tools/engineering/materialize-pbai-p2-c007-predevelopment-support.js \
            --output artifacts/pbai-p2/c007/predevelopment-support.json

      - name: Independently reproduce C007 support
        run: |
          node tools/engineering/verify-pbai-p2-c007-predevelopment-support-independent.js \
            --production artifacts/pbai-p2/c007/predevelopment-support.json \
            --output artifacts/pbai-p2/c007/predevelopment-support-verification.json

      - name: Verify support firewalls and print canonical compact core
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('artifacts/pbai-p2/c007/predevelopment-support.json', 'utf8'));
          const v = JSON.parse(fs.readFileSync('artifacts/pbai-p2/c007/predevelopment-support-verification.json', 'utf8'));
          if (r.candidateCodeUsed !== false || r.candidateImplementationObserved !== false || r.candidateBenefitMetricsObserved !== false) throw new Error('candidate evidence leaked');
          if (r.validationSeedsAccessed !== false || r.releaseHoldoutSeedsAccessed !== false) throw new Error('protected evidence accessed');
          if (r.researchGeneration3ArtifactsAccessed !== false) throw new Error('G3 artifact access reported');
          if (r.core.decision.candidateImplementationAuthorized !== false || r.core.decision.validationAuthorized !== false || r.core.decision.releaseHoldoutAuthorized !== false) throw new Error('authorization leaked');
          if (v.passed !== true || v.fullSelectedRootAndMeasurementCoreEquality !== true) throw new Error('independent verification failed');
          console.log(JSON.stringify({
            deterministicCoreSha256: r.deterministicCoreSha256,
            population: r.core.population,
            measurement: r.core.measurement,
            decision: r.core.decision,
          }, null, 2));
          NODE

      - name: Record artifact hashes
        run: sha256sum artifacts/pbai-p2/c007/*.json

      - uses: actions/upload-artifact@v4
        with:
          name: pbai-p2-c007-predevelopment-support
          path: artifacts/pbai-p2/c007/*.json
          if-no-files-found: error
