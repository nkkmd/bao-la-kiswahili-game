name: UMSSR Stage 1 Packaging Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - research/g2-10-unified-multiaxial-strategic-state-representation
    paths:
      - '.github/workflows/umssr-stage1-packaging-preflight.yml'
      - '.github/workflows/umssr-stage1-development.yml'
      - 'tools/experiments/run-umssr-stage1-packaging-preflight.js'
      - 'tools/experiments/run-umssr-stage1-development.js'
      - 'tools/experiments/lib/umssr-stage1-production.js'
      - 'tools/experiments/lib/umssr-stage1-independent.js'
      - 'doc/unified-multiaxial-strategic-state-representation/prereg/STAGE_1_EXECUTION_CONTRACT.json'
      - 'doc/unified-multiaxial-strategic-state-representation/prereg/STAGE_1_DEVELOPMENT_SPEC.json'
      - 'doc/unified-multiaxial-strategic-state-representation/prereg/STAGE_1_FEATURE_DICTIONARY.json'
      - 'doc/unified-multiaxial-strategic-state-representation/prereg/STAGE_2_VALIDATION_CONTRACT.json'

permissions:
  contents: read

jobs:
  packaging-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Environment
        run: |
          node --version
          git rev-parse HEAD
          git status --short
      - name: Syntax checks
        run: |
          node --check tools/experiments/run-umssr-stage1-packaging-preflight.js
          node --check tools/experiments/run-umssr-stage1-development.js
          node --check tools/experiments/lib/umssr-stage1-production.js
          node --check tools/experiments/lib/umssr-stage1-independent.js
      - name: Run full-shard packaging preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/local/umssr-stage1-packaging-preflight
          /usr/bin/time -v node tools/experiments/run-umssr-stage1-packaging-preflight.js artifacts/local/umssr-stage1-packaging-preflight \
            2>&1 | tee artifacts-umssr-stage1-packaging-preflight.log
      - name: Preserve packaging preflight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umssr-stage1-packaging-preflight-${{ github.sha }}
          path: |
            artifacts/local/umssr-stage1-packaging-preflight/**
            artifacts-umssr-stage1-packaging-preflight.log
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
