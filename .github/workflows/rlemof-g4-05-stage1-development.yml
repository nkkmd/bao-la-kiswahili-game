name: RLEMOF G4-05 Stage 1 Development

on:
  push:
    branches:
      - research/g4-05-exact-microdomain-oracle-foundation
    paths:
      - 'doc/reachable-late-game-exact-microdomain-oracle-foundation/authorizations/STAGE_1_AUTHORIZATION.json'

permissions:
  contents: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Record execution identity
        run: |
          mkdir -p artifacts/local/rlemof-stage1-development
          {
            echo "GITHUB_SHA=${GITHUB_SHA}"
            echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
            echo "GITHUB_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"
            node --version
          } | tee artifacts/local/rlemof-stage1-development/execution-identity.txt
      - name: Production development scan and bounded closures
        run: node tools/experiments/run-rlemof-stage1-development.js artifacts/local/rlemof-stage1-development/production-result.json
      - name: Independent full regeneration and closure verification
        run: node tools/experiments/verify-rlemof-stage1-development-independent.js artifacts/local/rlemof-stage1-development/production-result.json artifacts/local/rlemof-stage1-development/independent-verification.json
      - name: Build artifact manifest
        if: always()
        run: |
          cd artifacts/local/rlemof-stage1-development
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true
      - name: Upload Stage 1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlemof-g4-05-stage1-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/local/rlemof-stage1-development/
          if-no-files-found: error
          retention-days: 30
