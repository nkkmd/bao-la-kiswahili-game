name: BECT Stage 0 Technical

on:
  push:
    branches:
      - research/g3-05-branch-expansion-compression-transition
    paths:
      - doc/branch-expansion-compression-transition/authorizations/STAGE0_EXECUTION_TRIGGER

permissions:
  contents: read

concurrency:
  group: bect-stage0-technical-v1
  cancel-in-progress: false

jobs:
  technical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify frozen source bindings and protected boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object public/engine.js)" = "2f7885fa1ae38ddef5f14bbe2fecd4ca4fb84c7c"
          test "$(git hash-object tools/experiments/lib/lgtgmiv-stage1-production.js)" = "a4664f01535d6abbf6f83821befbb2fafd55cde6"
          test "$(git hash-object tools/experiments/lib/lgtgmiv-stage1-independent.js)" = "0c7239ac7acf146e9aee63dae66194681b8631d6"
          test "$(git hash-object tools/experiments/lib/bect-production.js)" = "b8fa63e941b4da1fec0969155c09754eae151a56"
          test "$(git hash-object tools/experiments/lib/bect-independent.js)" = "bb085c648d2f4f3d7d44f206f04036e95f94980b"
          test "$(git hash-object tools/experiments/run-bect-stage0-technical.js)" = "9b8ad37b92596367b46825c0ffcc5bb84c0cbb5e"
          test "$(git hash-object doc/branch-expansion-compression-transition/prereg/STUDY_1_SPEC.json)" = "c9d938631d256a239c5e21a82e9869143aa1d0fb"
          test "$(git hash-object doc/branch-expansion-compression-transition/prereg/STUDY_1_SPEC_CLARIFICATION_1.json)" = "90869977c1977bbc10f4834228ee69b9151ce250"
          test "$(git hash-object doc/branch-expansion-compression-transition/authorizations/2026-09-02-stage-0-technical-authorization.md)" = "c7d55440e623f8a69313cdef9e2e1fc436ec66d8"
          node - <<'NODE'
          const s=require('./doc/branch-expansion-compression-transition/prereg/STUDY_1_SPEC.json');
          const c=require('./doc/branch-expansion-compression-transition/prereg/STUDY_1_SPEC_CLARIFICATION_1.json');
          if(s.studyId!=='BECT-STUDY1')throw Error('Study ID changed');
          if(s.stages[1].seedStart!==31510001||s.stages[1].seedEnd!==31510240)throw Error('Stage 1 seed contract changed');
          if(s.stages[2].seedStart!==31520001||s.stages[2].seedEnd!==31520384)throw Error('Stage 2 seed contract changed');
          if(s.protectedDepth10Holdout.status!=='SEALED / NOT GENERATED / NOT READ')throw Error('protected holdout changed');
          if(c.stage0FixtureExecutedBeforeClarification!==false)throw Error('clarification timing changed');
          NODE
      - name: Run authorized technical fixtures and bounded technical replay
        run: node tools/experiments/run-bect-stage0-technical.js
      - name: Record technical provenance
        shell: bash
        run: |
          printf '%s\n' \
            "workflow_run_id=${GITHUB_RUN_ID}" \
            "workflow_head_sha=${GITHUB_SHA}" \
            "authorization_nonce=BECT-S0-AUTH-2026-09-02-V1-01" \
            "technical_seed=31500001" \
            "technical_seed_scientific_use_prohibited=true" \
            "fresh_scientific_seed_access=false" \
            "stage1_seed_access=false" \
            "stage2_seed_access=false" \
            "protected_depth10_access=false" \
            > doc/branch-expansion-compression-transition/results/stage-0/STAGE_0_TECHNICAL_PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bect-stage0-technical-v1-${{ github.run_id }}
          path: doc/branch-expansion-compression-transition/results/stage-0/
          if-no-files-found: error
          retention-days: 90
