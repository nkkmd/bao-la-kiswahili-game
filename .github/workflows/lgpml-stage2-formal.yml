name: LGPML Stage 2 Formal
on:
  push:
    branches: [research/g3-08-local-geometry-persistence-memory-length]
    paths: [doc/local-geometry-persistence-memory-length/authorizations/lgpml-stage2-trigger.txt]
concurrency:
  group: lgpml-stage2-formal-v1
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 6}
      - name: Verify source-bound Stage 2 authorization
        run: node tools/experiments/verify-lgpml-stage2-authorization.js
      - name: Durable Stage 2 pre-computation lease
        run: |
          mkdir -p artifacts/lease
          printf '%s\n' "LGPML-S2-FORMAL-2026-09-03-v1" > artifacts/lease/stage.txt
          git rev-parse HEAD > artifacts/lease/trigger-head.txt
          git rev-parse HEAD^ > artifacts/lease/authorization-parent.txt
          sha256sum doc/local-geometry-persistence-memory-length/authorizations/STAGE_2_SCIENTIFIC_AUTHORIZATION.json > artifacts/lease/authorization.sha256
      - uses: actions/upload-artifact@v4
        with: {name: "lgpml-stage2-lease-${{ github.run_id }}", path: artifacts/lease, if-no-files-found: error}
      - name: Execute exactly one authorized fresh formal computation
        run: |
          mkdir -p artifacts/local/local-geometry-persistence-memory-length/stage2
          node tools/experiments/run-lgpml-stage2-formal.js --output artifacts/local/local-geometry-persistence-memory-length/stage2/scientific-result.json
      - name: Upload Stage 2 result before repository mirror
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "lgpml-stage2-result-${{ github.run_id }}", path: artifacts/local/local-geometry-persistence-memory-length/stage2/scientific-result.json, if-no-files-found: error}
