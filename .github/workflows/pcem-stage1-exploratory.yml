name: PCEM Stage 1 exploratory scientific (serial superseded)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pcem-stage1-exploratory.yml'

permissions:
  contents: read

concurrency:
  group: pcem-stage1-serial-superseded-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  superseded:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Serial Stage 1 execution was prospectively superseded, before any scientific result artifact was observed, by STAGE_1_EXECUTION_AMENDMENT_1.json and .github/workflows/pcem-stage1-parallel.yml.'
