name: PCEM Stage 1 exploratory scientific

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pcem-stage1-exploratory.yml'
      - 'public/engine.js'
      - 'public/ai.js'
      - 'public/ai-weights.js'
      - 'tools/experiments/lib/ssgtc-representation-production.js'
      - 'tools/experiments/lib/practical-comeback-stage0-production.js'
      - 'tools/experiments/lib/practical-comeback-stage1-corpus.js'
      - 'tools/experiments/lib/practical-comeback-stage1-measurement.js'
      - 'tools/experiments/lib/practical-comeback-stage1-discovery.js'
      - 'tools/experiments/validate-pcem-stage1-spec.js'
      - 'tools/experiments/run-pcem-stage1-exploratory.js'
      - 'tools/experiments/lib/ssgtc-representation-independent.js'
      - 'tools/experiments/lib/practical-comeback-stage1-independent-core.js'
      - 'tools/experiments/lib/practical-comeback-stage1-independent-discovery.js'
      - 'tools/experiments/verify-pcem-stage1-independent.js'
      - 'doc/practical-comeback-error-inducing-moves/preregistration/STAGE_1_EXPLORATORY_SPEC.json'
      - 'doc/practical-comeback-error-inducing-moves/preregistration/STAGE_1_FEATURE_DEFINITIONS.json'
      - 'doc/practical-comeback-error-inducing-moves/preregistration/STAGE_1_EXPLORATORY_AUTHORIZATION.json'

permissions:
  contents: read

concurrency:
  group: pcem-stage1-exploratory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  production:
    name: stage1-production
    runs-on: ubuntu-latest
    timeout-minutes: 305
    outputs:
      should_run: ${{ steps.canonical_guard.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Canonical-result rerun guard
        id: canonical_guard
        shell: bash
        run: |
          if [ -f doc/practical-comeback-error-inducing-moves/results/STAGE_1_EXPLORATORY_RESULT.json ]; then
            echo 'Canonical Stage 1 result already exists; heavy scientific rerun is blocked.'
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.canonical_guard.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate frozen Stage 1 spec
        if: steps.canonical_guard.outputs.should_run == 'true'
        run: node tools/experiments/validate-pcem-stage1-spec.js

      - name: Verify authorization and source hashes before generation
        if: steps.canonical_guard.outputs.should_run == 'true'
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = require('node:path');
          const authPath = 'doc/practical-comeback-error-inducing-moves/preregistration/STAGE_1_EXPLORATORY_AUTHORIZATION.json';
          const specPath = 'doc/practical-comeback-error-inducing-moves/preregistration/STAGE_1_EXPLORATORY_SPEC.json';
          const featurePath = 'doc/practical-comeback-error-inducing-moves/preregistration/STAGE_1_FEATURE_DEFINITIONS.json';
          const files = [
            'public/engine.js',
            'public/ai.js',
            'public/ai-weights.js',
            'tools/experiments/lib/ssgtc-representation-production.js',
            'tools/experiments/lib/practical-comeback-stage0-production.js',
            'tools/experiments/lib/practical-comeback-stage1-corpus.js',
            'tools/experiments/lib/practical-comeback-stage1-measurement.js',
            'tools/experiments/lib/practical-comeback-stage1-discovery.js',
            'tools/experiments/validate-pcem-stage1-spec.js',
            'tools/experiments/run-pcem-stage1-exploratory.js',
            specPath,
            featurePath
          ];
          const sha = (p) => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const authText = fs.readFileSync(authPath, 'utf8');
          const auth = JSON.parse(authText);
          const spec = JSON.parse(fs.readFileSync(specPath, 'utf8'));
          const actual = Object.fromEntries(files.map((p) => [p, sha(p)]));
          if (auth.schemaVersion !== 1 || auth.studyId !== 'PCEM-STUDY1' || auth.stageId !== spec.stageId) throw new Error('authorization identity mismatch');
          if (auth.stage1GenerationAuthorized !== true || auth.scientificInferenceAuthorized !== false || auth.confirmatoryReuseAllowed !== false) throw new Error('authorization semantics mismatch');
          if (auth.stage2GenerationAuthorized !== false) throw new Error('Stage 2 unexpectedly authorized');
          if (auth.specSha256 !== sha(specPath)) throw new Error('spec hash mismatch');
          if (auth.featureDefinitionsSha256 !== sha(featurePath)) throw new Error('feature-definition hash mismatch');
          if (JSON.stringify(auth.authorizedSourceFileSha256) !== JSON.stringify(actual)) throw new Error('scientific source hash mismatch');
          console.log(JSON.stringify({
            stageId: spec.stageId,
            specSha256: auth.specSha256,
            featureDefinitionsSha256: auth.featureDefinitionsSha256,
            authorizationSha256: crypto.createHash('sha256').update(authText).digest('hex'),
            sourceHashesMatch: true,
            stage1GenerationAuthorized: true,
            stage2GenerationAuthorized: false
          }, null, 2));
          NODE

      - name: Run authorized Stage 1 production
        if: steps.canonical_guard.outputs.should_run == 'true'
        run: |
          mkdir -p artifacts/local/practical-comeback-error-inducing-moves/stage1-exploratory-v1
          /usr/bin/time -v node tools/experiments/run-pcem-stage1-exploratory.js \
            --out artifacts/local/practical-comeback-error-inducing-moves/stage1-exploratory-v1 \
            2> artifacts/local/practical-comeback-error-inducing-moves/stage1-exploratory-v1/production-resource.txt

      - name: Inspect production classification
        if: always() && steps.canonical_guard.outputs.should_run == 'true'
        run: |
          if [ -f artifacts/local/practical-comeback-error-inducing-moves/stage1-exploratory-v1/stage1-result.json ]; then
            cat artifacts/local/practical-comeback-error-inducing-moves/stage1-exploratory-v1/stage1-result.json
          else
            echo 'stage1-result.json absent'
          fi

      - name: Upload production artifact
        if: always() && steps.canonical_guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pcem-stage1-exploratory-production-v1
          path: artifacts/local/practical-comeback-error-inducing-moves/stage1-exploratory-v1
          if-no-files-found: error
          retention-days: 90

  independent-verification:
    name: stage1-independent-verification
    needs: production
    if: needs.production.result == 'success' && needs.production.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 305
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: pcem-stage1-exploratory-production-v1
          path: artifacts/local/practical-comeback-error-inducing-moves/stage1-exploratory-v1

      - name: Run independent full reconstruction
        run: |
          DIR=artifacts/local/practical-comeback-error-inducing-moves/stage1-exploratory-v1
          LABEL=$(node -e "const r=require('./' + process.argv[1] + '/stage1-result.json'); process.stdout.write(r.scientificLabel || '')" "$DIR")
          echo "production scientificLabel=$LABEL"
          if [ -f "$DIR/source-summary.json" ] && [ -f "$DIR/selection.json" ]; then
            /usr/bin/time -v node tools/experiments/verify-pcem-stage1-independent.js \
              --input-dir "$DIR" \
              --output "$DIR/independent-verification.json" \
              2> "$DIR/independent-verification-resource.txt"
          else
            if [ "$LABEL" != "RESOURCE-CENSORED" ]; then
              echo 'Missing source/selection artifacts for a non-resource-censored result' >&2
              exit 1
            fi
            node - <<'NODE'
            const fs = require('node:fs');
            const path = require('node:path');
            const dir = 'artifacts/local/practical-comeback-error-inducing-moves/stage1-exploratory-v1';
            const r = JSON.parse(fs.readFileSync(path.join(dir, 'stage1-result.json'), 'utf8'));
            const out = {
              schemaVersion: 1,
              studyId: 'PCEM-STUDY1',
              stageId: 'PCEM-S1-EXPLORATORY-2026-08-25-v1',
              decision: 'RESOURCE-CENSORED-BEFORE-INDEPENDENT-FULL-RECONSTRUCTION',
              passed: false,
              scientificInferenceAuthorized: false,
              scientificLabelVerified: 'RESOURCE-CENSORED',
              reason: r.reason,
              note: 'Production stopped before the complete source-summary/selection boundary; no candidate result is valid and no Stage 2 authorization follows.'
            };
            fs.writeFileSync(path.join(dir, 'independent-verification.json'), JSON.stringify(out, null, 2) + '\n');
            console.log(JSON.stringify(out, null, 2));
            NODE
          fi

      - name: Upload independently verified artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcem-stage1-exploratory-verified-v1
          path: artifacts/local/practical-comeback-error-inducing-moves/stage1-exploratory-v1
          if-no-files-found: error
          retention-days: 90
