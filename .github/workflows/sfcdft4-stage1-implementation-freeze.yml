name: SFCDFT4 Stage1 implementation freeze

on:
  push:
    branches:
      - research/g4-02-sfcdft-study4-prereg
    paths:
      - .github/workflows/sfcdft4-stage1-implementation-freeze.yml

permissions:
  contents: write

jobs:
  freeze:
    name: Generate and freeze Study4 Stage1 implementation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Generate Study4 Stage1 implementation from frozen Study3 route
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          copies = {
            '.github/actions/sfcdft3-stage1-acquire-slot/action.yml': '.github/actions/sfcdft4-stage1-acquire-slot/action.yml',
            '.github/workflows/sfcdft3-stage1-github-actions.yml': '.github/workflows/sfcdft4-stage1-github-actions.yml',
            '.github/workflows/sfcdft3-stage1-preflight.yml': '.github/workflows/sfcdft4-stage1-preflight.yml',
            'tools/experiments/lib/sfcdft3-source-production.js': 'tools/experiments/lib/sfcdft4-source-production.js',
            'tools/experiments/lib/sfcdft3-source-independent.js': 'tools/experiments/lib/sfcdft4-source-independent.js',
            'tools/experiments/lib/sfcdft3-production.js': 'tools/experiments/lib/sfcdft4-production.js',
            'tools/experiments/lib/sfcdft3-independent.js': 'tools/experiments/lib/sfcdft4-independent.js',
            'tools/experiments/run-sfcdft3-stage1-source-unit.js': 'tools/experiments/run-sfcdft4-stage1-source-unit.js',
            'tools/experiments/generate-sfcdft3-stage1-actions-matrices.js': 'tools/experiments/generate-sfcdft4-stage1-actions-matrices.js',
            'tools/experiments/classify-sfcdft3-stage1-actions-artifacts.js': 'tools/experiments/classify-sfcdft4-stage1-actions-artifacts.js',
            'tools/experiments/bundle-sfcdft3-stage1-source.js': 'tools/experiments/bundle-sfcdft4-stage1-source.js',
            'tools/experiments/run-sfcdft3-stage1-measurement-task.js': 'tools/experiments/run-sfcdft4-stage1-measurement-task.js',
            'tools/experiments/run-sfcdft3-stage1-aggregate.js': 'tools/experiments/run-sfcdft4-stage1-aggregate.js',
            'tools/experiments/verify-sfcdft3-stage1-actions-authorization.js': 'tools/experiments/verify-sfcdft4-stage1-actions-authorization.js',
          }
          replacements = [
            ('research/g4-02-sfcdft-study3-prereg','research/g4-02-sfcdft-study4-prereg'),
            ('SFCDFT3-S1-COMPATIBILITY-2026-09-19-v1','SFCDFT4-S1-COMPATIBILITY-2026-09-19-v1'),
            ('SFCDFT-STUDY3','SFCDFT-STUDY4'),
            ('SFCDFT3-D','SFCDFT4-D'),
            ('STUDY_3_STAGE_1','STUDY_4_STAGE_1'),
            ('STUDY_3_SPEC.json','STUDY_4_SPEC.json'),
            ('sfcdft3','sfcdft4'),
            ('Study3','Study4'),
            ('40511001','40611001'),
            ('40511384','40611384'),
            ('41511001','41611001'),
            ('41511384','41611384'),
            ('49031002','49041002'),
            ('50031002','50041002'),
          ]
          for src, dst in copies.items():
            text = Path(src).read_text()
            for a,b in replacements:
              text = text.replace(a,b)
            p = Path(dst); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(text)

          src_spec = json.loads(Path('doc/structural-forcing-corridor-tree-raw-transfer/prereg/STUDY_3_STAGE_1_COMPATIBILITY_SPEC.json').read_text())
          src_spec['studyId'] = 'SFCDFT-STUDY4'
          src_spec['stageId'] = 'SFCDFT4-S1-COMPATIBILITY-2026-09-19-v1'
          src_spec['statusAtFreeze'] = 'FROZEN-AFTER-PREACCESS-PASS-BEFORE-FRESH-ACCESS'
          src_spec['prerequisiteStage0'] = {
            'path': 'doc/structural-forcing-corridor-tree-raw-transfer/results/stage-0-study4/STUDY_4_STAGE_0_TECHNICAL_RESULT.json',
            'gitBlobSha': 'a930140db87ae98da6079d4484812092d30211e0',
            'decision': 'STAGE0-PASS',
            'workflowRunId': 35435952961,
            'sourceBundleArtifactId': 10582054771,
            'sourceBundleArtifactDigest': 'sha256:c171dcfc78320be4ce51cd93afdf95cf76f5cdc735a7c099c27ac542feccf8e5',
            'finalResultArtifactId': 10582298316,
            'finalResultArtifactDigest': 'sha256:292ff27460f3c14f02f22c723245c06af408376475d71dfcf89230d74d48ba5a',
            'bundleCoreSha256': 'ee402806f362ecb483f04353632d2e829ee13175bcab91b8b4038a091a3df01f',
            'deterministicCoreSha256': 'ebcffb9ab33acbafa6f5344740f0cc93d12fbd330911a2f96cac76b6c66d2133'
          }
          src_spec['freshSeedSlots'] = {
            'primary': {'seedStart':40611001,'seedEnd':40611384,'count':384},
            'pairedReserve': {'seedStart':41611001,'seedEnd':41611384,'count':384},
            'reserveMapping':'reserveSeed = primarySeed + 1000000',
            'maxInfrastructureReplacements':16,
            'maxFreshSeedReads':400,
            'seedExtensionAuthorized':False,
            'reserveOfReserveAuthorized':False
          }
          for d in src_spec['domains']:
            d['domainId'] = d['domainId'].replace('SFCDFT3-D','SFCDFT4-D')
          fw = src_spec['identityFirewalls']
          fw['study3Stage1'] = {
            'path':'doc/research-generation-4/identity-firewalls/g4-02-sfcdft-study3-stage1/MANIFEST.json',
            'gitBlobSha':'b4d1add69c4ee446dcdf1eb516c24c6b1b7a5a18',
            'identityCoreSha256':'3d8e9b9e175c63a864ea72a1cdc3b667feba2f216758a9325ebacba2c3c81cda',
            'forbiddenSeedNamespaces':['40511001..40511384','41511001..41511384'],
            'exclude':['sourceTrajectorySha256','openingPrefixSha256','rootRawSha256']
          }
          fw['study3Stage2'] = {
            'path':'doc/research-generation-4/identity-firewalls/g4-02-sfcdft-study3-stage2/MANIFEST.json',
            'gitBlobSha':'b7d9d369f6dae9f083ab25554a1617998e363af5',
            'identityCoreSha256':'4e9948fed1f7274f7d25b07f95fbc65ce3341b892dc64a288a6bcaa86f39b382',
            'forbiddenSeedNamespaces':['40521001..40521768','41521001..41521768'],
            'exclude':['sourceTrajectorySha256','openingPrefixSha256','rootRawSha256'],
            'scientificDecisionImported':False
          }
          src_spec['measurement']['productionImplementation'] = 'tools/experiments/lib/sfcdft4-production.js'
          src_spec['measurement']['independentImplementation'] = 'tools/experiments/lib/sfcdft4-independent.js'
          src_spec['protectedEvidence']['study3Stage1Replay'] = False
          src_spec['protectedEvidence']['study3Stage2RepairOrRerun'] = False
          src_spec['protectedEvidence']['study3ScientificSeedReread'] = False
          spec_path = Path('doc/structural-forcing-corridor-tree-raw-transfer/prereg/STUDY_4_STAGE_1_COMPATIBILITY_SPEC.json')
          spec_path.write_text(json.dumps(src_spec, indent=2, ensure_ascii=False) + '\n')

          bundle = Path('tools/experiments/bundle-sfcdft4-stage1-source.js')
          text = bundle.read_text()
          insert = """function loadStudy3Stage1(){const cfg=SPEC.identityFirewalls.study3Stage1,fw=readBound(cfg.path,cfg.gitBlobSha),base=path.dirname(path.join(ROOT,cfg.path));need(fw.identityCoreSha256===cfg.identityCoreSha256,'Study3 Stage1 firewall core mismatch');need(fw.scientificSeedReplay===false&&fw.scientificEndpointLoaded===false,'Study3 Stage1 firewall boundary mismatch');const out={trajectory:readSet(path.join(base,'SOURCE_TRAJECTORY_SHA256.txt')),prefix:readSet(path.join(base,'OPENING_PREFIX_SHA256.txt')),root:readSet(path.join(base,'RAW_ROOT_SHA256.txt'))};need(out.trajectory.size===fw.identityCounts.uniqueSourceTrajectorySha256&&out.prefix.size===fw.identityCounts.uniqueOpeningPrefixSha256&&out.root.size===fw.identityCounts.uniqueRawRootSha256,'Study3 Stage1 firewall count mismatch');return out;}
function loadStudy3Stage2(){const cfg=SPEC.identityFirewalls.study3Stage2,fw=readBound(cfg.path,cfg.gitBlobSha),base=path.dirname(path.join(ROOT,cfg.path));need(fw.identityCoreSha256===cfg.identityCoreSha256,'Study3 Stage2 firewall core mismatch');need(fw.scientificSeedReplay===false&&fw.scientificEndpointLoaded===false&&fw.scientificMeasurementLoaded===false&&fw.scientificAggregateLoaded===false,'Study3 Stage2 firewall boundary mismatch');const out={trajectory:readSet(path.join(base,'SOURCE_TRAJECTORY_SHA256.txt')),prefix:readSet(path.join(base,'OPENING_PREFIX_SHA256.txt')),root:readSet(path.join(base,'RAW_ROOT_SHA256.txt'))};need(out.trajectory.size===fw.identityCounts.uniqueSourceTrajectorySha256&&out.prefix.size===fw.identityCounts.uniqueOpeningPrefixSha256&&out.root.size===fw.identityCounts.uniqueRawRootSha256,'Study3 Stage2 firewall count mismatch');return out;}
"""
          if 'function limits(){' not in text: raise SystemExit('bundle insertion point missing')
          text = text.replace('function limits(){', insert + 'function limits(){', 1)
          old = 'const legacy=loadLegacy(),study1=loadStudy1(),study2=loadStudy2();'
          new = 'const legacy=loadLegacy(),study1=loadStudy1(),study2=loadStudy2(),study3s1=loadStudy3Stage1(),study3s2=loadStudy3Stage2();'
          if old not in text: raise SystemExit('bundle loader point missing')
          text = text.replace(old,new,1)
          old = 'for(const fw of[SPEC.identityFirewalls.g4_01Legacy,SPEC.identityFirewalls.study1,SPEC.identityFirewalls.study2])'
          new = 'for(const fw of[SPEC.identityFirewalls.g4_01Legacy,SPEC.identityFirewalls.study1,SPEC.identityFirewalls.study2,SPEC.identityFirewalls.study3Stage1,SPEC.identityFirewalls.study3Stage2])'
          if old not in text: raise SystemExit('bundle seed firewall point missing')
          text = text.replace(old,new,1)
          lines = text.splitlines()
          out=[]
          added=False
          for line in lines:
            out.append(line)
            if 'if(!reason&&study2.trajectory.has' in line:
              out.append("  if(!reason&&study3s1.trajectory.has(j.sourceTrajectorySha256))reason='STUDY3-STAGE1-TRAJECTORY-COLLISION';if(!reason&&study3s1.prefix.has(j.openingPrefixSha256))reason='STUDY3-STAGE1-OPENING-PREFIX-COLLISION';if(!reason&&(study3s1.root.has(j.namua.rawStateSha256)||study3s1.root.has(j.mtaji.rawStateSha256)))reason='STUDY3-STAGE1-RAW-ROOT-COLLISION';")
              out.append("  if(!reason&&study3s2.trajectory.has(j.sourceTrajectorySha256))reason='STUDY3-STAGE2-TRAJECTORY-COLLISION';if(!reason&&study3s2.prefix.has(j.openingPrefixSha256))reason='STUDY3-STAGE2-OPENING-PREFIX-COLLISION';if(!reason&&(study3s2.root.has(j.namua.rawStateSha256)||study3s2.root.has(j.mtaji.rawStateSha256)))reason='STUDY3-STAGE2-RAW-ROOT-COLLISION';")
              added=True
          if not added: raise SystemExit('bundle collision insertion point missing')
          text='\n'.join(out)+'\n'
          marker='study2Root:study2.root.size}'
          repl='study2Root:study2.root.size,study3Stage1Trajectory:study3s1.trajectory.size,study3Stage1OpeningPrefix:study3s1.prefix.size,study3Stage1Root:study3s1.root.size,study3Stage2Trajectory:study3s2.trajectory.size,study3Stage2OpeningPrefix:study3s2.prefix.size,study3Stage2Root:study3s2.root.size}'
          if marker not in text: raise SystemExit('bundle manifest count point missing')
          text=text.replace(marker,repl,1)
          bundle.write_text(text)

          preflight = Path('.github/workflows/sfcdft4-stage1-preflight.yml')
          text = preflight.read_text()
          start = text.index('      - name: Regress frozen Stage0 primary semantics with technical-only fixtures')
          end = text.index('      - name: Verify primary/reserve assignment semantics on technical seeds')
          replacement = """      - name: Verify canonical Study4 Stage0 prerequisite
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const p='doc/structural-forcing-corridor-tree-raw-transfer/results/stage-0-study4/STUDY_4_STAGE_0_TECHNICAL_RESULT.json';
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.studyId!=='SFCDFT-STUDY4'||r.stageId!=='SFCDFT4-S0-E2E-TECHNICAL-2026-09-19-v1'||r.decision!=='STAGE0-PASS')throw new Error('Stage0 prerequisite mismatch');
          if(r.freshScientificSeedReads!==0||r.scientificOutputsGenerated!==0)throw new Error('Stage0 scientific boundary mismatch');
          if(r.deterministicCoreSha256!=='ebcffb9ab33acbafa6f5344740f0cc93d12fbd330911a2f96cac76b6c66d2133')throw new Error('Stage0 deterministic core mismatch');
          fs.writeFileSync('/tmp/stage0-regression.json',JSON.stringify(r));
          NODE
      - name: Verify durable Study3 identity firewalls
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process'),path=require('node:path');
          const s=require('./doc/structural-forcing-corridor-tree-raw-transfer/prereg/STUDY_4_STAGE_1_COMPATIBILITY_SPEC.json');
          for(const key of ['study3Stage1','study3Stage2']){
            const c=s.identityFirewalls[key];
            const actual=cp.execFileSync('git',['hash-object',c.path],{encoding:'utf8'}).trim();
            if(actual!==c.gitBlobSha)throw new Error(`${key} manifest blob mismatch`);
            const m=JSON.parse(fs.readFileSync(c.path,'utf8'));
            if(m.identityCoreSha256!==c.identityCoreSha256)throw new Error(`${key} identity core mismatch`);
            if(m.scientificSeedReplay!==false||m.scientificEndpointLoaded!==false)throw new Error(`${key} scientific boundary mismatch`);
          }
          const p=s.freshSeedSlots.primary,r=s.freshSeedSlots.pairedReserve;
          for(const c of Object.values(s.identityFirewalls))for(const x of c.forbiddenSeedNamespaces||[]){const [a,b]=x.split('..').map(Number);for(const seed of [p.seedStart,p.seedEnd,r.seedStart,r.seedEnd])if(seed>=a&&seed<=b)throw new Error(`fresh namespace collision ${seed} with ${x}`);}
          console.log(JSON.stringify({study3Stage1:s.identityFirewalls.study3Stage1.identityCoreSha256,study3Stage2:s.identityFirewalls.study3Stage2.identityCoreSha256}));
          NODE
"""
          text = text[:start] + replacement + text[end:]
          text = text.replace("node --check tools/experiments/run-sfcdft4-stage0-technical.js\n","")
          preflight.write_text(text)
          PY

      - name: Validate generated Stage1 files seed-free
        run: |
          set -euo pipefail
          node --check tools/experiments/lib/sfcdft4-source-production.js
          node --check tools/experiments/lib/sfcdft4-source-independent.js
          node --check tools/experiments/lib/sfcdft4-production.js
          node --check tools/experiments/lib/sfcdft4-independent.js
          node --check tools/experiments/run-sfcdft4-stage1-source-unit.js
          node --check tools/experiments/generate-sfcdft4-stage1-actions-matrices.js
          node --check tools/experiments/classify-sfcdft4-stage1-actions-artifacts.js
          node --check tools/experiments/bundle-sfcdft4-stage1-source.js
          node --check tools/experiments/run-sfcdft4-stage1-measurement-task.js
          node --check tools/experiments/run-sfcdft4-stage1-aggregate.js
          node --check tools/experiments/verify-sfcdft4-stage1-actions-authorization.js
          python3 - <<'PY'
          import json
          p='doc/structural-forcing-corridor-tree-raw-transfer/prereg/STUDY_4_STAGE_1_COMPATIBILITY_SPEC.json'
          s=json.load(open(p))
          assert s['studyId']=='SFCDFT-STUDY4'
          assert s['stageId']=='SFCDFT4-S1-COMPATIBILITY-2026-09-19-v1'
          assert s['freshSeedSlots']['primary']=={'seedStart':40611001,'seedEnd':40611384,'count':384}
          assert s['freshSeedSlots']['pairedReserve']['seedStart']==41611001
          assert s['identityFirewalls']['study3Stage1']['identityCoreSha256']=='3d8e9b9e175c63a864ea72a1cdc3b667feba2f216758a9325ebacba2c3c81cda'
          assert s['identityFirewalls']['study3Stage2']['identityCoreSha256']=='4e9948fed1f7274f7d25b07f95fbc65ce3341b892dc64a288a6bcaa86f39b382'
          assert not s['measurement']['freshSeedReadAuthorized']
          PY
          git diff --check

      - name: Commit frozen Study4 Stage1 implementation
        run: |
          set -euo pipefail
          git config user.name 'Sawa'
          git config user.email '72678394+nkkmd@users.noreply.github.com'
          git add \
            .github/actions/sfcdft4-stage1-acquire-slot/action.yml \
            .github/workflows/sfcdft4-stage1-github-actions.yml \
            .github/workflows/sfcdft4-stage1-preflight.yml \
            doc/structural-forcing-corridor-tree-raw-transfer/prereg/STUDY_4_STAGE_1_COMPATIBILITY_SPEC.json \
            tools/experiments/lib/sfcdft4-source-production.js \
            tools/experiments/lib/sfcdft4-source-independent.js \
            tools/experiments/lib/sfcdft4-production.js \
            tools/experiments/lib/sfcdft4-independent.js \
            tools/experiments/run-sfcdft4-stage1-source-unit.js \
            tools/experiments/generate-sfcdft4-stage1-actions-matrices.js \
            tools/experiments/classify-sfcdft4-stage1-actions-artifacts.js \
            tools/experiments/bundle-sfcdft4-stage1-source.js \
            tools/experiments/run-sfcdft4-stage1-measurement-task.js \
            tools/experiments/run-sfcdft4-stage1-aggregate.js \
            tools/experiments/verify-sfcdft4-stage1-actions-authorization.js
          git diff --cached --quiet && { echo 'no implementation changes'; exit 1; }
          git commit -m 'research(g4-02): freeze Study4 Stage1 implementation'
          git push origin "HEAD:${GITHUB_REF_NAME}"
