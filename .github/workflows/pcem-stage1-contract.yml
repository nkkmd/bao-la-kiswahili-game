name: PCEM Stage 1 pre-authorization contract (closed)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pcem-stage1-contract.yml'
      - 'doc/practical-comeback-error-inducing-moves/preregistration/STAGE_1_EXPLORATORY_AUTHORIZATION.json'
      - 'doc/practical-comeback-error-inducing-moves/results/STAGE_1_ARTIFACT_PROVENANCE.json'
      - 'test/practical-comeback-closure-consistency.test.js'

permissions:
  contents: read

jobs:
  closure-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify frozen pre-authorization record without rerunning it
        run: |
          node - <<'NODE'
          const a = require('./doc/practical-comeback-error-inducing-moves/preregistration/STAGE_1_EXPLORATORY_AUTHORIZATION.json');
          if (a.preAuthorizationContract.workflowRunId !== 32814139745) throw new Error('unexpected pre-authorization run');
          if (a.preAuthorizationContract.conclusion !== 'success') throw new Error('pre-authorization contract was not frozen success');
          if (a.stage1GenerationAuthorized !== true) throw new Error('Stage 1 authorization record missing');
          if (a.stage2GenerationAuthorized !== false) throw new Error('Stage 2 unexpectedly authorized');
          const p = require('./doc/practical-comeback-error-inducing-moves/results/STAGE_1_ARTIFACT_PROVENANCE.json');
          if (p.scientificResultChanged !== false) throw new Error('unexpected scientific-result mutation');
          console.log('Pre-authorization contract is historical and closed; absence-of-authorization smoke is not rerun after authorization.');
          NODE
