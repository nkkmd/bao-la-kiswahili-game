name: PBAI-P12 final documentation audit

on:
  push:
    branches:
      - engineering/pbai-p12-margin-bounded-search
    paths:
      - '.github/workflows/pbai-p12-final-doc-audit.yml'

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engineering/pbai-p12-margin-bounded-search
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 最終文書の状態を同期して監査
        run: python3 .github/scripts/pbai_p12_finalize_docs.py
      - name: 関連契約と世代回帰を確認
        run: |
          node --test test/public-ai-improvement-program1-contract.test.js
          node --test test/ai-generation-release.test.js
          git diff --check
      - name: 最終整備を記録し一時ファイルを除去
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md doc/ai-engineering/NEXT_IMPROVEMENT_CANDIDATE.md doc/ai-engineering/NEXT_IMPROVEMENT_PREFLIGHT_2026-09-14.md
          git rm .github/workflows/pbai-p12-final-doc-audit.yml .github/scripts/pbai_p12_finalize_docs.py
          git commit -m 'docs: finalize PBAI-P12 documentation consistency'
          git push origin HEAD:engineering/pbai-p12-margin-bounded-search
