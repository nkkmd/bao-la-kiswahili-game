name: G4-02 documentation closure sync

on:
  push:
    branches:
      - research/g4-02-sfcdft-study4-prereg
    paths:
      - .github/workflows/g4-02-doc-closure-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact documentation replacements
        run: python tools/g4-02-doc-closure-sync.py
      - name: Verify synchronized closure markers
        run: |
          grep -F 'G4-02 = CLOSED / NO SCIENTIFIC DECISION' doc/FUTURE_RESEARCH_AGENDA.md
          grep -F '`G4-02` | corridor / tree-graph transfer | `CLOSED / NO SCIENTIFIC DECISION`' doc/RESEARCH_INDEX.md
          grep -F 'CLOSED / NO SCIENTIFIC DECISION' README.md
          if grep -F 'G4-02 authorization reviewはPREREQUISITE-REQUIRED' doc/RESEARCH_INDEX.md; then exit 1; fi
          if grep -F 'G4-02はeligibility gate通過後のauthorization reviewで`PREREQUISITE-REQUIRED`' README.md; then exit 1; fi
      - name: Commit synchronized documentation
        run: |
          git config user.name 'Sawa'
          git config user.email '72678394+nkkmd@users.noreply.github.com'
          git add README.md doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md
          git diff --cached --check
          git commit -m 'docs(rg4): synchronize G4-02 closure across indexes'
          git push origin HEAD:research/g4-02-sfcdft-study4-prereg
