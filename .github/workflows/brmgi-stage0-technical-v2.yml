name: BRMGI Stage 0 Technical v2
on:
  push:
    branches:
      - research/g3-06-bao-rule-mechanism-geometry-intervention
    paths:
      - doc/bao-rule-mechanism-geometry-intervention/authorizations/brmgi-stage0-v2-trigger.txt
concurrency:
  group: brmgi-stage0-technical-v2
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  stage0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Verify v2 authorization chain
        run: node tools/experiments/verify-brmgi-stage0-v2-authorization.js
      - name: Materialize durable v2 lease
        run: |
          mkdir -p artifacts/lease-v2
          printf '%s\n' "BRMGI-S0-TECHNICAL-2026-09-03-v2" > artifacts/lease-v2/stage.txt
          git rev-parse HEAD > artifacts/lease-v2/trigger-head.txt
      - name: Upload v2 lease before computation
        uses: actions/upload-artifact@v4
        with:
          name: brmgi-stage0-v2-lease-${{ github.run_id }}
          path: artifacts/lease-v2
          if-no-files-found: error
      - name: Execute exactly one v2 technical computation
        run: node tools/experiments/run-brmgi-stage0-technical-v2.js doc/bao-rule-mechanism-geometry-intervention/results/stage-0-v2/STAGE_0_TECHNICAL_RESULT.json
      - name: Upload v2 result before repository mirror
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brmgi-stage0-v2-result-${{ github.run_id }}
          path: doc/bao-rule-mechanism-geometry-intervention/results/stage-0-v2/STAGE_0_TECHNICAL_RESULT.json
          if-no-files-found: error
