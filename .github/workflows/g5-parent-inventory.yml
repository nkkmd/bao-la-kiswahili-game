name: G5 Parent Inventory Read-only Tests
on:
  push:
    branches: [main, research/g5-parent-inventory-20261020]
    paths: ['tools/research/g5-runner-topology/*inventory*', 'tools/research/g5-runner-topology/*review*', 'doc/research-generation-5/runner-topology-20261017/capacity-20261020/**', 'doc/research-generation-5/runner-topology-20261017/lightweight-20261020/**', 'doc/research-generation-5/runner-topology-20261017/shell-route-20261020/**', 'doc/research-generation-5/runner-topology-20261017/fail-first-20261020/**', '.github/workflows/g5-parent-inventory.yml']
  pull_request:
    paths: ['tools/research/g5-runner-topology/*inventory*', 'tools/research/g5-runner-topology/*review*', 'doc/research-generation-5/runner-topology-20261017/capacity-20261020/**', 'doc/research-generation-5/runner-topology-20261017/lightweight-20261020/**', 'doc/research-generation-5/runner-topology-20261017/shell-route-20261020/**', 'doc/research-generation-5/runner-topology-20261017/fail-first-20261020/**', '.github/workflows/g5-parent-inventory.yml']
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/research/g5-runner-topology/test-inventory-host.py
      - run: python3 tools/research/g5-runner-topology/test-inventory-package.py
      - run: python3 tools/research/g5-runner-topology/test-review-lightweight.py
      - run: python3 tools/research/g5-runner-topology/test-review-shell-route.py
      - name: Verify fail-first design sources without implementing or running control
        run: |
          python3 tools/research/g5-runner-topology/review-fail-first.py > "$RUNNER_TEMP/fail-first-review.json"
          diff -u doc/research-generation-5/runner-topology-20261017/fail-first-20261020/REVIEW.json "$RUNNER_TEMP/fail-first-review.json"
