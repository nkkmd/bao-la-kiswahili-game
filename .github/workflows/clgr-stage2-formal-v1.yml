name: CLGR Stage 2 Formal v1

on:
  push:
    branches:
      - research/g3-09-continuous-local-geometry-representation
    paths:
      - doc/continuous-local-geometry-representation/authorizations/clgr-stage2-formal-v1-trigger.json

permissions:
  contents: read

concurrency:
  group: clgr-stage2-formal-v1
  cancel-in-progress: false

jobs:
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Syntax-check frozen Stage 2 tooling
        run: |
          node --check tools/experiments/lib/clgr-stage2-production.js
          node --check tools/experiments/lib/clgr-stage2-independent.js
          node --check tools/experiments/run-clgr-stage2-formal.js
          node --check tools/experiments/verify-clgr-stage2-authorization.js
      - name: Verify exact Stage 2 authorization and source binding
        run: node tools/experiments/verify-clgr-stage2-authorization.js
      - name: Materialize durable pre-computation lease
        run: |
          mkdir -p artifacts/lease-stage2
          printf '%s\n' 'CLGR-S2-FORMAL-2026-09-03-v1' > artifacts/lease-stage2/stage.txt
          git rev-parse HEAD > artifacts/lease-stage2/trigger-head.txt
          git rev-parse HEAD^ > artifacts/lease-stage2/authorization-commit.txt
          sha256sum doc/continuous-local-geometry-representation/authorizations/STAGE_2_FORMAL_AUTHORIZATION.json > artifacts/lease-stage2/authorization.sha256
          sha256sum doc/continuous-local-geometry-representation/prereg/STAGE_2_FORMAL_SPEC.json > artifacts/lease-stage2/stage2-spec.sha256
          sha256sum doc/continuous-local-geometry-representation/results/stage-2-preauthorization-v1/PREAUTH_AUDIT_RESULT.json > artifacts/lease-stage2/preauthorization.sha256
      - name: Upload Stage 2 lease before formal computation
        uses: actions/upload-artifact@v4
        with:
          name: clgr-stage2-v1-lease-${{ github.run_id }}
          path: artifacts/lease-stage2
          if-no-files-found: error
          overwrite: false
      - name: Execute exactly one authorized fresh Stage 2 computation
        run: |
          mkdir -p artifacts/local/continuous-local-geometry-representation/stage2-v1
          node tools/experiments/run-clgr-stage2-formal.js \
            --output-dir artifacts/local/continuous-local-geometry-representation/stage2-v1
      - name: Upload Stage 2 result before repository mirror
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clgr-stage2-v1-result-${{ github.run_id }}
          path: artifacts/local/continuous-local-geometry-representation/stage2-v1
          if-no-files-found: error
          overwrite: false
