name: G2-08 Closure Documentation

on:
  push:
    branches:
      - research/g2-08-machine-decision-failure-taxonomy
    paths:
      - 'tools/experiments/materialize-g2-08-closure-docs.py'
      - 'tools/experiments/sanitize-g2-08-closure-whitespace.py'
      - 'tools/experiments/finalize-g2-08-closure-consistency.py'
      - '.github/workflows/g2-08-closure-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize localized closure updates
        run: |
          if grep -q '### 24. Machine Decision-Failure Taxonomy — Study 1' doc/RESEARCH_INDEX.md && \
             grep -q 'Study = CLOSED' doc/machine-decision-failure-taxonomy/CURRENT_STATUS.md; then
            echo 'Primary G2-08 closure materialization already present; skipping non-idempotent first-pass materializer.'
          else
            python3 tools/experiments/materialize-g2-08-closure-docs.py
          fi
          python3 tools/experiments/sanitize-g2-08-closure-whitespace.py
          python3 tools/experiments/finalize-g2-08-closure-consistency.py
          git diff --check
          git diff -- README.md doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md doc/machine-decision-failure-taxonomy/

      - name: Commit closure documentation
        run: |
          if git diff --quiet; then
            echo 'No documentation changes required.'
            exit 0
          fi
          git config user.name 'Sawa'
          git config user.email '72678394+nkkmd@users.noreply.github.com'
          git add README.md doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md doc/machine-decision-failure-taxonomy/
          git commit -m 'research(g2-08): finalize Study 1 closure consistency'
          git push origin HEAD:research/g2-08-machine-decision-failure-taxonomy
