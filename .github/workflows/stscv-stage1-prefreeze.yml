name: STSCV Stage 1 Prefreeze

on:
  push:
    branches:
      - research/g2-03-state-transformation-semantics-canonicalization-validation
    paths:
      - "doc/state-transformation-semantics-canonicalization-validation/preregistration/STAGE_1_SPEC.json"
      - "doc/state-transformation-semantics-canonicalization-validation/preregistration/STAGE_1_CANDIDATE_CONTRACT.json"
      - "tools/experiments/run-stscv-stage1-prefreeze.js"
      - "tools/experiments/run-stscv-stage1-development.js"
      - "tools/experiments/verify-stscv-stage1-development.js"
      - "tools/experiments/lib/stscv-stage0-production.js"
      - "tools/experiments/lib/stscv-stage0-independent.js"
      - "tools/experiments/lib/ssgtc-representation-production.js"
      - "tools/experiments/lib/ssgtc-representation-independent.js"
      - "tools/benchmark.js"
      - "public/engine.js"
      - ".github/workflows/stscv-stage1-prefreeze.yml"
      - ".github/workflows/stscv-stage1-development.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prefreeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Engine regression
        run: node test/engine.test.js
      - name: Validate Stage 1 prefreeze and source hashes
        run: |
          mkdir -p artifacts/local/state-transformation-semantics-canonicalization-validation/stage1-prefreeze-v1
          node tools/experiments/run-stscv-stage1-prefreeze.js \
            --output artifacts/local/state-transformation-semantics-canonicalization-validation/stage1-prefreeze-v1/STAGE_1_PREFREEZE_MANIFEST.json
      - uses: actions/upload-artifact@v4
        with:
          name: stscv-stage1-prefreeze-v1
          path: artifacts/local/state-transformation-semantics-canonicalization-validation/stage1-prefreeze-v1/STAGE_1_PREFREEZE_MANIFEST.json
          if-no-files-found: error
