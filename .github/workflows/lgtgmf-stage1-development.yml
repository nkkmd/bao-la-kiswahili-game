name: LGTGMF Stage 1 Development
on:
  push:
    branches: [research/g3-01-local-game-tree-geometry-measurement-foundation]
    paths: ['doc/local-game-tree-geometry-measurement-foundation/authorizations/STAGE_1_DEVELOPMENT_EXECUTE.json']
permissions:
  contents: read
jobs:
  development:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify authorization and frozen boundary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const a=JSON.parse(fs.readFileSync('doc/local-game-tree-geometry-measurement-foundation/authorizations/STAGE_1_DEVELOPMENT_EXECUTE.json','utf8'));
          const parent=cp.execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          if(a.studyId!=='LGTGMF-STUDY1'||a.stageId!=='LGTGMF-S1-DEVELOPMENT-2026-08-31-v1')throw Error('identity mismatch');
          if(a.implementationFreezeCommit!==parent)throw Error(`freeze mismatch ${a.implementationFreezeCommit} != ${parent}`);
          if(a.seedBase!==31010001||a.seedEnd!==31010096||a.targetDepth!==5)throw Error('population/horizon mismatch');
          if(a.standardRootDepth10GenerationAuthorized!==false||a.standardRootDepth10ReadAuthorized!==false)throw Error('depth10 firewall');
          if(a.stage2SeedReadAuthorized!==false)throw Error('stage2 firewall');
          NODE
          node --check tools/experiments/run-lgtgmf-stage1-development.js
          node --check tools/experiments/verify-lgtgmf-stage1-independent.js
          if grep -q 'lgtgmf-production' tools/experiments/lib/lgtgmf-independent.js tools/experiments/lib/lgtgmf-independent-v2.js tools/experiments/verify-lgtgmf-stage1-independent.js; then exit 1; fi
          sha256sum tools/experiments/lib/lgtgmf-production.js tools/experiments/lib/lgtgmf-production-v2.js tools/experiments/lib/lgtgmf-independent.js tools/experiments/lib/lgtgmf-independent-v2.js tools/experiments/run-lgtgmf-stage1-development.js tools/experiments/verify-lgtgmf-stage1-independent.js doc/local-game-tree-geometry-measurement-foundation/preregistration/STAGE_1_DEVELOPMENT_SPEC.json
      - name: Run production development reconstruction
        run: |
          set -euo pipefail
          OUT=artifacts/local/local-game-tree-geometry-measurement-foundation/stage1-development-v1
          node tools/experiments/run-lgtgmf-stage1-development.js "$OUT" | tee lgtgmf-stage1-production.log
      - name: Run structurally independent development reconstruction
        run: |
          set -euo pipefail
          OUT=artifacts/local/local-game-tree-geometry-measurement-foundation/stage1-development-v1
          node tools/experiments/verify-lgtgmf-stage1-independent.js "$OUT" | tee lgtgmf-stage1-independent.log
      - name: Preserve compact development artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lgtgmf-stage1-development-${{ github.sha }}
          path: |
            artifacts/local/local-game-tree-geometry-measurement-foundation/stage1-development-v1/**
            lgtgmf-stage1-production.log
            lgtgmf-stage1-independent.log
          retention-days: 30
