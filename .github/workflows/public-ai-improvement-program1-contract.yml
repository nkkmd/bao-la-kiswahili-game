name: PBAI-P1 engineering program contract

on:
  push:
    branches: [main]
    paths:
      - 'doc/AI_ENGINEERING_INDEX.md'
      - 'doc/ai-engineering/public-ai-improvement-program-1/**'
      - 'doc/engineering-program-decisions/2026-08-26-public-ai-improvement-program-1.md'
      - 'test/public-ai-improvement-program1-contract.test.js'
      - '.github/workflows/public-ai-improvement-program1-contract.yml'
  pull_request:
    branches: [main]
    paths:
      - 'doc/AI_ENGINEERING_INDEX.md'
      - 'doc/ai-engineering/public-ai-improvement-program-1/**'
      - 'doc/engineering-program-decisions/2026-08-26-public-ai-improvement-program-1.md'
      - 'test/public-ai-improvement-program1-contract.test.js'
      - '.github/workflows/public-ai-improvement-program1-contract.yml'

permissions:
  contents: read

jobs:
  contract-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify PBAI-P1 establishment contract
        run: node test/public-ai-improvement-program1-contract.test.js
