name: LGTTCI Stage 0 technical validation

on:
  pull_request:
    paths:
      - "public/engine.js"
      - "public/ai.js"
      - "tools/experiments/run-lgttci-stage0-technical.js"
      - "tools/experiments/lib/lgttci-compatibility-production.js"
      - "tools/experiments/lib/lgttci-compatibility-independent.js"
      - "tools/experiments/lib/lgtgmiv-stage1-production.js"
      - "tools/experiments/lib/lgtgmiv-stage1-independent.js"
      - "tools/experiments/lib/crclgr-production.js"
      - "tools/experiments/lib/crclgr-independent.js"
      - "tools/experiments/lib/silgm-production.js"
      - "tools/experiments/lib/silgm-independent.js"
      - "tools/experiments/lib/search-reliability-decision-robustness.js"
      - "doc/local-game-tree-geometry-transfer-compatibility-instrument/**"
      - "tools/takasia/run-historical-ci.cjs"
      - ".github/workflows/lgttci-stage0-technical.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage0-technical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check Stage 0 sources
        run: |
          node --check tools/experiments/lib/lgttci-compatibility-production.js
          node --check tools/experiments/lib/lgttci-compatibility-independent.js
          node --check tools/experiments/run-lgttci-stage0-technical.js

      - name: Run technical-only Stage 0
        run: node tools/takasia/run-historical-ci.cjs lgttci

      - name: Upload Stage 0 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lgttci-stage0-result
          path: artifacts/local/takasia-history/lgttci/
          if-no-files-found: error
          retention-days: 30
