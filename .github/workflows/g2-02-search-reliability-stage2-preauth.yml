name: G2-02 Stage 2 preauthorization technical checks

on:
  push:
    branches:
      - research/g2-02-search-reliability-decision-robustness
    paths:
      - doc/search-reliability-decision-robustness/preregistration/STAGE_2_FORMAL_SPEC.json
      - tools/experiments/run-search-reliability-stage2-formal.js
      - tools/experiments/verify-search-reliability-stage2-independent.js
      - tools/experiments/analyze-search-reliability-stage2-formal.js
      - .github/workflows/g2-02-search-reliability-stage2-preauth.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  technical-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Assert Stage 2 science firewall remains closed
        run: |
          test ! -f doc/search-reliability-decision-robustness/preregistration/STAGE_2_FORMAL_AUTHORIZATION.json
          node - <<'NODE'
          const s = require('./doc/search-reliability-decision-robustness/preregistration/STAGE_2_FORMAL_SPEC.json');
          if (s.stage2GenerationAuthorized !== false) process.exit(1);
          if (s.population.games !== 1536 || s.population.seedStart !== 25021001 || s.population.seedEnd !== 25022536) process.exit(1);
          if (s.primaryFormalCriterion.criteria.length !== 3) process.exit(1);
          console.log('stage2GenerationAuthorized=false');
          console.log('reservedStage2ScientificSeedConsumed=false');
          NODE

      - name: Syntax check Stage 2 path
        run: |
          node --check tools/experiments/run-search-reliability-stage2-formal.js
          node --check tools/experiments/verify-search-reliability-stage2-independent.js
          node --check tools/experiments/analyze-search-reliability-stage2-formal.js

      - name: Download immutable corrected Stage 1 firewall artifact
        uses: actions/download-artifact@v4
        with:
          name: g2-02-stage1-development-v1-verified-canonical
          path: artifacts/reference/g2-02-stage1-development-v1-verified-canonical
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: nkkmd/bao-la-kiswahili-game
          run-id: 33123555267

      - name: Validate Stage 1 firewall provenance only
        run: |
          node - <<'NODE'
          const fs = require('fs'); const path = require('path'); const crypto = require('crypto');
          const s = require('./doc/search-reliability-decision-robustness/preregistration/STAGE_2_FORMAL_SPEC.json');
          const dir = 'artifacts/reference/g2-02-stage1-development-v1-verified-canonical';
          for (const [name, expected] of Object.entries(s.stage1DevelopmentProvenance.requiredFileSha256)) {
            const actual = crypto.createHash('sha256').update(fs.readFileSync(path.join(dir, name))).digest('hex');
            if (actual !== expected) throw new Error(`${name}: ${actual} != ${expected}`);
          }
          const result = require(`./${dir}/stage1-development-result.json`);
          const verification = require(`./${dir}/stage1-verification.json`);
          if (result.stage1Decision !== 'PROFILE-FROZEN-DEVELOPMENT' || verification.passed !== true || verification.canonicalMeasurementHashMatches !== true) process.exit(1);
          console.log('stage1FirewallProvenanceValid=true');
          NODE

      - name: Run technical-only Stage 2 measurement/hash smoke
        run: |
          node - <<'NODE'
          const E = require('./public/engine.js');
          const C = require('./tools/experiments/lib/search-reliability-stage1-common.js');
          const M = require('./tools/experiments/lib/search-reliability-stage1-measurement.js');
          const spec = require('./doc/search-reliability-decision-robustness/preregistration/STAGE_2_FORMAL_SPEC.json');
          const state = E.initialState();
          const row = { seed: 99004101, gameId: 'SRDR-S2-TECHNICAL-ONLY', historicalTrajectoryHash: 'technical-only', openingPrefixHash: 'technical-only', selectionRank: 'technical-only', ply: 0, phase: state.phase, rawStateKey: C.rawStateKey(state), legalMoveCount: E.moveVariants(state).length, state };
          const measured = M.measureState(row, spec);
          if (Object.keys(measured.conditions).length !== 8) process.exit(1);
          const core = JSON.parse(JSON.stringify(C.measurementCore([measured])));
          const h1 = C.sha256(C.stableStringify(core));
          const h2 = C.sha256(C.stableStringify(JSON.parse(JSON.stringify(core))));
          if (h1 !== h2) throw new Error('Stage 2 canonical measurement hash is not JSON-stable');
          console.log(JSON.stringify({ technicalOnly: true, reservedStage2ScientificSeedConsumed: false, canonicalHashStable: true, hash: h1 }, null, 2));
          NODE
