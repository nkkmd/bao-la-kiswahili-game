name: BECT Stage 1 Source Validation

on:
  push:
    branches:
      - research/g3-05-branch-expansion-compression-transition
    paths:
      - doc/branch-expansion-compression-transition/authorizations/STAGE1_SOURCE_VALIDATION_TRIGGER

permissions:
  contents: read

concurrency:
  group: bect-stage1-source-validation-v1
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Validate exact scientific source bindings before authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object public/engine.js)" = "2f7885fa1ae38ddef5f14bbe2fecd4ca4fb84c7c"
          test "$(git hash-object tools/experiments/lib/lgtgmiv-stage1-production.js)" = "a4664f01535d6abbf6f83821befbb2fafd55cde6"
          test "$(git hash-object tools/experiments/lib/lgtgmiv-stage1-independent.js)" = "0c7239ac7acf146e9aee63dae66194681b8631d6"
          test "$(git hash-object tools/experiments/lib/bect-production.js)" = "b8fa63e941b4da1fec0969155c09754eae151a56"
          test "$(git hash-object tools/experiments/lib/bect-independent.js)" = "bb085c648d2f4f3d7d44f206f04036e95f94980b"
          test "$(git hash-object tools/experiments/lib/bect-stage1-production.js)" = "32995ed7e666b7cff7a6bb43946a30cdc86a7668"
          test "$(git hash-object tools/experiments/lib/bect-stage1-independent.js)" = "fcc150bdfcfbb1727ea6e0fdd4f336d1ae36e1e6"
          test "$(git hash-object tools/experiments/run-bect-stage1-development.js)" = "127cb10ea23d18f0a32c2adc2d8c499de4c19b04"
          test "$(git hash-object .github/workflows/bect-stage1-development.yml)" = "dcb39d07420ad81db9e10d0ba08a10a9a3cb7cb7"
          test "$(git hash-object doc/branch-expansion-compression-transition/prereg/STUDY_1_SPEC.json)" = "c9d938631d256a239c5e21a82e9869143aa1d0fb"
          test "$(git hash-object doc/branch-expansion-compression-transition/prereg/STUDY_1_SPEC_CLARIFICATION_1.json)" = "90869977c1977bbc10f4834228ee69b9151ce250"
          test "$(git hash-object doc/branch-expansion-compression-transition/prereg/STUDY_1_SPEC_CLARIFICATION_2.json)" = "87e78b008024301a26f78d1ac488d8489f9bd02b"
          test "$(git hash-object doc/branch-expansion-compression-transition/prereg/UPSTREAM_IDENTITY_FIREWALL.json)" = "123430eb0cbe100bf50e068ee4c4ee7dc52c2ca8"
          test "$(git hash-object doc/branch-expansion-compression-transition/results/stage-0-v2/STAGE_0_TECHNICAL_RESULT.json)" = "1f3f74e437753741950329517dc574b0b27d7429"
      - name: Validate preauthorization state without fresh seed access
        shell: bash
        run: |
          set -euo pipefail
          test ! -e doc/branch-expansion-compression-transition/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION.json
          test ! -e doc/branch-expansion-compression-transition/authorizations/STAGE1_EXECUTION_TRIGGER
          test ! -e doc/branch-expansion-compression-transition/executions/stage-1-execution-started.json
          test ! -e doc/branch-expansion-compression-transition/results/stage-1/scientific-result.json
          node - <<'NODE'
          const spec=require('./doc/branch-expansion-compression-transition/prereg/STUDY_1_SPEC.json');
          const fw=require('./doc/branch-expansion-compression-transition/prereg/UPSTREAM_IDENTITY_FIREWALL.json');
          const s0=require('./doc/branch-expansion-compression-transition/results/stage-0-v2/STAGE_0_TECHNICAL_RESULT.json');
          if(spec.stages[1].seedStart!==31510001||spec.stages[1].seedEnd!==31510240)throw Error('Stage 1 seed changed');
          if(spec.executionIntegrity.maxAuthorizedScientificExecutionsPerFreshStage!==1)throw Error('execution count changed');
          if(fw.identityCoreSha256!=='5b8246baf0f0b13fdfbc40b55bf3298895e7f0da660ca6b1275880361c4b7417')throw Error('firewall core changed');
          if(fw.scientificOutcomeFieldsRetained!==false||fw.g303DiagnosticScientificFieldsRetained!==false||fw.g304ScientificOutcomeFieldsRetained!==false)throw Error('outcome firewall violated');
          if(s0.stageDisposition!=='STAGE0-PASS')throw Error('Stage 0 not passed');
          if(spec.protectedDepth10Holdout.status!=='SEALED / NOT GENERATED / NOT READ')throw Error('protected holdout changed');
          console.log('BECT_STAGE1_SOURCE_VALIDATION=PASS');
          NODE
          printf '%s\n' \
            'scientific_workflow_execution=false' \
            'stage1_seed_access=false' \
            'stage2_seed_access=false' \
            'protected_depth10_access=false'
