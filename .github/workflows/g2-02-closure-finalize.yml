name: G2-02 closure finalization

on:
  push:
    branches:
      - research/g2-02-search-reliability-decision-robustness
    paths:
      - .github/workflows/g2-02-closure-finalize.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    if: github.ref == 'refs/heads/research/g2-02-search-reliability-decision-robustness'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Download immutable Stage 2 formal artifact
        uses: actions/download-artifact@v4
        with:
          name: g2-02-stage2-formal-v1
          path: artifacts/reference/g2-02-stage2-formal-v1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: nkkmd/bao-la-kiswahili-game
          run-id: 33124538584

      - name: Materialize canonical results and closure docs
        run: |
          python3 tools/experiments/finalize-g2-02-stage2-closure.py \
            --artifact artifacts/reference/g2-02-stage2-formal-v1

      - name: Run G2-02 and agenda consistency tests
        run: |
          node test/search-reliability-decision-robustness-stage0.test.js
          node test/second-generation-research-agenda.test.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('doc/search-reliability-decision-robustness/results/STAGE_2_FORMAL_RESULT.json')
          r = json.loads(p.read_text())
          assert r['formalDecision'] == 'INCONCLUSIVE'
          assert r['primaryFormalCriterion'] is None
          assert r['gates']['checks']['uniqueHistoricalTrajectoriesAfterStage1Firewall']['observed'] == 1040
          assert r['gates']['checks']['uniqueHistoricalTrajectoriesAfterStage1Firewall']['threshold'] == 1050
          print('closure-consistency=true')
          PY

      - name: Assert no large scientific raw artifacts are staged for repository closure
        run: |
          test ! -f doc/search-reliability-decision-robustness/results/STAGE_2_MEASUREMENTS.json
          test ! -f doc/search-reliability-decision-robustness/results/STAGE_2_SELECTED_STATES.json

      - name: Commit closure snapshot
        run: |
          git config user.name Sawa
          git config user.email 72678394+nkkmd@users.noreply.github.com
          git add README.md doc tools/experiments/finalize-g2-02-stage2-closure.py
          if git diff --cached --quiet; then
            echo 'No closure changes to commit'
          else
            git commit -m 'research(g2-02): close SRDR-STUDY1 as inconclusive'
            git push origin HEAD:research/g2-02-search-reliability-decision-robustness
          fi
