name: SILGM Stage 0 Technical v2
on:
  push:
    branches:
      - research/g3-07-search-instability-local-geometry-mechanism
    paths:
      - doc/search-instability-local-geometry-mechanism/authorizations/silgm-stage0-v2-trigger.txt
concurrency:
  group: silgm-stage0-technical-v2
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  stage0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Syntax-check frozen Stage 0 v2 tooling
        run: |
          node --check tools/experiments/run-silgm-stage0-technical-v2.js
          node --check tools/experiments/verify-silgm-stage0-v2-authorization.js
          node --check tools/experiments/lib/silgm-production.js
          node --check tools/experiments/lib/silgm-independent.js
      - name: Verify exact Stage 0 v2 authorization and source binding
        run: node tools/experiments/verify-silgm-stage0-v2-authorization.js
      - name: Verify v2 materialization without computation
        run: node tools/experiments/run-silgm-stage0-technical-v2.js --verify-only
      - name: Materialize durable pre-computation lease
        run: |
          mkdir -p artifacts/lease-v2
          printf '%s\n' "SILGM-S0-TECHNICAL-2026-09-03-v2" > artifacts/lease-v2/stage.txt
          git rev-parse HEAD > artifacts/lease-v2/trigger-head.txt
          git rev-parse HEAD^ > artifacts/lease-v2/tooling-parent.txt
          sha256sum doc/search-instability-local-geometry-mechanism/authorizations/STAGE_0_TECHNICAL_AUTHORIZATION_V2.json > artifacts/lease-v2/authorization.sha256
      - name: Upload v2 lease before computation
        uses: actions/upload-artifact@v4
        with:
          name: silgm-stage0-v2-lease-${{ github.run_id }}
          path: artifacts/lease-v2
          if-no-files-found: error
      - name: Execute exactly one authorized technical Stage 0 v2 computation
        run: |
          mkdir -p artifacts/local/search-instability-local-geometry-mechanism/stage0-v2
          node tools/experiments/run-silgm-stage0-technical-v2.js --output artifacts/local/search-instability-local-geometry-mechanism/stage0-v2/STAGE_0_TECHNICAL_RESULT.json
      - name: Upload Stage 0 v2 result before repository mirror
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silgm-stage0-v2-result-${{ github.run_id }}
          path: artifacts/local/search-instability-local-geometry-mechanism/stage0-v2/STAGE_0_TECHNICAL_RESULT.json
          if-no-files-found: error
