name: PCEM Stage 0 technical validation

on:
  pull_request:
    paths:
      - "public/engine.js"
      - "public/ai.js"
      - "tools/experiments/run-pcem-stage0-technical.js"
      - "tools/experiments/verify-pcem-stage0-independent.js"
      - "tools/experiments/lib/practical-comeback-stage0-production.js"
      - "tools/experiments/lib/ssgtc-representation-*.js"
      - "test/practical-comeback-stage0-tooling.test.js"
      - "doc/practical-comeback-error-inducing-moves/**"
      - ".github/workflows/pcem-stage0-technical.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage0-technical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Stage 0 primitive tests
        run: node test/practical-comeback-stage0-tooling.test.js

      - name: Run production technical pilot
        run: node tools/experiments/run-pcem-stage0-technical.js --out "${{ runner.temp }}/pcem-stage0-technical-v1"

      - name: Run independent verification
        run: node tools/experiments/verify-pcem-stage0-independent.js --input "${{ runner.temp }}/pcem-stage0-technical-v1/production.json" --output "${{ runner.temp }}/pcem-stage0-technical-v1/independent-verification.json"

      - name: Upload technical artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcem-stage0-technical-v1
          path: ${{ runner.temp }}/pcem-stage0-technical-v1
          if-no-files-found: warn
