name: PCEM Stage 0 technical validation (closed)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pcem-stage0-technical.yml'
      - 'doc/practical-comeback-error-inducing-moves/results/STAGE_0_TECHNICAL_RESULT.json'
      - 'test/practical-comeback-closure-consistency.test.js'

permissions:
  contents: read

jobs:
  closure-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify canonical Stage 0 is closed
        run: |
          node - <<'NODE'
          const r = require('./doc/practical-comeback-error-inducing-moves/results/STAGE_0_TECHNICAL_RESULT.json');
          if (r.stageId !== 'PCEM-S0-TECHNICAL-2026-08-25-v1') throw new Error('unexpected Stage 0 id');
          if (r.decision !== 'TECHNICAL-PASS') throw new Error('unexpected Stage 0 decision');
          if (r.canonicalWorkflow.runId !== 32813154014) throw new Error('unexpected Stage 0 canonical run');
          if (r.canonicalWorkflow.artifactId !== 9550497573) throw new Error('unexpected Stage 0 artifact');
          if (r.independentVerification.decision !== 'TECHNICAL-PASS' || !r.independentVerification.passed) throw new Error('independent Stage 0 verification not frozen PASS');
          console.log('PCEM Stage 0 is canonically closed; technical pilot regeneration is disabled.');
          NODE
