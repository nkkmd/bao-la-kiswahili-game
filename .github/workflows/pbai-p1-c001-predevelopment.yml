name: PBAI-P1 C001 contract freeze

on:
  pull_request:
    branches: [main]
    paths:
      - 'doc/ai-engineering/public-ai-improvement-program-1/README.md'
      - 'doc/ai-engineering/public-ai-improvement-program-1/CURRENT_STATUS.md'
      - 'doc/ai-engineering/public-ai-improvement-program-1/CANDIDATE_REGISTER.md'
      - 'doc/ai-engineering/public-ai-improvement-program-1/DECISION_REGISTER.md'
      - 'doc/ai-engineering/public-ai-improvement-program-1/candidates/PBAI-C001-v1*.json'
      - 'doc/engineering-program-decisions/2026-08-26-pbai-c001-v1-development-authorization.md'
      - 'tools/engineering/materialize-pbai-c001-predevelopment-support.js'
      - 'tools/engineering/validate-pbai-c001-predevelopment-support-spec.js'
      - 'tools/engineering/validate-pbai-c001-contract.js'
      - 'test/public-ai-improvement-program1-contract.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify contract change contains no public implementation
        run: |
          changed="$(git diff --name-only origin/main...HEAD -- public/)"
          test -z "$changed" || {
            echo 'PBAI-C001-v1 contract freeze must not modify public/.' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
      - name: Verify frozen AI-GEN2 source hashes
        run: |
          test "$(sha256sum public/engine.js | awk '{print $1}')" = "e6acf1fe4d97db67dbcfadc3a785e802342ae0b0cbaec35f53eb8e77424cfc1c"
          test "$(sha256sum public/ai.js | awk '{print $1}')" = "2823dbcf96c7a47489301ecd768a63975aa8b4e12b62cc4629fc8283ef5dff9e"
      - name: Validate global gates and frozen C001 contracts
        run: |
          node tools/engineering/validate-pbai-p1-gate-spec.js
          node tools/engineering/validate-pbai-c001-predevelopment-support-spec.js
          node tools/engineering/validate-pbai-c001-contract.js
      - name: Verify current PBAI-P1 program contract
        run: node test/public-ai-improvement-program1-contract.test.js
      - name: Validation and holdout execution firewall
        run: |
          ! grep -R --line-number -E '3140[0-9]{4}|3150[0-9]{4}' \
            tools/engineering/materialize-pbai-c001-predevelopment-support.js || {
              echo 'C001 support runner must not reference validation/holdout seed values.' >&2
              exit 1
            }
      - name: Reproduce committed baseline-only support result
        run: |
          mkdir -p artifacts/pbai-p1/c001
          node tools/engineering/materialize-pbai-c001-predevelopment-support.js \
            --output artifacts/pbai-p1/c001/predevelopment-support.json >/dev/null
          node - <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const actual = JSON.parse(fs.readFileSync('artifacts/pbai-p1/c001/predevelopment-support.json', 'utf8'));
          const frozen = JSON.parse(fs.readFileSync('doc/ai-engineering/public-ai-improvement-program-1/candidates/PBAI-C001-v1-predevelopment-support-result.json', 'utf8'));
          const contract = JSON.parse(fs.readFileSync('doc/ai-engineering/public-ai-improvement-program-1/candidates/PBAI-C001-v1.json', 'utf8'));
          const sha = (value) => crypto.createHash('sha256').update(JSON.stringify(value)).digest('hex');
          const fail = (message) => { throw new Error(message); };
          if (actual.candidateImplementationObserved !== false) fail('candidate implementation observed');
          if (actual.candidateCodeUsed !== false) fail('candidate code used');
          if (actual.candidateBenefitMetricsObserved !== false) fail('candidate benefit metrics observed');
          if (actual.validationSeedsAccessed !== false) fail('validation seeds accessed');
          if (actual.releaseHoldoutSeedsAccessed !== false) fail('release holdout seeds accessed');
          if (actual.publicCodeChanged !== false) fail('public code changed');
          if (actual.population.digest !== frozen.developmentPopulation.populationDigest) fail('population digest mismatch');
          if (actual.targetSupport.eligible !== frozen.targetSupport.eligible) fail('eligible target count mismatch');
          if (actual.targetSupport.selected !== frozen.targetSupport.selected) fail('selected target count mismatch');
          if (actual.targetSupport.supportPass !== true) fail('support must remain PASS');
          if (sha(actual.selectedTargetRefs) !== frozen.targetSupport.selectedRefsSha256) fail('target selection digest mismatch');
          if (sha(actual.controls.mtaji.refs) !== frozen.controls.mtaji.selectedRefsSha256) fail('Mtaji control digest mismatch');
          if (sha(actual.controls.namuaNonForced.refs) !== frozen.controls.namuaNonForced.selectedRefsSha256) fail('Namua non-forced control digest mismatch');
          if (contract.predevelopmentSupport.selectedTargetRefsSha256 !== frozen.targetSupport.selectedRefsSha256) fail('contract target binding mismatch');
          console.log(JSON.stringify({
            populationDigest: actual.population.digest,
            eligibleTargets: actual.targetSupport.eligible,
            selectedTargets: actual.targetSupport.selected,
            minimumEstimable: actual.targetSupport.minimumEstimable,
            supportPass: actual.targetSupport.supportPass,
            targetRefsSha256: sha(actual.selectedTargetRefs),
            mtajiControls: actual.controls.mtaji.selected,
            namuaNonForcedControls: actual.controls.namuaNonForced.selected,
            decision: actual.decision,
          }, null, 2));
          NODE
      - name: Verify closed candidates remain closed and holdout remains blocked
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const c001 = JSON.parse(fs.readFileSync('doc/ai-engineering/public-ai-improvement-program-1/candidates/PBAI-C001-v1.json', 'utf8'));
          const c002 = JSON.parse(fs.readFileSync('doc/ai-engineering/public-ai-improvement-program-1/candidates/PBAI-C002-v1-development-result.json', 'utf8'));
          const c004 = JSON.parse(fs.readFileSync('doc/ai-engineering/public-ai-improvement-program-1/candidates/PBAI-C004-v1-development-result.json', 'utf8'));
          if (c002.finalDevelopmentStatus !== 'NON-ESTIMABLE-HOLD') throw new Error('C002 HOLD changed');
          if (c002.decision.developmentAuthorizationContinues !== false) throw new Error('C002 authorization revived');
          if (c004.finalDevelopmentStatus !== 'DEVELOPMENT-FAIL-HOLD') throw new Error('C004 HOLD changed');
          if (c004.decision.developmentAuthorizationContinues !== false) throw new Error('C004 authorization revived');
          if (c001.validationAndHoldoutFirewall.validationExecutionAuthorizedNow !== false) throw new Error('validation authorization leaked');
          if (c001.validationAndHoldoutFirewall.releaseHoldoutExecutionAuthorizedNow !== false) throw new Error('holdout authorization leaked');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: pbai-c001-contract-support-reproduction
          path: artifacts/pbai-p1/c001/predevelopment-support.json
          if-no-files-found: error
