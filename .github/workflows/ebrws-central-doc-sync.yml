name: EBRWS central document sync

on:
  push:
    branches:
      - research/g3-02-effective-branching-reply-width-structure
    paths:
      - ".github/workflows/ebrws-central-doc-sync.yml"
      - "tools/experiments/materialize-ebrws-start-central-docs.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/g3-02-effective-branching-reply-width-structure
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Materialize current-facing central documents
        run: node tools/experiments/materialize-ebrws-start-central-docs.js

      - name: Commit central document sync
        shell: bash
        run: |
          git config user.name "Sawa"
          git config user.email "72678394+nkkmd@users.noreply.github.com"
          git add README.md doc/FUTURE_RESEARCH_AGENDA.md doc/RESEARCH_INDEX.md
          if git diff --cached --quiet; then
            echo "No central document change"
          else
            git commit -m "Sync central docs for EBRWS Study start"
            git push origin HEAD:research/g3-02-effective-branching-reply-width-structure
          fi
