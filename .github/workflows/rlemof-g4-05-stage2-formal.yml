name: RLEMOF G4-05 Stage 2 Formal

on:
  push:
    branches:
      - research/g4-05-exact-microdomain-oracle-foundation
    paths:
      - 'doc/reachable-late-game-exact-microdomain-oracle-foundation/authorizations/STAGE_2_AUTHORIZATION.json'

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Record execution identity
        run: |
          mkdir -p artifacts/local/rlemof-stage2-formal
          {
            echo "GITHUB_SHA=${GITHUB_SHA}"
            echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
            echo "GITHUB_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME}"
            node --version
          } | tee artifacts/local/rlemof-stage2-formal/execution-identity.txt
      - name: Production fresh formal exact microdomains
        run: node tools/experiments/run-rlemof-stage2-formal.js artifacts/local/rlemof-stage2-formal/production-result.json
      - name: Independent full regeneration and exact verification
        run: node tools/experiments/verify-rlemof-stage2-formal-independent.js artifacts/local/rlemof-stage2-formal/production-result.json artifacts/local/rlemof-stage2-formal/independent-verification.json
      - name: Build artifact manifest
        if: always()
        run: |
          cd artifacts/local/rlemof-stage2-formal
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true
      - name: Upload Stage 2 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rlemof-g4-05-stage2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/local/rlemof-stage2-formal/
          if-no-files-found: error
          retention-days: 30
