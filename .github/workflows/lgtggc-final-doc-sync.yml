name: LGTGGC Final Central Documentation Sync
on:
  push:
    branches:
      - research/g3-12-local-game-tree-geometry-generalization-counterexample
    paths:
      - doc/local-game-tree-geometry-generalization-counterexample/authorizations/lgtggc-final-doc-sync-trigger.txt
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic central documentation sync
        run: python3 tools/experiments/sync-lgtggc-final-central-docs.py
      - name: Verify intended diff set
        run: |
          python3 - <<'PY'
          import subprocess
          allowed={
            'README.md',
            'doc/RESEARCH_INDEX.md',
            'doc/FUTURE_RESEARCH_AGENDA.md',
            'doc/research-generation-3/README.md',
            'doc/research-generation-3/CURRENT_STATUS.md',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected changed set: {sorted(changed)}')
          if 'doc/research-generation-3/PROGRAM_PLAN.md' in changed:
              raise SystemExit('historical PROGRAM_PLAN changed')
          print('intended central-doc diff set exact')
          PY
      - name: Commit central documentation sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md doc/research-generation-3/README.md doc/research-generation-3/CURRENT_STATUS.md
          git commit -m 'Sync G3-12 technical-invalid closure across current docs'
          git push origin HEAD:research/g3-12-local-game-tree-geometry-generalization-counterexample
