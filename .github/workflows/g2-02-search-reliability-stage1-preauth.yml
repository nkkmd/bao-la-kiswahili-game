name: G2-02 Stage 1 preauthorization technical checks

on:
  push:
    branches:
      - research/g2-02-search-reliability-decision-robustness
    paths:
      - 'doc/search-reliability-decision-robustness/preregistration/STAGE_1_DEVELOPMENT_SPEC.json'
      - 'tools/experiments/lib/search-reliability-stage1-common.js'
      - 'tools/experiments/lib/search-reliability-stage1-measurement.js'
      - 'tools/experiments/run-search-reliability-stage1.js'
      - 'tools/experiments/verify-search-reliability-stage1-independent.js'
      - 'tools/experiments/analyze-search-reliability-stage1.js'
      - 'tools/experiments/run-search-reliability-stage1-preauth-smoke.js'
      - 'test/search-reliability-stage1-contract.test.js'
      - '.github/workflows/g2-02-search-reliability-stage1-preauth.yml'
      - '.github/workflows/g2-02-search-reliability-stage1-source-freeze.yml'
      - '.github/workflows/g2-02-search-reliability-stage1-development.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  technical-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Stage 1 scientific path
        run: |
          node --check tools/experiments/lib/search-reliability-stage1-common.js
          node --check tools/experiments/lib/search-reliability-stage1-measurement.js
          node --check tools/experiments/run-search-reliability-stage1.js
          node --check tools/experiments/verify-search-reliability-stage1-independent.js
          node --check tools/experiments/analyze-search-reliability-stage1.js
      - name: Validate prospective Stage 1 contract
        run: node test/search-reliability-stage1-contract.test.js
      - name: Run technical-only measurement smoke
        run: node tools/experiments/run-search-reliability-stage1-preauth-smoke.js
      - name: Assert scientific firewall remains closed
        run: |
          test ! -f doc/search-reliability-decision-robustness/preregistration/STAGE_1_DEVELOPMENT_AUTHORIZATION.json
          echo 'scientificInferenceAuthorized=false'
          echo 'scientificOutcomeGenerationAuthorized=false'
          echo 'scientificSeedConsumed=false'
