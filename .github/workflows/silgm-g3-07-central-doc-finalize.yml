name: SILGM G3-07 Central Documentation Finalize

on:
  push:
    branches:
      - research/g3-07-search-instability-local-geometry-mechanism
    paths:
      - doc/search-instability-local-geometry-mechanism/triggers/CENTRAL_DOC_FINALIZE.txt

permissions:
  contents: write

concurrency:
  group: silgm-g3-07-central-doc-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: research/g3-07-search-instability-local-geometry-mechanism

      - name: Verify trigger branch and immutable historical program plan
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "research/g3-07-search-instability-local-geometry-mechanism"
          test "$(git hash-object doc/research-generation-3/PROGRAM_PLAN.md)" = "2bb90c11f1625f63f40a7eab8a3de7774505a1ac"
          node --check tools/experiments/finalize-silgm-g3-07-central-docs.js

      - name: Finalize current-facing documentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/local/search-instability-local-geometry-mechanism/central-doc-finalize
          node tools/experiments/finalize-silgm-g3-07-central-docs.js | tee artifacts/local/search-instability-local-geometry-mechanism/central-doc-finalize/result.json
          node tools/experiments/finalize-silgm-g3-07-central-docs.js --verify-only

      - name: Enforce documentation-only diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -gt 0
          for f in "${changed[@]}"; do
            case "$f" in
              README.md|doc/RESEARCH_INDEX.md|doc/FUTURE_RESEARCH_AGENDA.md|doc/research-generation-3/README.md|doc/research-generation-3/CURRENT_STATUS.md) ;;
              *) echo "Unexpected changed path: $f" >&2; exit 1 ;;
            esac
          done
          test "$(git hash-object doc/research-generation-3/PROGRAM_PLAN.md)" = "2bb90c11f1625f63f40a7eab8a3de7774505a1ac"

      - name: Upload finalizer verification before commit
        uses: actions/upload-artifact@v4
        with:
          name: silgm-g3-07-central-doc-finalize-${{ github.run_id }}
          path: artifacts/local/search-instability-local-geometry-mechanism/central-doc-finalize/result.json
          if-no-files-found: error
          overwrite: false

      - name: Commit current-facing documentation on research branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sawa"
          git config user.email "72678394+nkkmd@users.noreply.github.com"
          git add README.md doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md doc/research-generation-3/README.md doc/research-generation-3/CURRENT_STATUS.md
          git commit -m "Synchronize current-facing docs after SILGM formal closure"
          git push origin HEAD:research/g3-07-search-instability-local-geometry-mechanism
