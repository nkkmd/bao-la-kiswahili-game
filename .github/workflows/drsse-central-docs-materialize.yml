name: DRSSE Central Docs Materialize

on:
  push:
    branches:
      - research/g2-05-deep-raw-state-space-enumeration
    paths:
      - doc/deep-raw-state-space-enumeration/checkpoints/2026-08-28-stage2-formal-acceptance.md

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize bounded central-document updates
        run: python3 tools/experiments/materialize-g2-05-central-docs.py
      - name: Validate agenda and whitespace
        run: |
          node test/second-generation-research-agenda.test.js
          git diff --check
          grep -F 'G2-05` / `DRSSE-STUDY1`' README.md
          grep -F '### 21. Deep RAW State-Space Enumeration — Study 1' doc/RESEARCH_INDEX.md
          grep -F '**状態:** **完了 / `DRSSE-STUDY1` / formal decision `EXACT-WITHIN-FROZEN-DEPTH-9-DOMAIN`**' doc/FUTURE_RESEARCH_AGENDA.md
          grep -F 'G2-05 Deep RAW State-Space Enumeration Study 1 closure' doc/research-program-decisions/2026-08-26-second-generation-pure-research-agenda.md
      - name: Commit central-document materialization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md doc/research-program-decisions/2026-08-26-second-generation-pure-research-agenda.md
          if git diff --cached --quiet; then
            echo 'No central documentation changes to commit.'
            exit 1
          fi
          git commit -m 'docs(g2-05): integrate completed study into central research indexes'
          git push origin HEAD:research/g2-05-deep-raw-state-space-enumeration
