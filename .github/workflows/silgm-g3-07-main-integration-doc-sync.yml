name: SILGM G3-07 Main Integration Documentation Sync

on:
  push:
    branches:
      - integration/g3-07-main-doc-sync
    paths:
      - doc/search-instability-local-geometry-mechanism/triggers/MAIN_INTEGRATION_DOC_SYNC.txt

permissions:
  contents: write

concurrency:
  group: silgm-g3-07-main-integration-doc-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 100
          ref: integration/g3-07-main-doc-sync

      - name: Verify integration ancestry and immutable program plan
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "integration/g3-07-main-doc-sync"
          git merge-base --is-ancestor 7f14538aa0ec3edd2045649025715219ffea17ec HEAD
          test "$(git hash-object doc/research-generation-3/PROGRAM_PLAN.md)" = "2bb90c11f1625f63f40a7eab8a3de7774505a1ac"
          python -m py_compile tools/experiments/finalize-silgm-g3-07-main-integration.py

      - name: Synchronize post-integration current-facing documentation
        shell: bash
        run: |
          set -euo pipefail
          python tools/experiments/finalize-silgm-g3-07-main-integration.py | tee /tmp/silgm-g3-07-main-integration-doc-sync.json
          test "$(git hash-object doc/research-generation-3/PROGRAM_PLAN.md)" = "2bb90c11f1625f63f40a7eab8a3de7774505a1ac"

      - name: Enforce documentation-only diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 8
          for f in "${changed[@]}"; do
            case "$f" in
              README.md|doc/RESEARCH_INDEX.md|doc/FUTURE_RESEARCH_AGENDA.md|doc/research-generation-3/README.md|doc/research-generation-3/CURRENT_STATUS.md|doc/search-instability-local-geometry-mechanism/README.md|doc/search-instability-local-geometry-mechanism/CURRENT_STATUS.md|doc/search-instability-local-geometry-mechanism/REPRODUCIBILITY_INDEX.md) ;;
              *) echo "Unexpected changed path: $f" >&2; exit 1 ;;
            esac
          done
          test -f doc/research-generation-3/checkpoints/2026-09-03-g3-07-main-integration-complete.md
          test "$(git status --porcelain --untracked-files=all | grep -c '^?? doc/research-generation-3/checkpoints/2026-09-03-g3-07-main-integration-complete.md$')" -eq 1

      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sawa"
          git config user.email "72678394+nkkmd@users.noreply.github.com"
          git add README.md doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md doc/research-generation-3/README.md doc/research-generation-3/CURRENT_STATUS.md doc/research-generation-3/checkpoints/2026-09-03-g3-07-main-integration-complete.md doc/search-instability-local-geometry-mechanism/README.md doc/search-instability-local-geometry-mechanism/CURRENT_STATUS.md doc/search-instability-local-geometry-mechanism/REPRODUCIBILITY_INDEX.md
          git commit -m "Record G3-07 main integration completion"
          git push origin HEAD:integration/g3-07-main-doc-sync
