name: SSGTGE Stage 0 Technical

# Technical-only validation. This workflow may not generate depth-10/depth-11 scientific outcomes
# and may not evaluate estimator candidates on the real G2-05 development series.
on:
  push:
    branches:
      - research/g2-12-state-space-game-tree-growth-estimation
    paths:
      - 'doc/state-space-game-tree-growth-estimation/authorizations/STAGE_0_TECHNICAL_EXECUTE.json'

permissions:
  contents: read

jobs:
  technical-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Environment and source integrity
        run: |
          node --version
          git rev-parse HEAD
          git rev-parse HEAD^
          git status --short
          node --check tools/experiments/lib/ssgtge-production.js
          node --check tools/experiments/lib/ssgtge-independent.js
          node --check tools/experiments/run-ssgtge-stage0-technical.js
          node --check tools/experiments/verify-ssgtge-stage0-independent.js

      - name: Run production technical validation
        run: |
          mkdir -p artifacts/local/state-space-game-tree-growth-estimation/stage0-technical-v1
          /usr/bin/time -v node tools/experiments/run-ssgtge-stage0-technical.js \
            artifacts/local/state-space-game-tree-growth-estimation/stage0-technical-v1 \
            2>&1 | tee artifacts-ssgtge-stage0-production.log

      - name: Run structurally independent technical verification
        run: |
          /usr/bin/time -v node tools/experiments/verify-ssgtge-stage0-independent.js \
            artifacts/local/state-space-game-tree-growth-estimation/stage0-technical-v1 \
            2>&1 | tee artifacts-ssgtge-stage0-independent.log

      - name: Preserve technical-only artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssgtge-stage0-technical-${{ github.sha }}
          path: |
            artifacts/local/state-space-game-tree-growth-estimation/stage0-technical-v1/**
            artifacts-ssgtge-stage0-production.log
            artifacts-ssgtge-stage0-independent.log
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
