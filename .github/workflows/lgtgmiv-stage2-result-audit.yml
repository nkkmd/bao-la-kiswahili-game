name: LGTGMIV Stage 2 Read-Only Result Audit

on:
  push:
    branches:
      - research/pre-g3-02-local-game-tree-geometry-measurement-instrument-verification
    paths:
      - .github/workflows/lgtgmiv-stage2-result-audit.yml
      - tools/experiments/audit-lgtgmiv-stage2-result.js

permissions:
  contents: write

concurrency:
  group: lgtgmiv-stage2-readonly-result-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify audit is read-only with respect to scientific evidence generation
        run: |
          ! grep -q 'public/engine' tools/experiments/audit-lgtgmiv-stage2-result.js
          ! grep -q 'moveVariants' tools/experiments/audit-lgtgmiv-stage2-result.js
          ! grep -q 'applyMove' tools/experiments/audit-lgtgmiv-stage2-result.js
      - name: Audit committed Stage 2 result only
        run: node tools/experiments/audit-lgtgmiv-stage2-result.js
      - name: Commit audit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/local-game-tree-geometry-measurement-instrument-verification/results/stage-2/posthoc-audit-summary.json
          git commit -m "Record LGTGMIV Stage 2 read-only audit"
          git push
