name: TCTGD Stage 1 Technical Refreeze V2

on:
  push:
    branches:
      - research/g3-03-transposition-tree-graph-divergence
    paths:
      - doc/transposition-concentration-tree-graph-divergence/authorizations/STAGE1_TECHNICAL_REFREEZE_V2_TRIGGER

permissions:
  contents: write

concurrency:
  group: tctgd-stage1-technical-refreeze-v2
  cancel-in-progress: false

jobs:
  refreeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Confirm pre-fresh technical correction boundary
        run: |
          set -euo pipefail
          test ! -f doc/transposition-concentration-tree-graph-divergence/results/stage-1/scientific-result.json
          test ! -f doc/transposition-concentration-tree-graph-divergence/executions/stage-1-execution-started.json
          test ! -f doc/transposition-concentration-tree-graph-divergence/authorizations/STAGE1_EXECUTION_TRIGGER
          test ! -f doc/transposition-concentration-tree-graph-divergence/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION.json
      - name: Materialize identity-only firewall and technical spec v2
        run: node tools/experiments/materialize-tctgd-technical-refreeze-v2.js
      - name: Commit technical refreeze artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/transposition-concentration-tree-graph-divergence/prereg/UPSTREAM_IDENTITY_FIREWALL_V2.json doc/transposition-concentration-tree-graph-divergence/prereg/STUDY_1_SPEC_V2.json
          git commit -m "Freeze TCTGD Stage 1 technical execution v2"
          git push origin HEAD:research/g3-03-transposition-tree-graph-divergence
      - name: Record non-scientific sentinel
        run: |
          printf '%s\n' 'TCTGD_TECHNICAL_REFREEZE_V2=PASS' 'fresh_scientific_evidence=false' 'stage1_seed_access=false' 'protected_depth10_access=false' > tctgd-technical-refreeze-v2.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tctgd-technical-refreeze-v2
          path: tctgd-technical-refreeze-v2.txt
          if-no-files-found: error
          retention-days: 90
