name: SILGM Stage 1 Development v1

on:
  push:
    branches:
      - research/g3-07-search-instability-local-geometry-mechanism
    paths:
      - doc/search-instability-local-geometry-mechanism/authorizations/silgm-stage1-development-v1-trigger.json

permissions:
  contents: read

concurrency:
  group: silgm-stage1-development-v1
  cancel-in-progress: false

jobs:
  scientific:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Syntax-check frozen Stage 1 tooling
        run: |
          node --check tools/experiments/lib/silgm-stage1-production.js
          node --check tools/experiments/lib/silgm-stage1-independent.js
          node --check tools/experiments/run-silgm-stage1-development.js
          node --check tools/experiments/verify-silgm-stage1-authorization.js

      - name: Verify exact Stage 1 authorization and source binding
        run: node tools/experiments/verify-silgm-stage1-authorization.js

      - name: Materialize durable pre-computation lease
        run: |
          mkdir -p artifacts/lease-stage1
          printf '%s\n' 'SILGM-S1-DEVELOPMENT-2026-09-03-v1' > artifacts/lease-stage1/stage.txt
          git rev-parse HEAD > artifacts/lease-stage1/trigger-head.txt
          git rev-parse HEAD^ > artifacts/lease-stage1/authorization-commit.txt
          git rev-parse HEAD^^ > artifacts/lease-stage1/tooling-commit.txt
          sha256sum doc/search-instability-local-geometry-mechanism/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION.json > artifacts/lease-stage1/authorization.sha256
          sha256sum doc/search-instability-local-geometry-mechanism/prereg/STAGE_1_DEVELOPMENT_SPEC.json > artifacts/lease-stage1/stage1-spec.sha256
          sha256sum doc/search-instability-local-geometry-mechanism/results/stage-1-preauthorization-v1/PREAUTH_AUDIT_RESULT.json > artifacts/lease-stage1/preauthorization.sha256

      - name: Upload Stage 1 lease before scientific computation
        uses: actions/upload-artifact@v4
        with:
          name: silgm-stage1-v1-lease-${{ github.run_id }}
          path: artifacts/lease-stage1
          if-no-files-found: error
          overwrite: false

      - name: Execute exactly one authorized fresh Stage 1 computation
        run: |
          mkdir -p artifacts/local/search-instability-local-geometry-mechanism/stage1-development-v1
          node tools/experiments/run-silgm-stage1-development.js \
            --output artifacts/local/search-instability-local-geometry-mechanism/stage1-development-v1

      - name: Upload Stage 1 scientific result before repository mirror
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silgm-stage1-v1-result-${{ github.run_id }}
          path: |
            artifacts/local/search-instability-local-geometry-mechanism/stage1-development-v1/scientific-result.json
            artifacts/local/search-instability-local-geometry-mechanism/stage1-development-v1/telemetry.json
            artifacts/local/search-instability-local-geometry-mechanism/stage1-development-v1/execution-summary.json
          if-no-files-found: error
          overwrite: false
