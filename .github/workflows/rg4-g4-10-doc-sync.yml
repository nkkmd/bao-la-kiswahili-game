name: RG4 G4-10 one-shot document sync

on:
  push:
    branches:
      - research/g4-10-fresh-depth11-exact-reachability-topology
    paths:
      - .github/workflows/rg4-g4-10-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Synchronize current-facing long documents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one old occurrence, got {count}")
              return text.replace(old, new, 1)

          idx = Path('doc/RESEARCH_INDEX.md')
          text = idx.read_text()
          text = replace_once(
              text,
              '現在の状態: **Research Generation 2・3は完了済み。Research Generation 4はG4-01〜G4-09 main統合済み。G4-10は保護・未アクセス**',
              '現在の状態: **Research Generation 2・3は完了済み。Research Generation 4はcore G4-01〜G4-10 scientific agenda完了。G4-10はCLOSED / NON-ESTIMABLE（research branch、main統合前）**',
              'RESEARCH_INDEX headline',
          )
          text = replace_once(
              text,
              '| 第四世代の現在状態 | [`research-generation-4/CURRENT_STATUS.md`](research-generation-4/CURRENT_STATUS.md) |',
              '| 第四世代の現在状態 | [`research-generation-4/CURRENT_STATUS.md`](research-generation-4/CURRENT_STATUS.md) |\n| 第四世代の最終統合 | [`research-generation-4/FINAL_SYNTHESIS.md`](research-generation-4/FINAL_SYNTHESIS.md) |\n| G4-10の正式結果 | [`fresh-depth11-exact-reachability-topology/FINAL_REPORT.md`](fresh-depth11-exact-reachability-topology/FINAL_REPORT.md) |',
              'RESEARCH_INDEX reading links',
          )
          text = replace_once(
              text,
              '| `G4-10` | protected depth-11 exact topology | `PROTECTED / NOT-AUTHORIZED-NOT-ACCESSED` |',
              '| `G4-10` / [`FDERT-STUDY1`](fresh-depth11-exact-reachability-topology/) | protected depth-11 exact topology | `CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / RESEARCH BRANCH` |',
              'RESEARCH_INDEX G4-10 row',
          )
          marker = '## Research Generation 3 — 局所ゲーム木幾何'
          if '### G4-10 — protected depth-11 exact topology' not in text:
              if marker not in text:
                  raise SystemExit('RESEARCH_INDEX RG3 marker missing')
              section = '''### G4-10 — protected depth-11 exact topology\n\nG4-10 `FDERT-STUDY1` はstandard initial RAW rootからcomplete exact depth 11を構築するone-shot protected Studyとして実行しました。\n\n```text\nActions run = 36368880428 / attempt 1 / success\ntarget depth = 11\ntarget complete = false\nlast complete depth = 10\nfirst incomplete depth = 11\nstop reason = UNIQUE_STATE_CAP\nfrozen cumulative distinct RAW-state ceiling = 2000000\nformal decision = NON-ESTIMABLE\nT1..T4 = NON-ESTIMABLE\n```\n\nFresh complete 0..10 prefixはG3-11 canonical exact prefixと完全一致し、independent complete-prefix verificationもPASSしました。partial depth-11 evidenceはformal resultへ昇格せず、state ceiling増加、alternate runner rescue、same-evidence rerun、depth 12 extensionを行いません。\n\n詳しくは、[`fresh-depth11-exact-reachability-topology/FINAL_REPORT.md`](fresh-depth11-exact-reachability-topology/FINAL_REPORT.md)、[`fresh-depth11-exact-reachability-topology/REPRODUCIBILITY_INDEX.md`](fresh-depth11-exact-reachability-topology/REPRODUCIBILITY_INDEX.md)、[`fresh-depth11-exact-reachability-topology/results/stage-1/STAGE_1_CANONICAL_RECORD.json`](fresh-depth11-exact-reachability-topology/results/stage-1/STAGE_1_CANONICAL_RECORD.json)を参照してください。\n\n'''
              text = text.replace(marker, section + marker, 1)
          idx.write_text(text)

          agenda = Path('doc/FUTURE_RESEARCH_AGENDA.md')
          text = agenda.read_text()
          text = replace_once(text, 'Version: 5.11.0', 'Version: 5.12.0', 'agenda version')
          text = replace_once(
              text,
              'Research Generation 4: **G4-01〜G4-09 complete/closed and integrated to `main` / G4-10 protected**',
              'Research Generation 4: **core G4-01〜G4-10 scientific agenda complete / G4-10 CLOSED NON-ESTIMABLE on research branch / main integration pending**',
              'agenda headline',
          )
          text = replace_once(
              text,
              'G4-10 depth 11 = NOT AUTHORIZED / NOT ACCESSED',
              'G4-10 = CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / RESEARCH BRANCH\nRG4 core G4-01..G4-10 scientific agenda = COMPLETE\nG4-10 same-evidence rerun = NOT AUTHORIZED\nG4-10 depth 12 = NOT AUTHORIZED',
              'agenda G4-10 state block',
          )
          text = replace_once(
              text,
              '| D | `G4-10` | protected fresh depth-11 exact reachability topology | `PROTECTED / NOT AUTHORIZED / NOT ACCESSED` |',
              '| D | `G4-10` | protected fresh depth-11 exact reachability topology | `CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / RESEARCH BRANCH` |',
              'agenda G4-10 table row',
          )
          table_tail = '| 独立 | `G4-P01`、`G4-H01` | canonicalization再基礎化とhuman / expert研究 | `NOT AUTHORIZED / DEFERRED` |\n'
          if '### G4-10 closure' not in text:
              if table_tail not in text:
                  raise SystemExit('agenda table tail missing')
              insert = '''\n### G4-10 closure\n\n`FDERT-STUDY1`はone-shot protected depth-11 exact Studyとして実行されましたが、depth 11構築中に事前固定した`2,000,000 cumulative distinct RAW states` ceilingへ到達しました。complete depth-11 layerは成立せず、formal decisionは`NON-ESTIMABLE`、T1〜T4もすべて`NON-ESTIMABLE`です。\n\nFresh complete 0..10 prefixはG3-11 canonical exact prefixと一致し、integrityはPASSしました。partial depth-11 evidenceはformal result、estimate、lower bound、growth trendへ昇格しません。同Study/versionのresource増加、rerun、alternate runner rescue、depth 12 extensionは認可されません。\n\n第四世代core agendaはG4-01〜G4-10のformal closureをもってscientifically completeです。今後の新しい研究候補は、このclosureをrepairする形ではなく、新しいStudy identityとprospective authorizationを必要とします。\n'''
              text = text.replace(table_tail, table_tail + insert, 1)
          agenda.write_text(text)
          PY
      - name: Assert no stale current-state labels remain
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'G4-10は保護・未アクセス' doc/RESEARCH_INDEX.md
          ! grep -Fq 'PROTECTED / NOT-AUTHORIZED-NOT-ACCESSED' doc/RESEARCH_INDEX.md
          ! grep -Fq 'G4-10 depth 11 = NOT AUTHORIZED / NOT ACCESSED' doc/FUTURE_RESEARCH_AGENDA.md
          ! grep -Fq 'G4-01〜G4-09 complete/closed and integrated to `main` / G4-10 protected' doc/FUTURE_RESEARCH_AGENDA.md
      - name: Commit synchronized documents and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/rg4-g4-10-doc-sync.yml
          git add doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(rg4): synchronize G4-10 closure across indexes'
          git push origin HEAD:research/g4-10-fresh-depth11-exact-reachability-topology
