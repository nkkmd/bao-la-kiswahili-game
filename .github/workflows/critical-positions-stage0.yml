name: Critical positions Stage 0 technical validation

on:
  push:
    branches:
      - research/critical-positions-outcome-branching
    paths:
      - "public/engine.js"
      - "public/ai.js"
      - "public/ai-weights.js"
      - "tools/benchmark.js"
      - "tools/experiments/lib/position-typology-features.js"
      - "tools/experiments/lib/position-complexity-search-diagnostic.js"
      - "tools/experiments/lib/tactical-motif-features.js"
      - "tools/experiments/lib/critical-positions-outcome-branching.js"
      - "tools/experiments/run-critical-positions-stage0-smoke.js"
      - "tools/experiments/verify-critical-positions-stage0-smoke.js"
      - "test/critical-positions-outcome-branching-stage0.test.js"
      - ".github/workflows/critical-positions-stage0.yml"
  pull_request:
    paths:
      - "public/engine.js"
      - "public/ai.js"
      - "public/ai-weights.js"
      - "tools/benchmark.js"
      - "tools/experiments/lib/position-typology-features.js"
      - "tools/experiments/lib/position-complexity-search-diagnostic.js"
      - "tools/experiments/lib/tactical-motif-features.js"
      - "tools/experiments/lib/critical-positions-outcome-branching.js"
      - "tools/experiments/run-critical-positions-stage0-smoke.js"
      - "tools/experiments/verify-critical-positions-stage0-smoke.js"
      - "test/critical-positions-outcome-branching-stage0.test.js"
      - ".github/workflows/critical-positions-stage0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  technical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate prerequisite exact-search instrumentation
        run: node test/position-complexity-search-diagnostic.test.js
      - name: Validate prerequisite structural/reply instrumentation
        run: node test/tactical-motif-stage0.test.js
      - name: Validate critical-position Stage 0 semantics
        run: node test/critical-positions-outcome-branching-stage0.test.js
      - name: Run technical-only Stage 0 smoke
        run: node tools/experiments/run-critical-positions-stage0-smoke.js --output /tmp/cpob-stage0-smoke.json
      - name: Independently verify Stage 0 smoke
        run: node tools/experiments/verify-critical-positions-stage0-smoke.js --input /tmp/cpob-stage0-smoke.json
      - name: Show compact technical benchmark
        run: |
          node -e 'const r=require("/tmp/cpob-stage0-smoke.json"); console.log(JSON.stringify({stageId:r.stageId,resultHash:r.resultHash,scientificSeedConsumed:r.scientificSeedConsumed,benchmarks:r.benchmarks},null,2))'
      - uses: actions/upload-artifact@v4
        with:
          name: cpob-stage0-technical-smoke
          path: /tmp/cpob-stage0-smoke.json
          if-no-files-found: error
          retention-days: 7
