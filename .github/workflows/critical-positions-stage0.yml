name: Critical positions Stage 0 technical validation

on:
  push:
    branches:
      - research/critical-positions-outcome-branching
    paths:
      - "public/engine.js"
      - "public/ai.js"
      - "public/ai-weights.js"
      - "tools/benchmark.js"
      - "tools/experiments/lib/position-typology-features.js"
      - "tools/experiments/lib/position-complexity-search-diagnostic.js"
      - "tools/experiments/lib/tactical-motif-features.js"
      - "tools/experiments/lib/critical-positions-outcome-branching.js"
      - "tools/experiments/run-critical-positions-stage0-smoke.js"
      - "tools/experiments/verify-critical-positions-stage0-smoke.js"
      - "tools/experiments/run-critical-positions-stage0-cap-audit.js"
      - "tools/experiments/verify-critical-positions-stage0-cap-audit.js"
      - "test/critical-positions-outcome-branching-stage0.test.js"
      - ".github/workflows/critical-positions-stage0.yml"
  pull_request:
    paths:
      - "public/engine.js"
      - "public/ai.js"
      - "public/ai-weights.js"
      - "tools/benchmark.js"
      - "tools/experiments/lib/position-typology-features.js"
      - "tools/experiments/lib/position-complexity-search-diagnostic.js"
      - "tools/experiments/lib/tactical-motif-features.js"
      - "tools/experiments/lib/critical-positions-outcome-branching.js"
      - "tools/experiments/run-critical-positions-stage0-smoke.js"
      - "tools/experiments/verify-critical-positions-stage0-smoke.js"
      - "tools/experiments/run-critical-positions-stage0-cap-audit.js"
      - "tools/experiments/verify-critical-positions-stage0-cap-audit.js"
      - "test/critical-positions-outcome-branching-stage0.test.js"
      - ".github/workflows/critical-positions-stage0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  technical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate prerequisite exact-search instrumentation
        run: node test/position-complexity-search-diagnostic.test.js
      - name: Validate prerequisite structural/reply instrumentation
        run: node test/tactical-motif-stage0.test.js
      - name: Validate critical-position Stage 0 semantics
        run: node test/critical-positions-outcome-branching-stage0.test.js
      - name: Run technical-only Stage 0 smoke
        run: node tools/experiments/run-critical-positions-stage0-smoke.js --output /tmp/cpob-stage0-smoke.json
      - name: Independently verify Stage 0 smoke
        run: node tools/experiments/verify-critical-positions-stage0-smoke.js --input /tmp/cpob-stage0-smoke.json
      - name: Run P1 cap/replicate technical audit
        run: node tools/experiments/run-critical-positions-stage0-cap-audit.js --output /tmp/cpob-stage0-cap-audit.json
      - name: Independently verify P1 cap/replicate audit
        run: node tools/experiments/verify-critical-positions-stage0-cap-audit.js --input /tmp/cpob-stage0-cap-audit.json
      - name: Show compact technical summaries
        run: |
          node -e 'const r=require("/tmp/cpob-stage0-smoke.json"); const c=require("/tmp/cpob-stage0-cap-audit.json"); console.log(JSON.stringify({smoke:{stageId:r.stageId,resultHash:r.resultHash,scientificSeedConsumed:r.scientificSeedConsumed,benchmarks:r.benchmarks},capAudit:{stageId:c.stageId,resultHash:c.resultHash,elapsedMs:c.elapsedMs,terminal:c.terminalContinuationPlySummary,grid:c.grid}},null,2))'
      - uses: actions/upload-artifact@v4
        with:
          name: cpob-stage0-technical-audits
          path: |
            /tmp/cpob-stage0-smoke.json
            /tmp/cpob-stage0-cap-audit.json
          if-no-files-found: error
          retention-days: 7
