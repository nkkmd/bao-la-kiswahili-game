name: RG3 Program Closure Final Documentation Polish

on:
  push:
    branches:
      - research/g3-final-program-closure
    paths:
      - doc/research-generation-3/authorizations/rg3-program-closure-final-polish-trigger.txt

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh main reference
        run: git fetch origin main --no-tags
      - name: Preserve helper for post-removal audit
        run: cp tools/experiments/finalize-rg3-program-closure-polish.py /tmp/finalize-rg3-program-closure-polish.py
      - name: Apply documentation-only polish
        run: python3 tools/experiments/finalize-rg3-program-closure-polish.py --polish
      - name: Remove one-time write-capable tooling before final audit
        run: |
          git rm .github/workflows/rg3-program-closure-final-polish.yml
          git rm tools/experiments/finalize-rg3-program-closure-polish.py
          git rm doc/research-generation-3/authorizations/rg3-program-closure-final-polish-trigger.txt
      - name: Generate and verify final consistency checkpoint
        run: python3 /tmp/finalize-rg3-program-closure-polish.py --audit
      - name: Verify historical program plan unchanged
        run: |
          test "$(git hash-object doc/research-generation-3/PROGRAM_PLAN.md)" = "2bb90c11f1625f63f40a7eab8a3de7774505a1ac"
      - name: Verify clean patch formatting
        run: git diff --check
      - name: Commit final documentation polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/RESEARCH_INDEX.md doc/research-generation-3/README.md doc/research-generation-3/CURRENT_STATUS.md doc/research-generation-3/PROGRAM_FINAL_RESULT.json doc/research-generation-3/checkpoints/2026-09-04-research-generation-3-final-polish-consistency-pass.md
          git diff --cached --quiet && { echo "No staged changes"; exit 1; }
          git commit -m "Finalize Research Generation 3 pre-main documentation audit"
          git push origin HEAD:research/g3-final-program-closure
