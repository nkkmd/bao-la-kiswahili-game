name: MDFT Stage 1 Development

on:
  push:
    branches:
      - research/g2-08-machine-decision-failure-taxonomy
    paths:
      - 'doc/machine-decision-failure-taxonomy/authorizations/STAGE_1_EXECUTION_AUTHORIZATION.json'

permissions:
  contents: read

jobs:
  stage1-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout authorized frozen source
        uses: actions/checkout@v4

      - name: Execution-start gate
        run: |
          set -euo pipefail
          node --version
          git rev-parse HEAD
          node --check tools/experiments/lib/mdft-stage1-production.js
          node --check tools/experiments/lib/mdft-stage1-independent.js
          node --check tools/experiments/run-mdft-stage1-development.js
          test -f doc/machine-decision-failure-taxonomy/authorizations/STAGE_1_EXECUTION_AUTHORIZATION.json

      - name: Run consume-once Stage 1 development
        run: |
          set -o pipefail
          mkdir -p artifacts/local/mdft-stage1-development-v1
          /usr/bin/time -v node tools/experiments/run-mdft-stage1-development.js artifacts/local/mdft-stage1-development-v1 2>&1 | tee artifacts-mdft-stage1-development.log

      - name: Preserve mandatory scientific artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdft-stage1-development-${{ github.sha }}
          path: |
            artifacts/local/mdft-stage1-development-v1/**
            artifacts-mdft-stage1-development.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
