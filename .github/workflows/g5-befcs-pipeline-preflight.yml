name: G5 BEFCS Worker Host Pipeline
on:
  push:
    branches: [research/g5-befcs-pipeline-preflight]
    paths:
      - 'tools/research/g5-befcs-pipeline/**'
      - 'test/g5-befcs-pipeline.test.cjs'
      - 'doc/research-generation-5/befcs-pipeline-20261013/**'
      - '.github/workflows/g5-befcs-pipeline-preflight.yml'
  pull_request:
    paths:
      - 'tools/research/g5-befcs-pipeline/**'
      - 'test/g5-befcs-pipeline.test.cjs'
      - 'doc/research-generation-5/befcs-pipeline-20261013/**'
      - '.github/workflows/g5-befcs-pipeline-preflight.yml'
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        # 凍結済みfixtureの入力を当時のコミットで検算する。現在のtreeはcheckpoint CIで検査する。
        with:
          ref: 7cbda82d06fb7e5f2f47098bad1c8c4f76f218fc
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Refuse unfrozen science and test checkpoint ordering
        run: node --test test/g5-befcs-pipeline.test.cjs
      - name: Verify fixed source and protected inputs before fixture generation
        run: node tools/research/g5-befcs-pipeline/run.cjs --bindings
      - name: Run seed-free host worker pipeline in real 1 GiB cgroups
        run: node tools/research/g5-befcs-pipeline/run.cjs --ci-live
      - name: Preserve stopped and completed technical registries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: befcs-pipeline-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/local/befcs-pipeline/
          retention-days: 90
          if-no-files-found: warn
