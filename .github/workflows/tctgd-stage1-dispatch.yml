name: TCTGD Stage 1 One-Shot Dispatcher

on:
  push:
    branches:
      - research/g3-03-transposition-tree-graph-divergence
    paths:
      - doc/transposition-concentration-tree-graph-divergence/authorizations/STAGE1_EXECUTION_TRIGGER

permissions:
  contents: write
  actions: write

concurrency:
  group: tctgd-stage1-dispatch
  cancel-in-progress: false

jobs:
  dispatch-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/g3-03-transposition-tree-graph-divergence
          fetch-depth: 1
      - name: Create durable dispatch ledger before scientific dispatch
        id: ledger
        env:
          DISPATCHER_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          AUTH=doc/transposition-concentration-tree-graph-divergence/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION.json
          TRIGGER=doc/transposition-concentration-tree-graph-divergence/authorizations/STAGE1_EXECUTION_TRIGGER
          LEDGER=doc/transposition-concentration-tree-graph-divergence/executions/stage-1-dispatch-ledger.json
          test -f "$AUTH"
          test -f "$TRIGGER"
          if test -f "$LEDGER"; then
            echo "Dispatch ledger already exists; no second scientific dispatch."
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NONCE=$(node -e 'const x=require("./'"$AUTH"'"); process.stdout.write(x.authorizationNonce)')
          mkdir -p "$(dirname "$LEDGER")"
          node - <<NODE
          const fs=require('node:fs');
          fs.writeFileSync('$LEDGER',JSON.stringify({schemaVersion:1,studyId:'TCTGD-STUDY1',stageId:'TCTGD-S1-DEVELOPMENT-2026-09-02-v1',dispatcherRunId:Number(process.env.DISPATCHER_RUN_ID),authorizationNonce:'$NONCE',scientificDispatchCount:1,freshScientificEvidenceGeneratedBeforeDispatch:false,protectedDepth10AccessBeforeDispatch:false},null,2)+'\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LEDGER"
          git commit -m "Record TCTGD Stage 1 one-shot dispatch ledger"
          git push origin HEAD:research/g3-03-transposition-tree-graph-divergence
          echo "dispatch=true" >> "$GITHUB_OUTPUT"
          echo "nonce=$NONCE" >> "$GITHUB_OUTPUT"
      - name: Dispatch scientific workflow exactly once
        if: steps.ledger.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_NONCE: ${{ steps.ledger.outputs.nonce }}
          DISPATCHER_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/actions/workflows/tctgd-stage1-development.yml/dispatches \
            -f ref=research/g3-03-transposition-tree-graph-divergence \
            -f inputs[authorization_nonce]="$AUTH_NONCE" \
            -f inputs[dispatcher_run_id]="$DISPATCHER_RUN_ID"
