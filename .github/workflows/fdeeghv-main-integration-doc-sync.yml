name: FDEGHV G3-11 post-integration documentation sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fdeeghv-main-integration-doc-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify main integration ancestry
        run: |
          test "$(git branch --show-current)" = "main"
          git merge-base --is-ancestor 03d1b5bf28ed45aaa9480f0a7c5efc6d394fcbae HEAD
      - name: Synchronize current-facing documentation
        run: python3 tools/experiments/fdeeghv-main-integration-doc-sync.py
      - name: Commit bookkeeping-only synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Complete G3-11 main integration bookkeeping"
          git push origin HEAD:main
