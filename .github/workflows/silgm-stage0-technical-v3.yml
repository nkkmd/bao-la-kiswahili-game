name: SILGM Stage 0 Technical v3
on:
  push:
    branches:
      - research/g3-07-search-instability-local-geometry-mechanism
    paths:
      - doc/search-instability-local-geometry-mechanism/authorizations/silgm-stage0-v3-trigger.txt
concurrency:
  group: silgm-stage0-technical-v3
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  stage0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Syntax-check frozen Stage 0 v3 tooling
        run: |
          node --check tools/experiments/run-silgm-stage0-technical-v3.js
          node --check tools/experiments/verify-silgm-stage0-v3-authorization.js
          node --check tools/experiments/lib/silgm-production.js
          node --check tools/experiments/lib/silgm-independent.js
      - name: Verify exact Stage 0 v3 authorization and source binding
        run: node tools/experiments/verify-silgm-stage0-v3-authorization.js
      - name: Verify v3 materialization without computation
        run: node tools/experiments/run-silgm-stage0-technical-v3.js --verify-only
      - name: Materialize durable pre-computation lease
        run: |
          mkdir -p artifacts/lease-v3
          printf '%s\n' "SILGM-S0-TECHNICAL-2026-09-03-v3" > artifacts/lease-v3/stage.txt
          git rev-parse HEAD > artifacts/lease-v3/trigger-head.txt
          git rev-parse HEAD^ > artifacts/lease-v3/tooling-parent.txt
          sha256sum doc/search-instability-local-geometry-mechanism/authorizations/STAGE_0_TECHNICAL_AUTHORIZATION_V3.json > artifacts/lease-v3/authorization.sha256
      - name: Upload v3 lease before computation
        uses: actions/upload-artifact@v4
        with:
          name: silgm-stage0-v3-lease-${{ github.run_id }}
          path: artifacts/lease-v3
          if-no-files-found: error
      - name: Execute exactly one authorized technical Stage 0 v3 computation
        run: |
          mkdir -p artifacts/local/search-instability-local-geometry-mechanism/stage0-v3
          node tools/experiments/run-silgm-stage0-technical-v3.js --output artifacts/local/search-instability-local-geometry-mechanism/stage0-v3/STAGE_0_TECHNICAL_RESULT.json
      - name: Upload Stage 0 v3 result before repository mirror
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silgm-stage0-v3-result-${{ github.run_id }}
          path: artifacts/local/search-instability-local-geometry-mechanism/stage0-v3/STAGE_0_TECHNICAL_RESULT.json
          if-no-files-found: error
