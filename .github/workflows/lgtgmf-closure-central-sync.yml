name: LGTGMF Closure Central Sync
on:
  push:
    branches: [research/g3-01-local-game-tree-geometry-measurement-foundation]
    paths: ['doc/local-game-tree-geometry-measurement-foundation/authorizations/CLOSURE_CENTRAL_SYNC_EXECUTE.json']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify authorization
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync('doc/local-game-tree-geometry-measurement-foundation/authorizations/CLOSURE_CENTRAL_SYNC_EXECUTE.json','utf8'));
          if(a.studyId!=='LGTGMF-STUDY1'||a.finalDecision!=='TECHNICAL-INVALID')throw Error('authorization mismatch');
          if(a.mainIntegrationAuthorized!==false||a.scientificRerunAuthorized!==false)throw Error('authorization boundary mismatch');
          NODE
      - name: Synchronize current-facing central documents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          idx=Path('doc/RESEARCH_INDEX.md')
          s=idx.read_text()
          pattern=r"### 30\. Research Generation 3 — Prospective Program Plan\n.*?\n---\n\n## 将来研究"
          replacement='''### 30. Research Generation 3 — G3-01 closure / dependency reassessment\n\n**Program:** Bao Third-Generation Research Program / **Core:** `G3-01..G3-12`  \n**状態:** **ACTIVE / G3-01 `TECHNICAL-INVALID` / dependency reassessment required**\n\nResearch Generation 3はRAW-only bounded exact analysisを基盤としてlocal game-tree geometryを扱うprogramである。最初のmeasurement foundation Study `G3-01`は正式に`LGTGMF-STUDY1`として開始・実行され、`TECHNICAL-INVALID`で閉じた。\n\nStage 0 corrective v2はtechnical pass。Fresh Stage 1ではNamua 6 / Mtaji 6の全12 rootsをdepth 5までproduction / independent双方でcomplete reconstructionし、root-level measurement coreとF1〜F5 family digestはすべてexact一致した。しかし、凍結済みcanonical stage manifestの`stageCoreSha256`へelapsed / RSS等のnon-deterministic resource observationsを含めたimplementation defectによりstage-level digestが一致しなかった。fresh seed消費後のsame-evidence repairは禁止されていたためfail-closedとした。\n\n```text\nLGTGMF-STUDY1 = TECHNICAL-INVALID\nformal eligible measurement families = []\nStage 2 = NOT-AUTHORIZED-NOT-EXECUTED\nStage 1 seed consumption = 31010001..31010096\nStage 2 seed consumption = NONE\nprotected depth-10 holdout = SEALED / NOT GENERATED / NOT READ\n```\n\nProgram contract上、G3-02〜G3-08は原則としてG3-01でformal eligibilityを得たmeasurement familyだけを利用する。本Studyのeligible setは空なので、同instrumentのまま後続Studyを自動開始しない。新しいprospective measurement prerequisite Studyまたはprogram-level dependency decisionが必要である。\n\n**G3-01を最初に読む:**\n\n- [`local-game-tree-geometry-measurement-foundation/STUDY_1_OVERVIEW.md`](local-game-tree-geometry-measurement-foundation/STUDY_1_OVERVIEW.md)\n- [`local-game-tree-geometry-measurement-foundation/STUDY_1_FINAL_REPORT.md`](local-game-tree-geometry-measurement-foundation/STUDY_1_FINAL_REPORT.md)\n- [`local-game-tree-geometry-measurement-foundation/CURRENT_STATUS.md`](local-game-tree-geometry-measurement-foundation/CURRENT_STATUS.md)\n- [`local-game-tree-geometry-measurement-foundation/REPRODUCIBILITY_INDEX.md`](local-game-tree-geometry-measurement-foundation/REPRODUCIBILITY_INDEX.md)\n\n**Program records:**\n\n- [`research-generation-3/PROGRAM_PLAN.md`](research-generation-3/PROGRAM_PLAN.md)\n- [`research-generation-3/CURRENT_STATUS.md`](research-generation-3/CURRENT_STATUS.md)\n- [`research-program-decisions/2026-08-31-third-generation-local-game-tree-geometry-agenda.md`](research-program-decisions/2026-08-31-third-generation-local-game-tree-geometry-agenda.md)\n- [`research-program-decisions/2026-08-31-g3-01-measurement-foundation-technical-invalid-closure.md`](research-program-decisions/2026-08-31-g3-01-measurement-foundation-technical-invalid-closure.md)\n\n**Boundary:** G2-05 depth-9 exact result、validated transform set `[]`、G2-11 / G2-12 closureを変更しない。G3-01のStage 1 exact family agreementをformal eligibilityへ救済しない。standard-root depth 10はG3-11用にsealedしたまま維持する。\n\n---\n\n## 将来研究'''
          ns,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1: raise SystemExit(f'RESEARCH_INDEX section replacement count={n}')
          old='**Research Generation 3 state:** prospective plan recorded on 2026-08-31; scientific Study execution has not started. G3-01 is the first recommended agenda item, and standard-root depth 10 is sealed for G3-11.'
          new='**Research Generation 3 state:** G3-01 `LGTGMF-STUDY1` is closed `TECHNICAL-INVALID`; formal eligible measurement families are empty and G3-02〜G3-08 automatic start is blocked pending a new prospective prerequisite or program-level dependency decision. Standard-root depth 10 remains sealed for G3-11.'
          if ns.count(old)!=1: raise SystemExit('RESEARCH_INDEX future-state anchor mismatch')
          ns=ns.replace(old,new)
          idx.write_text(ns)

          ag=Path('doc/FUTURE_RESEARCH_AGENDA.md')
          a=ag.read_text()
          old='- **G3-01 — Local Game-Tree Geometry Measurement Foundation Study 1**: branching、reply width、transposition、reconvergence、tree/graph divergenceの再現可能なmeasurement foundationを構築する。**P0 / first recommended Study**'
          new='- **G3-01 — Local Game-Tree Geometry Measurement Foundation Study 1**: `LGTGMF-STUDY1`として実行・closure済み。Stage 1でroot-level / F1〜F5 exact agreementは得たがcanonical stage-manifest implementation defectによりformal decision `TECHNICAL-INVALID`、eligible family `[]`、Stage 2 `NOT-AUTHORIZED-NOT-EXECUTED`。同evidenceを修正rerunせず、新規prospective prerequisiteまたはdependency再設計が必要。**CLOSED / dependency-blocking**'
          if a.count(old)!=1: raise SystemExit('FUTURE_RESEARCH_AGENDA G3-01 anchor mismatch')
          a=a.replace(old,new)
          p=r"### 10\.12 現在の開始状態\n.*\Z"
          repl='''### 10.12 現在状態\n\n2026-08-31、G3-01は`LGTGMF-STUDY1`としてprospectively開始され、Stage 1まで実行した後`TECHNICAL-INVALID`で閉じた。\n\n```text\nResearch Generation 3 = ACTIVE / DEPENDENCY REASSESSMENT REQUIRED\nG3-01 = LGTGMF-STUDY1 / CLOSED / TECHNICAL-INVALID\nG3-01 formal eligible measurement families = []\nG3-01 Stage 1 seed consumption = 31010001..31010096\nG3-01 Stage 2 = NOT-AUTHORIZED-NOT-EXECUTED\nG3-01 Stage 2 seed consumption = NONE\nG3-02..G3-08 automatic start = BLOCKED\nprotected depth-10 holdout = SEALED / NOT GENERATED / NOT READ\n```\n\nG3-01 Stage 1では全12 selected rootsのproduction / independent root-level measurement coreとF1〜F5 family digestがexact一致したが、deterministic stage manifestを要求した凍結contractに対して、implementationがruntime-dependent resource observationsをstage hashへ含めたためtechnical integrity gateを満たさなかった。fresh evidence消費後のsame-evidence repairは禁止されているため、このdevelopment agreementをformal eligibilityへ昇格させない。\n\n次に進む場合は、G3-01をreopen / rescueせず、新しいprospective measurement-instrument prerequisite Studyを設計するか、Research Generation 3 dependency graphをprogram-level decisionとして再設計する。G3-02以降を通常順序で自動開始しない。'''
          a2,n=re.subn(p,repl,a,flags=re.S)
          if n!=1: raise SystemExit(f'FUTURE_RESEARCH_AGENDA current-state replacement count={n}')
          ag.write_text(a2)
          PY
          git diff --check
          git diff -- doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md
      - name: Commit central synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sawa'
          git config user.email '72678394+nkkmd@users.noreply.github.com'
          git add doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md
          git commit -m 'Synchronize G3-01 closure in central research docs'
          git push origin HEAD:research/g3-01-local-game-tree-geometry-measurement-foundation
