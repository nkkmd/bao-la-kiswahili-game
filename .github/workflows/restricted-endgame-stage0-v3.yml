name: Restricted endgame Stage 0 v3 expansion audit

on:
  push:
    branches:
      - research/restricted-endgame-winning-regions
    paths:
      - "public/engine.js"
      - "tools/benchmark.js"
      - "tools/experiments/lib/restricted-endgame-transition.js"
      - "tools/experiments/lib/restricted-endgame-stage0.js"
      - "tools/experiments/lib/restricted-endgame-independent-verifier.js"
      - "tools/experiments/run-restricted-endgame-stage0-v3.js"
      - "tools/experiments/verify-restricted-endgame-stage0-v3.js"
      - "doc/restricted-endgame-winning-regions/preregistration/STAGE_0_TECHNICAL_SPEC_V3.json"
      - ".github/workflows/restricted-endgame-stage0-v3.yml"
  pull_request:
    paths:
      - "public/engine.js"
      - "tools/benchmark.js"
      - "tools/experiments/lib/restricted-endgame-transition.js"
      - "tools/experiments/lib/restricted-endgame-stage0.js"
      - "tools/experiments/lib/restricted-endgame-independent-verifier.js"
      - "tools/experiments/run-restricted-endgame-stage0-v3.js"
      - "tools/experiments/verify-restricted-endgame-stage0-v3.js"
      - "doc/restricted-endgame-winning-regions/preregistration/STAGE_0_TECHNICAL_SPEC_V3.json"
      - ".github/workflows/restricted-endgame-stage0-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v3-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate transition implementations
        run: |
          node test/restricted-endgame-transition.test.js
          node test/restricted-endgame-independent-verifier.test.js
      - name: Run one-shot v3 expanded technical closure
        run: |
          node --max-old-space-size=6144 tools/experiments/run-restricted-endgame-stage0-v3.js \
            --output /tmp/rewr-stage0-v3.json \
            > /tmp/rewr-stage0-v3-console.json
          cat /tmp/rewr-stage0-v3-console.json
      - name: Verify v3 or apply frozen v2 fallback
        run: |
          node --max-old-space-size=6144 tools/experiments/verify-restricted-endgame-stage0-v3.js \
            --input /tmp/rewr-stage0-v3.json \
            --output /tmp/rewr-stage0-v3-verification.json \
            > /tmp/rewr-stage0-v3-verification-console.json
          cat /tmp/rewr-stage0-v3-verification-console.json
      - name: Assert no scientific outcome and final technical choice
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const a = JSON.parse(fs.readFileSync('/tmp/rewr-stage0-v3.json', 'utf8'));
          const v = JSON.parse(fs.readFileSync('/tmp/rewr-stage0-v3-verification.json', 'utf8'));
          const forbidden = /\b(WIN|LOSS|RECURRENT|DTF|optimalMoveSet|absoluteWinner)\b/;
          if (a.technicalOnly !== true || a.outcomeFieldsEmitted !== false
              || a.scientificOutcomeGenerationAuthorized !== false
              || a.scientificTablebaseGenerationAuthorized !== false
              || a.additionalCapExpansionAuthorized !== false
              || v.technicalOnly !== true || v.outcomeFieldsEmitted !== false
              || v.additionalCapExpansionAuthorized !== false
              || forbidden.test(JSON.stringify(a)) || forbidden.test(JSON.stringify(v))) {
            throw new Error('Stage 0 v3 firewall violation');
          }
          if (v.v3Complete) {
            if (v.passed !== true || v.finalTechnicalDomainChoice !== 'V3-DOMAIN') {
              throw new Error('Complete v3 graph failed independent verification');
            }
          } else if (v.finalTechnicalDomainChoice !== 'V2-FALLBACK') {
            throw new Error('Incomplete v3 did not select frozen v2 fallback');
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: rewr-stage0-v3-audit
          path: |
            /tmp/rewr-stage0-v3.json
            /tmp/rewr-stage0-v3-verification.json
          if-no-files-found: error
          retention-days: 14
