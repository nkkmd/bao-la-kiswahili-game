G4-10 remains **PROTECTED / NOT AUTHORIZED / NOT ACCESSED**. No next scientific agenda is authorized by this integration. Any next Study requires its own dependency check and authorization review before fresh evidence access.
""")

      - name: Commit synchronized documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md \
            doc/research-generation-4/README.md \
            doc/research-generation-4/CURRENT_STATUS.md \
            doc/research-generation-4/RESUME_HERE.md \
            doc/geometry-conditioned-search-reliability-exact-agreement/README.md \
            doc/geometry-conditioned-search-reliability-exact-agreement/CURRENT_STATUS.md \
            doc/research-generation-4/checkpoints/2026-09-28-g4-09-main-integration.md
          git diff --cached --check
          git commit -m "docs(g4-09): record main integration"
          git push origin HEAD:main
