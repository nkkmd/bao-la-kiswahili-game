name: G4-09 post-integration documentation sync once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/g4-09-post-integration-sync-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize current-facing G4-09 integration state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f"{path}: required text not found: {old!r}")
              p.write_text(text.replace(old, new))

          replacements = [
              ("doc/RESEARCH_INDEX.md",
               "Research Generation 4はG4-01〜G4-08 main統合済み。G4-09は研究完了・research branch上でclosed、G4-10は保護・未アクセス",
               "Research Generation 4はG4-01〜G4-09 main統合済み。G4-10は保護・未アクセス"),
              ("doc/RESEARCH_INDEX.md",
               "`CLOSED / MODULE-A-NOT-ELIGIBLE-FOR-FORMAL-HOLDOUT / MODULE-B-FIXED8-EXACT-CENSUS-COMPLETE / NOT YET MAIN INTEGRATED`",
               "`CLOSED / MODULE-A-NOT-ELIGIBLE-FOR-FORMAL-HOLDOUT / MODULE-B-FIXED8-EXACT-CENSUS-COMPLETE / MAIN INTEGRATED`"),
              ("doc/FUTURE_RESEARCH_AGENDA.md",
               "Research Generation 4: **G4-01〜G4-08 complete/closed and integrated to `main` / G4-09 closed on research branch / G4-10 protected**",
               "Research Generation 4: **G4-01〜G4-09 complete/closed and integrated to `main` / G4-10 protected**"),
              ("doc/FUTURE_RESEARCH_AGENDA.md",
               "G4-09 = CLOSED / MODULE-A-NOT-ELIGIBLE-FOR-FORMAL-HOLDOUT / MODULE-B-FIXED8-EXACT-CENSUS-COMPLETE / NOT YET MAIN INTEGRATED",
               "G4-09 = CLOSED / MODULE-A-NOT-ELIGIBLE-FOR-FORMAL-HOLDOUT / MODULE-B-FIXED8-EXACT-CENSUS-COMPLETE / MAIN INTEGRATED"),
              ("doc/FUTURE_RESEARCH_AGENDA.md",
               "`CLOSED / MODULE-A NOT ELIGIBLE / MODULE-B FIXED8 EXACT-CENSUS COMPLETE / NOT YET MAIN INTEGRATED`",
               "`CLOSED / MODULE-A NOT ELIGIBLE / MODULE-B FIXED8 EXACT-CENSUS COMPLETE / MAIN INTEGRATED`"),
              ("doc/FUTURE_RESEARCH_AGENDA.md",
               "G4-09 scientific execution・closureはresearch branch上で完了しています。",
               "G4-09 scientific execution・closure・main統合は完了しています。"),
              ("doc/FUTURE_RESEARCH_AGENDA.md",
               "4. **[進行] Research Generation 4 — G4-01〜G4-08は各final dispositionでmain統合済み。G4-09は研究完了・research branch上でclosed。次のscientific agendaは未選定で、G4-10 depth 11はprotected / not authorized / not accessed**",
               "4. **[進行] Research Generation 4 — G4-01〜G4-09は各final dispositionでmain統合済み。次のscientific agendaは未選定で、G4-10 depth 11はprotected / not authorized / not accessed**"),
              ("doc/research-generation-4/README.md",
               "状態: **`G4-01..G4-08 MAIN INTEGRATED / G4-09 CLOSED ON RESEARCH BRANCH / G4-10 PROTECTED`**",
               "状態: **`G4-01..G4-09 MAIN INTEGRATED / G4-10 PROTECTED`**"),
              ("doc/research-generation-4/README.md",
               "`CLOSED / MODULE-A NOT ELIGIBLE / MODULE-B FIXED8 EXACT-CENSUS COMPLETE / NOT YET MAIN INTEGRATED`",
               "`CLOSED / MODULE-A NOT ELIGIBLE / MODULE-B FIXED8 EXACT-CENSUS COMPLETE / MAIN INTEGRATED`"),
              ("doc/research-generation-4/README.md",
               "G4-09のscientific executionとclosureは完了し、pre-main consistency auditは`PASS / READY-FOR-MAIN-INTEGRATION-REVIEW`となった。次は別の明示的操作として`main`統合をレビューする段階である。統合直前にはresearch branchとremote `main`のHEAD、ahead / behind、merge base、`public/`差分、G4-10保護境界を再確認する。",
               "G4-09のscientific execution・closure・pre-main consistency audit・`main`統合は完了した。G4-09に対する追加科学実行は行わない。次のscientific agendaを開始する場合は別の明示的authorization reviewを必要とする。"),
              ("doc/research-generation-4/CURRENT_STATUS.md",
               "状態: **`G4-01..G4-08 MAIN INTEGRATED / G4-09 CLOSED ON RESEARCH BRANCH / G4-10 PROTECTED`**",
               "状態: **`G4-01..G4-09 MAIN INTEGRATED / G4-10 PROTECTED`**"),
              ("doc/research-generation-4/CURRENT_STATUS.md",
               "G4-09 = CLOSED / MODULE-A-NOT-ELIGIBLE-FOR-FORMAL-HOLDOUT / MODULE-B-FIXED8-EXACT-CENSUS-COMPLETE / NOT YET MAIN INTEGRATED",
               "G4-09 = CLOSED / MODULE-A-NOT-ELIGIBLE-FOR-FORMAL-HOLDOUT / MODULE-B-FIXED8-EXACT-CENSUS-COMPLETE / MAIN INTEGRATED"),
              ("doc/research-generation-4/CURRENT_STATUS.md",
               "`CLOSED / MODULE-A NOT ELIGIBLE / MODULE-B FIXED8 EXACT-CENSUS COMPLETE / NOT YET MAIN INTEGRATED`",
               "`CLOSED / MODULE-A NOT ELIGIBLE / MODULE-B FIXED8 EXACT-CENSUS COMPLETE / MAIN INTEGRATED`"),
              ("doc/research-generation-4/CURRENT_STATUS.md",
               "G4-09のscientific executionとclosureは完了し、pre-main consistency auditは`PASS / READY-FOR-MAIN-INTEGRATION-REVIEW`となった。次は別の明示的操作として`main`統合をレビューする段階である。統合直前にはresearch branchとremote `main`のHEAD、ahead / behind、merge base、`public/`差分、G4-10保護境界を再確認する。",
               "G4-09のscientific execution・closure・pre-main consistency audit・`main`統合は完了した。G4-09に対する追加科学実行は行わない。次のscientific agendaを開始する場合は別の明示的authorization reviewを必要とする。"),
              ("doc/research-generation-4/RESUME_HERE.md",
               "状態: **`G4-09 CLOSED ON RESEARCH BRANCH / PRE-MAIN CONSISTENCY AUDIT PASS / MAIN INTEGRATION REVIEW NEXT / G4-10 PROTECTED`**",
               "状態: **`G4-09 MAIN INTEGRATED / G4-10 PROTECTED / NEXT SCIENTIFIC AGENDA NOT AUTHORIZED`**"),
              ("doc/research-generation-4/RESUME_HERE.md",
               "G4-09 = CLOSED / MODULE-A NOT ELIGIBLE / MODULE-B FIXED8 EXACT-CENSUS COMPLETE / NOT YET MAIN INTEGRATED",
               "G4-09 = CLOSED / MODULE-A NOT ELIGIBLE / MODULE-B FIXED8 EXACT-CENSUS COMPLETE / MAIN INTEGRATED"),
              ("doc/research-generation-4/RESUME_HERE.md",
               "main integration = not performed",
               "main integration = COMPLETE / FAST-FORWARD"),
              ("doc/geometry-conditioned-search-reliability-exact-agreement/README.md",
               "main integration = not performed",
               "main integration = COMPLETE / FAST-FORWARD"),
              ("doc/geometry-conditioned-search-reliability-exact-agreement/CURRENT_STATUS.md",
               "main integration = not performed",
               "main integration = COMPLETE / FAST-FORWARD"),
          ]

          for path, old, new in replacements:
              replace_required(path, old, new)

          replace_required(
              "doc/research-generation-4/RESUME_HERE.md",
              "G4-09 scientific executionとclosureは完了し、pre-main consistency auditも`PASS / READY-FOR-MAIN-INTEGRATION-REVIEW`で完了した。\n\n次は**別の明示的操作としてmain統合をレビューする段階**である。統合操作の直前にresearch branch HEADとremote `main` HEADを再取得し、ahead-only / behind 0 / merge base一致、`public/`差分0、G4-10 depth-11 access 0を再確認する。\n\n監査PASSは自動統合を意味しない。G4-10も引き続き別authorizationなしにアクセスしない。",
              "G4-09 scientific execution・closure・pre-main consistency audit・`main`統合は完了した。G4-09に対する追加科学実行やsame-Study rescueは行わない。\n\n次のscientific agendaは未認可である。G4-10も引き続き別authorizationなしにアクセスしない。新しい研究へ進む場合はfresh evidence access前に独立authorization reviewを行う。",
          )
          replace_required(
              "doc/geometry-conditioned-search-reliability-exact-agreement/CURRENT_STATUS.md",
              "G4-09に対する追加科学実行は行わない。pre-main consistency auditは`PASS / READY-FOR-MAIN-INTEGRATION-REVIEW`で完了している。\n\n次は別の明示的操作として`main`統合をレビューする段階である。統合直前にresearch branchとremote `main`のHEAD、ahead / behind、merge base、`public/`差分、G4-10保護境界を再確認する。G4-10 depth-11は引き続き別authorizationなしにアクセスしない。",
              "G4-09に対する追加科学実行は行わない。pre-main consistency auditと`main`へのnon-force fast-forward統合は完了している。\n\n同Studyをreopen / rerun / rescueしない。新しいscientific agendaへ進む場合は別Study / 別authorizationを必要とする。G4-10 depth-11は引き続き別authorizationなしにアクセスしない。",
          )
          PY

      - name: Commit synchronized documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md \
            doc/research-generation-4/README.md \
            doc/research-generation-4/CURRENT_STATUS.md \
            doc/research-generation-4/RESUME_HERE.md \
            doc/geometry-conditioned-search-reliability-exact-agreement/README.md \
            doc/geometry-conditioned-search-reliability-exact-agreement/CURRENT_STATUS.md
          git diff --cached --check
          git commit -m "docs(g4-09): synchronize post-integration status"
          git push origin HEAD:main
