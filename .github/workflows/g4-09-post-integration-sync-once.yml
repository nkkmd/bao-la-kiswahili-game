## Post-integration documentation

After the fast-forward, current-facing documents are synchronized on `main` to record `G4-09 = MAIN INTEGRATED`. Historical preregistration, canonical scientific records, closure records, and pre-main audit checkpoints remain unchanged as point-in-time records.

Updated current-facing records include:

- `doc/geometry-conditioned-search-reliability-exact-agreement/CURRENT_STATUS.md`
- `doc/geometry-conditioned-search-reliability-exact-agreement/README.md`
- `doc/research-generation-4/CURRENT_STATUS.md`
- `doc/research-generation-4/README.md`
- `doc/research-generation-4/RESUME_HERE.md`
- `doc/RESEARCH_INDEX.md`
