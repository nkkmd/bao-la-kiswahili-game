name: G3 Final Program Closure Documentation Sync

on:
  push:
    branches:
      - research/g3-final-program-closure
    paths:
      - doc/research-generation-3/authorizations/g3-final-program-closure-doc-sync-trigger.txt

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize generation closure documentation
        run: python3 tools/experiments/sync-g3-final-program-closure-docs.py
      - name: Verify historical program plan unchanged
        run: |
          test "$(git rev-parse HEAD:doc/research-generation-3/PROGRAM_PLAN.md)" = "2bb90c11f1625f63f40a7eab8a3de7774505a1ac"
      - name: Commit synchronized documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md doc/research-generation-3/README.md doc/research-generation-3/CURRENT_STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m "Synchronize Research Generation 3 program closure docs"
          git push origin HEAD:research/g3-final-program-closure
