name: G3-12 Main Integration Bookkeeping
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/g3-12-main-integration-bookkeeping.yml
permissions:
  contents: write
jobs:
  bookkeeping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify integrated source ancestry
        run: |
          test "$(git rev-parse 146a515671838606034efd9d4c3120e9b4c597f2)" = "146a515671838606034efd9d4c3120e9b4c597f2"
          git merge-base --is-ancestor 146a515671838606034efd9d4c3120e9b4c597f2 HEAD
      - name: Apply documentation-only bookkeeping
        run: python3 tools/experiments/finalize-g3-12-main-integration.py
      - name: Commit bookkeeping and retire one-time workflow
        run: |
          rm .github/workflows/g3-12-main-integration-bookkeeping.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete G3-12 main integration bookkeeping"
          git push origin HEAD:main
