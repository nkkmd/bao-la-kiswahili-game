name: G3-08 Final Document Follow-up

on:
  push:
    branches:
      - research/g3-08-local-geometry-persistence-memory-length
    paths:
      - doc/local-geometry-persistence-memory-length/triggers/FINAL_DOC_FOLLOWUP.txt

permissions:
  contents: write

concurrency:
  group: g3-08-final-doc-followup
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Assert trigger-only commit and research branch
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "research/g3-08-local-geometry-persistence-memory-length"
          test "$(git diff --name-only HEAD^ HEAD)" = "doc/local-geometry-persistence-memory-length/triggers/FINAL_DOC_FOLLOWUP.txt"
      - name: Normalize inherited current-facing lifecycle metadata
        run: python3 tools/experiments/finalize-g3-08-document-consistency-followup.py
      - name: Verify no scientific or historical plan drift
        shell: bash
        run: |
          test "$(git hash-object doc/research-generation-3/PROGRAM_PLAN.md)" = "2bb90c11f1625f63f40a7eab8a3de7774505a1ac"
          grep -Fq 'Study status = CLOSED / TECHNICAL-INVALID' doc/local-geometry-persistence-memory-length/CURRENT_STATUS.md
          grep -Fq 'Stage 2 = LGPML-S2-FORMAL-2026-09-03-v1 / NOT-AUTHORIZED-NOT-EXECUTED' doc/local-geometry-persistence-memory-length/CURRENT_STATUS.md
          grep -Fq 'main integration = NOT AUTHORIZED / NOT PERFORMED / EXPLICIT USER INSTRUCTION REQUIRED' doc/local-geometry-persistence-memory-length/CURRENT_STATUS.md
      - name: Commit branch-only documentation corrections
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md doc/
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'Complete G3-08 documentation consistency follow-up'
          git push origin HEAD:research/g3-08-local-geometry-persistence-memory-length
