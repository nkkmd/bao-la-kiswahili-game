name: PBAI-P2 C008 development evaluation

on:
  pull_request:
    branches:
      - engineering/pbai-p2-program-initialization
    paths:
      - 'public/ai.js'
      - 'doc/ai-engineering/public-ai-improvement-program-2/candidates/PBAI-C008-v1.json'
      - 'doc/ai-engineering/public-ai-improvement-program-2/candidates/PBAI-C008-v1-feature-off-equivalence-result.json'
      - 'doc/ai-engineering/public-ai-improvement-program-2/candidates/PBAI-C008-v1-development-measurement-spec.json'
      - 'tools/engineering/run-pbai-p2-c008-v1-development.js'
      - 'tools/engineering/verify-pbai-p2-c008-v1-development-independent.js'
      - '.github/workflows/pbai-p2-c008-v1-development.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify frozen source and development firewall
        run: |
          test "$(sha256sum public/engine.js | awk '{print $1}')" = "e6acf1fe4d97db67dbcfadc3a785e802342ae0b0cbaec35f53eb8e77424cfc1c"
          test "$(sha256sum public/ai.js | awk '{print $1}')" = "cb4e8524964cc775782f66feab39f360be1f0b75d8505919c7bcc5ef85419c3a"
          changed_public="$(git diff --name-only origin/engineering/pbai-p2-program-initialization...HEAD -- public/)"
          test "$changed_public" = "public/ai.js" || {
            echo 'C008 development may differ from P2 initialization only in public/ai.js under public/.' >&2
            printf '%s\n' "$changed_public" >&2
            exit 1
          }
          node - <<'NODE'
          const fs = require('node:fs');
          const base = 'doc/ai-engineering/public-ai-improvement-program-2/candidates/';
          const contract = JSON.parse(fs.readFileSync(`${base}PBAI-C008-v1.json`, 'utf8'));
          const equivalence = JSON.parse(fs.readFileSync(`${base}PBAI-C008-v1-feature-off-equivalence-result.json`, 'utf8'));
          const spec = JSON.parse(fs.readFileSync(`${base}PBAI-C008-v1-development-measurement-spec.json`, 'utf8'));
          if (contract.status !== 'FROZEN-FOR-DEVELOPMENT') throw new Error('candidate contract changed');
          if (contract.mechanism.featureFlag !== 'pbaiC008RootFlipConfirmation') throw new Error('feature flag changed');
          if (equivalence.decision.disposition !== 'FEATURE-OFF-EQUIVALENCE-PASS') throw new Error('feature-off prerequisite missing');
          if (spec.status !== 'FROZEN-BEFORE-DEVELOPMENT-OUTCOME') throw new Error('development spec not frozen');
          if (spec.population.sourceSeedStart !== 42400001 || spec.population.sourceSeedEnd !== 42400512 || spec.population.sourceSeedCount !== 512) throw new Error('development source block changed');
          if (spec.population.runtimeEligible.minimumEstimableTotal !== 64 || spec.population.runtimeEligible.maximumTotal !== 128) throw new Error('eligible gate changed');
          if (spec.frozenDevelopmentGate.primary.topSetAgreementDeltaMinimum !== 0.05) throw new Error('TopSet gate changed');
          if (spec.frozenDevelopmentGate.primary.meanNormalizedRankLossDeltaMaximum !== -0.02) throw new Error('rank-loss gate changed');
          if (spec.frozenDevelopmentGate.cost.medianNodeRatioMaximum !== 1.60 || spec.frozenDevelopmentGate.cost.p95NodeRatioMaximum !== 2.50) throw new Error('cost gate changed');
          if (spec.firewall.validationSeeds425MayBeAccessed !== false || spec.firewall.releaseHoldoutSeeds426MayBeAccessed !== false) throw new Error('protected split authorization leaked');
          if (spec.researchGeneration3Influence !== false) throw new Error('G3 firewall changed');
          NODE
          for f in tools/engineering/run-pbai-p2-c008-v1-development.js tools/engineering/verify-pbai-p2-c008-v1-development-independent.js; do
            ! grep -E '42500001|42501024|42600001|42602048|43200001|43201024|43400001|43400064' "$f" || {
              echo "Protected/non-development seed literal found in $f" >&2
              exit 1
            }
            ! grep -E "require\(.*(research-generation-3|local-game-tree)" "$f" || {
              echo "Forbidden G3 import found in $f" >&2
              exit 1
            }
          done

      - name: Materialize exact frozen baseline AI source
        run: |
          git show 2265fb7ccbf6cf6dde6ab08d5519e44e61b9e972:public/ai.js > /tmp/pbai-c008-baseline-ai.js
          test "$(sha256sum /tmp/pbai-c008-baseline-ai.js | awk '{print $1}')" = "2823dbcf96c7a47489301ecd768a63975aa8b4e12b62cc4629fc8283ef5dff9e"

      - name: Syntax check development tools
        run: |
          node --check tools/engineering/run-pbai-p2-c008-v1-development.js
          node --check tools/engineering/verify-pbai-p2-c008-v1-development-independent.js

      - name: Run frozen C008 development measurement
        run: |
          mkdir -p artifacts/pbai-p2/c008
          node tools/engineering/run-pbai-p2-c008-v1-development.js \
            --baseline-ai /tmp/pbai-c008-baseline-ai.js \
            --output artifacts/pbai-p2/c008/development-result.json

      - name: Independently reconstruct C008 development result
        run: |
          node tools/engineering/verify-pbai-p2-c008-v1-development-independent.js \
            --production artifacts/pbai-p2/c008/development-result.json \
            --baseline-ai /tmp/pbai-c008-baseline-ai.js \
            --output artifacts/pbai-p2/c008/development-verification.json

      - name: Verify independent evidence and protected boundaries
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('artifacts/pbai-p2/c008/development-result.json', 'utf8'));
          const v = JSON.parse(fs.readFileSync('artifacts/pbai-p2/c008/development-verification.json', 'utf8'));
          if (v.passed !== true || v.deterministicCoreEquality !== true || v.fullEligibleAndNegativeRowsEquality !== true) throw new Error('independent reconstruction failed');
          if (r.firewalls.supportSeeds432Accessed !== false || r.firewalls.featureOffSeeds434Accessed !== false || r.firewalls.validationSeeds425Accessed !== false || r.firewalls.releaseHoldoutSeeds426Accessed !== false) throw new Error('protected evidence accessed');
          if (r.firewalls.researchGeneration3ArtifactsAccessed !== false) throw new Error('G3 artifact access reported');
          if (r.decision.validationExecutionAuthorized !== false || r.decision.releaseHoldoutExecutionAuthorized !== false || r.decision.publicDeploymentAuthorized !== false || r.decision.aiGen3PromotionAuthorized !== false) throw new Error('authorization leaked');
          console.log(JSON.stringify({
            deterministicCoreSha256: r.deterministicCoreSha256,
            population: r.population,
            summary: r.summary,
            decision: r.decision,
            independentVerification: {
              deterministicCoreEquality: v.deterministicCoreEquality,
              fullEligibleAndNegativeRowsEquality: v.fullEligibleAndNegativeRowsEquality,
              verifiedDisposition: v.verifiedDisposition,
            },
          }, null, 2));
          NODE

      - name: Record artifact hashes
        run: sha256sum artifacts/pbai-p2/c008/development-*.json

      - uses: actions/upload-artifact@v4
        with:
          name: pbai-p2-c008-development
          path: artifacts/pbai-p2/c008/development-*.json
          if-no-files-found: error
