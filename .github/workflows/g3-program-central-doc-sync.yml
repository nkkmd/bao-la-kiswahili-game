name: Research Generation 3 program central-doc sync

on:
  push:
    branches:
      - research/g3-program-plan
    paths:
      - doc/research-generation-3/authorizations/PROGRAM_SYNC_EXECUTE.json

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout planning branch
        uses: actions/checkout@v4
        with:
          ref: research/g3-program-plan
          fetch-depth: 0

      - name: Validate authorization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('doc/research-generation-3/authorizations/PROGRAM_SYNC_EXECUTE.json').read_text(encoding='utf-8'))
          assert a['schemaVersion'] == 1
          assert a['centralDocumentSyncAuthorized'] is True
          assert a['scientificStudyExecutionAuthorized'] is False
          assert a['scientificOutcomeGenerationAuthorized'] is False
          assert a['targetBranch'] == 'research/g3-program-plan'
          assert set(a['allowedPaths']) == {'README.md', 'doc/FUTURE_RESEARCH_AGENDA.md', 'doc/RESEARCH_INDEX.md'}
          PY

      - name: Synchronize central documents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          agenda = Path('doc/FUTURE_RESEARCH_AGENDA.md')
          text = agenda.read_text(encoding='utf-8')
          assert '## 10. 第三世代研究アジェンダ' not in text
          text = replace_once(text, 'Version: 2.0.0', 'Version: 3.0.0', 'agenda version')
          text = replace_once(
              text,
              'Research Generation 2: **Closed (2026-08-31)**',
              'Research Generation 2: **Closed (2026-08-31)**\nResearch Generation 3: **Prospective plan / not yet started (2026-08-31)**',
              'agenda generation status')
          section = Path('doc/research-generation-3/sync/FUTURE_RESEARCH_AGENDA_SECTION.md').read_text(encoding='utf-8').strip()
          agenda.write_text(text.rstrip() + '\n\n' + section + '\n', encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          assert 'doc/research-generation-3/PROGRAM_PLAN.md' not in text
          anchor = '- [`doc/research-generation-2/FINAL_SYNTHESIS.md`](doc/research-generation-2/FINAL_SYNTHESIS.md): Research Generation 2 final synthesis。Core `G2-01..G2-12`はformal closure。G2-11はrequired frozen representation不成立によりagenda-level `NON-ESTIMABLE` / execution `NOT-AUTHORIZED-NOT-EXECUTED`（Study ID未付与）で閉じ、G2-H01はindependent / non-blocking human trackとしてdeferred。'
          addition = anchor + '\n' + '- [`doc/research-generation-3/PROGRAM_PLAN.md`](doc/research-generation-3/PROGRAM_PLAN.md): Research Generation 3 prospective program plan。局所ゲーム木幾何、effective branching、reply width、transposition、tree/graph divergence、geometry dynamics、search mechanism、protected depth-10 exact holdout、generalization boundaryを`G3-01..G3-12`として計画。scientific Studyは未開始。\n' + '- [`doc/research-generation-3/CURRENT_STATUS.md`](doc/research-generation-3/CURRENT_STATUS.md): Research Generation 3の現在状態。G3-01 formal Study ID未付与、seed未消費、depth 10はG3-11用holdoutとしてsealed。'
          readme.write_text(replace_once(text, anchor, addition, 'README synthesis anchor'), encoding='utf-8')

          index = Path('doc/RESEARCH_INDEX.md')
          text = index.read_text(encoding='utf-8')
          assert '### 30. Research Generation 3 — Prospective Program Plan' not in text
          section = Path('doc/research-generation-3/sync/RESEARCH_INDEX_SECTION.md').read_text(encoding='utf-8').strip()
          text = replace_once(text, '## 将来研究\n', section + '\n\n## 将来研究\n', 'research index section')
          text = replace_once(
              text,
              '## 将来研究\n\n**Research Generation 2 state:**',
              '## 将来研究\n\n**Research Generation 3 state:** prospective plan recorded on 2026-08-31; scientific Study execution has not started. G3-01 is the first recommended agenda item, and standard-root depth 10 is sealed for G3-11.\n\n**Research Generation 2 state:**',
              'research index future status')
          index.write_text(text, encoding='utf-8')
          PY

      - name: Verify diff scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {'README.md', 'doc/FUTURE_RESEARCH_AGENDA.md', 'doc/RESEARCH_INDEX.md'}
          lines = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          paths = {line[3:] for line in lines if line.strip()}
          assert paths == expected, (paths, expected)
          PY

      - name: Commit synchronized central documents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md doc/FUTURE_RESEARCH_AGENDA.md doc/RESEARCH_INDEX.md
          git commit -m "Synchronize Research Generation 3 program plan"
          git push origin HEAD:research/g3-program-plan
