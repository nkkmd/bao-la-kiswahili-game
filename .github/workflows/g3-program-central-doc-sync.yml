          PY

      - name: Verify central-document diff scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {'README.md', 'doc/FUTURE_RESEARCH_AGENDA.md', 'doc/RESEARCH_INDEX.md'}
          lines = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          paths = {line[3:] for line in lines if line.strip()}
          assert paths == expected, (paths, expected)
          PY

      - name: Commit synchronized central documents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md doc/FUTURE_RESEARCH_AGENDA.md doc/RESEARCH_INDEX.md
          git commit -m "Synchronize Research Generation 3 program plan"
          git push origin HEAD:research/g3-program-plan
