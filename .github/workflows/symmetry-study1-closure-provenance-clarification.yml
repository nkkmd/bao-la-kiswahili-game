name: Symmetry Study 1 Closure Provenance Clarification

on:
  push:
    branches:
      - research/symmetry-isomorphic-positions
    paths:
      - "tools/experiments/clarify-symmetry-study1-closure-provenance.js"

permissions:
  contents: write

jobs:
  clarify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply closure provenance clarification
        run: node tools/experiments/clarify-symmetry-study1-closure-provenance.js
      - name: Verify canonical closure language
        run: |
          grep -F "v1 candidate-decision run was technically invalidated" doc/symmetry-isomorphic-positions/CURRENT_STATUS.md
          grep -F "v2 was not authorized or executed" doc/symmetry-isomorphic-positions/STUDY_1_OVERVIEW.md
          grep -F "Study-level closure decision" doc/symmetry-isomorphic-positions/STUDY_1_FINAL_REPORT.md
          grep -F "invalidated v1 diagnostic" doc/RESEARCH_INDEX.md
          grep -F "v2は未承認・未実行" doc/FUTURE_RESEARCH_AGENDA.md
      - name: Commit clarification
        run: |
          if git diff --quiet -- README.md doc/FUTURE_RESEARCH_AGENDA.md doc/RESEARCH_INDEX.md doc/symmetry-isomorphic-positions; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md doc/FUTURE_RESEARCH_AGENDA.md doc/RESEARCH_INDEX.md doc/symmetry-isomorphic-positions
          git commit -m "Research: clarify Symmetry Study 1 v1 invalidation and closure provenance"
          git push
