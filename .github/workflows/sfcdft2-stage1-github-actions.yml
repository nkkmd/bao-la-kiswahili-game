name: SFCDFT2 Stage 1 GitHub Actions execution

on:
  push:
    branches:
      - research/g4-02-sfcdft-study2-prereg
    paths:
      - 'doc/structural-forcing-corridor-tree-raw-transfer/authorizations/STUDY_2_STAGE_1_EXECUTION_AUTHORIZATION.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: sfcdft2-stage1-fresh-execution
  cancel-in-progress: false

jobs:
  gate:
    name: Study2 authorization and frozen matrix gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source: ${{ steps.matrices.outputs.source }}
      measurement: ${{ steps.matrices.outputs.measurement }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject workflow rerun attempts
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT}" != '1' ]; then
            echo 'Study2 Stage 1 fresh workflow rerun is forbidden.' >&2
            exit 1
          fi
      - name: Require first creation of final Study2 authorization
        shell: bash
        run: |
          set -euo pipefail
          auth='doc/structural-forcing-corridor-tree-raw-transfer/authorizations/STUDY_2_STAGE_1_EXECUTION_AUTHORIZATION.json'
          test -f "$auth"
          if git cat-file -e "${GITHUB_SHA}^:${auth}" 2>/dev/null; then
            echo 'Study2 final Stage 1 authorization already existed in the parent commit; a second fresh workflow run is forbidden.' >&2
            exit 1
          fi
      - name: Verify frozen Study2 authorization and source binding
        run: node tools/experiments/verify-sfcdft2-stage1-actions-authorization.js
      - name: Generate frozen Study2 matrices
        id: matrices
        run: node tools/experiments/generate-sfcdft2-stage1-actions-matrices.js

  acquire-primary:
    name: Study2 primary quartet ${{ matrix.s1 }}-${{ matrix.s4 }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.gate.outputs.source) }}
    steps:
      - uses: actions/checkout@v4
      - id: s1
        continue-on-error: true
        uses: ./.github/actions/sfcdft2-stage1-acquire-slot
        with: { slot-seed: '${{ matrix.s1 }}', role: PRIMARY }
      - id: s2
        continue-on-error: true
        uses: ./.github/actions/sfcdft2-stage1-acquire-slot
        with: { slot-seed: '${{ matrix.s2 }}', role: PRIMARY }
      - id: s3
        continue-on-error: true
        uses: ./.github/actions/sfcdft2-stage1-acquire-slot
        with: { slot-seed: '${{ matrix.s3 }}', role: PRIMARY }
      - id: s4
        continue-on-error: true
        uses: ./.github/actions/sfcdft2-stage1-acquire-slot
        with: { slot-seed: '${{ matrix.s4 }}', role: PRIMARY }
      - name: Propagate quartet failure after all possible slots
        if: always()
        shell: bash
        run: |
          test '${{ steps.s1.outcome }}' = success && test '${{ steps.s2.outcome }}' = success && test '${{ steps.s3.outcome }}' = success && test '${{ steps.s4.outcome }}' = success

  classify-primary:
    name: Classify Study2 primary acquisition
    if: ${{ always() && needs.gate.result == 'success' }}
    needs: [gate, acquire-primary]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      fatal: ${{ steps.classify.outputs.fatal }}
      retry_a: ${{ steps.classify.outputs.retry_a }}
      retry_b: ${{ steps.classify.outputs.retry_b }}
    steps:
      - uses: actions/checkout@v4
      - name: List immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[].name' > artifact-names.txt
      - id: classify
        run: node tools/experiments/classify-sfcdft2-stage1-actions-artifacts.js --mode primary --names artifact-names.txt --summary primary-classification.json
      - uses: actions/upload-artifact@v4
        with:
          name: sfcdft2-s1-primary-classification
          path: primary-classification.json
          retention-days: 90

  retry-primary-a:
    name: Study2 safe pre-read retry A ${{ matrix.slot }}
    needs: classify-primary
    if: ${{ needs.classify-primary.outputs.fatal != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.classify-primary.outputs.retry_a) }}
    steps:
      - if: ${{ matrix.slot != 0 }}
        uses: actions/checkout@v4
      - if: ${{ matrix.slot != 0 }}
        uses: ./.github/actions/sfcdft2-stage1-acquire-slot
        with: { slot-seed: '${{ matrix.slot }}', role: PRIMARY }

  retry-primary-b:
    name: Study2 safe pre-read retry B ${{ matrix.slot }}
    needs: classify-primary
    if: ${{ needs.classify-primary.outputs.fatal != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.classify-primary.outputs.retry_b) }}
    steps:
      - if: ${{ matrix.slot != 0 }}
        uses: actions/checkout@v4
      - if: ${{ matrix.slot != 0 }}
        uses: ./.github/actions/sfcdft2-stage1-acquire-slot
        with: { slot-seed: '${{ matrix.slot }}', role: PRIMARY }

  classify-post-retry:
    name: Classify Study2 after safe pre-read retry
    if: ${{ always() && needs.gate.result == 'success' }}
    needs: [gate, classify-primary, retry-primary-a, retry-primary-b]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      fatal: ${{ steps.classify.outputs.fatal }}
      reserve_matrix: ${{ steps.classify.outputs.reserve_matrix }}
      reserve_count: ${{ steps.classify.outputs.reserve_count }}
    steps:
      - uses: actions/checkout@v4
      - name: List immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[].name' > artifact-names.txt
      - id: classify
        run: node tools/experiments/classify-sfcdft2-stage1-actions-artifacts.js --mode post-retry --names artifact-names.txt --summary post-retry-classification.json
      - uses: actions/upload-artifact@v4
        with:
          name: sfcdft2-s1-post-retry-classification
          path: post-retry-classification.json
          retention-days: 90

  reserve:
    name: Study2 paired reserve ${{ matrix.slot }}
    needs: classify-post-retry
    if: ${{ needs.classify-post-retry.outputs.fatal != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.classify-post-retry.outputs.reserve_matrix) }}
    steps:
      - if: ${{ matrix.slot != 0 }}
        uses: actions/checkout@v4
      - if: ${{ matrix.slot != 0 }}
        uses: ./.github/actions/sfcdft2-stage1-acquire-slot
        with: { slot-seed: '${{ matrix.slot }}', role: PAIRED-RESERVE }

  classify-final:
    name: Final Study2 source acquisition classification
    if: ${{ always() && needs.gate.result == 'success' }}
    needs: [gate, classify-post-retry, reserve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.classify.outputs.ready }}
      fatal: ${{ steps.classify.outputs.fatal }}
      source_count: ${{ steps.classify.outputs.source_count }}
    steps:
      - uses: actions/checkout@v4
      - name: List immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[].name' > artifact-names.txt
      - id: classify
        run: node tools/experiments/classify-sfcdft2-stage1-actions-artifacts.js --mode final --names artifact-names.txt --summary final-classification.json
      - uses: actions/upload-artifact@v4
        with:
          name: sfcdft2-s1-final-classification
          path: final-classification.json
          retention-days: 90
      - name: Require complete Study2 source acquisition
        run: test '${{ steps.classify.outputs.ready }}' = 'true'

  bundle-source:
    name: Build sealed Study2 identity-filtered source bundle
    needs: [gate, classify-final]
    if: ${{ needs.classify-final.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      selection_ready: ${{ steps.selection.outputs.selection_ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sfcdft2-s1-source-*
          path: raw-source-artifacts
      - name: Bundle, firewall and freeze Study2 selected pairs
        run: node tools/experiments/bundle-sfcdft2-stage1-source.js --input raw-source-artifacts --output artifacts/sfcdft2-stage1/bundle
      - id: selection
        name: Expose Study2 selection readiness only
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const r=require('./artifacts/sfcdft2-stage1/bundle/SELECTED_SOURCE_MANIFEST.json');
          console.log(`selection_ready=${r.selectionReady?'true':'false'}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: sfcdft2-s1-source-bundle-${{ github.run_id }}
          path: artifacts/sfcdft2-stage1/bundle
          if-no-files-found: error
          retention-days: 90

  measure:
    name: Study2 seed-free measurement task ${{ matrix.task }}
    needs: [gate, bundle-source]
    if: ${{ needs.bundle-source.outputs.selection_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.gate.outputs.measurement) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sfcdft2-s1-source-bundle-${{ github.run_id }}
          path: source-bundle
      - name: Measure sealed Study2 roots without fresh seed access
        run: |
          mkdir -p "artifacts/sfcdft2-stage1/measurement/${{ matrix.task }}"
          node tools/experiments/run-sfcdft2-stage1-measurement-task.js \
            --bundle source-bundle \
            --task '${{ matrix.task }}' \
            --output "artifacts/sfcdft2-stage1/measurement/${{ matrix.task }}/result.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sfcdft2-s1-measurement-${{ matrix.task }}
          path: artifacts/sfcdft2-stage1/measurement/${{ matrix.task }}/result.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Aggregate Study2 Stage 1 compatibility result
    if: ${{ always() && needs.bundle-source.result == 'success' }}
    needs: [bundle-source, measure]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sfcdft2-s1-source-bundle-${{ github.run_id }}
          path: source-bundle
      - name: Download Study2 measurement artifacts when selected population is ready
        if: ${{ needs.bundle-source.outputs.selection_ready == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: sfcdft2-s1-measurement-*
          path: measurements
      - name: Create empty measurement directory for pre-measurement NON-ESTIMABLE path
        if: ${{ needs.bundle-source.outputs.selection_ready != 'true' }}
        run: mkdir -p measurements
      - name: Aggregate Study2 without fresh seed access
        run: |
          mkdir -p artifacts/sfcdft2-stage1/final
          node tools/experiments/run-sfcdft2-stage1-aggregate.js \
            --bundle source-bundle \
            --measurements measurements \
            --output artifacts/sfcdft2-stage1/final/STUDY_2_STAGE_1_COMPATIBILITY_RESULT.json
      - name: Verify compatibility-only output boundary
        run: |
          node - <<'NODE'
          const r=require('./artifacts/sfcdft2-stage1/final/STUDY_2_STAGE_1_COMPATIBILITY_RESULT.json');
          if(r.studyId!=='SFCDFT-STUDY2') throw new Error('Study2 identity mismatch');
          if(r.scientificEffectGenerated!==false||r.effectDirectionGenerated!==false||r.pValueGenerated!==false) throw new Error('Study2 Stage 1 output boundary violated');
          if(r.generalizationDecisionGenerated!==false||r.counterexampleDecisionGenerated!==false) throw new Error('Study2 formal decision boundary violated');
          if(!['FORMAL-PREPARATION-ELIGIBLE','NON-ESTIMABLE'].includes(r.decision)) throw new Error(`unexpected Study2 Stage 1 decision ${r.decision}`);
          console.log(JSON.stringify({decision:r.decision,selectedPairCount:r.selectedPairCount,measurementTaskCount:r.measurementTaskCount,deterministicCoreSha256:r.deterministicCoreSha256}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: sfcdft2-s1-final-result-${{ github.run_id }}
          path: artifacts/sfcdft2-stage1/final/STUDY_2_STAGE_1_COMPATIBILITY_RESULT.json
          if-no-files-found: error
          retention-days: 90
