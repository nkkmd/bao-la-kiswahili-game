name: PBAI-P2 C006 baseline-only support

on:
  pull_request:
    branches: [main]
    paths:
      - 'doc/ai-engineering/public-ai-improvement-program-2/**'
      - 'doc/engineering-program-decisions/2026-09-01-public-ai-improvement-program-2.md'
      - 'tools/engineering/materialize-pbai-p2-c006-predevelopment-support.js'
      - 'tools/engineering/verify-pbai-p2-c006-predevelopment-support-independent.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-only-support:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify predevelopment change contains no public implementation
        run: |
          changed="$(git diff --name-only origin/main...HEAD -- public/)"
          test -z "$changed" || {
            echo 'PBAI-C006 predevelopment support must not modify public/.' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }

      - name: Verify frozen AI-GEN2 source hashes
        run: |
          test "$(sha256sum public/engine.js | awk '{print $1}')" = "e6acf1fe4d97db67dbcfadc3a785e802342ae0b0cbaec35f53eb8e77424cfc1c"
          test "$(sha256sum public/ai.js | awk '{print $1}')" = "2823dbcf96c7a47489301ecd768a63975aa8b4e12b62cc4629fc8283ef5dff9e"

      - name: Validate frozen support contract
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const spec = JSON.parse(fs.readFileSync(
            'doc/ai-engineering/public-ai-improvement-program-2/candidates/PBAI-C006-v1-predevelopment-support-spec.json',
            'utf8',
          ));
          const fail = (m) => { throw new Error(m); };
          if (spec.program !== 'PBAI-P2') fail('program mismatch');
          if (spec.candidateVersion !== 'PBAI-C006-v1') fail('candidate mismatch');
          if (spec.status !== 'FROZEN-BEFORE-DYNAMIC-SUPPORT-OUTCOME') fail('support spec not frozen');
          if (spec.scientificEvidenceCutoff !== 'cd200b85c1eb24aa4419bd5a9573552f3682f00d') fail('G2 cutoff mismatch');
          if (spec.researchGeneration3Influence !== false) fail('G3 firewall failed');
          if (spec.candidateCodeAllowed !== false || spec.publicImplementationChangeAllowed !== false) fail('implementation leaked');
          if (spec.population.seedStart !== 43000001 || spec.population.seedEnd !== 43002048 || spec.population.seedCount !== 2048) fail('support seed block changed');
          if (spec.population.maximumGamePlies !== 160) fail('maximum game plies changed');
          if (spec.population.localSearchRootSelection.targetPerPhase !== 128) fail('local root target changed');
          if (spec.population.localSearchRootSelection.maximumLocalDepthPlies !== 4) fail('local depth changed');
          if (spec.gate.minimumSemanticCollisionWitnesses !== 1 || spec.gate.minimumPracticalWitnesses !== 1) fail('support gate changed');
          if (spec.firewall.validationSeedsMayBeRead !== false || spec.firewall.releaseHoldoutSeedsMayBeRead !== false) fail('protected split leaked');
          NODE

      - name: Verify support runners are baseline-only
        run: |
          for f in \
            tools/engineering/materialize-pbai-p2-c006-predevelopment-support.js \
            tools/engineering/verify-pbai-p2-c006-predevelopment-support-independent.js; do
            ! grep -E '(^|[^0-9])(42[1-9][0-9]{5}|43[1-9][0-9]{5})([^0-9]|$)' "$f" || {
              echo "Protected or other-candidate seed literal found in $f" >&2
              exit 1
            }
            ! grep -E "require\(.*(experiments|research-generation-3|local-game-tree)" "$f" || {
              echo "Forbidden research/tool import found in $f" >&2
              exit 1
            }
          done

      - name: Materialize frozen baseline-only support
        run: |
          mkdir -p artifacts/pbai-p2/c006
          node tools/engineering/materialize-pbai-p2-c006-predevelopment-support.js \
            --output artifacts/pbai-p2/c006/predevelopment-support.json

      - name: Independently reproduce support core
        run: |
          node tools/engineering/verify-pbai-p2-c006-predevelopment-support-independent.js \
            --production artifacts/pbai-p2/c006/predevelopment-support.json \
            --output artifacts/pbai-p2/c006/predevelopment-support-verification.json

      - name: Verify firewalls in produced evidence
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('artifacts/pbai-p2/c006/predevelopment-support.json', 'utf8'));
          const verification = JSON.parse(fs.readFileSync('artifacts/pbai-p2/c006/predevelopment-support-verification.json', 'utf8'));
          if (result.candidateCodeUsed !== false) throw new Error('candidate code used');
          if (result.candidateImplementationObserved !== false) throw new Error('candidate implementation observed');
          if (result.validationSeedsAccessed !== false) throw new Error('validation accessed');
          if (result.releaseHoldoutSeedsAccessed !== false) throw new Error('holdout accessed');
          if (result.researchGeneration3ArtifactsAccessed !== false) throw new Error('G3 artifact access reported');
          if (result.core.decision.candidateImplementationAuthorized !== false) throw new Error('implementation authorization leaked');
          if (result.core.decision.validationAuthorized !== false) throw new Error('validation authorization leaked');
          if (result.core.decision.releaseHoldoutAuthorized !== false) throw new Error('holdout authorization leaked');
          if (verification.passed !== true || verification.fullDeterministicCoreEquality !== true) throw new Error('independent verification failed');
          console.log(JSON.stringify({
            deterministicCoreSha256: result.deterministicCoreSha256,
            semanticCollisionWitnesses: result.core.measurement.semanticCollisionWitnesses,
            naturalReachableCollisionWitnesses: result.core.measurement.naturalReachableCollisionWitnesses,
            workerStaleIdentityWitnesses: result.core.measurement.workerStaleIdentityWitnesses,
            localEvaluationCacheCollisionEvents: result.core.measurement.localEvaluationCacheCollisionEvents,
            localTranspositionCollisionEvents: result.core.measurement.localTranspositionCollisionEvents,
            practicalWitnessCount: result.core.measurement.practicalWitnessCount,
            disposition: result.core.decision.disposition,
            supportPass: result.core.decision.supportPass,
          }, null, 2));
          NODE

      - name: Record artifact hashes
        run: sha256sum artifacts/pbai-p2/c006/*.json

      - uses: actions/upload-artifact@v4
        with:
          name: pbai-p2-c006-predevelopment-support
          path: artifacts/pbai-p2/c006/*.json
          if-no-files-found: error
