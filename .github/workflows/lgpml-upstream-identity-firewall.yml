name: LGPML Upstream Identity Firewall
on:
  push:
    branches:
      - research/g3-08-local-geometry-persistence-memory-length
    paths:
      - doc/local-geometry-persistence-memory-length/authorizations/lgpml-firewall-trigger.txt
concurrency:
  group: lgpml-upstream-identity-firewall
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Verify trigger-only commit
        run: |
          test "$(git diff --name-only HEAD^ HEAD)" = "doc/local-geometry-persistence-memory-length/authorizations/lgpml-firewall-trigger.txt"
      - name: Syntax check
        run: node --check tools/experiments/materialize-lgpml-upstream-identity-firewall.js
      - name: Materialize identity-only firewall
        run: node tools/experiments/materialize-lgpml-upstream-identity-firewall.js
      - name: Verify no fresh scientific access marker
        run: |
          node - <<'NODE'
          const x=require('./doc/local-geometry-persistence-memory-length/prereg/UPSTREAM_IDENTITY_FIREWALL.json');
          if(x.scientificOutcomeFieldsRetained!==false||x.freshLgpmlStage1SeedAccess!==false||x.protectedDepth10Access!==false) process.exit(2);
          if(x.g307Stage2IdentityMaterialization.scientificMeasurementFunctionsCalled!==false) process.exit(3);
          NODE
      - name: Commit exact identity manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/local-geometry-persistence-memory-length/prereg/UPSTREAM_IDENTITY_FIREWALL.json
          git diff --cached --quiet && exit 2
          git commit -m "Materialize LGPML upstream identity-only firewall"
          git push origin HEAD:research/g3-08-local-geometry-persistence-memory-length
