name: PSRRE Final Documentation Quality

# Archived after PSRRE-STUDY1 closure: no manual dispatch is exposed on main.
on:
  push:
    branches:
      - research/pre-g2-11-strategic-regime-representation-eligibility
    paths:
      - 'tools/experiments/finalize-psrre-doc-quality.py'
      - '.github/workflows/psrre-doc-quality.yml'
      - 'doc/prospective-strategic-regime-representation-eligibility/checkpoints/2026-08-30-final-documentation-quality-request.md'

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/pre-g2-11-strategic-regime-representation-eligibility

      - name: Finalize and audit documentation quality
        run: python3 tools/experiments/finalize-psrre-doc-quality.py

      - name: Whitespace audit
        run: git diff --check

      - name: Commit quality corrections
        run: |
          if git diff --quiet; then
            echo 'No documentation quality changes required.'
            exit 0
          fi
          git config user.name 'Sawa'
          git config user.email '72678394+nkkmd@users.noreply.github.com'
          git add README.md \
            doc/FUTURE_RESEARCH_AGENDA.md \
            doc/research-program-decisions/2026-08-26-second-generation-pure-research-agenda.md \
            doc/research-program-decisions/2026-08-30-pre-g2-11-strategic-representation-prerequisite-selection.md
          git commit -m 'Finalize PSRRE documentation consistency [skip ci]'
          git push origin HEAD:research/pre-g2-11-strategic-regime-representation-eligibility
