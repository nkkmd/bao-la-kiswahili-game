name: RG4 G4-10 final documentation audit

on:
  push:
    branches:
      - research/g4-10-fresh-depth11-exact-reachability-topology
    paths:
      - .github/workflows/rg4-g4-10-final-doc-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit current-facing documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re, sys

          active = [
              Path('README.md'),
              Path('doc/RESEARCH_INDEX.md'),
              Path('doc/FUTURE_RESEARCH_AGENDA.md'),
              Path('doc/research-generation-4/README.md'),
              Path('doc/research-generation-4/CURRENT_STATUS.md'),
              Path('doc/research-generation-4/FINAL_SYNTHESIS.md'),
              Path('doc/research-generation-4/RESUME_HERE.md'),
              Path('doc/fresh-depth11-exact-reachability-topology/README.md'),
              Path('doc/fresh-depth11-exact-reachability-topology/CURRENT_STATUS.md'),
              Path('doc/fresh-depth11-exact-reachability-topology/FINAL_REPORT.md'),
              Path('doc/fresh-depth11-exact-reachability-topology/REPRODUCIBILITY_INDEX.md'),
              Path('doc/fresh-depth11-exact-reachability-topology/DECISION_REGISTER.md'),
              Path('doc/research-program-decisions/2026-09-28-g4-10-fresh-depth11-exact-reachability-topology-study1-closure.md'),
              Path('doc/research-generation-4/checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md'),
          ]

          errors = []
          for p in active:
              if not p.exists():
                  errors.append(f'missing active document: {p}')

          stale = [
              'G4-10 = PROTECTED / NOT AUTHORIZED / NOT ACCESSED',
              'G4-10 depth 11 = NOT AUTHORIZED / NOT ACCESSED',
              'G4-10は保護・未アクセス',
              'G4-10 PROTECTED / NEXT SCIENTIFIC AGENDA NOT AUTHORIZED',
              '`G4-10` | protected depth-11 exact topology | `PROTECTED / NOT-AUTHORIZED-NOT-ACCESSED`',
          ]
          for p in active:
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              for s in stale:
                  if s in text:
                      errors.append(f'stale current-state text in {p}: {s}')

          # Required current-state anchors.
          required = {
              Path('doc/research-generation-4/CURRENT_STATUS.md'): [
                  'G4-10 = CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / RESEARCH BRANCH',
                  'Public AI change authorized by RG4 = false',
              ],
              Path('doc/research-generation-4/RESUME_HERE.md'): [
                  'G4-10 = CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / RESEARCH BRANCH',
                  'PRE-MAIN CONSISTENCY AUDIT',
              ],
              Path('doc/fresh-depth11-exact-reachability-topology/CURRENT_STATUS.md'): [
                  'formal decision = NON-ESTIMABLE',
                  'stop reason = UNIQUE_STATE_CAP',
                  'main integration = NOT YET PERFORMED',
              ],
              Path('doc/fresh-depth11-exact-reachability-topology/FINAL_REPORT.md'): [
                  'NON-ESTIMABLE / UNIQUE_STATE_CAP',
                  'same-evidence rerun = false',
              ],
              Path('doc/research-generation-4/FINAL_SYNTHESIS.md'): [
                  'G4-10', 'NON-ESTIMABLE', 'UNIQUE_STATE_CAP',
              ],
          }
          for p, needles in required.items():
              text = p.read_text(encoding='utf-8') if p.exists() else ''
              for s in needles:
                  if s not in text:
                      errors.append(f'missing required anchor in {p}: {s}')

          # Parse all G4-10 JSON records and verify canonical outcome.
          g4dir = Path('doc/fresh-depth11-exact-reachability-topology')
          for p in g4dir.rglob('*.json'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  errors.append(f'invalid JSON {p}: {e}')

          canon_path = g4dir / 'results/stage-1/STAGE_1_CANONICAL_RECORD.json'
          canon = json.loads(canon_path.read_text(encoding='utf-8'))
          checks = [
              (canon.get('formalDecision') == 'NON-ESTIMABLE', 'canonical formalDecision'),
              (canon.get('domain', {}).get('stopReason') == 'UNIQUE_STATE_CAP', 'canonical stopReason'),
              (canon.get('domain', {}).get('targetDepth') == 11, 'canonical targetDepth'),
              (canon.get('domain', {}).get('targetComplete') is False, 'canonical targetComplete'),
              (canon.get('domain', {}).get('lastCompleteDepth') == 10, 'canonical lastCompleteDepth'),
              (canon.get('domain', {}).get('firstIncompleteDepth') == 11, 'canonical firstIncompleteDepth'),
              (canon.get('completePrefixThroughDepth10', {}).get('distinctRawStates') == 451127, 'canonical prefix states'),
              (canon.get('completePrefixThroughDepth10', {}).get('depthLabelledLegalEdgesThroughParentDepth9') == 466768, 'canonical prefix edges'),
              (canon.get('completePrefixThroughDepth10', {}).get('treeNodeOccurrences') == '631101', 'canonical tree nodes'),
              (canon.get('execution', {}).get('scientificExecutionsActual') == 1, 'canonical execution count'),
              (canon.get('execution', {}).get('sameEvidenceRerunAuthorized') is False, 'canonical rerun boundary'),
              (canon.get('interpretation', {}).get('publicAiChangeAuthorized') is False, 'canonical AI boundary'),
          ]
          for ok, label in checks:
              if not ok:
                  errors.append(f'failed {label}')
          if any(v != 'NON-ESTIMABLE' for v in canon.get('targetDecisions', {}).values()):
              errors.append('canonical T1..T4 are not all NON-ESTIMABLE')

          # Relative Markdown link audit for active docs. Directories resolve to README.md.
          link_re = re.compile(r'(?<!!)\[[^\]]*\]\(([^)]+)\)')
          for p in active:
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              for raw in link_re.findall(text):
                  target = raw.strip().split()[0].strip('<>')
                  if not target or target.startswith(('#', 'http://', 'https://', 'mailto:')):
                      continue
                  target = target.split('#', 1)[0]
                  if not target:
                      continue
                  q = (p.parent / target).resolve()
                  try:
                      q.relative_to(Path.cwd().resolve())
                  except ValueError:
                      errors.append(f'link escapes repository in {p}: {raw}')
                      continue
                  if q.is_dir():
                      q = q / 'README.md'
                  if not q.exists():
                      errors.append(f'broken relative link in {p}: {raw}')

          # Repository-scope boundary against main.
          import subprocess
          subprocess.run(['git','fetch','origin','main:refs/remotes/origin/main'], check=True)
          changed = subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'], text=True).splitlines()
          if any(x.startswith('public/') for x in changed):
              errors.append('public/ changed relative to main')
          if 'README.md' in changed:
              errors.append('root README.md changed relative to main')
          if 'doc/research-generation-4/PROGRAM_PLAN.md' in changed:
              errors.append('frozen RG4 PROGRAM_PLAN.md changed relative to main')

          report = []
          report.append('# G4-10 final documentation audit — machine check')
          report.append('')
          report.append('Branch: `research/g4-10-fresh-depth11-exact-reachability-topology`')
          report.append('')
          report.append(f'Active documents checked: {len(active)}')
          report.append(f'G4-10 JSON files parsed: {len(list(g4dir.rglob("*.json")))}')
          report.append(f'Changed paths vs main: {len(changed)}')
          report.append('')
          if errors:
              report.append('Decision: **FAIL**')
              report.append('')
              report.extend(f'- {e}' for e in errors)
          else:
              report.append('Decision: **PASS**')
              report.append('')
              report.append('- no stale current-state marker in active documents')
              report.append('- required G4-10 closure anchors present')
              report.append('- all G4-10 JSON files parse successfully')
              report.append('- canonical outcome and no-rescue/public-AI boundaries match')
              report.append('- active-document relative Markdown links resolve')
              report.append('- no `public/`, root `README.md`, or frozen RG4 `PROGRAM_PLAN.md` change vs main')
          Path('/tmp/g4-10-final-doc-audit.md').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          if errors:
              sys.exit(1)
          PY

      - name: Record PASS and remove one-shot workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/g4-10-final-doc-audit.md doc/research-generation-4/checkpoints/2026-09-28-g4-10-final-documentation-audit.md
          rm .github/workflows/rg4-g4-10-final-doc-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doc/research-generation-4/checkpoints/2026-09-28-g4-10-final-documentation-audit.md .github/workflows/rg4-g4-10-final-doc-audit.yml
          git commit -m 'docs(rg4): record final G4-10 documentation audit'
          git push origin HEAD:research/g4-10-fresh-depth11-exact-reachability-topology
