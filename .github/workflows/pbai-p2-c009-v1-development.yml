# Canonical development restart after pre-outcome syntax-only correction; no gates or populations changed.
name: PBAI-P2 C009 frozen development

on:
  push:
    branches:
      - engineering/pbai-p2-c009-v1-development
    paths:
      - 'tools/engineering/run-pbai-p2-c009-v1-development.js'
      - 'tools/engineering/verify-pbai-p2-c009-v1-development-independent.js'
      - '.github/workflows/pbai-p2-c009-v1-development.yml'

permissions:
  contents: read

jobs:
  frozen-development:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify candidate, equivalence, gates, and firewalls
        run: |
          test "$(sha256sum public/ai.js | awk '{print $1}')" = "750678ec33c916da35844dc2d999cc3b996c1cc6ec79ad84e12030f0da84517f"
          test "$(sha256sum public/engine.js | awk '{print $1}')" = "e6acf1fe4d97db67dbcfadc3a785e802342ae0b0cbaec35f53eb8e77424cfc1c"
          changed_public="$(git diff --name-only 51f0eb9244c87cb1bb106a018bb0057d70f61ac8 -- public/)"
          test "$changed_public" = "public/ai.js" || {
            echo 'unexpected public source surface' >&2
            printf '%s\n' "$changed_public" >&2
            exit 1
          }
          grep -q 'const pbaiC009Enabled = options.pbaiC009SingleReplyExtension === true' public/ai.js
          node --check tools/engineering/run-pbai-p2-c009-v1-development.js
          node --check tools/engineering/verify-pbai-p2-c009-v1-development-independent.js
          node - <<'NODE'
          const fs=require('node:fs');
          const base='doc/ai-engineering/public-ai-improvement-program-2/candidates/';
          const s=JSON.parse(fs.readFileSync(`${base}PBAI-C009-v1-development-measurement-spec.json`,'utf8'));
          const e=JSON.parse(fs.readFileSync(`${base}PBAI-C009-v1-feature-off-equivalence-result.json`,'utf8'));
          if(s.status!=='FROZEN-BEFORE-CANDIDATE-SOURCE-CHANGE-AND-DEVELOPMENT-OUTCOME') throw new Error('development spec is not prospectively frozen');
          if(e.decision.disposition!=='FEATURE-OFF-EQUIVALENCE-PASS') throw new Error('feature-off prerequisite failed');
          if(e.candidateAiSha256!=='750678ec33c916da35844dc2d999cc3b996c1cc6ec79ad84e12030f0da84517f') throw new Error('candidate hash binding changed');
          if(s.population.sourceSeedStart!==42400001||s.population.sourceSeedEnd!==42400512||s.population.sourceSeedCount!==512) throw new Error('development population changed');
          if(s.population.runtimeEligible.minimumEstimableTotal!==64||s.population.runtimeEligible.maximumTotal!==128) throw new Error('eligible population gate changed');
          const g=s.frozenDevelopmentGate;
          if(g.primary.topSetAgreementDeltaMinimum!==0.03||g.primary.meanNormalizedRankLossDeltaMaximum!==-0.01) throw new Error('primary gate changed');
          if(g.safety.severeLossRateExcessOverBaselineMaximum!==0||g.safety.catastrophicNewLossCountMaximum!==0) throw new Error('safety gate changed');
          if(g.cost.medianNodeRatioMaximum!==1.25||g.cost.p95NodeRatioMaximum!==1.75) throw new Error('cost gate changed');
          if(g.runtimeCoverage.eligibleRootTriggeredExtensionsMinimum!==1||g.runtimeCoverage.maxExtensionsPerObservedPathMaximum!==1) throw new Error('runtime coverage gate changed');
          if(s.firewall.validationSeeds425MayBeAccessed!==false||s.firewall.releaseHoldoutSeeds426MayBeAccessed!==false||s.firewall.researchGeneration3ArtifactsMayBeRead!==false) throw new Error('protected firewall changed');
          if(s.firewall.developmentOutcomeMayTuneMechanism!==false||s.firewall.developmentOutcomeMayTuneThresholds!==false) throw new Error('no-retune firewall changed');
          if(s.researchGeneration3Influence!==false) throw new Error('G3 firewall changed');
          NODE

      - name: Materialize frozen AI-GEN2 baseline
        run: |
          mkdir -p artifacts/pbai-p2/c009/development
          git show 2265fb7ccbf6cf6dde6ab08d5519e44e61b9e972:public/ai.js > artifacts/pbai-p2/c009/development/baseline-ai.js
          test "$(sha256sum artifacts/pbai-p2/c009/development/baseline-ai.js | awk '{print $1}')" = "2823dbcf96c7a47489301ecd768a63975aa8b4e12b62cc4629fc8283ef5dff9e"

      - name: Run frozen production development measurement
        run: |
          node tools/engineering/run-pbai-p2-c009-v1-development.js \
            --baseline-ai artifacts/pbai-p2/c009/development/baseline-ai.js \
            --output artifacts/pbai-p2/c009/development/result.json

      - name: Independently reconstruct frozen development measurement
        run: |
          node tools/engineering/verify-pbai-p2-c009-v1-development-independent.js \
            --baseline-ai artifacts/pbai-p2/c009/development/baseline-ai.js \
            --production artifacts/pbai-p2/c009/development/result.json \
            --output artifacts/pbai-p2/c009/development/verification.json

      - name: Verify reconstruction, decision domain, and protected boundaries
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('artifacts/pbai-p2/c009/development/result.json','utf8'));
          const v=JSON.parse(fs.readFileSync('artifacts/pbai-p2/c009/development/verification.json','utf8'));
          if(v.productionRunnerImported!==false||v.productionPopulationTrustedWithoutReconstruction!==false) throw new Error('independent boundary failed');
          for(const k of ['strictRawPopulationReconstructed','baselineSingleReplyEligibilityReconstructed','d4ReferenceReconstructed','candidateAndBaselineMetricsReconstructed','aggregateDecisionReconstructed','sourceHashesVerified','eligibleRowsEquality','negativeControlRowsEquality','populationEquality','summaryEquality','decisionEquality','deterministicCoreEquality','passed']) if(v[k]!==true) throw new Error(`independent verification failed: ${k}`);
          const allowed=['TECHNICAL-INVALID-REJECT-OR-HOLD','DEVELOPMENT-NON-ESTIMABLE-HOLD','REJECT-HOLD','DEVELOPMENT-BENEFIT-FAIL-HOLD','DEVELOPMENT-PASS-VALIDATION-CONTRACT-FREEZE-AUTHORIZED'];
          if(!allowed.includes(r.decision.disposition)) throw new Error('unexpected development disposition');
          if(r.firewalls.supportSeeds433Accessed!==false||r.firewalls.featureOffSeeds435Accessed!==false||r.firewalls.validationSeeds425Accessed!==false||r.firewalls.releaseHoldoutSeeds426Accessed!==false||r.firewalls.researchGeneration3ArtifactsAccessed!==false||r.firewalls.c008DevelopmentFullRowsAccessed!==false) throw new Error('development firewall failed');
          if(r.decision.validationExecutionAuthorized!==false||r.decision.releaseHoldoutExecutionAuthorized!==false||r.decision.publicDeploymentAuthorized!==false||r.decision.aiGen3PromotionAuthorized!==false) throw new Error('protected authorization leaked');
          console.log(JSON.stringify({deterministicCoreSha256:r.deterministicCoreSha256,population:r.population,summary:r.summary,decision:r.decision,independentVerification:v},null,2));
          NODE

      - name: Record artifact hashes
        run: |
          sha256sum artifacts/pbai-p2/c009/development/result.json
          sha256sum artifacts/pbai-p2/c009/development/verification.json

      - uses: actions/upload-artifact@v4
        with:
          name: pbai-p2-c009-frozen-development
          path: |
            artifacts/pbai-p2/c009/development/result.json
            artifacts/pbai-p2/c009/development/verification.json
          if-no-files-found: error
