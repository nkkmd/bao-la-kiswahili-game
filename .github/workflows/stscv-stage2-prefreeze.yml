name: STSCV Stage 2 Prefreeze

on:
  push:
    branches:
      - research/g2-03-state-transformation-semantics-canonicalization-validation
    paths:
      - 'doc/state-transformation-semantics-canonicalization-validation/results/STAGE_1_DEVELOPMENT_RESULT.json'
      - 'doc/state-transformation-semantics-canonicalization-validation/preregistration/STAGE_2_FIREWALL.json'
      - 'doc/state-transformation-semantics-canonicalization-validation/preregistration/STAGE_2_SPEC.json'
      - 'doc/state-transformation-semantics-canonicalization-validation/preregistration/STAGE_2_DECISION_RULE.json'
      - 'tools/experiments/run-stscv-stage2-prefreeze.js'
      - 'tools/experiments/stscv-stage2-formal-parts/**'
      - '.github/workflows/stscv-stage2-prefreeze.yml'
      - '.github/workflows/stscv-stage2-formal.yml'

jobs:
  prefreeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine regression
        run: node test/engine.test.js
      - name: Reconstruct and syntax-check frozen formal sources
        run: |
          cat tools/experiments/stscv-stage2-formal-parts/run-stscv-stage2-formal.part*.jsfrag > tools/experiments/run-stscv-stage2-formal.generated.js
          cat tools/experiments/stscv-stage2-formal-parts/verify-stscv-stage2-formal.part*.jsfrag > tools/experiments/verify-stscv-stage2-formal.generated.js
          node --check tools/experiments/run-stscv-stage2-formal.generated.js
          node --check tools/experiments/verify-stscv-stage2-formal.generated.js
      - name: Validate Stage 2 source, firewall, and formal rule freeze
        run: |
          mkdir -p artifacts/local/state-transformation-semantics-canonicalization-validation/stage2-prefreeze-v1
          node tools/experiments/run-stscv-stage2-prefreeze.js \
            --output artifacts/local/state-transformation-semantics-canonicalization-validation/stage2-prefreeze-v1/STAGE_2_PREFREEZE_MANIFEST.json
      - uses: actions/upload-artifact@v4
        with:
          name: stscv-stage2-prefreeze-v1
          path: artifacts/local/state-transformation-semantics-canonicalization-validation/stage2-prefreeze-v1/STAGE_2_PREFREEZE_MANIFEST.json
          if-no-files-found: error
