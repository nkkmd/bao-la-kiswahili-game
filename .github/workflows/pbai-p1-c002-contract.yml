name: PBAI-P1 C002 contract freeze

on:
  pull_request:
    branches: [main]
    paths:
      - 'doc/ai-engineering/public-ai-improvement-program-1/candidates/PBAI-C002-v1.json'
      - 'doc/ai-engineering/public-ai-improvement-program-1/CANDIDATE_REGISTER.md'
      - 'doc/ai-engineering/public-ai-improvement-program-1/CURRENT_STATUS.md'
      - 'doc/ai-engineering/public-ai-improvement-program-1/DECISION_REGISTER.md'
      - 'tools/engineering/validate-pbai-c002-contract.js'
      - 'test/public-ai-improvement-program1-contract.test.js'
      - '.github/workflows/pbai-p1-c002-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-freeze-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify baseline source remains frozen
        run: node tools/engineering/verify-pbai-ai-gen2-baseline-freeze.js
      - name: Verify PBAI-C global gate freeze remains valid
        run: node tools/engineering/validate-pbai-p1-gate-spec.js
      - name: Validate PBAI-C002-v1 candidate contract
        run: node tools/engineering/validate-pbai-c002-contract.js
      - name: Verify no public implementation exists in contract-freeze PR
        run: |
          if git diff --name-only origin/main...HEAD -- public/ | grep -q .; then
            echo 'PBAI-D contract freeze must not include public implementation changes.' >&2
            exit 1
          fi
      - name: Verify PBAI-P1 program contract
        run: node test/public-ai-improvement-program1-contract.test.js
