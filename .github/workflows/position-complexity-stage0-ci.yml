name: Position Complexity Research CI

on:
  pull_request:
    paths:
      - "tools/experiments/lib/position-complexity-search-diagnostic.js"
      - "tools/experiments/run-position-complexity-stage0-smoke.js"
      - "tools/experiments/run-position-complexity-stage1-exploratory.js"
      - "tools/experiments/verify-position-complexity-stage1-exploratory.js"
      - "tools/experiments/analyze-position-complexity-stage1-exploratory.py"
      - "test/position-complexity-search-diagnostic.test.js"
      - "test/position-complexity-stage1-runner.test.js"
      - "test/search.test.js"
      - "doc/position-complexity/preregistration/STAGE_1_EXPLORATORY_SPEC.json"
      - ".github/workflows/position-complexity-stage0-ci.yml"
  workflow_dispatch:

jobs:
  technical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Existing search regression
        run: node test/search.test.js
      - name: Position-complexity diagnostic unit tests
        run: node test/position-complexity-search-diagnostic.test.js
      - name: Position-complexity Stage 0 smoke
        run: node tools/experiments/run-position-complexity-stage0-smoke.js > /tmp/position-complexity-stage0-smoke.json
      - name: Show Stage 0 gate summary
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('/tmp/position-complexity-stage0-smoke.json', 'utf8'));
          console.log(JSON.stringify({
            passed: result.passed,
            aggregateGates: result.aggregateGates,
            G0_9_existingSearchBehaviorProtection: result.G0_9_existingSearchBehaviorProtection,
            fixtureCount: result.fixtures.length,
          }, null, 2));
          if (!result.passed) process.exit(1);
          NODE
      - name: Position-complexity Stage 1 runner/verifier unit tests
        run: node test/position-complexity-stage1-runner.test.js
      - name: Position-complexity Stage 1 analyzer syntax
        run: python3 -m py_compile tools/experiments/analyze-position-complexity-stage1-exploratory.py
