name: PBAI-P1 C001 closure

on:
  pull_request:
    branches: [main]
    paths:
      - 'doc/ai-engineering/public-ai-improvement-program-1/**'
      - 'test/public-ai-improvement-program1-contract.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify closure contains no public candidate implementation
        run: |
          changed="$(git diff --name-only origin/main...HEAD -- public/)"
          test -z "$changed" || {
            echo 'C001 closure must not modify public/.' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }

      - name: Verify frozen AI-GEN2 source remains on main path
        run: |
          test "$(sha256sum public/engine.js | awk '{print $1}')" = "e6acf1fe4d97db67dbcfadc3a785e802342ae0b0cbaec35f53eb8e77424cfc1c"
          test "$(sha256sum public/ai.js | awk '{print $1}')" = "2823dbcf96c7a47489301ecd768a63975aa8b4e12b62cc4629fc8283ef5dff9e"

      - name: Validate frozen gates and historical candidate contracts
        run: |
          node tools/engineering/validate-pbai-p1-gate-spec.js
          node tools/engineering/validate-pbai-c001-predevelopment-support-spec.js
          node tools/engineering/validate-pbai-c001-contract.js

      - name: Validate current PBAI-P1 closure state
        run: node test/public-ai-improvement-program1-contract.test.js

      - name: Verify binding C001 result and firewall
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = 'doc/ai-engineering/public-ai-improvement-program-1/candidates/PBAI-C001-v1-development-result.json';
          const r = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (r.finalDevelopmentStatus !== 'DEVELOPMENT-BENEFIT-FAIL-HOLD') throw new Error('unexpected C001 disposition');
          if (r.development.pullRequest !== 61 || r.development.pullRequestMerged !== false || r.development.pullRequestClosedWithoutMerge !== true) throw new Error('PR disposition mismatch');
          if (r.developmentGate.topSetAgreement.deltaCandidateMinusBaseline !== 0.015625 || r.developmentGate.topSetAgreement.passed !== false) throw new Error('TopSet result drift');
          if (r.developmentGate.meanNormalizedRankLoss.deltaCandidateMinusBaseline !== -0.011718750000000028 || r.developmentGate.meanNormalizedRankLoss.passed !== false) throw new Error('rank-loss result drift');
          if (r.developmentGate.severeLoss.excessCandidateMinusBaseline !== 0.015625 || r.developmentGate.severeLoss.passed !== false) throw new Error('severe-loss result drift');
          if (r.developmentGate.catastrophicNewLoss.count !== 0 || r.developmentGate.catastrophicNewLoss.passed !== true) throw new Error('catastrophic-loss result drift');
          if (r.developmentGate.searchWork.medianRatioCandidateOverBaseline !== 0.2772631454984396 || r.developmentGate.searchWork.medianRatioPassed !== true) throw new Error('search-work result drift');
          if (r.developmentGate.developmentPass !== false) throw new Error('development disposition drift');
          if (r.decision.developmentAuthorizationContinues !== false || r.decision.sameVersionRetuningAllowed !== false) throw new Error('same-version authorization reopened');
          if (r.executionBoundary.validationExecuted !== false || r.executionBoundary.validationSeedsAccessed !== false) throw new Error('validation firewall violation');
          if (r.executionBoundary.releaseHoldoutExecuted !== false || r.executionBoundary.releaseHoldoutSeedsAccessed !== false) throw new Error('holdout firewall violation');
          if (r.decision.publicAdoptionAuthorized !== false || r.decision.aiGen3PromotionAuthorized !== false) throw new Error('release/adoption unexpectedly authorized');
          if (r.decision.mainPublicResult !== 'KEEP-AI-GEN2') throw new Error('main public result drift');
          console.log('PBAI-C001-v1 closure binding: PASS');
          NODE
