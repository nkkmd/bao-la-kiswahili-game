name: DRSSE Study 1 Closure CI

on:
  push:
    branches:
      - research/g2-05-deep-raw-state-space-enumeration
      - main
    paths:
      - "doc/deep-raw-state-space-enumeration/**"
      - "doc/RESEARCH_INDEX.md"
      - "doc/FUTURE_RESEARCH_AGENDA.md"
      - "doc/research-program-decisions/2026-08-26-second-generation-pure-research-agenda.md"
      - "doc/research-program-decisions/2026-08-28-post-g2-05-raw-enumeration-hardening.md"
      - "README.md"
      - "tools/experiments/*drsse*"
      - "test/drsse-study1-closure.test.js"
      - "test/raw-enumeration-hardening-policy.test.js"
      - "test/second-generation-research-agenda.test.js"
      - ".github/workflows/drsse-*.yml"
  pull_request:
    paths:
      - "doc/deep-raw-state-space-enumeration/**"
      - "doc/RESEARCH_INDEX.md"
      - "doc/FUTURE_RESEARCH_AGENDA.md"
      - "doc/research-program-decisions/2026-08-26-second-generation-pure-research-agenda.md"
      - "doc/research-program-decisions/2026-08-28-post-g2-05-raw-enumeration-hardening.md"
      - "tools/experiments/*drsse*"
      - "test/drsse-study1-closure.test.js"
      - "test/raw-enumeration-hardening-policy.test.js"
      - "test/second-generation-research-agenda.test.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: DRSSE closed-study consistency audit
        run: node test/drsse-study1-closure.test.js
      - name: Prospective RAW enumeration hardening policy audit
        run: node test/raw-enumeration-hardening-policy.test.js
      - name: Research Generation 2 agenda audit
        run: node test/second-generation-research-agenda.test.js
      - name: Executable-source whitespace audit
        run: |
          git diff --check HEAD^ HEAD -- \
            '.github/workflows/drsse-*.yml' \
            'test/drsse-study1-closure.test.js' \
            'test/raw-enumeration-hardening-policy.test.js' \
            'tools/experiments/*drsse*.js' \
            'tools/experiments/lib/drsse-*.js'
