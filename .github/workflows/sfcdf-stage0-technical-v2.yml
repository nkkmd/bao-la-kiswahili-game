name: SFCDF Stage 0 Technical v2

on:
  push:
    branches:
      - research/g3-04-structural-forcing-corridor-decision-funnel
    paths:
      - doc/structural-forcing-corridor-decision-funnel/authorizations/STAGE0_V2_EXECUTION_TRIGGER

permissions:
  contents: read

concurrency:
  group: sfcdf-stage0-technical-v2
  cancel-in-progress: false

jobs:
  technical:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify v2 authorization, corrected prereg, source bindings, and protected boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object doc/structural-forcing-corridor-decision-funnel/prereg/STUDY_1_SPEC.json)" = "3742a0b9ddbcf9c7b3534d22adb0e06d859410bf"
          test "$(git hash-object doc/structural-forcing-corridor-decision-funnel/authorizations/STAGE_0_TECHNICAL_AUTHORIZATION_V2.json)" = "ccd8ef9f8b28799fe5ee666d2d2c7396ddf0efad"
          test "$(git hash-object tools/experiments/run-sfcdf-stage0-technical.js)" = "d36b5a28ee55321faaa177a2a9e2c03a5f1724fd"
          test "$(git hash-object tools/experiments/lib/sfcdf-production.js)" = "b6fca5d533ff4fdf906e64509185b480c6dc5818"
          test "$(git hash-object tools/experiments/lib/sfcdf-independent.js)" = "3bbc16d41c56f2eb00d7169ace2359f0fa9b9b53"
          node - <<'NODE'
          const a=require('./doc/structural-forcing-corridor-decision-funnel/authorizations/STAGE_0_TECHNICAL_AUTHORIZATION_V2.json');
          const s=require('./doc/structural-forcing-corridor-decision-funnel/prereg/STUDY_1_SPEC.json');
          if(a.decision!=='STAGE0-V2-TECHNICAL-AUTHORIZED'||a.maxAdditionalTechnicalExecutions!==1)throw Error('Stage 0 v2 authorization invalid');
          if(a.freshScientificEvidenceAuthorized||a.stage1SeedAccessAuthorized||a.stage2SeedAccessAuthorized||a.protectedDepth10AccessAuthorized)throw Error('Stage 0 v2 authorization scope widened');
          if(s.stages[1].seedStart!==31410001||s.stages[1].seedEnd!==31410192)throw Error('Stage 1 seed contract changed');
          if(s.stages[2].seedStart!==31420001||s.stages[2].seedEnd!==31420288)throw Error('Stage 2 seed contract changed');
          if(s.protectedEvidence.standardInitialRawRootCompleteExactDepth10Holdout!=='SEALED / NOT GENERATED / NOT READ')throw Error('protected holdout changed');
          NODE
      - name: Run synthetic technical fixtures
        run: node tools/experiments/run-sfcdf-stage0-technical.js
      - name: Record v2 technical provenance
        shell: bash
        run: |
          printf '%s\n' \
            "workflow_version=v2" \
            "workflow_run_id=${GITHUB_RUN_ID}" \
            "workflow_head_sha=${GITHUB_SHA}" \
            "previous_v1_run=33616688284" \
            "previous_v1_disposition=PRE-FIXTURE-TECHNICAL-ABORT" \
            "fresh_scientific_seed_access=false" \
            "stage1_seed_access=false" \
            "stage2_seed_access=false" \
            "protected_depth10_access=false" \
            > doc/structural-forcing-corridor-decision-funnel/results/stage-0/STAGE_0_TECHNICAL_PROVENANCE_V2.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sfcdf-stage0-technical-v2
          path: doc/structural-forcing-corridor-decision-funnel/results/stage-0/
          if-no-files-found: error
          retention-days: 90
