name: G2 final current-state documentation correction

on:
  push:
    branches:
      - research/g2-final-program-closure
    paths:
      - doc/research-generation-2/authorizations/CURRENT_STATE_CORRECTION_EXECUTE.json

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v4
        with:
          ref: research/g2-final-program-closure
          fetch-depth: 0

      - name: Validate authorization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('doc/research-generation-2/authorizations/CURRENT_STATE_CORRECTION_EXECUTE.json').read_text(encoding='utf-8'))
          assert data['schemaVersion'] == 1
          assert data['currentStateCorrectionAuthorized'] is True
          assert data['scientificExecutionAuthorized'] is False
          assert data['mainIntegrationAuthorized'] is False
          assert data['targetBranch'] == 'research/g2-final-program-closure'
          assert set(data['allowedPaths']) == {'README.md', 'doc/RESEARCH_INDEX.md'}
          PY

      - name: Correct current-facing state text
        shell: bash
        run: |
          set -euo pipefail
          python tools/maintenance/correct-g2-final-current-state.py

      - name: Verify diff scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          changed = set(filter(None, subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()))
          assert changed == {'README.md', 'doc/RESEARCH_INDEX.md'}, changed
          PY

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md doc/RESEARCH_INDEX.md
          git commit -m "Correct Research Generation 2 current-state references"
          git push origin HEAD:research/g2-final-program-closure
