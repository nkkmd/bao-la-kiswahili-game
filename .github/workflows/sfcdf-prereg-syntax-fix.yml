name: SFCDF Prereg Syntax Fix

on:
  push:
    branches:
      - research/g3-04-structural-forcing-corridor-decision-funnel
    paths:
      - doc/structural-forcing-corridor-decision-funnel/authorizations/PREREG_SYNTAX_FIX_TRIGGER

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/g3-04-structural-forcing-corridor-decision-funnel
          fetch-depth: 1
      - name: Correct JSON syntax only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('doc/structural-forcing-corridor-decision-funnel/prereg/STUDY_1_SPEC.json')
          s=p.read_text()
          old='      "canonical identities may be materialized only into identity-only exclusion manifest before Stage 1"\n'
          new='      "identityOnlyMaterialization": "canonical identities may be materialized only into identity-only exclusion manifest before Stage 1"\n'
          if old not in s: raise SystemExit('expected malformed prereg line not found')
          s=s.replace(old,new,1)
          json.loads(s)
          p.write_text(s)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/structural-forcing-corridor-decision-funnel/prereg/STUDY_1_SPEC.json
          git commit -m "Correct SFCDF prereg JSON syntax without contract change"
          git push origin HEAD:research/g3-04-structural-forcing-corridor-decision-funnel
