name: REWR central docs integration PR

on:
  pull_request:
    paths:
      - ".github/workflows/rewr-central-doc-integration-pr.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/restricted-endgame-winning-regions
          fetch-depth: 0
      - name: Integrate completed REWR Study 1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Central research index.
          p = Path('doc/RESEARCH_INDEX.md')
          text = p.read_text()
          if '### 12. Restricted Endgame / Winning Regions — Study 1' not in text:
              marker = '\n---\n\n## 将来研究\n'
              assert marker in text
              block = '''\n---\n\n### 12. Restricted Endgame / Winning Regions — Study 1\n\n**研究題目:** Baoにおける限定終盤と必勝圏の完全解析 — constrained endgame state spaces における exact game-theoretic value, cycle structure, and distance-to-win の列挙・後退解析  \n**状態:** **Study 1 complete / formal decision `EXACT-SOLVED-WITHIN-FROZEN-DOMAIN`**  \n**作業branch:** `research/restricted-endgame-winning-regions`\n\nこのprospective independent machine-only studyでは、standard initial stateから到達証明を持つ1つのMtaji rootと、そのrootからの全合法手によるcomplete raw-state forward closureをoutcome生成前に固定し、symmetry reductionなしでexact retrograde analysisを行った。\n\nFinal frozen domainとexact resultは次のとおり。\n\n```text\nroots = 1\nstates = 8\nedges = 7\nTERMINAL = 4\nWIN = 3\nLOSS = 1\nRECURRENT = 0\n```\n\nFrozen rootはPlayer 0 to moveの`WIN`、absolute forced winner = Player 0、`DTF = 3`で、unique optimal moveは`capture:mtaji:1:4:left:::false`だった。Production solverと独立実装verifierは全state rows、state/edge hashes、value counts、RECURRENT SCCs、solution hashまで完全一致した。\n\nより大きいone-shot候補は423,733 states / 426,938 edgesまで展開したが、1着手が1,000,000 microstepsのadministrative cutoffへ到達したためexact不適格となった。このcutoffをgame resultへ読み替えず、事前規則どおり追加cap拡張は行わなかった。\n\n**最初に読む:**\n\n- [`restricted-endgame-winning-regions/STUDY_1_OVERVIEW.md`](restricted-endgame-winning-regions/STUDY_1_OVERVIEW.md) — 初見向け成果概要\n\n**詳細・正本:**\n\n- [`restricted-endgame-winning-regions/STUDY_1_FINAL_REPORT.md`](restricted-endgame-winning-regions/STUDY_1_FINAL_REPORT.md) — 科学的・技術的最終統合\n- [`restricted-endgame-winning-regions/results/STAGE_1_EXACT_RESULT.json`](restricted-endgame-winning-regions/results/STAGE_1_EXACT_RESULT.json) — canonical exact oracle\n- [`restricted-endgame-winning-regions/REPRODUCIBILITY_INDEX.md`](restricted-endgame-winning-regions/REPRODUCIBILITY_INDEX.md) — hash / workflow / verification索引\n- [`restricted-endgame-winning-regions/CURRENT_STATUS.md`](restricted-endgame-winning-regions/CURRENT_STATUS.md) — closure状態とclaim boundary\n- [`restricted-endgame-winning-regions/DECISION_REGISTER.md`](restricted-endgame-winning-regions/DECISION_REGISTER.md) — frozen decisions / no-rescue boundary\n\n**Boundary:** exact claimはfrozen 8-state restricted domainだけに限定される。Bao全体、全Mtaji、全終盤が解けたこと、Baoにcycle/drawがないこと、engine evaluationがgame-theoretically正しいこと、symmetry/isomorphismが成立することは意味しない。\n'''
              text = text.replace(marker, block + marker, 1)
          p.write_text(text)

          # 2) Future research agenda: mark REWR complete and advance machine-only sequence.
          p = Path('doc/FUTURE_RESEARCH_AGENDA.md')
          text = p.read_text()
          text = text.replace('Version: 1.10.1', 'Version: 1.11.0', 1)

          if 'Restricted Endgame / Winning Regions Study 1も完了した。' not in text:
              anchor = 'Critical Positions / Outcome Branching Study 1も完了した。'
              i = text.find(anchor)
              assert i >= 0
              para_end = text.find('\n\n', i)
              assert para_end >= 0
              insertion = ('\n\nRestricted Endgame / Winning Regions Study 1も完了した。outcome-blindなStage 0 technical selectionと独立graph reconstructionを経て、standard initial stateから到達証明を持つ1つのMtaji rootのcomplete forward closure（8 states / 7 legal edges）をprospectively freezeした。Stage 1ではproduction solverと別実装のindependent verifierが全state rows、state/edge hashes、value、DTF、optimal movesを完全一致させ、formal decisionは`EXACT-SOLVED-WITHIN-FROZEN-DOMAIN`となった。frozen rootはPlayer 0の`WIN`, DTF=3で、unique optimal moveは`capture:mtaji:1:4:left:::false`である。このexact claimは8-state bounded domainだけに限定される。')
              text = text[:para_end] + insertion + text[para_end:]

          old_seq = 'この制約下では、次のmachine-only research sequenceを **限定終盤と必勝圏 → 対称性と同型局面 → 状態空間とゲーム木複雑度** とする。'
          if old_seq in text:
              text = text.replace(old_seq, 'machine-only sequenceの第1項だった**限定終盤と必勝圏 Study 1は完了**したため、次は **対称性と同型局面 → 状態空間とゲーム木複雑度** の順で進む。', 1)

          list_anchor = '- Critical Positions / Outcome Branching Study 1 — [`critical-positions-outcome-branching/STUDY_1_OVERVIEW.md`](critical-positions-outcome-branching/STUDY_1_OVERVIEW.md)（Study 1 closed after Stage 1 negative exploratory result / promoted candidates 0 / Stage 2 not executed）'
          if '- Restricted Endgame / Winning Regions Study 1 —' not in text:
              assert list_anchor in text
              text = text.replace(list_anchor, list_anchor + '\n- Restricted Endgame / Winning Regions Study 1 — [`restricted-endgame-winning-regions/STUDY_1_OVERVIEW.md`](restricted-endgame-winning-regions/STUDY_1_OVERVIEW.md)（Study 1 complete / `EXACT-SOLVED-WITHIN-FROZEN-DOMAIN` / 8 states / 7 edges）', 1)

          new48 = '''### 4.8 限定終盤と必勝圏 — Study 1完了\n\n#### 現在の状態\n\n**Study 1 complete / formal decision `EXACT-SOLVED-WITHIN-FROZEN-DOMAIN`。**\n\n- 初見向け概要: [`restricted-endgame-winning-regions/STUDY_1_OVERVIEW.md`](restricted-endgame-winning-regions/STUDY_1_OVERVIEW.md)\n- 科学的正本: [`restricted-endgame-winning-regions/STUDY_1_FINAL_REPORT.md`](restricted-endgame-winning-regions/STUDY_1_FINAL_REPORT.md)\n- Canonical oracle: [`restricted-endgame-winning-regions/results/STAGE_1_EXACT_RESULT.json`](restricted-endgame-winning-regions/results/STAGE_1_EXACT_RESULT.json)\n\nStudy 1ではMtaji-only、historically reachable root、raw state identity、no symmetry reduction、complete legal forward closureを採用した。Outcome-blind Stage 0 selectionでfinal domainを固定し、Stage 1 exact solutionとindependent full verificationを完了した。\n\n```text\nroots = 1\nstates = 8\nedges = 7\nTERMINAL = 4\nWIN = 3\nLOSS = 1\nRECURRENT = 0\n```\n\nFrozen rootはPlayer 0 to moveの`WIN`、absoluteWinner = 0、`DTF = 3`、unique optimal move = `capture:mtaji:1:4:left:::false`。より大きいone-shot candidateは423,733 states / 426,938 edgesまで展開したが、1着手が1,000,000 microstepsの`ADMIN-CUTOFF`へ達したためexact不適格となり、cutoffをdraw/lossへ読み替えず追加cap拡張も行わなかった。\n\nExact claimはfrozen 8-state domainだけに限定する。Bao全体、全Mtaji、全終盤、cycle absence、engine evaluation correctness、symmetry成立は主張しない。\n\n#### 後続利用\n\nこのraw exact oracleを次のSymmetry / Isomorphic Positions Studyで候補変換がstate value・optimal move set・DTFを保存するか検証するground truthとして利用する。Study 1自体へsymmetry reductionをretrofitしない。\n'''
          pattern48 = r'### 4\.8 限定終盤と必勝圏.*?(?=\n---\n\n### 4\.9 )'
          text, n = re.subn(pattern48, new48.rstrip(), text, count=1, flags=re.S)
          assert n == 1

          text = text.replace('**限定終盤と必勝圏 Study 1の後に着手予定。** 限定終盤で得られるbounded exact game-theoretic oracleを、将来のsymmetry/isomorphism validationにも利用できる順序を採用する。', '**次に着手するmachine-only研究。** Restricted Endgame / Winning Regions Study 1で得られたraw 8-state exact oracleをground truthとして利用し、候補変換が合法手グラフ、game-theoretic value、optimal move set、DTFを保存するかをprospectively検証する。', 1)
          text = text.replace('**対称性と同型局面 Study 1の後に着手予定。** raw state countとsymmetry-reduced canonical state countを区別できる基盤を先に確立する。', '**対称性と同型局面 Study 1の後に着手予定。** raw state countと、独立検証されたsymmetry-reduced canonical state countを区別できる基盤を先に確立する。', 1)

          old_stage3 = '''### 第3段階: 理論および完全解析への展開\n\n1. **[次に着手] 限定終盤と必勝圏**\n2. **[その後] 対称性と同型局面**\n3. **[その後] 状態空間とゲーム木複雑度**\n4. **[後続候補] 逆転可能性と勝負手**'''
          if old_stage3 in text:
              text = text.replace(old_stage3, '''### 第3段階: 理論および完全解析への展開\n\n1. **[完了] 限定終盤と必勝圏 — Study 1 (`EXACT-SOLVED-WITHIN-FROZEN-DOMAIN`)**\n2. **[次に着手] 対称性と同型局面**\n3. **[その後] 状態空間とゲーム木複雑度**\n4. **[後続候補] 逆転可能性と勝負手**''', 1)

          old_follow = 'この順序を現行のmachine-only research sequenceとする。まず限定終盤でsymmetry reductionに依存しないbounded exact solutionを確立し、そのexact oracleを後続のsymmetry/isomorphism validationへ利用する。次にcanonical representationを確立したうえで、raw state spaceとsymmetry-reduced state spaceを区別する状態空間研究へ進む。'
          if old_follow in text:
              text = text.replace(old_follow, '限定終盤と必勝圏 Study 1でsymmetry reductionに依存しないbounded exact solutionを確立した。次はそのraw exact oracleを後続のsymmetry/isomorphism validationへ利用し、canonical representationを独立検証したうえで、raw state spaceとsymmetry-reduced state spaceを区別する状態空間研究へ進む。', 1)

          p.write_text(text)

          # Basic post-edit assertions.
          idx = Path('doc/RESEARCH_INDEX.md').read_text()
          ag = Path('doc/FUTURE_RESEARCH_AGENDA.md').read_text()
          assert '### 12. Restricted Endgame / Winning Regions — Study 1' in idx
          assert 'EXACT-SOLVED-WITHIN-FROZEN-DOMAIN' in idx
          assert '### 4.8 限定終盤と必勝圏 — Study 1完了' in ag
          assert '2. **[次に着手] 対称性と同型局面**' in ag
          PY
      - name: Commit central documentation integration
        run: |
          if git diff --quiet -- doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md; then
            echo "Central docs already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md
          git commit -m "Research: integrate Restricted Endgame Study 1"
          git push origin HEAD:research/restricted-endgame-winning-regions
