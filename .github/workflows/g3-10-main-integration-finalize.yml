name: G3-10 Main Integration Finalize

on:
  push:
    branches:
      - tmp-g3-10-main-integration-finalize
    paths:
      - doc/geometry-conditioned-longitudinal-dynamics/authorizations/G3_10_MAIN_INTEGRATION_FINALIZE_TRIGGER

permissions:
  contents: write

concurrency:
  group: g3-10-main-integration-finalize-v1
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bookkeeping branch
        uses: actions/checkout@v4
        with:
          ref: tmp-g3-10-main-integration-finalize
          fetch-depth: 0

      - name: Update post-integration current-facing state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          SOURCE='28b64d1cb02904e0c57886ae2046cd681ab64387'
          PREV='0bcd1695b6dbd044acf2eed91740d282c63dbb07'

          def replace(path, old, new, expected=1):
              p=Path(path)
              t=p.read_text(encoding='utf-8')
              n=t.count(old)
              if n != expected:
                  raise SystemExit(f'{path}: expected {expected} matches for {old!r}, got {n}')
              p.write_text(t.replace(old,new), encoding='utf-8')

          replace('README.md',
              'G3-10 scientific executionは完了し、`main` integrationは明示的ユーザー指示待ち。',
              'G3-10 scientific executionに加え、明示的ユーザー指示後の`main` fast-forward integrationも完了。')

          replace('doc/RESEARCH_INDEX.md',
              'same-evidence rerunは禁止。`main` integrationは明示的ユーザー指示があるまで`NOT AUTHORIZED / NOT PERFORMED`。',
              f'same-evidence rerunは禁止。`main` integrationは`COMPLETE / FAST-FORWARD / source tip {SOURCE}`。')
          replace('doc/RESEARCH_INDEX.md',
              '/ protected depth-10 `SEALED` / main integration `NOT AUTHORIZED`**',
              '/ protected depth-10 `SEALED` / main integration `COMPLETE / FAST-FORWARD`**')

          replace('doc/research-generation-3/README.md',
              'MAIN INTEGRATION PENDING EXPLICIT USER AUTHORIZATION',
              'MAIN INTEGRATION COMPLETE / FAST-FORWARD')
          replace('doc/research-generation-3/README.md',
              'G3-10 main integration = NOT AUTHORIZED / NOT PERFORMED',
              f'G3-10 main integration = COMPLETE / FAST-FORWARD / source tip {SOURCE} / force=false')

          replace('doc/research-generation-3/CURRENT_STATUS.md',
              'MAIN INTEGRATION PENDING EXPLICIT USER AUTHORIZATION',
              'MAIN INTEGRATION COMPLETE / FAST-FORWARD')
          replace('doc/research-generation-3/CURRENT_STATUS.md',
              'G3-10 main integration = NOT AUTHORIZED / NOT PERFORMED',
              f'G3-10 main integration = COMPLETE / FAST-FORWARD / source tip {SOURCE} / previous main {PREV} / force=false')
          replace('doc/research-generation-3/CURRENT_STATUS.md',
              'Active research branch = research/g3-10-geometry-conditioned-longitudinal-dynamics / G3-10 scientific execution CLOSED; documentation/pre-main readiness only',
              'G3-10 research branch = research/g3-10-geometry-conditioned-longitudinal-dynamics / scientific execution CLOSED / integrated to main; retained for provenance')

          replace('doc/geometry-conditioned-longitudinal-dynamics/README.md',
              'main integration = NOT AUTHORIZED / NOT PERFORMED',
              f'main integration = COMPLETE / FAST-FORWARD / source tip {SOURCE} / force=false')

          replace('doc/geometry-conditioned-longitudinal-dynamics/CURRENT_STATUS.md',
              'repository readiness = PRE-MAIN-INTEGRATION-READY',
              'repository readiness = MAIN-INTEGRATION-COMPLETE', expected=2)
          replace('doc/geometry-conditioned-longitudinal-dynamics/CURRENT_STATUS.md',
              'main integration = NOT AUTHORIZED / NOT PERFORMED',
              f'main integration = COMPLETE / FAST-FORWARD / source tip {SOURCE} / previous main {PREV} / force=false')
          replace('doc/geometry-conditioned-longitudinal-dynamics/CURRENT_STATUS.md',
              '残るrepository operationは、ユーザーが明示的に指示した場合に限る`main` integrationだけである。\n\n`main` integrationの許可は本ファイルから推定してはならない。明示的なユーザー指示がない限り`NOT AUTHORIZED / NOT PERFORMED`を維持する。',
              '2026-09-04の明示的ユーザー指示に基づき、`main`はprevious headからG3-10 research tipへ`force=false`でfast-forward統合された。科学的closure、artifact identity、no-rescue boundaryは変更していない。')

          replace('doc/geometry-conditioned-longitudinal-dynamics/DECISION_REGISTER.md',
              '| Main integration | `NOT AUTHORIZED / NOT PERFORMED` | 明示的ユーザー指示があるまで禁止 |',
              f'| Main integration | `COMPLETE / FAST-FORWARD` | explicit user authorization 2026-09-04; `{PREV}` → `{SOURCE}`; `force=false` |')

          replace('doc/canonical-resource-robust-continuous-local-geometry-representation/CURRENT_STATUS.md',
              'repository integration = CRCLGR history carried into G3-10 research branch / combined main integration NOT AUTHORIZED / NOT PERFORMED',
              f'repository integration = COMPLETE via G3-10 combined fast-forward to main / source tip {SOURCE}')
          replace('doc/canonical-resource-robust-continuous-local-geometry-representation/README.md',
              'combined successor-branch main integration = NOT AUTHORIZED / NOT PERFORMED',
              f'combined successor-branch main integration = COMPLETE / FAST-FORWARD / source tip {SOURCE}')

          replace('doc/resource-robust-continuous-local-geometry-representation/CURRENT_STATUS.md',
              'repository integration = RRCLGR history carried into successor G3-10 branch / combined main integration NOT AUTHORIZED / NOT PERFORMED',
              f'repository integration = COMPLETE via successor G3-10 combined fast-forward to main / source tip {SOURCE}')
          replace('doc/resource-robust-continuous-local-geometry-representation/README.md',
              'combined successor-branch main integration = NOT AUTHORIZED / NOT PERFORMED',
              f'combined successor-branch main integration = COMPLETE / FAST-FORWARD / source tip {SOURCE}')

          checkpoint=Path('doc/research-generation-3/checkpoints/2026-09-04-g3-10-main-integration-complete.md')
          if checkpoint.exists():
              raise SystemExit('integration checkpoint already exists')
          checkpoint.write_text(f'''# G3-10 main integration complete\n\nDate: 2026-09-04\n\n```text\nStudy = GCLD-STUDY1 / G3-10\nStudy status = CLOSED / FORMAL-COMPLETE\nIntegration authorization = explicit user instruction\nPrevious main = {PREV}\nIntegrated research tip = {SOURCE}\nIntegration method = FAST-FORWARD\nForce = false\nScientific recomputation during integration = false\nProtected depth-10 = SEALED / NOT GENERATED / NOT READ / NOT PEEKED\nHistorical PROGRAM_PLAN = UNCHANGED\n```\n\n`main` was advanced directly from the previous main ancestor to the fully audited G3-10 research tip. This repository operation does not alter any scientific decision, artifact identity, consumed-seed boundary, or no-rescue rule.\n''', encoding='utf-8')
          PY

      - name: Verify immutable scientific and historical identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object doc/research-generation-3/PROGRAM_PLAN.md)" = "2bb90c11f1625f63f40a7eab8a3de7774505a1ac"
          test "$(sha256sum doc/geometry-conditioned-longitudinal-dynamics/results/stage-2/STAGE_2_FORMAL_RESULT.json | awk '{print $1}')" = "08f31652fb599cf9db9b839cbc07f8aabe06aed69215208ec0556e6ec3a5bf7a"
          grep -Fq 'G3-10 main integration = COMPLETE / FAST-FORWARD' doc/research-generation-3/CURRENT_STATUS.md
          grep -Fq 'repository readiness = MAIN-INTEGRATION-COMPLETE' doc/geometry-conditioned-longitudinal-dynamics/CURRENT_STATUS.md
          grep -Fq 'main integration = COMPLETE / FAST-FORWARD' doc/geometry-conditioned-longitudinal-dynamics/README.md
          grep -Fq 'G3-10 main integration complete' doc/research-generation-3/checkpoints/2026-09-04-g3-10-main-integration-complete.md

      - name: Commit post-integration bookkeeping only
        shell: bash
        run: |
          set -euo pipefail
          git add README.md doc/RESEARCH_INDEX.md doc/research-generation-3/README.md doc/research-generation-3/CURRENT_STATUS.md doc/geometry-conditioned-longitudinal-dynamics/README.md doc/geometry-conditioned-longitudinal-dynamics/CURRENT_STATUS.md doc/geometry-conditioned-longitudinal-dynamics/DECISION_REGISTER.md doc/canonical-resource-robust-continuous-local-geometry-representation/CURRENT_STATUS.md doc/canonical-resource-robust-continuous-local-geometry-representation/README.md doc/resource-robust-continuous-local-geometry-representation/CURRENT_STATUS.md doc/resource-robust-continuous-local-geometry-representation/README.md doc/research-generation-3/checkpoints/2026-09-04-g3-10-main-integration-complete.md
          ! git diff --cached --name-only | grep -Fx 'doc/research-generation-3/PROGRAM_PLAN.md'
          ! git diff --cached --name-only | grep -F 'results/stage-'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize G3-10 main integration records"
          git push origin HEAD:tmp-g3-10-main-integration-finalize
