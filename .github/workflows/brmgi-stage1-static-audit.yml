name: BRMGI Stage 1 Static Audit
on:
  push:
    branches:
      - research/g3-06-bao-rule-mechanism-geometry-intervention
    paths:
      - doc/bao-rule-mechanism-geometry-intervention/checkpoints/brmgi-stage1-static-audit-trigger.txt
concurrency:
  group: brmgi-stage1-static-audit
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preauthorization static audit only
        run: node tools/experiments/audit-brmgi-stage1-static.js | tee BRMGI_STAGE1_STATIC_AUDIT.json
      - name: Upload static audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: brmgi-stage1-static-audit-${{ github.run_id }}
          path: BRMGI_STAGE1_STATIC_AUDIT.json
          if-no-files-found: error
