name: SILGM Stage 1 Preauthorization Static Audit v1

on:
  push:
    branches:
      - research/g3-07-search-instability-local-geometry-mechanism
    paths:
      - doc/search-instability-local-geometry-mechanism/authorizations/silgm-stage1-preauthorization-trigger.txt

permissions:
  contents: read

concurrency:
  group: silgm-stage1-preauthorization-static-v1
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Syntax-check Stage 1 preauthorization tooling
        run: |
          node --check tools/experiments/lib/silgm-stage1-production.js
          node --check tools/experiments/lib/silgm-stage1-independent.js
          node --check tools/experiments/run-silgm-stage1-development.js
          node --check tools/experiments/verify-silgm-stage1-preauthorization.js

      - name: Verify frozen Stage 1 source binding and firewalls
        run: |
          mkdir -p artifacts/local/search-instability-local-geometry-mechanism/stage1-preauthorization-v1
          node tools/experiments/verify-silgm-stage1-preauthorization.js \
            --output artifacts/local/search-instability-local-geometry-mechanism/stage1-preauthorization-v1/PREAUTH_AUDIT_RESULT.json

      - name: Verify runner fails closed while unarmed
        run: node tools/experiments/run-silgm-stage1-development.js --unarmed-smoke

      - name: Upload preauthorization audit before repository mirror
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: silgm-stage1-preauthorization-v1-${{ github.run_id }}
          path: artifacts/local/search-instability-local-geometry-mechanism/stage1-preauthorization-v1/PREAUTH_AUDIT_RESULT.json
          if-no-files-found: error
          overwrite: false
