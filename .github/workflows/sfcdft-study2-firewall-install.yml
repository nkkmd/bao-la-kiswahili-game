name: Install SFCDFT Study2 identity firewall

on:
  push:
    branches:
      - research/g4-02-sfcdft-study3-prereg
    paths:
      - .github/workflows/sfcdft-study2-firewall-install.yml

permissions:
  contents: write
  actions: read

jobs:
  install:
    name: Install verified Study2 firewall artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: "35388490684"
      SOURCE_ARTIFACT_ID: "10565022669"
      SOURCE_ARTIFACT_NAME: "sfcdft-study2-identity-firewall-35388490684"
      SOURCE_ARTIFACT_DIGEST: "sha256:5b899255bbcf658b078185a03959432282a404a47ccce9c3dc741d5d3797efe3"
      EXPECTED_IDENTITY_CORE: "7961d01342e35f3e70f82e5688f585be08ef99827b905dcccf032d285994abfc"
      TARGET_DIR: "doc/research-generation-4/identity-firewalls/g4-02-sfcdft-study2"
    steps:
      - name: Checkout Study3 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify target branch and source artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "research/g4-02-sfcdft-study3-prereg"
          actual_digest="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" --jq '.digest')"
          test "$actual_digest" = "$SOURCE_ARTIFACT_DIGEST"

      - name: Download immutable firewall artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/sfcdft2-firewall
          mkdir -p /tmp/sfcdft2-firewall
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT_NAME" \
            --dir /tmp/sfcdft2-firewall

      - name: Verify firewall content
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = '/tmp/sfcdft2-firewall';
          const p = JSON.parse(fs.readFileSync(`${path}/MANIFEST.json`, 'utf8'));
          const lines = (name) => fs.readFileSync(`${path}/${name}`, 'utf8').trim().split(/\r?\n/).filter(Boolean).length;
          if (p.firewallId !== 'G4-02-SFCDFT-STUDY2-IDENTITY-FIREWALL') throw new Error('firewall id mismatch');
          if (p.sourceRunId !== 35345143248) throw new Error('source scientific run mismatch');
          if (p.sourceArtifactCounts.primaryStart !== 384 || p.sourceArtifactCounts.sealedSource !== 382 || p.sourceArtifactCounts.deterministicFailure !== 2) throw new Error('source counts mismatch');
          if (p.scientificSeedReplay !== false || p.scientificEndpointLoaded !== false) throw new Error('seed-free boundary mismatch');
          if (p.identityCoreSha256 !== process.env.EXPECTED_IDENTITY_CORE) throw new Error('identity core mismatch');
          if (lines('SOURCE_TRAJECTORY_SHA256.txt') !== 380) throw new Error('trajectory count mismatch');
          if (lines('OPENING_PREFIX_SHA256.txt') !== 372) throw new Error('opening prefix count mismatch');
          if (lines('RAW_ROOT_SHA256.txt') !== 657) throw new Error('RAW root count mismatch');
          if (lines('SOURCE_RECORD_INDEX.jsonl') !== 382) throw new Error('source index count mismatch');
          console.log(JSON.stringify({identityCoreSha256:p.identityCoreSha256, identityCounts:p.identityCounts}));
          NODE

      - name: Install exact artifact payload and human-readable index
        run: |
          set -euo pipefail
          mkdir -p "$TARGET_DIR"
          cp /tmp/sfcdft2-firewall/MANIFEST.json "$TARGET_DIR/MANIFEST.json"
          cp /tmp/sfcdft2-firewall/SOURCE_TRAJECTORY_SHA256.txt "$TARGET_DIR/SOURCE_TRAJECTORY_SHA256.txt"
          cp /tmp/sfcdft2-firewall/OPENING_PREFIX_SHA256.txt "$TARGET_DIR/OPENING_PREFIX_SHA256.txt"
          cp /tmp/sfcdft2-firewall/RAW_ROOT_SHA256.txt "$TARGET_DIR/RAW_ROOT_SHA256.txt"
          cp /tmp/sfcdft2-firewall/SOURCE_RECORD_INDEX.jsonl "$TARGET_DIR/SOURCE_RECORD_INDEX.jsonl"
          cat > "$TARGET_DIR/README.md" <<'EOF'
          # G4-02 SFCDFT-STUDY2 identity firewall

          更新日: 2026-09-19  
          状態: **`MATERIALIZED / IDENTITY-ONLY / SEED-FREE`**

          このdirectoryは、`SFCDFT-STUDY3`以降でStudy 2 Stage 1 evidenceとのidentity collisionを除外するためのdurable firewallである。

          materializationはStudy 2 scientific seedを再読せず、GitHub Actions run `35345143248`で既に保存済みの382 sealed source artifactsだけを入力にした。

          provenance:

          ```text
          source scientific run = 35345143248
          source execution head = 8c84f2cda1a62f812f030ef319341683a4d77e54
          seed-free materialization run = 35388490684
          materialization artifact ID = 10565022669
          materialization artifact digest = sha256:5b899255bbcf658b078185a03959432282a404a47ccce9c3dc741d5d3797efe3
          identity core SHA-256 = 7961d01342e35f3e70f82e5688f585be08ef99827b905dcccf032d285994abfc
          ```

          identity counts:

          ```text
          sealed source records = 382
          unique source trajectory hashes = 380
          unique first-16 opening-prefix hashes = 372
          unique RAW-root hashes = 657
          failed Study 2 slots without sealed identity = 40411112 / 40411312
          ```

          failed slotsはseed namespace exclusionで保護する。Study 2のtrajectoryはfull-trajectory semantics、Study 3はanchor-bounded decision-prefix semanticsであるため、旧trajectory hashの非一致だけからprefix-level independenceを主張しない。first-16 opening prefix、RAW root、seed namespaceを主要な監査可能firewallとして併用する。

          このdirectoryはscientific endpoint、effect direction、p-value、generalization/counterexample decisionを保存しない。
          EOF

      - name: Commit firewall to Study3 branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_DIR"
          git diff --cached --quiet && { echo "No firewall changes to commit"; exit 0; }
          git commit -m "research(g4-02): materialize Study2 identity firewall"
          git push origin "HEAD:$GITHUB_REF_NAME"
