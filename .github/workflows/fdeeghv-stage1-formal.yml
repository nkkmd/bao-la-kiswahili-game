name: FDEGHV G3-11 Stage 1 formal holdout

on:
  push:
    branches:
      - research/g3-11-fresh-depth10-exact-geometry-holdout
    paths:
      - doc/fresh-depth10-exact-geometry-holdout/authorizations/STAGE_1_EXECUTE.json

permissions:
  contents: write

jobs:
  lease:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Materialize durable pre-computation lease
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fdeeghv-stage1-lease"
          auth_sha=$(sha256sum doc/fresh-depth10-exact-geometry-holdout/authorizations/STAGE_1_EXECUTE.json | awk '{print $1}')
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          auth = json.loads((root/'doc/fresh-depth10-exact-geometry-holdout/authorizations/STAGE_1_EXECUTE.json').read_text())
          out = Path(os.environ['RUNNER_TEMP'])/'fdeeghv-stage1-lease'/'PRECOMPUTATION_LEASE.json'
          lease = {
              'schemaVersion': 1,
              'programLabel': 'G3-11',
              'studyId': 'FDEGHV-STUDY1',
              'stageId': 'FDEGHV-S1-FORMAL-HOLDOUT-2026-09-04-v1',
              'durableLease': True,
              'protectedDepth10AccessAuthorized': True,
              'sourceCommit': os.environ['GITHUB_SHA'],
              'workflowRunId': os.environ['GITHUB_RUN_ID'],
              'workflowRunAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'authorizationNonce': auth['authorizationNonce'],
              'authorizationFileSha256': os.popen("sha256sum doc/fresh-depth10-exact-geometry-holdout/authorizations/STAGE_1_EXECUTE.json").read().split()[0],
              'sameEvidenceRerunAuthorized': False,
              'depth11AccessAuthorized': False,
          }
          out.write_text(json.dumps(lease, indent=2) + '\n')
          PY
      - name: Upload lease before scientific access
        uses: actions/upload-artifact@v4
        with:
          name: fdeeghv-stage1-precomputation-lease-${{ github.run_id }}
          path: ${{ runner.temp }}/fdeeghv-stage1-lease/PRECOMPUTATION_LEASE.json
          if-no-files-found: error
          retention-days: 90

  scientific:
    needs: lease
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download durable lease
        uses: actions/download-artifact@v4
        with:
          name: fdeeghv-stage1-precomputation-lease-${{ github.run_id }}
          path: ${{ runner.temp }}/fdeeghv-stage1-lease
      - name: Execute exactly one protected production enumeration
        shell: bash
        run: |
          set +e
          export FDEGHV_STAGE1_LEASE="$RUNNER_TEMP/fdeeghv-stage1-lease/PRECOMPUTATION_LEASE.json"
          export FDEGHV_STAGE1_OUT="$RUNNER_TEMP/fdeeghv-stage1-formal"
          node tools/experiments/run-fdeeghv-stage1-formal.js
          echo "$?" > "$RUNNER_TEMP/fdeeghv-production-exit-code"
          exit 0
      - name: Independent verification and formal decision
        shell: bash
        run: |
          set +e
          export FDEGHV_STAGE1_LEASE="$RUNNER_TEMP/fdeeghv-stage1-lease/PRECOMPUTATION_LEASE.json"
          export FDEGHV_STAGE1_OUT="$RUNNER_TEMP/fdeeghv-stage1-formal"
          prod_code=$(cat "$RUNNER_TEMP/fdeeghv-production-exit-code")
          if [ "$prod_code" = "0" ]; then
            timeout --signal=TERM 5500s node tools/experiments/verify-fdeeghv-stage1-independent.js
            ver_code=$?
          else
            node tools/experiments/verify-fdeeghv-stage1-independent.js
            ver_code=$?
          fi
          if [ ! -f "$RUNNER_TEMP/fdeeghv-stage1-formal/STAGE_1_FORMAL_RESULT.json" ]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP'])/'fdeeghv-stage1-formal'
          out.mkdir(parents=True, exist_ok=True)
          result = {
              'schemaVersion': 1,
              'programLabel': 'G3-11',
              'studyId': 'FDEGHV-STUDY1',
              'stageId': 'FDEGHV-S1-FORMAL-HOLDOUT-2026-09-04-v1',
              'evidenceClass': 'FRESH-DEEPER-EXACT-HOLDOUT',
              'formalDecisionEstablished': True,
              'formalDecision': 'NON-ESTIMABLE' if int(os.environ.get('VER_CODE','124')) == 124 else 'TECHNICAL-INVALID',
              'integrityPassed': False,
              'classification': 'INDEPENDENT-WALL-CLOCK-CAP' if int(os.environ.get('VER_CODE','124')) == 124 else 'INDEPENDENT-VERIFICATION-FAILED',
              'sameEvidenceRerunAuthorized': False,
              'depth11AccessAuthorized': False,
              'partialFormalPromotionAuthorized': False,
          }
          (out/'STAGE_1_FORMAL_RESULT.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
          fi
          echo "$ver_code" > "$RUNNER_TEMP/fdeeghv-verifier-exit-code"
          exit 0
        env:
          VER_CODE: ${{ env.VER_CODE }}
      - name: Build exact artifact manifest
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])/'fdeeghv-stage1-formal'
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              data=p.read_bytes()
              rows.append({'path':str(p.relative_to(root)),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (root/'ARTIFACT_MANIFEST.json').write_text(json.dumps({'schemaVersion':1,'files':rows},indent=2)+'\n')
          PY
      - name: Upload canonical protected-evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdeeghv-stage1-formal-${{ github.run_id }}
          path: ${{ runner.temp }}/fdeeghv-stage1-formal/
          if-no-files-found: error
          retention-days: 90
      - name: Exact-byte compact repository mirror
        if: always()
        shell: bash
        run: |
          src="$RUNNER_TEMP/fdeeghv-stage1-formal"
          dst="doc/fresh-depth10-exact-geometry-holdout/results/stage-1"
          mkdir -p "$dst"
          for f in STAGE_1_FORMAL_RESULT.json STAGE_1_PRODUCTION_SUMMARY.json result-core.json ARTIFACT_MANIFEST.json; do
            if [ -f "$src/$f" ]; then cp "$src/$f" "$dst/$f"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dst"
          git commit -m "Mirror G3-11 Stage 1 formal result" || true
          git push origin HEAD:research/g3-11-fresh-depth10-exact-geometry-holdout
      - name: Preserve formal failure status without rerun
        if: always()
        shell: bash
        run: |
          prod_code=$(cat "$RUNNER_TEMP/fdeeghv-production-exit-code" 2>/dev/null || echo 2)
          ver_code=$(cat "$RUNNER_TEMP/fdeeghv-verifier-exit-code" 2>/dev/null || echo 2)
          echo "production exit=$prod_code verifier exit=$ver_code"
          test -f "$RUNNER_TEMP/fdeeghv-stage1-formal/STAGE_1_FORMAL_RESULT.json"
