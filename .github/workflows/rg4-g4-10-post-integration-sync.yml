name: RG4 G4-10 post-integration sync

on:
  push:
    branches:
      - tmp/g4-10-post-integration-sync
    paths:
      - .github/workflows/rg4-g4-10-post-integration-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize post-integration documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def sub(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # RG4 current-facing status.
          p='doc/research-generation-4/CURRENT_STATUS.md'
          sub(p,
              '状態: **`G4-01..G4-09 MAIN INTEGRATED / G4-10 CLOSED NON-ESTIMABLE ON RESEARCH BRANCH / CORE SCIENTIFIC AGENDA COMPLETE`**',
              '状態: **`G4-01..G4-10 MAIN INTEGRATED / CORE SCIENTIFIC AGENDA COMPLETE`**')
          sub(p,
              'G4-10 = CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / RESEARCH BRANCH',
              'G4-10 = CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / MAIN INTEGRATED')
          sub(p,
              '`CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / RESEARCH BRANCH`',
              '`CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / MAIN INTEGRATED`')
          sub(p,
              'main integration of G4-10 = NOT YET PERFORMED',
              'main integration of G4-10 = COMPLETE / FAST-FORWARD')
          sub(p,
              'Research Generation 4 final synthesisとpre-main consistency auditは完了した。監査判定は`PASS / READY FOR SEPARATE MAIN-INTEGRATION GATE`。次は別gateとして`main`統合を判断する。',
              'Research Generation 4 final synthesis、pre-main consistency audit、final documentation auditを完了後、G4-10 research HEADを`main`へnon-force fast-forward統合した。統合中のscientific rerun、resource ceiling変更、`public/`変更、public AI変更はない。')
          sub(p,
              '- [`checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md`](checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md) — pre-main audit PASS',
              '- [`checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md`](checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md) — pre-main audit PASS\n- [`checkpoints/2026-09-28-g4-10-main-integration.md`](checkpoints/2026-09-28-g4-10-main-integration.md) — G4-10 / RG4 main integration record')

          # RG4 entry README.
          p='doc/research-generation-4/README.md'
          sub(p,
              '状態: **`CORE G4-01..G4-10 SCIENTIFIC AGENDA COMPLETE / G4-10 CLOSED NON-ESTIMABLE ON RESEARCH BRANCH`**',
              '状態: **`CORE G4-01..G4-10 SCIENTIFIC AGENDA COMPLETE / MAIN INTEGRATED`**')
          sub(p,
              '`CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / RESEARCH BRANCH`',
              '`CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / MAIN INTEGRATED`')
          sub(p,
              '次に許可されるrepository operationは、Study closureと監査から分離した別gateとしての`main`統合判断である。明示的な統合作業までresearch branchに留める。',
              'G4-10 / Research Generation 4の`main`統合は、pre-main consistency auditとfinal documentation auditのPASS後にnon-force fast-forwardで完了した。追加scientific executionは行っていない。')
          sub(p,
              '7. [`checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md`](checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md) — pre-main consistency audit PASS\n8. [`PROGRAM_PLAN.md`](PROGRAM_PLAN.md) — frozen prospective contract / outcome-editしない',
              '7. [`checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md`](checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md) — pre-main consistency audit PASS\n8. [`checkpoints/2026-09-28-g4-10-main-integration.md`](checkpoints/2026-09-28-g4-10-main-integration.md) — main integration record\n9. [`PROGRAM_PLAN.md`](PROGRAM_PLAN.md) — frozen prospective contract / outcome-editしない')

          # Safe restart point.
          p='doc/research-generation-4/RESUME_HERE.md'
          sub(p,
              '状態: **`G4-01..G4-10 CORE SCIENTIFIC AGENDA COMPLETE / G4-10 CLOSED NON-ESTIMABLE / MAIN INTEGRATION PENDING`**',
              '状態: **`G4-01..G4-10 CORE SCIENTIFIC AGENDA COMPLETE / G4-10 CLOSED NON-ESTIMABLE / MAIN INTEGRATED`**')
          sub(p,
              'G4-10 = CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / RESEARCH BRANCH',
              'G4-10 = CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / MAIN INTEGRATED')
          sub(p,
              'G4-10 main integration = NOT YET PERFORMED',
              'G4-10 main integration = COMPLETE / FAST-FORWARD')
          sub(p,
              '8. [`checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md`](checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md)でpre-main audit PASSを確認する。\n9. [`PROGRAM_PLAN.md`](PROGRAM_PLAN.md)はprospective frozen planとして変更せず参照する。',
              '8. [`checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md`](checkpoints/2026-09-28-g4-10-pre-main-consistency-audit.md)でpre-main audit PASSを確認する。\n9. [`checkpoints/2026-09-28-g4-10-main-integration.md`](checkpoints/2026-09-28-g4-10-main-integration.md)でmain統合記録を確認する。\n10. [`PROGRAM_PLAN.md`](PROGRAM_PLAN.md)はprospective frozen planとして変更せず参照する。')
          sub(p,
              'Research Generation 4 final synthesis、current-facing文書同期、研究索引・future agenda更新、pre-main consistency auditは完了した。監査判定は **`PASS / READY FOR SEPARATE MAIN-INTEGRATION GATE`**。\n\n次に許可されるrepository operationは、別gateとしての`main`統合判断である。明示的に統合作業へ進むまではresearch branchに留め、科学結果、resource ceiling、formal classification、no-rescue boundaryを変更しない。',
              'Research Generation 4 final synthesis、current-facing文書同期、研究索引・future agenda更新、pre-main consistency audit、final documentation audit、`main`統合まで完了した。\n\nG4-10に対する追加scientific executionは行わない。次の研究へ進む場合は、新しいStudy identity、prospective preregistration、別authorizationを必要とする。')

          # Final synthesis.
          p='doc/research-generation-4/FINAL_SYNTHESIS.md'
          sub(p,
              '状態: **`CORE SCIENTIFIC AGENDA COMPLETE / G4-10 CLOSED NON-ESTIMABLE / PRE-MAIN REVIEW PENDING`**',
              '状態: **`CORE SCIENTIFIC AGENDA COMPLETE / G4-10 CLOSED NON-ESTIMABLE / MAIN INTEGRATED`**')
          sub(p,
              'ただし、この文書作成時点ではG4-10の`main`統合は未実施である。次のgateはcurrent-facing文書、リンク、状態表記、canonical provenanceのpre-main consistency auditである。',
              'G4-10はpre-main consistency auditとfinal documentation auditのPASS後、research HEAD `0a2fb472686f90f0cdb70f89b6d9daaf91068764`を`main`へnon-force fast-forward統合した。統合によってscientific result、resource ceiling、formal classification、no-rescue boundary、public AI状態は変更していない。')
          sub(p,
              '`main` integrationはこのsynthesisとは別の明示gateとする。',
              '`main` integrationは別の明示gateとして完了した。統合記録は[`checkpoints/2026-09-28-g4-10-main-integration.md`](checkpoints/2026-09-28-g4-10-main-integration.md)を参照する。')

          # Central index.
          p='doc/RESEARCH_INDEX.md'
          sub(p,
              '現在の状態: **Research Generation 2・3は完了済み。Research Generation 4はcore G4-01〜G4-10 scientific agenda完了。G4-10はCLOSED / NON-ESTIMABLE（research branch、main統合前）**',
              '現在の状態: **Research Generation 2・3は完了済み。Research Generation 4はcore G4-01〜G4-10 scientific agenda完了・main統合済み。G4-10はCLOSED / NON-ESTIMABLE**')
          sub(p,
              '`CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / RESEARCH BRANCH`',
              '`CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / MAIN INTEGRATED`')
          sub(p,
              '| G4-10の正式結果 | [`fresh-depth11-exact-reachability-topology/FINAL_REPORT.md`](fresh-depth11-exact-reachability-topology/FINAL_REPORT.md) |',
              '| G4-10の正式結果 | [`fresh-depth11-exact-reachability-topology/FINAL_REPORT.md`](fresh-depth11-exact-reachability-topology/FINAL_REPORT.md) |\n| G4-10 / RG4 main統合記録 | [`research-generation-4/checkpoints/2026-09-28-g4-10-main-integration.md`](research-generation-4/checkpoints/2026-09-28-g4-10-main-integration.md) |')

          # Future agenda.
          p='doc/FUTURE_RESEARCH_AGENDA.md'
          sub(p, 'Version: 5.12.0', 'Version: 5.13.0')
          sub(p,
              'Research Generation 4: **core G4-01〜G4-10 scientific agenda complete / G4-10 CLOSED NON-ESTIMABLE on research branch / main integration pending**',
              'Research Generation 4: **core G4-01〜G4-10 scientific agenda complete / G4-10 CLOSED NON-ESTIMABLE / main integrated**')
          sub(p,
              'G4-10 = CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / RESEARCH BRANCH',
              'G4-10 = CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / MAIN INTEGRATED')
          sub(p,
              '| D | `G4-10` | protected fresh depth-11 exact reachability topology | `CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / RESEARCH BRANCH` |',
              '| D | `G4-10` | protected fresh depth-11 exact reachability topology | `CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / MAIN INTEGRATED` |')
          sub(p,
              'G4-10 depth 12 = NOT AUTHORIZED',
              'G4-10 depth 12 = NOT AUTHORIZED\nG4-10 main integration = COMPLETE / FAST-FORWARD')

          # G4-10 current state.
          p='doc/fresh-depth11-exact-reachability-topology/CURRENT_STATUS.md'
          sub(p, 'main integration = NOT YET PERFORMED', 'main integration = COMPLETE / FAST-FORWARD')
          sub(p,
              'G4-10 closure document、Research Generation 4 final synthesis、current-facing文書同期、pre-main consistency auditは完了した。監査は`PASS / READY FOR SEPARATE MAIN-INTEGRATION GATE`。`main`統合は引き続き別gateであり、まだ実施していない。',
              'G4-10 closure document、Research Generation 4 final synthesis、pre-main consistency audit、final documentation auditを完了後、research HEAD `0a2fb472686f90f0cdb70f89b6d9daaf91068764`を`main`へnon-force fast-forward統合した。追加scientific executionは行っていない。')

          # G4-10 final report.
          p='doc/fresh-depth11-exact-reachability-topology/FINAL_REPORT.md'
          sub(p,
              '次工程はRG4 current-facing文書の同期、program final synthesis、文書整合監査である。`main`統合は別途明示gateとする。',
              'その後、RG4 current-facing文書同期、program final synthesis、pre-main consistency audit、final documentation auditを完了し、research HEAD `0a2fb472686f90f0cdb70f89b6d9daaf91068764`を`main`へnon-force fast-forward統合した。これはrepository integrationであり、本報告のscientific decisionやno-rescue boundaryを変更しない。')

          # Decision register.
          p='doc/fresh-depth11-exact-reachability-topology/DECISION_REGISTER.md'
          sub(p,
              '| FDERT-D033 | main integration | `SEPARATE GATE` | Study closureとmain統合を分離する。 |',
              '| FDERT-D033 | main integration | `SEPARATE GATE` | Study closureとmain統合を分離する。 |\n| FDERT-D034 | main integration result | `COMPLETE / FAST-FORWARD` | pre-main consistency auditとfinal documentation auditのPASS後、scientific rerunなしで統合。 |')

          # G4-10 entry README: add repository integration status.
          p=Path('doc/fresh-depth11-exact-reachability-topology/README.md')
          text=p.read_text(encoding='utf-8')
          marker='`NON-ESTIMABLE`は科学的な失敗ではなく、事前に固定したresource boundaryを守った正式closureである。'
          if marker not in text:
              raise SystemExit('missing G4-10 README closure marker')
          p.write_text(text.replace(marker, marker + '\n\n## Repository integration\n\n2026-09-28、pre-main consistency auditとfinal documentation auditのPASS後、research HEAD `0a2fb472686f90f0cdb70f89b6d9daaf91068764`を`main`へnon-force fast-forward統合した。統合中のscientific rerun、resource ceiling変更、`public/`変更、public AI変更はない。'), encoding='utf-8')

          checkpoint=Path('doc/research-generation-4/checkpoints/2026-09-28-g4-10-main-integration.md')
          if checkpoint.exists():
              raise SystemExit('integration checkpoint already exists')
          checkpoint.write_text('''# 2026-09-28 — G4-10 / Research Generation 4 main integration\n\nAgenda: `Research Generation 4 / G4-10`  \nStudy: `FDERT-STUDY1`  \nIntegration decision: **`COMPLETE / NON-FORCE FAST-FORWARD`**\n\n## Integration identity\n\n```text\npre-integration main HEAD = 7eb59518753d9b8846d5ccf32246aba1b4b301cc\nintegrated research HEAD = 0a2fb472686f90f0cdb70f89b6d9daaf91068764\nsource branch = research/g4-10-fresh-depth11-exact-reachability-topology\nmethod = non-force fast-forward\ninitial main fast-forward = COMPLETE\n```\n\nImmediately before integration, the research branch was `ahead 65 / behind 0` and its merge base was the pre-integration `main` HEAD.\n\n## Preconditions\n\n- pre-main consistency audit: `PASS / READY FOR SEPARATE MAIN-INTEGRATION GATE`\n- final documentation audit: `PASS`\n- final documentation audit run: `36370815727 / attempt 1 / success`\n- `public/` delta before integration: 0\n- root `README.md` delta before integration: 0\n- frozen `doc/research-generation-4/PROGRAM_PLAN.md` delta before integration: 0\n\n## Scientific state preserved\n\n```text\nG4-10 = CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP\nT1 = NON-ESTIMABLE\nT2 = NON-ESTIMABLE\nT3 = NON-ESTIMABLE\nT4 = NON-ESTIMABLE\nsame-evidence rerun = NOT AUTHORIZED\ndepth 12 = NOT AUTHORIZED\npublic AI change = NOT AUTHORIZED\n```\n\nIntegration did not rerun scientific computation, change any resource ceiling, promote partial depth-11 evidence, alter the formal classification, or change public AI production.\n\n## Post-integration documentation sync\n\nAfter the initial fast-forward, current-facing documents were synchronized from `RESEARCH BRANCH / MAIN INTEGRATION PENDING` to `MAIN INTEGRATED`. This synchronization changes repository-status wording only and does not change scientific evidence or interpretation.\n''', encoding='utf-8')
          PY

      - name: Verify synchronized state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          current=[
            Path('doc/RESEARCH_INDEX.md'),
            Path('doc/FUTURE_RESEARCH_AGENDA.md'),
            Path('doc/research-generation-4/README.md'),
            Path('doc/research-generation-4/CURRENT_STATUS.md'),
            Path('doc/research-generation-4/FINAL_SYNTHESIS.md'),
            Path('doc/research-generation-4/RESUME_HERE.md'),
            Path('doc/fresh-depth11-exact-reachability-topology/README.md'),
            Path('doc/fresh-depth11-exact-reachability-topology/CURRENT_STATUS.md'),
            Path('doc/fresh-depth11-exact-reachability-topology/FINAL_REPORT.md'),
            Path('doc/fresh-depth11-exact-reachability-topology/DECISION_REGISTER.md'),
          ]
          stale=[
            'G4-10 CLOSED NON-ESTIMABLE ON RESEARCH BRANCH',
            'MAIN INTEGRATION PENDING',
            'G4-10 = CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / RESEARCH BRANCH',
            '`CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / RESEARCH BRANCH`',
            'main integration of G4-10 = NOT YET PERFORMED',
            'G4-10 main integration = NOT YET PERFORMED',
            'main integration = NOT YET PERFORMED',
            'research branch、main統合前',
            'main integration pending',
            '`main`統合は引き続き別gateであり、まだ実施していない',
            'G4-10の`main`統合は未実施',
          ]
          errors=[]
          for p in current:
              t=p.read_text(encoding='utf-8')
              for s in stale:
                  if s in t:
                      errors.append(f'{p}: stale marker {s}')
          required={
            Path('doc/research-generation-4/CURRENT_STATUS.md'): ['G4-10 = CLOSED / NON-ESTIMABLE / UNIQUE_STATE_CAP / MAIN INTEGRATED', 'main integration of G4-10 = COMPLETE / FAST-FORWARD'],
            Path('doc/research-generation-4/FINAL_SYNTHESIS.md'): ['MAIN INTEGRATED', '0a2fb472686f90f0cdb70f89b6d9daaf91068764'],
            Path('doc/fresh-depth11-exact-reachability-topology/CURRENT_STATUS.md'): ['main integration = COMPLETE / FAST-FORWARD'],
            Path('doc/FUTURE_RESEARCH_AGENDA.md'): ['Version: 5.13.0', 'G4-10 main integration = COMPLETE / FAST-FORWARD'],
            Path('doc/research-generation-4/checkpoints/2026-09-28-g4-10-main-integration.md'): ['COMPLETE / NON-FORCE FAST-FORWARD', 'public AI change = NOT AUTHORIZED'],
          }
          for p, needles in required.items():
              t=p.read_text(encoding='utf-8')
              for s in needles:
                  if s not in t:
                      errors.append(f'{p}: missing {s}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print('post-integration documentation verification: PASS')
          PY

      - name: Commit synchronized state and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/rg4-g4-10-post-integration-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doc .github/workflows/rg4-g4-10-post-integration-sync.yml
          git commit -m 'docs(g4-10): record main integration and sync RG4 status'
          git push origin HEAD:tmp/g4-10-post-integration-sync
