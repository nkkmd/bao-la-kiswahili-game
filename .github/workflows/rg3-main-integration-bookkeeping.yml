name: RG3 Main Integration Bookkeeping

on:
  push:
    branches:
      - main
    paths:
      - doc/research-generation-3/authorizations/rg3-main-integration-bookkeeping-trigger.txt

permissions:
  contents: write

jobs:
  bookkeeping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify integrated closure ancestry
        run: |
          git merge-base --is-ancestor fd6c8e2a4510d5937b47a87735854e8459b2646f 0feaab24efdd92c3e094aae0fcc60256e90bd1a6
          git merge-base --is-ancestor 0feaab24efdd92c3e094aae0fcc60256e90bd1a6 HEAD
      - name: Preserve helper for post-removal bookkeeping
        run: cp tools/experiments/finalize-rg3-main-integration-bookkeeping.py /tmp/finalize-rg3-main-integration-bookkeeping.py
      - name: Defer diff-scope audit until temporary tooling removal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/experiments/finalize-rg3-main-integration-bookkeeping.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('    names = set(filter(None, git("diff", "--name-only", SOURCE_TIP).splitlines()))')
          check='    subprocess.check_call(["git", "diff", "--check", SOURCE_TIP])'
          end=s.index(check, start)
          line_end=s.index('\n', end)+1
          s=s[:start] + check + '\n' + s[line_end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply post-integration bookkeeping
        run: python3 tools/experiments/finalize-rg3-main-integration-bookkeeping.py
      - name: Remove one-time write-capable tooling
        run: |
          git rm .github/workflows/rg3-main-integration-bookkeeping.yml
          git rm -f tools/experiments/finalize-rg3-main-integration-bookkeeping.py
          git rm doc/research-generation-3/authorizations/rg3-main-integration-bookkeeping-trigger.txt
      - name: Verify final bookkeeping diff scope and historical plan
        run: |
          git add -N doc/research-generation-3/checkpoints/2026-09-04-research-generation-3-main-integration-complete.md
          python3 - <<'PY'
          import subprocess
          expected = {
              'README.md',
              'doc/FUTURE_RESEARCH_AGENDA.md',
              'doc/RESEARCH_INDEX.md',
              'doc/research-generation-3/CURRENT_STATUS.md',
              'doc/research-generation-3/FINAL_SYNTHESIS.md',
              'doc/research-generation-3/PROGRAM_FINAL_RESULT.json',
              'doc/research-generation-3/README.md',
              'doc/research-generation-3/checkpoints/2026-09-04-research-generation-3-main-integration-complete.md',
          }
          names=set(filter(None, subprocess.check_output(['git','diff','--name-only','0feaab24efdd92c3e094aae0fcc60256e90bd1a6'], text=True).splitlines()))
          if names != expected:
              raise SystemExit(f'diff mismatch missing={sorted(expected-names)} extra={sorted(names-expected)}')
          blob=subprocess.check_output(['git','hash-object','doc/research-generation-3/PROGRAM_PLAN.md'], text=True).strip()
          if blob != '2bb90c11f1625f63f40a7eab8a3de7774505a1ac':
              raise SystemExit('PROGRAM_PLAN changed')
          subprocess.check_call(['git','diff','--check','0feaab24efdd92c3e094aae0fcc60256e90bd1a6'])
          print('final bookkeeping diff audit PASS')
          PY
      - name: Commit post-integration bookkeeping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md doc/FUTURE_RESEARCH_AGENDA.md doc/RESEARCH_INDEX.md doc/research-generation-3/CURRENT_STATUS.md doc/research-generation-3/FINAL_SYNTHESIS.md doc/research-generation-3/PROGRAM_FINAL_RESULT.json doc/research-generation-3/README.md doc/research-generation-3/checkpoints/2026-09-04-research-generation-3-main-integration-complete.md
          git diff --cached --quiet && { echo "No staged bookkeeping changes"; exit 1; }
          git commit -m "Complete Research Generation 3 main integration bookkeeping"
          git push origin HEAD:main
