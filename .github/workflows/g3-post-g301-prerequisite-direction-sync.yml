name: RG3 post-G3-01 prerequisite direction sync

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/g3-post-g301-prerequisite-direction-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize program direction
        run: python3 .github/scripts/g3_post_g301_prerequisite_direction_sync.py

      - name: Commit synchronization
        run: |
          git config user.name "Sawa"
          git config user.email "72678394+nkkmd@users.noreply.github.com"
          git add README.md doc/FUTURE_RESEARCH_AGENDA.md doc/RESEARCH_INDEX.md \
            doc/research-generation-3 doc/local-game-tree-geometry-measurement-foundation/README.md \
            doc/local-game-tree-geometry-measurement-foundation/CURRENT_STATUS.md \
            doc/research-program-decisions/2026-08-31-post-g3-01-measurement-instrument-prerequisite-selected.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Select post-G3-01 measurement prerequisite direction"
            git push origin HEAD:main
          fi
