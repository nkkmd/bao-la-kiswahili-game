name: CLGR G3-09 Document Consistency Follow-up

on:
  push:
    branches:
      - research/g3-09-continuous-local-geometry-representation
    paths:
      - 'doc/continuous-local-geometry-representation/executions/clgr-g3-09-document-consistency-followup-trigger.json'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify follow-up script syntax
        run: python3 -m py_compile tools/experiments/finalize-clgr-g3-09-document-consistency-followup.py
      - name: Apply documentation-only follow-up and audit
        run: python3 tools/experiments/finalize-clgr-g3-09-document-consistency-followup.py
      - name: Commit follow-up documentation
        run: |
          if git diff --quiet; then
            echo 'No documentation changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md \
            doc/RESEARCH_INDEX.md \
            doc/research-generation-3/README.md \
            doc/local-geometry-persistence-memory-length/REPRODUCIBILITY_INDEX.md \
            doc/continuous-local-geometry-representation/README.md \
            doc/continuous-local-geometry-representation/DECISION_REGISTER.md \
            doc/continuous-local-geometry-representation/REPRODUCIBILITY_INDEX.md \
            doc/continuous-local-geometry-representation/checkpoints/2026-09-03-final-document-consistency-followup-pass.md
          git commit -m 'Finalize G3-09 document consistency follow-up'
          git push origin HEAD:research/g3-09-continuous-local-geometry-representation
