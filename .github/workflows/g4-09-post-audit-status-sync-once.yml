name: G4-09 post-audit status sync once

on:
  push:
    branches:
      - research/g4-09-search-reliability-exact-agreement
    paths:
      - .github/workflows/g4-09-post-audit-status-sync-once.yml

permissions:
  contents: write

jobs:
  sync-post-audit-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Patch post-audit status only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {n}")
              return text.replace(old, new, 1)

          p = Path('doc/research-generation-4/RESUME_HERE.md')
          s = p.read_text(encoding='utf-8')
          s = once(s, '状態: **`G4-09 CLOSED ON RESEARCH BRANCH / PRE-MAIN CONSISTENCY AUDIT NEXT / G4-10 PROTECTED`**', '状態: **`G4-09 CLOSED ON RESEARCH BRANCH / PRE-MAIN CONSISTENCY AUDIT PASS / MAIN INTEGRATION REVIEW NEXT / G4-10 PROTECTED`**', 'resume headline')
          old = 'G4-09 scientific executionとclosureは完了済み。\n\n次は**main統合前の最終整合監査**を行う。\n\n確認対象:\n\n- G4-09 current-facing文書とcanonical recordsの整合\n- RG4入口文書 / research index / future agendaの状態表記\n- research branchとremote `main`のahead / behind / merge base\n- `public/`変更の有無\n- public AI production変更の有無\n- G4-10 depth-11 accessが0のままか\n- no-rerun / no-rescue境界\n\n監査がPASSしても、自動で`main`へ統合しない。統合は別の明示的操作として行う。'
          new = 'G4-09 scientific executionとclosureは完了し、pre-main consistency auditも`PASS / READY-FOR-MAIN-INTEGRATION-REVIEW`で完了した。\n\n次は**別の明示的操作としてmain統合をレビューする段階**である。統合操作の直前にresearch branch HEADとremote `main` HEADを再取得し、ahead-only / behind 0 / merge base一致、`public/`差分0、G4-10 depth-11 access 0を再確認する。\n\n監査PASSは自動統合を意味しない。G4-10も引き続き別authorizationなしにアクセスしない。'
          s = once(s, old, new, 'resume next work')
          p.write_text(s, encoding='utf-8')

          p = Path('doc/research-generation-4/CURRENT_STATUS.md')
          s = p.read_text(encoding='utf-8')
          old = 'G4-09のscientific executionは閉じた。次はG4-09 branchのcurrent-facing文書、canonical records、branch scope、`public/`差分、G4-10保護境界を最終監査し、`main`統合可否を判断する段階である。\n\nG4-10は引き続きprotectedであり、G4-09 closureや将来のmain統合によって自動認可されない。depth-11へ進む場合は別の明示的authorization reviewが必須である。'
          new = 'G4-09のscientific executionとclosureは完了し、pre-main consistency auditは`PASS / READY-FOR-MAIN-INTEGRATION-REVIEW`となった。次は別の明示的操作として`main`統合をレビューする段階である。統合直前にはresearch branchとremote `main`のHEAD、ahead / behind、merge base、`public/`差分、G4-10保護境界を再確認する。\n\nG4-10は引き続きprotectedであり、G4-09 closureや将来のmain統合によって自動認可されない。depth-11へ進む場合は別の明示的authorization reviewが必須である。'
          s = once(s, old, new, 'current-status next work')
          marker = '- [`../research-program-decisions/2026-09-28-g4-09-search-reliability-exact-agreement-study1-closure.md`](../research-program-decisions/2026-09-28-g4-09-search-reliability-exact-agreement-study1-closure.md)'
          s = once(s, marker, marker + '\n- [`checkpoints/2026-09-28-g4-09-pre-main-audit-pass.md`](checkpoints/2026-09-28-g4-09-pre-main-audit-pass.md)', 'current-status audit link')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify scope and post-audit state
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'doc/research-generation-4/CURRENT_STATUS.md\ndoc/research-generation-4/RESUME_HERE.md'
          grep -Fq 'PRE-MAIN CONSISTENCY AUDIT PASS / MAIN INTEGRATION REVIEW NEXT' doc/research-generation-4/RESUME_HERE.md
          grep -Fq 'PASS / READY-FOR-MAIN-INTEGRATION-REVIEW' doc/research-generation-4/CURRENT_STATUS.md
          grep -Fq '2026-09-28-g4-09-pre-main-audit-pass.md' doc/research-generation-4/CURRENT_STATUS.md
          grep -Fq 'G4-10 = PROTECTED / NOT AUTHORIZED / NOT ACCESSED' doc/research-generation-4/RESUME_HERE.md

      - name: Commit post-audit status synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doc/research-generation-4/CURRENT_STATUS.md doc/research-generation-4/RESUME_HERE.md
          git commit -m 'docs(g4-09): mark pre-main audit pass'
          git push origin HEAD:${GITHUB_REF_NAME}
