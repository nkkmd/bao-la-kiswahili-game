name: LGPML G3-08 Central Documentation Finalization

on:
  push:
    branches: [research/g3-08-local-geometry-persistence-memory-length]
    paths:
      - doc/local-geometry-persistence-memory-length/triggers/CENTRAL_DOC_FINALIZE.txt

permissions:
  contents: write

concurrency:
  group: lgpml-g3-08-central-docs-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - name: Assert trigger-only commit and research branch
        run: |
          test "$GITHUB_REF_NAME" = "research/g3-08-local-geometry-persistence-memory-length"
          test "$(git diff --name-only HEAD^ HEAD)" = "doc/local-geometry-persistence-memory-length/triggers/CENTRAL_DOC_FINALIZE.txt"
      - name: Finalize current-facing central documents
        run: python tools/experiments/finalize-lgpml-g3-08-central-docs.py
      - name: Verify historical program plan unchanged
        run: test "$(git hash-object doc/research-generation-3/PROGRAM_PLAN.md)" = "2bb90c11f1625f63f40a7eab8a3de7774505a1ac"
      - name: Commit branch-only documentation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md doc/research-generation-3/README.md doc/research-generation-3/CURRENT_STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m "Finalize G3-08 central documentation after technical-invalid closure"
          test "$(git branch --show-current)" = "research/g3-08-local-geometry-persistence-memory-length"
          git push origin HEAD:research/g3-08-local-geometry-persistence-memory-length
