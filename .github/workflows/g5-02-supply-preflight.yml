name: G5-02 Supply Preflight

on:
  push:
    branches: [research/g5-02-exact-supply]
    paths:
      - 'tools/research/g5-02/**'
      - 'test/g5-02-supply.test.cjs'
      - 'doc/research-generation-5/g5-02/SPEC.json'
      - 'doc/research-generation-5/g5-02/SOURCE_MANIFEST.json'
      - 'doc/research-generation-5/g5-02/AUTHORIZATION.json'
      - '.github/workflows/g5-02-supply*.yml'
  pull_request:
    paths:
      - 'tools/research/g5-02/**'
      - 'test/g5-02-supply.test.cjs'
      - 'doc/research-generation-5/**'
      - '.github/workflows/g5-02-supply*.yml'

permissions:
  contents: read

jobs:
  technical-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify current editorial boundary and archived bindings
        run: |
          python3 tools/research/g5-checkpoint/test-verify-current.py
          python3 tools/research/g5-checkpoint/verify-current.py --hashes-only
      - name: Fixture-only supply preflight
        run: |
          git worktree add --detach "$RUNNER_TEMP/g5-legacy-verification" 43e145da1eb66cab38b56e96b52c0f3a4282b302
          cd "$RUNNER_TEMP/g5-legacy-verification"
          node --test test/g5-02-supply.test.cjs
