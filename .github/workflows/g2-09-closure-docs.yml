name: G2-09 Closure Documentation

on:
  push:
    branches:
      - research/g2-09-tactical-motif-generalization-counterexample
    paths:
      - 'tools/experiments/materialize-g2-09-closure-docs.py'
      - '.github/workflows/g2-09-closure-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize central closure updates
        run: |
          python3 tools/experiments/materialize-g2-09-closure-docs.py
          git diff --check
          git diff -- README.md doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md

      - name: Commit closure documentation
        run: |
          if git diff --quiet; then
            echo 'No central documentation changes required.'
            exit 0
          fi
          git config user.name 'Sawa'
          git config user.email '72678394+nkkmd@users.noreply.github.com'
          git add README.md doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md
          git commit -m 'research(g2-09): synchronize central closure documentation'
          git push origin HEAD:research/g2-09-tactical-motif-generalization-counterexample
