name: G2-09 Central Documentation Final Consistency

on:
  push:
    branches:
      - research/g2-09-tactical-motif-generalization-counterexample
    paths:
      - 'tools/experiments/finalize-g2-09-central-doc-consistency.py'
      - '.github/workflows/g2-09-central-doc-final-consistency.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix and verify central documentation consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/experiments/finalize-g2-09-central-doc-consistency.py
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if [ "$changed" != "doc/RESEARCH_INDEX.md" ]; then
            echo "Unexpected change scope: $changed" >&2
            exit 2
          fi

      - name: Commit central-index correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sawa'
          git config user.email '72678394+nkkmd@users.noreply.github.com'
          git add doc/RESEARCH_INDEX.md
          git commit -m 'docs(research): fix stale G2-09 sequence references'
          git push origin HEAD:research/g2-09-tactical-motif-generalization-counterexample
