name: TMGC Stage 0 Source Preflight

# Technical-only source population preflight. No motif consequence or tactical-value outcome is computed.
on:
  workflow_dispatch:
  push:
    branches:
      - research/g2-09-tactical-motif-generalization-counterexample
    paths:
      - '.github/workflows/tmgc-stage0-source-preflight.yml'
      - 'tools/experiments/run-tmgc-stage0-source-preflight.js'
      - 'doc/tactical-motif-generalization-counterexample/preregistration/STAGE_0_SOURCE_PREFLIGHT_SPEC.json'
      - 'public/engine.js'
      - 'public/ai.js'
      - 'public/ai-weights.js'
      - 'tools/benchmark.js'

permissions:
  contents: read

jobs:
  source-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout branch source
        uses: actions/checkout@v4

      - name: Environment
        run: |
          node --version
          git rev-parse HEAD
          git status --short

      - name: Run source-only technical preflight
        run: |
          set -o pipefail
          mkdir -p artifacts/local/tmgc-stage0-source-preflight
          /usr/bin/time -v node tools/experiments/run-tmgc-stage0-source-preflight.js artifacts/local/tmgc-stage0-source-preflight \
            2>&1 | tee artifacts-tmgc-stage0-source-preflight.log

      - name: Preserve source-preflight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmgc-stage0-source-preflight-${{ github.sha }}
          path: |
            artifacts/local/tmgc-stage0-source-preflight/**
            artifacts-tmgc-stage0-source-preflight.log
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
