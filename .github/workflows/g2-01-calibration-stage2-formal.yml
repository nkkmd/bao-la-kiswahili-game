name: G2-01 Stage 2 formal replication

on:
  push:
    branches:
      - research/g2-01-position-evaluation-empirical-outcome-calibration-replication
    paths:
      - 'doc/position-evaluation-empirical-outcome-calibration-replication/preregistration/STAGE_2_FORMAL_AUTHORIZATION.json'

permissions:
  actions: read
  contents: read

jobs:
  generate-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit frozen Stage 2 contract
        run: |
          node test/g2-01-calibration-replication-contract.test.js
          node tools/experiments/validate-g2-01-calibration-stage2-spec.js
      - name: Generate fixed shard
        run: |
          START=$(( ${{ matrix.shard }} * 1024 ))
          node tools/experiments/run-g2-01-calibration-stage2.js \
            --phase generate \
            --start-index "$START" \
            --count 1024 \
            --output artifacts/local/position-evaluation-empirical-outcome-calibration-replication/stage2-formal-v1
      - name: Independently replay fixed shard
        run: |
          START=$(( ${{ matrix.shard }} * 1024 ))
          node tools/experiments/verify-g2-01-calibration-stage2-independent.js \
            --mode games \
            --start-index "$START" \
            --count 1024 \
            --output artifacts/local/position-evaluation-empirical-outcome-calibration-replication/stage2-formal-v1
      - uses: actions/upload-artifact@v4
        with:
          name: peocr-stage2-shard-${{ matrix.shard }}
          path: artifacts/local/position-evaluation-empirical-outcome-calibration-replication/stage2-formal-v1
          if-no-files-found: error
          retention-days: 90

  merge-select-evaluate:
    needs: generate-shards
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          pattern: peocr-stage2-shard-*
          path: /tmp/peocr-stage2
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: peocr-stage1-development-v1
          path: /tmp/peocr-stage1
          repository: nkkmd/bao-la-kiswahili-game
          run-id: 33017663172
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Audit complete merged fixed population
        run: |
          test "$(find /tmp/peocr-stage2/games -maxdepth 1 -type f -name 'game-*.json' | wc -l)" -eq 8192
          test "$(find /tmp/peocr-stage2 -maxdepth 1 -type f -name 'verification-games-*.json' | wc -l)" -eq 8
          node - <<'NODE'
          const fs = require('node:fs');
          const files = fs.readdirSync('/tmp/peocr-stage2').filter(n => /^verification-games-\d+-\d+\.json$/.test(n)).sort();
          if (files.length !== 8) throw new Error(`Expected 8 shard verification files, got ${files.length}`);
          for (const file of files) {
            const v = JSON.parse(fs.readFileSync(`/tmp/peocr-stage2/${file}`, 'utf8'));
            if (v.passed !== true || v.gameReplayMismatches !== 0 || v.count !== 1024) throw new Error(`Invalid shard verification: ${file}`);
          }
          NODE
      - name: Apply outcome-blind firewall, select and measure
        run: |
          node tools/experiments/run-g2-01-calibration-stage2.js \
            --phase select-measure \
            --stage1-output /tmp/peocr-stage1 \
            --output /tmp/peocr-stage2
      - name: Independently verify firewall, selection and measurements
        run: |
          node tools/experiments/verify-g2-01-calibration-stage2-independent.js \
            --mode selection \
            --stage1-output /tmp/peocr-stage1 \
            --output /tmp/peocr-stage2
      - name: Run frozen formal evaluator
        run: node tools/experiments/evaluate-g2-01-calibration-stage2.js /tmp/peocr-stage2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peocr-stage2-formal-v1
          path: /tmp/peocr-stage2
          if-no-files-found: error
          retention-days: 90
