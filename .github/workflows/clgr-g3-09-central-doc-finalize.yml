name: CLGR G3-09 Central Documentation Finalization

on:
  push:
    branches:
      - research/g3-09-continuous-local-geometry-representation
    paths:
      - doc/continuous-local-geometry-representation/executions/clgr-g3-09-central-doc-finalize-trigger.json

permissions:
  contents: write

concurrency:
  group: clgr-g3-09-central-doc-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify finalizer syntax
        run: python3 -m py_compile tools/experiments/finalize-clgr-g3-09-central-docs.py
      - name: Finalize current-facing documentation only
        run: python3 tools/experiments/finalize-clgr-g3-09-central-docs.py
      - name: Verify no historical program-plan change
        run: test "$(git rev-parse HEAD:doc/research-generation-3/PROGRAM_PLAN.md)" = '2bb90c11f1625f63f40a7eab8a3de7774505a1ac'
      - name: Commit current-facing documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md doc/research-generation-3/README.md doc/research-generation-3/CURRENT_STATUS.md doc/continuous-local-geometry-representation/checkpoints/2026-09-03-central-document-update-pass.md
          git diff --cached --check
          git commit -m 'Finalize G3-09 current-facing documentation'
          git push origin HEAD:research/g3-09-continuous-local-geometry-representation
