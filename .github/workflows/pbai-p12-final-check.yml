name: PBAI-P12 final check

on:
  push:
    branches:
      - engineering/pbai-p12-margin-bounded-search
    paths:
      - '.github/workflows/pbai-p12-final-check.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engineering/pbai-p12-margin-bounded-search
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Finalize documentation
        run: python3 .github/scripts/pbai_p12_finalize_docs.py
      - name: Verify contracts
        run: |
          node --test test/public-ai-improvement-program1-contract.test.js
          node --test test/ai-generation-release.test.js
          git diff --check
          if git diff --name-only origin/main...HEAD | grep '^public/'; then
            echo 'Unexpected public/ changes in PBAI-P12 branch' >&2
            exit 1
          fi
      - name: Commit documentation updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md doc/ai-engineering/NEXT_IMPROVEMENT_CANDIDATE.md doc/ai-engineering/NEXT_IMPROVEMENT_PREFLIGHT_2026-09-14.md
          git commit -m 'docs: finalize PBAI-P12 documentation consistency'
          git push origin HEAD:engineering/pbai-p12-margin-bounded-search
