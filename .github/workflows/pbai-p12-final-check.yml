name: PBAI-P12 final check

on:
  push:
    branches:
      - engineering/pbai-p12-margin-bounded-search
    paths:
      - '.github/workflows/pbai-p12-final-check.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engineering/pbai-p12-margin-bounded-search
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 日本語見出しを最終整備
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'doc/ai-engineering/public-ai-improvement-program-12/AUTHORIZATION_REVIEW.md': {
                  '## 6. baseline support gate': '## 6. baseline support判定条件',
              },
              'doc/ai-engineering/public-ai-improvement-program-12/CANDIDATE_SPEC.md': {
                  '## 8. fixed-depth development gate': '## 8. 固定深度development判定条件',
              },
              'doc/ai-engineering/public-ai-improvement-program-12/DECISION_REGISTER.md': {
                  '## D-002 — baseline support': '## D-002 — baseline support判定',
                  '## D-003 — candidate mechanism freeze': '## D-003 — candidate mechanismの事前固定',
                  '## D-004 — fixed-depth development': '## D-004 — 固定深度development',
              },
              'doc/ai-engineering/public-ai-improvement-program-12/RELEASE_REGISTER.md': {
                  '# `PBAI-P12` — Release Register': '# `PBAI-P12` — リリース台帳',
              },
          }

          for path, pairs in replacements.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in pairs.items():
                  if old not in text:
                      raise SystemExit(f'expected heading not found: {path}: {old}')
                  if text.count(old) != 1:
                      raise SystemExit(f'heading not unique: {path}: {old}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: ルートREADMEと候補履歴を同期して監査
        run: python3 .github/scripts/pbai_p12_finalize_docs.py
      - name: Markdown差分の末尾空白を正規化
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('doc/ai-engineering/NEXT_IMPROVEMENT_CANDIDATE.md')
          text = p.read_text(encoding='utf-8')
          lines = [
              '更新日: 2026-09-17',
              '現在の公開AI系統: **`AI-GEN4`**',
              '状態: **`DEVELOPMENT-GATE-FAIL / NOT-ADOPTED / CLOSED`**',
              '正式Program ID: **`PBAI-P12`**',
          ]
          for line in lines:
              old = line + '  \n'
              new = line + chr(92) + '\n'
              if old in text:
                  text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: 関連契約と世代回帰を確認
        run: |
          node --test test/public-ai-improvement-program1-contract.test.js
          node --test test/ai-generation-release.test.js
          git diff --check
      - name: 最終整備を記録し一時監査ファイルを除去
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md \
            doc/ai-engineering/NEXT_IMPROVEMENT_CANDIDATE.md \
            doc/ai-engineering/NEXT_IMPROVEMENT_PREFLIGHT_2026-09-14.md \
            doc/ai-engineering/public-ai-improvement-program-12/*.md
          git rm \
            .github/workflows/pbai-p12-final-check.yml \
            .github/workflows/pbai-p12-final-doc-audit.yml \
            .github/scripts/pbai_p12_finalize_docs.py
          git commit -m 'docs: finalize PBAI-P12 documentation consistency'
          git push origin HEAD:engineering/pbai-p12-margin-bounded-search
