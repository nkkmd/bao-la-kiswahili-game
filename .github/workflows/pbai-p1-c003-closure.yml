name: PBAI-P1 C003 predevelopment closure

on:
  pull_request:
    branches: [main]
    paths:
      - 'doc/ai-engineering/public-ai-improvement-program-1/**'
      - 'tools/engineering/validate-pbai-c003-predevelopment-support-spec.js'
      - 'tools/engineering/materialize-pbai-c003-predevelopment-support.js'
      - 'test/public-ai-improvement-program1-contract.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify closure contains no public candidate implementation
        run: |
          changed="$(git diff --name-only origin/main...HEAD -- public/)"
          test -z "$changed" || {
            echo 'C003 closure must not modify public/.' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          test "$(sha256sum public/engine.js | awk '{print $1}')" = "e6acf1fe4d97db67dbcfadc3a785e802342ae0b0cbaec35f53eb8e77424cfc1c"
          test "$(sha256sum public/ai.js | awk '{print $1}')" = "2823dbcf96c7a47489301ecd768a63975aa8b4e12b62cc4629fc8283ef5dff9e"

      - name: Validate frozen global gates and C003 support spec
        run: |
          node tools/engineering/validate-pbai-p1-gate-spec.js
          node tools/engineering/validate-pbai-c003-predevelopment-support-spec.js

      - name: Validate current PBAI-P1 closure state
        run: node test/public-ai-improvement-program1-contract.test.js

      - name: Verify binding C003 identity-gate HOLD
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = 'doc/ai-engineering/public-ai-improvement-program-1/candidates/PBAI-C003-v1-predevelopment-support-result.json';
          const r = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (r.finalSupportStatus !== 'NON-ESTIMABLE-PRACTICAL-REACHABILITY-HOLD') throw new Error('unexpected C003 disposition');
          if (r.failureStage !== 'STRICT-RAW-IDENTITY-BINDING') throw new Error('unexpected failure stage');
          if (r.failureReason !== 'ORACLE-STORED-ROW-REHASH-MISMATCH') throw new Error('unexpected failure reason');
          if (r.identityBindingResult.passed !== false) throw new Error('identity gate unexpectedly passed');
          if (r.identityBindingResult.reachabilityMeasurementExecuted !== false) throw new Error('reachability unexpectedly executed');
          if (r.identityBindingResult.trajectoriesWithNonterminalOracleHit !== null) throw new Error('unmeasured hit count must remain null');
          if (r.identityBindingResult.uniqueNonterminalOracleStatesHit !== null) throw new Error('unmeasured state count must remain null');
          if (r.identityBindingResult.zeroHitConclusionAuthorized !== false) throw new Error('zero-hit inference unexpectedly authorized');
          if (r.identityBindingResult.knownAffectedRepositoryRowsFromORISC.length !== 3) throw new Error('known ORISC mismatch count drift');
          if (r.workflowProvenance.pullRequest !== 63 || r.workflowProvenance.pullRequestMerged !== false || r.workflowProvenance.pullRequestClosedWithoutMerge !== true) throw new Error('PR disposition mismatch');
          for (const key of ['candidateImplementationObserved','candidateCodeUsed','candidateBenefitMetricsObserved','validationSeedsAccessed','releaseHoldoutSeedsAccessed','publicCodeChanged','developmentAuthorizationGranted','publicAdoptionAuthorized','aiGen3PromotionAuthorized','researchGeneration2EvidenceIncluded']) {
            if (r.firewall[key] !== false) throw new Error(`firewall reopened: ${key}`);
          }
          if (r.noRescueRule.sameVersionIdentityRelaxationAllowed !== false || r.noRescueRule.sameVersionSeedBlockExpansionAllowed !== false || r.noRescueRule.sameVersionSyntheticFixtureSubstitutionAllowed !== false) throw new Error('same-version rescue reopened');
          if (r.researchBoundary.restrictedEndgameFormalDecisionChanged !== false || r.researchBoundary.oriscFormalDecisionChanged !== false) throw new Error('research decision unexpectedly changed');
          if (r.mainPublicResult !== 'KEEP-AI-GEN2') throw new Error('public result drift');
          console.log('PBAI-C003-v1 identity-binding HOLD: PASS');
          NODE
