name: PSRRE Stage 0 Technical

# Technical-only prerequisite validation. No PSRRE Stage 1/2 scientific seed may be consumed.
on:
  workflow_dispatch:
  push:
    branches:
      - research/pre-g2-11-strategic-regime-representation-eligibility
    paths:
      - 'doc/prospective-strategic-regime-representation-eligibility/authorizations/STAGE_0_TECHNICAL_EXECUTE.json'

permissions:
  contents: read

jobs:
  technical-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Environment and syntax
        run: |
          node --version
          git rev-parse HEAD
          git rev-parse HEAD^
          git status --short
          node --check tools/experiments/run-psrre-stage0-technical.js
          node --check tools/experiments/lib/psrre-stage0-production.js
          node --check tools/experiments/lib/psrre-stage0-independent.js

      - name: Run PSRRE Stage 0 technical-only validation
        run: |
          mkdir -p artifacts/local/psrre-stage0-technical
          /usr/bin/time -v node tools/experiments/run-psrre-stage0-technical.js artifacts/local/psrre-stage0-technical \
            2>&1 | tee artifacts-psrre-stage0.log

      - name: Preserve technical-only artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psrre-stage0-technical-${{ github.sha }}
          path: |
            artifacts/local/psrre-stage0-technical/**
            artifacts-psrre-stage0.log
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
