name: G2-09 Japanese Documentation Materialization

on:
  push:
    branches:
      - research/g2-09-tactical-motif-generalization-counterexample
    paths:
      - tools/experiments/materialize-g2-09-japanese-docs.py
      - tools/experiments/finalize-g2-09-japanese-docs.py
      - .github/workflows/g2-09-japanese-doc-materialization.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize Japanese human-facing documentation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 tools/experiments/materialize-g2-09-japanese-docs.py > /tmp/g2-09-materialize.log 2>&1
          rc=$?
          set -e
          cat /tmp/g2-09-materialize.log
          if [ "$rc" -ne 0 ]; then
            if ! grep -q '^unreplaced audited lines remain:' /tmp/g2-09-materialize.log; then
              exit "$rc"
            fi
          fi
          python3 tools/experiments/finalize-g2-09-japanese-docs.py
          python3 tools/experiments/audit-g2-09-japanese-docs.py | tee g2-09-japanese-doc-audit-after.json
          git diff --check

      - name: Verify change scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/changed.txt
          cat /tmp/changed.txt
          if grep -Ev '^(doc/tactical-motif-generalization-counterexample/.*\.md|doc/research-program-decisions/2026-08-30-g2-09-tactical-motif-generalization-counterexample-closure\.md)$' /tmp/changed.txt; then
            echo 'Unexpected non-human-facing or out-of-scope file change.' >&2
            exit 2
          fi
          test -s /tmp/changed.txt

      - name: Commit Japanese documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sawa'
          git config user.email '72678394+nkkmd@users.noreply.github.com'
          git add doc/tactical-motif-generalization-counterexample doc/research-program-decisions/2026-08-30-g2-09-tactical-motif-generalization-counterexample-closure.md
          git commit -m 'docs(research): complete G2-09 Japanese documentation'
          git push origin HEAD:research/g2-09-tactical-motif-generalization-counterexample
