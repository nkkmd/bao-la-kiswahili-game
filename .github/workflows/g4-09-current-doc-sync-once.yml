name: G4-09 current-facing documentation sync once

on:
  push:
    branches:
      - research/g4-09-search-reliability-exact-agreement
    paths:
      - .github/workflows/g4-09-current-doc-sync-once.yml

permissions:
  contents: write

jobs:
  sync-current-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Patch only stale current-facing G4-09 statements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {n}")
              return text.replace(old, new, 1)

          p = Path('doc/RESEARCH_INDEX.md')
          s = p.read_text(encoding='utf-8')
          s = once(s, '更新日: 2026-09-27  ', '更新日: 2026-09-28  ', 'index date')
          s = once(s, '現在の状態: **Research Generation 2・3は完了済み。Research Generation 4はG4-01〜G4-08 main統合済み。G4-09は未認可、G4-10は保護・未アクセス**', '現在の状態: **Research Generation 2・3は完了済み。Research Generation 4はG4-01〜G4-08 main統合済み。G4-09は研究完了・research branch上でclosed、G4-10は保護・未アクセス**', 'index headline')
          s = once(s, '| G4-08 main統合記録 | [`research-generation-4/checkpoints/2026-09-27-g4-08-main-integration.md`](research-generation-4/checkpoints/2026-09-27-g4-08-main-integration.md) |', '| G4-08 main統合記録 | [`research-generation-4/checkpoints/2026-09-27-g4-08-main-integration.md`](research-generation-4/checkpoints/2026-09-27-g4-08-main-integration.md) |\n| G4-09の正式結果 | [`geometry-conditioned-search-reliability-exact-agreement/CURRENT_STATUS.md`](geometry-conditioned-search-reliability-exact-agreement/CURRENT_STATUS.md) |', 'index entry link')
          s = once(s, '| `G4-09` | search reliability / exact agreement | `DEPENDENCY-GATED / NOT-AUTHORIZED-NOT-EXECUTED` |', '| `G4-09` / [`GCSREA-STUDY1`](geometry-conditioned-search-reliability-exact-agreement/) | search reliability / exact agreement | `CLOSED / MODULE-A-NOT-ELIGIBLE-FOR-FORMAL-HOLDOUT / MODULE-B-FIXED8-EXACT-CENSUS-COMPLETE / NOT YET MAIN INTEGRATED` |', 'index table row')
          p.write_text(s, encoding='utf-8')

          p = Path('doc/FUTURE_RESEARCH_AGENDA.md')
          s = p.read_text(encoding='utf-8')
          s = once(s, 'Version: 5.10.1', 'Version: 5.11.0', 'future version')
          s = once(s, '更新日: 2026-09-27  ', '更新日: 2026-09-28  ', 'future date')
          s = once(s, 'Research Generation 4: **G4-01〜G4-08 complete/closed and integrated to `main` / G4-09 not authorized / G4-10 protected**', 'Research Generation 4: **G4-01〜G4-08 complete/closed and integrated to `main` / G4-09 closed on research branch / G4-10 protected**', 'future headline')
          s = once(s, 'G4-09 = DEPENDENCY-GATED / NOT AUTHORIZED', 'G4-09 = CLOSED / MODULE-A-NOT-ELIGIBLE-FOR-FORMAL-HOLDOUT / MODULE-B-FIXED8-EXACT-CENSUS-COMPLETE / NOT YET MAIN INTEGRATED', 'future status block')
          s = once(s, '| C | `G4-09` | search reliability / exact agreement | `DEPENDENCY-GATED / NOT AUTHORIZED` |', '| C | `G4-09` | search reliability / exact agreement | `CLOSED / MODULE-A NOT ELIGIBLE / MODULE-B FIXED8 EXACT-CENSUS COMPLETE / NOT YET MAIN INTEGRATED` |', 'future table row')
          s = once(s, '以下は科学的価値の高い候補です。優先順位はauthorizationではありません。G4-08 scientific execution・closure・main統合は完了しています。次のscientific agendaを開始する場合は、fresh evidence access前に独立authorization reviewを行います。', '以下は科学的価値の高い候補です。優先順位はauthorizationではありません。G4-09 scientific execution・closureはresearch branch上で完了しています。次のscientific agendaを開始する場合は、fresh evidence access前に独立authorization reviewを行います。G4-10は引き続きprotectedであり、G4-09 closureによって自動認可されません。', 'future priorities intro')
          old = '### 2.1 G4-09 — 次のWave C候補\n\nG4-08はformal holdoutまで完了し、24/24 `NON-ESTIMABLE`で閉じました。この結果を救済するためにply-0除外、freshness grammar変更、seed extension、replacement populationを同Study内で行いません。\n\nG4-09はgeometry-conditioned search reliabilityと、G4-05 exact microdomainに限定したexact agreement moduleを分離して検証する候補です。一般domainではhigher-resource searchをtruthとして扱わず、exact correctnessを主張するmoduleはformal-eligible exact domainへ限定します。\n\nG4-09は**未認可**です。G4-08 closureやmain統合はG4-09のscientific executionを自動承認しません。開始する場合は独立authorization reviewを行います。'
          new = '### 2.1 G4-09 closure後の次研究境界\n\nG4-09 `GCSREA-STUDY1` は`CLOSED / MODULE-A-NOT-ELIGIBLE-FOR-FORMAL-HOLDOUT / MODULE-B-FIXED8-EXACT-CENSUS-COMPLETE`として研究実行を閉じました。Module Aのsupport gateを結果後に緩和せず、general Stage 2 namespaceは未読のまま封印します。Module Bのfixed-8 exact censusもrerun・domain追加を行いません。\n\n次のscientific agendaはG4-09のrepairやrescueとして開始せず、新しいprospective Study identity、fresh evidence境界、独立authorization reviewを必要とします。G4-10 depth 11は独立したprotected holdoutであり、引き続き`NOT AUTHORIZED / NOT ACCESSED`です。'
          s = once(s, old, new, 'future section 2.1')
          s = once(s, '4. **[進行] Research Generation 4 — G4-01/G4-03/G4-04/G4-05/G4-06/G4-07は完了・main統合済み。G4-02は科学的判定なしで終了。G4-08は24/24 NON-ESTIMABLEで研究閉鎖・main統合済み。次のscientific候補はG4-09だが未認可**', '4. **[進行] Research Generation 4 — G4-01〜G4-08は各final dispositionでmain統合済み。G4-09は研究完了・research branch上でclosed。次のscientific agendaは未選定で、G4-10 depth 11はprotected / not authorized / not accessed**', 'future program item')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify scope and stale statements
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'doc/FUTURE_RESEARCH_AGENDA.md\ndoc/RESEARCH_INDEX.md'
          ! grep -Fq 'G4-09は未認可' doc/RESEARCH_INDEX.md
          ! grep -Fq 'DEPENDENCY-GATED / NOT-AUTHORIZED-NOT-EXECUTED' doc/RESEARCH_INDEX.md
          ! grep -Fq 'G4-09 not authorized' doc/FUTURE_RESEARCH_AGENDA.md
          ! grep -Fq 'G4-09 = DEPENDENCY-GATED / NOT AUTHORIZED' doc/FUTURE_RESEARCH_AGENDA.md
          ! grep -Fq '次のscientific候補はG4-09' doc/FUTURE_RESEARCH_AGENDA.md
          grep -Fq 'G4-09 = CLOSED / MODULE-A-NOT-ELIGIBLE-FOR-FORMAL-HOLDOUT / MODULE-B-FIXED8-EXACT-CENSUS-COMPLETE / NOT YET MAIN INTEGRATED' doc/FUTURE_RESEARCH_AGENDA.md
          grep -Fq 'G4-10 depth 11 = NOT AUTHORIZED / NOT ACCESSED' doc/FUTURE_RESEARCH_AGENDA.md
          grep -Fq 'G4-09は研究完了・research branch上でclosed' doc/RESEARCH_INDEX.md
          grep -Fq 'G4-10は保護・未アクセス' doc/RESEARCH_INDEX.md

      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md
          git commit -m 'docs(g4-09): synchronize current-facing research docs'
          git push origin HEAD:${GITHUB_REF_NAME}
