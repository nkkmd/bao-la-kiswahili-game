name: G4-09 current-facing documentation sync once

on:
  push:
    branches:
      - research/g4-09-search-reliability-exact-agreement
    paths:
      - .github/workflows/g4-09-current-doc-sync-once.yml

permissions:
  contents: write

jobs:
  sync-current-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Patch only stale current-facing G4-09 statements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one occurrence, found {count}")
              return text.replace(old, new, 1)

          # doc/RESEARCH_INDEX.md
          p = Path('doc/RESEARCH_INDEX.md')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, '更新日: 2026-09-27  ', '更新日: 2026-09-28  ', 'research-index date')
          s = replace_once(
              s,
              '現在の状態: **Research Generation 2・3は完了済み。Research Generation 4はG4-01〜G4-08 main統合済み。G4-09は未認可、G4-10は保護・未アクセス**',
              '現在の状態: **Research Generation 2・3は完了済み。Research Generation 4はG4-01〜G4-08 main統合済み。G4-09は研究完了・research branch上でclosed、G4-10は保護・未アクセス**',
              'research-index current state')
          s = replace_once(
              s,
              '| G4-08 main統合記録 | [`research-generation-4/checkpoints/2026-09-27-g4-08-main-integration.md`](research-generation-4/checkpoints/2026-09-27-g4-08-main-integration.md) |',
              '| G4-08 main統合記録 | [`research-generation-4/checkpoints/2026-09-27-g4-08-main-integration.md`](research-generation-4/checkpoints/2026-09-27-g4-08-main-integration.md) |\n| G4-09の正式結果 | [`geometry-conditioned-search-reliability-exact-agreement/CURRENT_STATUS.md`](geometry-conditioned-search-reliability-exact-agreement/CURRENT_STATUS.md) |',
              'research-index entry link')
          s = replace_once(
              s,
              '| `G4-09` | search reliability / exact agreement | `DEPENDENCY-GATED / NOT-AUTHORIZED-NOT-EXECUTED` |',
              '| `G4-09` / [`GCSREA-STUDY1`](geometry-conditioned-search-reliability-exact-agreement/) | search reliability / exact agreement | `CLOSED / MODULE-A-NOT-ELIGIBLE-FOR-FORMAL-HOLDOUT / MODULE-B-FIXED8-EXACT-CENSUS-COMPLETE / NOT YET MAIN INTEGRATED` |',
              'research-index G4-09 table row')
          anchor = '詳しくは、[`rule-semantic-geometry-transition/CURRENT_STATUS.md`](rule-semantic-geometry-transition/CURRENT_STATUS.md)、[`rule-semantic-geometry-transition/results/stage-2/STAGE_2_CANONICAL_RECORD.json`](rule-semantic-geometry-transition/results/stage-2/STAGE_2_CANONICAL_RECORD.json)、[`research-program-decisions/2026-09-27-g4-08-rule-semantic-geometry-transition-study1-closure.md`](research-program-decisions/2026-09-27-g4-08-rule-semantic-geometry-transition-study1-closure.md)、[`research-generation-4/checkpoints/2026-09-27-g4-08-main-integration.md`](research-generation-4/checkpoints/2026-09-27-g4-08-main-integration.md)を参照してください。\n\n## Research Generation 3 — 局所ゲーム木幾何'
          g409 = '''詳しくは、[`rule-semantic-geometry-transition/CURRENT_STATUS.md`](rule-semantic-geometry-transition/CURRENT_STATUS.md)、[`rule-semantic-geometry-transition/results/stage-2/STAGE_2_CANONICAL_RECORD.json`](rule-semantic-geometry-transition/results/stage-2/STAGE_2_CANONICAL_RECORD.json)、[`research-program-decisions/2026-09-27-g4-08-rule-semantic-geometry-transition-study1-closure.md`](research-program-decisions/2026-09-27-g4-08-rule-semantic-geometry-transition-study1-closure.md)、[`research-generation-4/checkpoints/2026-09-27-g4-08-main-integration.md`](research-generation-4/checkpoints/2026-09-27-g4-08-main-integration.md)を参照してください。

### G4-09

G4-09 `GCSREA-STUDY1` は、general-domainのsearch-output stabilityと、G4-05固定8 exact microdomain内のsearch-vs-exact agreementを分離してprospectiveに検証しました。

Module AはStage 1 fresh developmentをone-shotで完了しましたが、事前固定した9つのgeometry × search contrast slotがすべてsupport gate未達となったため、general-domain formal holdoutへ進まず`NOT-ELIGIBLE-FOR-FORMAL-HOLDOUT`として閉じました。これはsearch effectが存在しないというnegative resultではありません。

Module BはG4-05の固定8 exact microdomainをfinite censusとしてone-shot測定しました。2 domainは合法手1つのforced rootとして別集計し、残る6 domain × 6 search configurationsの36 cellはすべてestimableでした。canonical-bestとPV first moveは36/36でexact optimal set内、TopSetは35/36 `EQUAL`、1/36 `SEARCH-SUBSET-EXACT`でした。production / independent searchおよびclassifierは一致しました。

このfixed-8 censusはrandom sampleではなく、whole-Bao accuracy / correctness probabilityやconfiguration rankingへ一般化しません。G4-10 depth 11へのアクセス、public AI変更、general Stage 2 seed accessは行っていません。

G4-09は`CLOSED / MODULE-A-NOT-ELIGIBLE-FOR-FORMAL-HOLDOUT / MODULE-B-FIXED8-EXACT-CENSUS-COMPLETE`として研究実行を閉じています。現時点ではresearch branch上でclosedであり、`main`統合前の整合性監査中です。

詳しくは、[`geometry-conditioned-search-reliability-exact-agreement/CURRENT_STATUS.md`](geometry-conditioned-search-reliability-exact-agreement/CURRENT_STATUS.md)、[`geometry-conditioned-search-reliability-exact-agreement/results/stage-2/STAGE_2_CANONICAL_RECORD.json`](geometry-conditioned-search-reliability-exact-agreement/results/stage-2/STAGE_2_CANONICAL_RECORD.json)、[`research-program-decisions/2026-09-28-g4-09-search-reliability-exact-agreement-study1-closure.md`](research-program-decisions/2026-09-28-g4-09-search-reliability-exact-agreement-study1-closure.md)を参照してください。

## Research Generation 3 — 局所ゲーム木幾何'''
          s = replace_once(s, anchor, g409, 'research-index G4-09 section insertion')
          p.write_text(s, encoding='utf-8')

          # doc/FUTURE_RESEARCH_AGENDA.md
          p = Path('doc/FUTURE_RESEARCH_AGENDA.md')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, 'Version: 5.10.1', 'Version: 5.11.0', 'future version')
          s = replace_once(s, '更新日: 2026-09-27  ', '更新日: 2026-09-28  ', 'future date')
          s = replace_once(
              s,
              'Research Generation 4: **G4-01〜G4-08 complete/closed and integrated to `main` / G4-09 not authorized / G4-10 protected**',
              'Research Generation 4: **G4-01〜G4-08 complete/closed and integrated to `main` / G4-09 closed on research branch / G4-10 protected**',
              'future RG4 headline')
          s = replace_once(
              s,
              'G4-09 = DEPENDENCY-GATED / NOT AUTHORIZED',
              'G4-09 = CLOSED / MODULE-A-NOT-ELIGIBLE-FOR-FORMAL-HOLDOUT / MODULE-B-FIXED8-EXACT-CENSUS-COMPLETE / NOT YET MAIN INTEGRATED',
              'future status block')
          s = replace_once(
              s,
              '| C | `G4-09` | search reliability / exact agreement | `DEPENDENCY-GATED / NOT AUTHORIZED` |',
              '| C | `G4-09` | search reliability / exact agreement | `CLOSED / MODULE-A NOT ELIGIBLE / MODULE-B FIXED8 EXACT-CENSUS COMPLETE / NOT YET MAIN INTEGRATED` |',
              'future table row')

          anchor = '詳細は[`rule-semantic-geometry-transition/CURRENT_STATUS.md`](rule-semantic-geometry-transition/CURRENT_STATUS.md)、[`rule-semantic-geometry-transition/results/stage-2/STAGE_2_CANONICAL_RECORD.json`](rule-semantic-geometry-transition/results/stage-2/STAGE_2_CANONICAL_RECORD.json)、[`research-program-decisions/2026-09-27-g4-08-rule-semantic-geometry-transition-study1-closure.md`](research-program-decisions/2026-09-27-g4-08-rule-semantic-geometry-transition-study1-closure.md)、[`research-generation-4/checkpoints/2026-09-27-g4-08-main-integration.md`](research-generation-4/checkpoints/2026-09-27-g4-08-main-integration.md)を参照してください。\n\n## 2. 今後の優先課題'
          replacement = '''詳細は[`rule-semantic-geometry-transition/CURRENT_STATUS.md`](rule-semantic-geometry-transition/CURRENT_STATUS.md)、[`rule-semantic-geometry-transition/results/stage-2/STAGE_2_CANONICAL_RECORD.json`](rule-semantic-geometry-transition/results/stage-2/STAGE_2_CANONICAL_RECORD.json)、[`research-program-decisions/2026-09-27-g4-08-rule-semantic-geometry-transition-study1-closure.md`](research-program-decisions/2026-09-27-g4-08-rule-semantic-geometry-transition-study1-closure.md)、[`research-generation-4/checkpoints/2026-09-27-g4-08-main-integration.md`](research-generation-4/checkpoints/2026-09-27-g4-08-main-integration.md)を参照してください。

### G4-09

G4-09 `GCSREA-STUDY1` は、general-domainのsearch-output stabilityとG4-05固定8 exact microdomain内のexact agreementを分離して検証しました。

Module AはStage 1 fresh developmentをone-shotで完了しましたが、9つの事前固定slotがすべてsupport gate未達となり、general-domain formal holdoutには進まず`NOT-ELIGIBLE-FOR-FORMAL-HOLDOUT`として閉じました。これはno-effect resultではありません。

Module BはG4-05固定8 domainをfinite censusとしてone-shot測定しました。2 forced rootを別集計し、6 nontrivial domains × 6 frozen search configurations = 36/36 cellsがestimableでした。canonical-bestとPV first moveは36/36でexact optimal set内、TopSetは35/36 `EQUAL`、1/36 `SEARCH-SUBSET-EXACT`でした。production / independentは一致しています。

固定8はrandom sampleではないため、whole-Bao correctness probabilityやconfiguration winnerへ一般化しません。general Stage 2 namespaceは未読のまま封印し、G4-10 depth 11にもアクセスしていません。public AI変更もありません。

正式状態は`CLOSED / MODULE-A-NOT-ELIGIBLE-FOR-FORMAL-HOLDOUT / MODULE-B-FIXED8-EXACT-CENSUS-COMPLETE`です。詳細は[`geometry-conditioned-search-reliability-exact-agreement/CURRENT_STATUS.md`](geometry-conditioned-search-reliability-exact-agreement/CURRENT_STATUS.md)を参照してください。

## 2. 今後の優先課題'''
          s = replace_once(s, anchor, replacement, 'future G4-09 section insertion')
          s = replace_once(
              s,
              '以下は科学的価値の高い候補です。優先順位はauthorizationではありません。G4-08 scientific execution・closure・main統合は完了しています。次のscientific agendaを開始する場合は、fresh evidence access前に独立authorization reviewを行います。',
              '以下は科学的価値の高い候補です。優先順位はauthorizationではありません。G4-09 scientific execution・closureはresearch branch上で完了しています。次のscientific agendaを開始する場合は、fresh evidence access前に独立authorization reviewを行います。G4-10は引き続きprotectedであり、G4-09 closureによって自動認可されません。',
              'future section2 intro')
          old = '''### 2.1 G4-09 — 次のWave C候補

G4-08はformal holdoutまで完了し、24/24 `NON-ESTIMABLE`で閉じました。この結果を救済するためにply-0除外、freshness grammar変更、seed extension、replacement populationを同Study内で行いません。

G4-09はgeometry-conditioned search reliabilityと、G4-05 exact microdomainに限定したexact agreement moduleを分離して検証する候補です。一般domainではhigher-resource searchをtruthとして扱わず、exact correctnessを主張するmoduleはformal-eligible exact domainへ限定します。

G4-09は**未認可**です。G4-08 closureやmain統合はG4-09のscientific executionを自動承認しません。開始する場合は独立authorization reviewを行います。'''
          new = '''### 2.1 G4-09 closure後の次研究境界

G4-09は上記のとおり研究実行を閉じました。Module Aのsupport gateを結果後に緩和したり、general Stage 2 namespaceを同Studyで開いたり、fixed-8 exact censusを再実行・拡張したりしません。

次のscientific agendaはG4-09のrepairやrescueとして開始せず、新しいprospective Study identity、fresh evidence境界、authorization reviewを必要とします。G4-10 depth 11は独立したprotected holdoutであり、引き続き`NOT AUTHORIZED / NOT ACCESSED`です。'''
          s = replace_once(s, old, new, 'future section2.1')
          s = replace_once(
              s,
              'G4-03のsearch-ranking result、G4-04のtrajectory-transfer result、G4-05のexact microdomain result、G4-06のgeometry / exact-consequence bridge result、G4-07のmultiscale memory / reversal result、G4-08のrule-semantic transition `NON-ESTIMABLE` closureはいずれも、公開AIの棋力改善を直接示すものではありません。',
              'G4-03のsearch-ranking result、G4-04のtrajectory-transfer result、G4-05のexact microdomain result、G4-06のgeometry / exact-consequence bridge result、G4-07のmultiscale memory / reversal result、G4-08のrule-semantic transition `NON-ESTIMABLE` closure、G4-09のsearch reliability / fixed-8 exact-census resultはいずれも、公開AIの棋力改善を直接示すものではありません。',
              'future section2.7')
          s = replace_once(
              s,
              'G4-03はroot legal widthとranking-preorder changeのassociationがfresh domainsへ広く移ることを示しました。G4-04はG3-10由来C1/C2/C3/C5 directionがfresh P1/P2 domainsへ8/8で移送されることを確認しました。G4-06では固定8 exact microdomain内でbounded geometryとexact consequenceを接続しました。G4-07では固定P1/P2 trajectoriesの最短lagで全6 geometry axisが`REVERSAL-CONFIRMED`となりました。G4-08はrule-semantic eventとgeometry directionについてformal conclusionを形成できず、24/24 `NON-ESTIMABLE`で閉じました。ただし、いずれも固定domain外へ無条件に一般化しません。',
              'G4-03はroot legal widthとranking-preorder changeのassociationがfresh domainsへ広く移ることを示しました。G4-04はG3-10由来C1/C2/C3/C5 directionがfresh P1/P2 domainsへ8/8で移送されることを確認しました。G4-06では固定8 exact microdomain内でbounded geometryとexact consequenceを接続しました。G4-07では固定P1/P2 trajectoriesの最短lagで全6 geometry axisが`REVERSAL-CONFIRMED`となりました。G4-08はrule-semantic eventとgeometry directionについてformal conclusionを形成できず、24/24 `NON-ESTIMABLE`で閉じました。G4-09ではgeneral search-stability moduleはsupport不足でformal holdoutへ進まず、fixed-8 exact moduleでは36/36 nontrivial cellsがestimableでした。ただし、いずれも固定domain外へ無条件に一般化しません。',
              'future section4.3')
          s = replace_once(
              s,
              'G4-05のformal decisionは`EXACT-ORACLE-FOUNDATION-ESTABLISHED-WITHIN-FROZEN-MICRODOMAIN`です。G4-06はその固定8 domainを使ってbounded geometryとのformal bridge mappingを完了しましたが、これもwhole-Bao solution、DRAW分布、arbitrary root optimality、普遍的なgeometry lawへ拡張しません。',
              'G4-05のformal decisionは`EXACT-ORACLE-FOUNDATION-ESTABLISHED-WITHIN-FROZEN-MICRODOMAIN`です。G4-06はその固定8 domainを使ってbounded geometryとのformal bridge mappingを完了しました。G4-09 Module Bは同じ固定8をfinite censusとしてsearch-vs-exact agreementへ接続し、nontrivial 36/36 cellsを測定しましたが、これらはいずれもwhole-Bao solution、DRAW分布、arbitrary root optimality、correctness probability、普遍的なgeometry lawへ拡張しません。',
              'future section4.6')
          s = replace_once(
              s,
              '4. **[進行] Research Generation 4 — G4-01/G4-03/G4-04/G4-05/G4-06/G4-07は完了・main統合済み。G4-02は科学的判定なしで終了。G4-08は24/24 NON-ESTIMABLEで研究閉鎖・main統合済み。次のscientific候補はG4-09だが未認可**',
              '4. **[進行] Research Generation 4 — G4-01〜G4-08は各final dispositionでmain統合済み。G4-09は研究完了・research branch上でclosed。次のscientific agendaは未選定で、G4-10 depth 11はprotected / not authorized / not accessed**',
              'future section5 item4')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify only intended files changed and stale current-state statements removed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'doc/FUTURE_RESEARCH_AGENDA.md\ndoc/RESEARCH_INDEX.md'
          ! grep -Fq 'G4-09は未認可' doc/RESEARCH_INDEX.md
          ! grep -Fq 'DEPENDENCY-GATED / NOT-AUTHORIZED-NOT-EXECUTED' doc/RESEARCH_INDEX.md
          ! grep -Fq 'G4-09 not authorized' doc/FUTURE_RESEARCH_AGENDA.md
          ! grep -Fq 'G4-09 = DEPENDENCY-GATED / NOT AUTHORIZED' doc/FUTURE_RESEARCH_AGENDA.md
          ! grep -Fq '次のscientific候補はG4-09' doc/FUTURE_RESEARCH_AGENDA.md
          grep -Fq 'G4-09 = CLOSED / MODULE-A-NOT-ELIGIBLE-FOR-FORMAL-HOLDOUT / MODULE-B-FIXED8-EXACT-CENSUS-COMPLETE / NOT YET MAIN INTEGRATED' doc/FUTURE_RESEARCH_AGENDA.md
          grep -Fq 'G4-10 depth 11 = NOT AUTHORIZED / NOT ACCESSED' doc/FUTURE_RESEARCH_AGENDA.md
          grep -Fq 'G4-09は研究完了・research branch上でclosed' doc/RESEARCH_INDEX.md
          grep -Fq 'G4-10は保護・未アクセス' doc/RESEARCH_INDEX.md

      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doc/RESEARCH_INDEX.md doc/FUTURE_RESEARCH_AGENDA.md
          git commit -m 'docs(g4-09): synchronize current-facing research docs'
          git push origin HEAD:${GITHUB_REF_NAME}
