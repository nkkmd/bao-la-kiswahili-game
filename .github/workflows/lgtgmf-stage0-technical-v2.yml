name: LGTGMF Stage 0 Technical v2
on:
  push:
    branches: [research/g3-01-local-game-tree-geometry-measurement-foundation]
    paths: ['doc/local-game-tree-geometry-measurement-foundation/authorizations/STAGE_0_TECHNICAL_V2_EXECUTE.json']
permissions:
  contents: read
jobs:
  technical-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify corrective authorization and source boundary
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const a=JSON.parse(fs.readFileSync('doc/local-game-tree-geometry-measurement-foundation/authorizations/STAGE_0_TECHNICAL_V2_EXECUTE.json','utf8'));
          const p=cp.execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          if(a.stageId!=='LGTGMF-S0-TECHNICAL-2026-08-31-v2'||a.implementationFreezeCommit!==p)throw Error('authorization/freeze mismatch');
          if(a.scientificSeedConsumptionAuthorized!==false||a.stage1SeedReadAuthorized!==false||a.stage2SeedReadAuthorized!==false)throw Error('fresh-evidence firewall');
          if(a.standardRootDepth10GenerationAuthorized!==false||a.standardRootDepth10ReadAuthorized!==false)throw Error('depth10 firewall');
          NODE
          node --check tools/experiments/lib/lgtgmf-production-v2.js
          node --check tools/experiments/lib/lgtgmf-independent-v2.js
          node --check tools/experiments/run-lgtgmf-stage0-technical-v2.js
          node --check tools/experiments/verify-lgtgmf-stage0-independent-v2.js
          if grep -q 'lgtgmf-production' tools/experiments/lib/lgtgmf-independent-v2.js tools/experiments/verify-lgtgmf-stage0-independent-v2.js; then exit 1; fi
          sha256sum tools/experiments/lib/lgtgmf-production-v2.js tools/experiments/lib/lgtgmf-independent-v2.js tools/experiments/run-lgtgmf-stage0-technical-v2.js tools/experiments/verify-lgtgmf-stage0-independent-v2.js doc/local-game-tree-geometry-measurement-foundation/preregistration/STAGE_0_TECHNICAL_SPEC_V2.json
      - name: Re-run retained v1 technical controls
        run: |
          set -euo pipefail
          V1=artifacts/local/local-game-tree-geometry-measurement-foundation/stage0-technical-v2/v1-controls
          mkdir -p "$V1"
          node tools/experiments/run-lgtgmf-stage0-technical.js "$V1"
          node tools/experiments/verify-lgtgmf-stage0-independent.js "$V1"
      - name: Run corrective v2 production and independent paths
        run: |
          set -euo pipefail
          OUT=artifacts/local/local-game-tree-geometry-measurement-foundation/stage0-technical-v2
          node tools/experiments/run-lgtgmf-stage0-technical-v2.js "$OUT" | tee lgtgmf-stage0-v2-production.log
          node tools/experiments/verify-lgtgmf-stage0-independent-v2.js "$OUT" | tee lgtgmf-stage0-v2-independent.log
      - name: Preserve corrective technical artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lgtgmf-stage0-technical-v2-${{ github.sha }}
          path: |
            artifacts/local/local-game-tree-geometry-measurement-foundation/stage0-technical-v2/**
            lgtgmf-stage0-v2-production.log
            lgtgmf-stage0-v2-independent.log
          retention-days: 30
