name: TCTGD Stage 1 Development

on:
  workflow_dispatch:
    inputs:
      authorization_nonce:
        description: Frozen Stage 1 authorization nonce
        required: true
        type: string
      dispatcher_run_id:
        description: Non-scientific dispatcher workflow run ID
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: tctgd-stage1-development
  cancel-in-progress: false

jobs:
  lease:
    runs-on: ubuntu-latest
    outputs:
      execute: ${{ steps.lease.outputs.execute }}
      lease_sha: ${{ steps.lease.outputs.lease_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/g3-03-transposition-tree-graph-divergence
          fetch-depth: 1
      - id: lease
        name: Establish durable pre-computation execution lease
        env:
          AUTH_NONCE: ${{ inputs.authorization_nonce }}
          DISPATCHER_RUN_ID: ${{ inputs.dispatcher_run_id }}
          SCIENTIFIC_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          AUTH=doc/transposition-concentration-tree-graph-divergence/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION.json
          MARKER=doc/transposition-concentration-tree-graph-divergence/executions/stage-1-execution-started.json
          RESULT=doc/transposition-concentration-tree-graph-divergence/results/stage-1/scientific-result.json
          test -f "$AUTH"
          test ! -f "$RESULT"
          EXPECTED_NONCE=$(node -e 'const x=require("./'"$AUTH"'"); process.stdout.write(x.authorizationNonce)')
          test "$EXPECTED_NONCE" = "$AUTH_NONCE"
          if test -f "$MARKER"; then
            echo "Existing execution marker: duplicate scientific queue prevented before computation."
            echo "execute=false" >> "$GITHUB_OUTPUT"
            echo "lease_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const auth=JSON.parse(fs.readFileSync('doc/transposition-concentration-tree-graph-divergence/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION.json','utf8'));
          function blob(text){const b=Buffer.from(text,'utf8');return crypto.createHash('sha1').update(Buffer.from(`blob ${b.length}\0`,'utf8')).update(b).digest('hex')}
          for(const [p,e] of Object.entries(auth.sourceBlobBindings)){const a=blob(fs.readFileSync(p,'utf8'));if(a!==e)throw new Error(`source blob mismatch ${p}: ${a} != ${e}`)}
          NODE
          PRE_HEAD=$(git rev-parse HEAD)
          AUTH_HEAD=$(node -e 'const x=require("./'"$AUTH"'"); process.stdout.write(x.authorizedScientificContentHead)')
          mkdir -p "$(dirname "$MARKER")"
          node - <<NODE
          const fs=require('node:fs');
          const marker={schemaVersion:1,studyId:'TCTGD-STUDY1',stageId:'TCTGD-S1-DEVELOPMENT-2026-09-02-v1',workflowRunId:Number(process.env.SCIENTIFIC_RUN_ID),dispatcherRunId:Number(process.env.DISPATCHER_RUN_ID),authorizationNonce:process.env.AUTH_NONCE,authorizedScientificContentHead:'$AUTH_HEAD',preLeaseRemoteHead:'$PRE_HEAD',leaseCommitSha:null,freshScientificEvidenceGeneratedBeforeLease:false,protectedDepth10AccessBeforeLease:false};
          fs.writeFileSync('$MARKER',JSON.stringify(marker,null,2)+'\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MARKER"
          git commit -m "Establish TCTGD Stage 1 execution lease"
          git push origin HEAD:research/g3-03-transposition-tree-graph-divergence
          LEASE_SHA=$(git rev-parse HEAD)
          node - <<NODE
          const fs=require('node:fs'); const p='$MARKER'; const x=JSON.parse(fs.readFileSync(p,'utf8')); x.leaseCommitSha='$LEASE_SHA'; fs.writeFileSync('/tmp/lease-with-sha.json',JSON.stringify(x,null,2)+'\n');
          NODE
          echo "execute=true" >> "$GITHUB_OUTPUT"
          echo "lease_sha=$LEASE_SHA" >> "$GITHUB_OUTPUT"

  scientific:
    needs: lease
    if: needs.lease.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.lease.outputs.lease_sha }}
          fetch-depth: 1
      - name: Run exactly-once fresh development computation
        env:
          TCTGD_EXECUTION_LEASE_CONFIRMED: "true"
        run: |
          node tools/experiments/run-tctgd-stage1-development.js
      - name: Upload durable canonical Stage 1 bytes before repository mirror
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tctgd-stage1-development-result-${{ github.run_id }}
          path: doc/transposition-concentration-tree-graph-divergence/results/stage-1/
          if-no-files-found: error
          retention-days: 90

  mirror:
    needs: [lease, scientific]
    if: always() && needs.lease.outputs.execute == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tctgd-stage1-development-result-${{ github.run_id }}
          path: /tmp/tctgd-stage1-result
      - uses: actions/checkout@v4
        with:
          ref: research/g3-03-transposition-tree-graph-divergence
          fetch-depth: 1
      - name: Mirror already-uploaded exact result bytes
        run: |
          set -euo pipefail
          DEST=doc/transposition-concentration-tree-graph-divergence/results/stage-1
          mkdir -p "$DEST"
          cp -a /tmp/tctgd-stage1-result/. "$DEST/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "No Stage 1 result changes to mirror."
            exit 0
          fi
          git commit -m "Materialize TCTGD Stage 1 result from durable artifact"
          git push origin HEAD:research/g3-03-transposition-tree-graph-divergence
