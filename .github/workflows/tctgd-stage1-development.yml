name: TCTGD Stage 1 Development

on:
  push:
    branches: [research/g3-03-transposition-tree-graph-divergence]
    paths:
      - doc/transposition-concentration-tree-graph-divergence/authorizations/STAGE1_EXECUTION_TRIGGER

permissions:
  contents: write
  actions: read

concurrency:
  group: tctgd-stage1-development
  cancel-in-progress: false

jobs:
  lease:
    runs-on: ubuntu-latest
    outputs:
      execute: ${{ steps.lease.outputs.execute }}
      lease_sha: ${{ steps.lease.outputs.lease_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: lease
        env:
          SCIENTIFIC_RUN_ID: ${{ github.run_id }}
          TRIGGER_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          AUTH=doc/transposition-concentration-tree-graph-divergence/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION.json
          TRIGGER=doc/transposition-concentration-tree-graph-divergence/authorizations/STAGE1_EXECUTION_TRIGGER
          MARKER=doc/transposition-concentration-tree-graph-divergence/executions/stage-1-execution-started.json
          RESULT=doc/transposition-concentration-tree-graph-divergence/results/stage-1/scientific-result.json
          test -f "$AUTH"; test -f "$TRIGGER"; test ! -f "$RESULT"
          if test -f "$MARKER"; then
            echo "Existing execution marker: duplicate scientific queue prevented before computation."
            echo "execute=false" >> "$GITHUB_OUTPUT"
            echo "lease_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const a=JSON.parse(fs.readFileSync('doc/transposition-concentration-tree-graph-divergence/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION.json','utf8'));
          const t=JSON.parse(fs.readFileSync('doc/transposition-concentration-tree-graph-divergence/authorizations/STAGE1_EXECUTION_TRIGGER','utf8'));
          if(a.authorizationDecision!=='STAGE1-AUTHORIZED'||a.maxScientificExecutions!==1)throw Error('authorization mismatch');
          if(t.studyId!==a.studyId||t.stageId!==a.stageId||t.authorizationNonce!==a.authorizationNonce||t.freshScientificEvidenceAuthorized!==true||t.protectedDepth10AccessAuthorized!==false)throw Error('trigger binding mismatch');
          function blob(s){const b=Buffer.from(s,'utf8');return crypto.createHash('sha1').update(Buffer.from(`blob ${b.length}\0`)).update(b).digest('hex')}
          for(const [p,e] of Object.entries(a.sourceBlobBindings)){const x=blob(fs.readFileSync(p,'utf8'));if(x!==e)throw Error(`source blob mismatch ${p}: ${x} != ${e}`)}
          NODE
          PRE_HEAD=$(git rev-parse HEAD); test "$PRE_HEAD" = "$TRIGGER_COMMIT_SHA"
          AUTH_HEAD=$(node -e 'const x=require("./'"$AUTH"'");process.stdout.write(x.authorizedScientificContentHead)')
          git cat-file -e "$AUTH_HEAD^{commit}"; git merge-base --is-ancestor "$AUTH_HEAD" "$PRE_HEAD"
          ALLOW='^(doc/transposition-concentration-tree-graph-divergence/authorizations/STAGE_1_DEVELOPMENT_AUTHORIZATION\.json|doc/transposition-concentration-tree-graph-divergence/authorizations/2026-09-02-stage-1-development-authorization\.md|doc/transposition-concentration-tree-graph-divergence/authorizations/STAGE1_EXECUTION_TRIGGER)$'
          BAD=$(git diff --name-only "$AUTH_HEAD..$PRE_HEAD" | grep -Ev "$ALLOW" || true)
          test -z "$BAD" || { printf 'Unexpected post-freeze advancement:\n%s\n' "$BAD" >&2; exit 1; }
          NONCE=$(node -e 'const x=require("./'"$AUTH"'");process.stdout.write(x.authorizationNonce)')
          mkdir -p "$(dirname "$MARKER")"
          node - <<NODE
          const fs=require('node:fs');fs.writeFileSync('$MARKER',JSON.stringify({schemaVersion:1,studyId:'TCTGD-STUDY1',stageId:'TCTGD-S1-DEVELOPMENT-2026-09-02-v1',workflowRunId:Number(process.env.SCIENTIFIC_RUN_ID),triggerCommitSha:process.env.TRIGGER_COMMIT_SHA,authorizationNonce:'$NONCE',authorizedScientificContentHead:'$AUTH_HEAD',preLeaseRemoteHead:'$PRE_HEAD',freshScientificEvidenceGeneratedBeforeLease:false,protectedDepth10AccessBeforeLease:false},null,2)+'\n');
          NODE
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MARKER"; git commit -m "Establish TCTGD Stage 1 execution lease"
          git push origin HEAD:research/g3-03-transposition-tree-graph-divergence
          echo "execute=true" >> "$GITHUB_OUTPUT"; echo "lease_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  scientific:
    needs: lease
    if: needs.lease.outputs.execute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.lease.outputs.lease_sha }}
          fetch-depth: 1
      - name: Run exactly-once fresh development computation
        env:
          TCTGD_EXECUTION_LEASE_CONFIRMED: "true"
          TCTGD_EXECUTION_LEASE_SHA: ${{ needs.lease.outputs.lease_sha }}
        run: node tools/experiments/run-tctgd-stage1-development-v2.js
      - name: Upload durable canonical Stage 1 bytes before repository mirror
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tctgd-stage1-development-result-${{ github.run_id }}
          path: doc/transposition-concentration-tree-graph-divergence/results/stage-1/
          if-no-files-found: error
          retention-days: 90

  mirror:
    needs: [lease, scientific]
    if: always() && needs.lease.outputs.execute == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tctgd-stage1-development-result-${{ github.run_id }}
          path: /tmp/tctgd-stage1-result
      - uses: actions/checkout@v4
        with:
          ref: research/g3-03-transposition-tree-graph-divergence
          fetch-depth: 1
      - run: |
          set -euo pipefail
          D=doc/transposition-concentration-tree-graph-divergence/results/stage-1; mkdir -p "$D"; cp -a /tmp/tctgd-stage1-result/. "$D/"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$D"; git diff --cached --quiet && exit 0
          git commit -m "Materialize TCTGD Stage 1 result from durable artifact"
          git push origin HEAD:research/g3-03-transposition-tree-graph-divergence
