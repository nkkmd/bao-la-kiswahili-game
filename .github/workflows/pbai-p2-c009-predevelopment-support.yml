name: PBAI-P2 C009 baseline-only single-reply support

on:
  push:
    branches:
      - engineering/pbai-p2-program-initialization
    paths:
      - 'doc/ai-engineering/public-ai-improvement-program-2/candidates/PBAI-C009-v1-predevelopment-support-spec.json'
      - 'tools/engineering/materialize-pbai-p2-c009-predevelopment-support.js'
      - 'tools/engineering/verify-pbai-p2-c009-predevelopment-support-independent.js'
      - '.github/workflows/pbai-p2-c009-predevelopment-support.yml'

permissions:
  contents: read

jobs:
  baseline-only-single-reply-support:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify frozen baseline and support-only firewall
        run: |
          test "$(sha256sum public/engine.js | awk '{print $1}')" = "e6acf1fe4d97db67dbcfadc3a785e802342ae0b0cbaec35f53eb8e77424cfc1c"
          test "$(sha256sum public/ai.js | awk '{print $1}')" = "2823dbcf96c7a47489301ecd768a63975aa8b4e12b62cc4629fc8283ef5dff9e"
          git diff --quiet 2265fb7ccbf6cf6dde6ab08d5519e44e61b9e972 -- public/engine.js public/ai.js public/ai-weights.js public/ai-config.js public/ai-worker.js public/main.js public/index.html public/service-worker.js
          ! grep -q 'pbaiC009' public/ai.js
          node - <<'NODE'
          const fs = require('node:fs');
          const p = 'doc/ai-engineering/public-ai-improvement-program-2/candidates/PBAI-C009-v1-predevelopment-support-spec.json';
          const s = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (s.status !== 'FROZEN-BEFORE-DYNAMIC-SUPPORT-OUTCOME') throw new Error('C009 support spec is not frozen');
          if (s.candidateCodeAllowed !== false || s.publicImplementationChangeAllowed !== false) throw new Error('candidate implementation leaked');
          if (s.population.seedStart !== 43300001 || s.population.seedEnd !== 43301024) throw new Error('C009 support seed block changed');
          if (s.gate.minimumEligibleRoots !== 64) throw new Error('C009 support minimum changed');
          if (s.researchGeneration3Influence !== false) throw new Error('G3 firewall changed');
          if (s.firewall.c008DevelopmentOutcomesMayTuneThisContract !== false) throw new Error('C008 outcome leaked into C009 contract');
          if (s.evidenceBoundary.f05AllUsed !== false || s.evidenceBoundary.lambda100Used !== false || s.evidenceBoundary.replyPressureModelUsed !== false) throw new Error('technical-invalid G2-07 production model leaked');
          NODE

      - name: Syntax check independent support tools
        run: |
          node --check tools/engineering/materialize-pbai-p2-c009-predevelopment-support.js
          node --check tools/engineering/verify-pbai-p2-c009-predevelopment-support-independent.js

      - name: Materialize frozen C009 baseline-only support
        run: |
          mkdir -p artifacts/pbai-p2/c009
          node tools/engineering/materialize-pbai-p2-c009-predevelopment-support.js \
            --output artifacts/pbai-p2/c009/predevelopment-support.json

      - name: Independently reconstruct C009 support
        run: |
          node tools/engineering/verify-pbai-p2-c009-predevelopment-support-independent.js \
            --production artifacts/pbai-p2/c009/predevelopment-support.json \
            --output artifacts/pbai-p2/c009/predevelopment-support-verification.json

      - name: Verify support firewall and independent evidence
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('artifacts/pbai-p2/c009/predevelopment-support.json', 'utf8'));
          const v = JSON.parse(fs.readFileSync('artifacts/pbai-p2/c009/predevelopment-support-verification.json', 'utf8'));
          if (v.passed !== true) throw new Error('independent C009 verification failed');
          if (r.candidateCodeUsed !== false || r.candidateImplementationObserved !== false || r.singleReplyExtensionExecuted !== false) throw new Error('candidate mechanism executed during support');
          if (r.candidateBenefitMetricsObserved !== false) throw new Error('candidate benefit leaked into support');
          if (r.developmentSeedsAccessed !== false || r.validationSeedsAccessed !== false || r.releaseHoldoutSeedsAccessed !== false) throw new Error('protected split leaked');
          if (r.c008DevelopmentOutcomeUsedToTuneContract !== false || r.researchGeneration3ArtifactsAccessed !== false) throw new Error('evidence firewall leaked');
          if (r.core.decision.candidateImplementationAuthorized !== false || r.core.decision.validationAuthorized !== false || r.core.decision.releaseHoldoutAuthorized !== false) throw new Error('authorization leaked');
          if (!['SUPPORT-PASS','NON-ESTIMABLE-HOLD','TECHNICAL-INVALID-PREDEVELOPMENT-SUPPORT'].includes(r.core.decision.disposition)) throw new Error('unexpected support disposition');
          console.log(JSON.stringify({
            deterministicCoreSha256: r.deterministicCoreSha256,
            population: r.core.population,
            measurement: r.core.measurement,
            decision: r.core.decision,
            independentVerification: v,
          }, null, 2));
          NODE

      - name: Record artifact hashes
        run: |
          sha256sum artifacts/pbai-p2/c009/predevelopment-support.json
          sha256sum artifacts/pbai-p2/c009/predevelopment-support-verification.json

      - uses: actions/upload-artifact@v4
        with:
          name: pbai-p2-c009-predevelopment-support
          path: |
            artifacts/pbai-p2/c009/predevelopment-support.json
            artifacts/pbai-p2/c009/predevelopment-support-verification.json
          if-no-files-found: error
