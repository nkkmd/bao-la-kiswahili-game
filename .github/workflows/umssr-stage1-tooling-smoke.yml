name: UMSSR Stage 1 Tooling Smoke

# Technical-only pre-scientific smoke. Never consumes UMSSR Stage 1/2 scientific seeds.
on:
  workflow_dispatch:
  push:
    branches:
      - research/g2-10-unified-multiaxial-strategic-state-representation
    paths:
      - '.github/workflows/umssr-stage1-tooling-smoke.yml'
      - 'tools/experiments/run-umssr-stage1-tooling-smoke.js'
      - 'tools/experiments/lib/umssr-stage1-production.js'
      - 'tools/experiments/lib/umssr-stage1-independent.js'
      - 'tools/experiments/lib/umssr-stage0-production.js'
      - 'tools/experiments/lib/umssr-stage0-independent.js'
      - 'tools/experiments/lib/search-reliability-decision-robustness.js'
      - 'tools/experiments/lib/position-complexity-search-diagnostic.js'
      - 'tools/experiments/lib/tmgc-stage0-production.js'
      - 'tools/experiments/lib/tmgc-stage0-independent.js'
      - 'doc/unified-multiaxial-strategic-state-representation/prereg/STAGE_1_DEVELOPMENT_SPEC.json'
      - 'doc/unified-multiaxial-strategic-state-representation/prereg/STAGE_1_FEATURE_DICTIONARY.json'
      - 'doc/unified-multiaxial-strategic-state-representation/prereg/STAGE_1_TOOLING_SMOKE_SPEC.json'
      - 'doc/unified-multiaxial-strategic-state-representation/prereg/STAGE_2_VALIDATION_CONTRACT.json'
      - 'doc/tactical-motifs/preregistration/STAGE_2_FORMAL_CANDIDATES.json'
      - 'public/engine.js'
      - 'public/ai.js'
      - 'public/ai-weights.js'
      - 'tools/benchmark.js'

permissions:
  contents: read

jobs:
  tooling-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout frozen branch source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Environment
        run: |
          node --version
          git rev-parse HEAD
          git status --short
          uname -a

      - name: Syntax checks
        run: |
          node --check tools/experiments/run-umssr-stage1-tooling-smoke.js
          node --check tools/experiments/lib/umssr-stage1-production.js
          node --check tools/experiments/lib/umssr-stage1-independent.js

      - name: Verify scientific seed firewall
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const spec = JSON.parse(fs.readFileSync('doc/unified-multiaxial-strategic-state-representation/prereg/STAGE_1_DEVELOPMENT_SPEC.json','utf8'));
          const smoke = JSON.parse(fs.readFileSync('doc/unified-multiaxial-strategic-state-representation/prereg/STAGE_1_TOOLING_SMOKE_SPEC.json','utf8'));
          if (spec.seedBlock.seedStart !== 29310001 || spec.seedBlock.seedEnd !== 29314096) throw new Error('Stage 1 scientific seed contract drift');
          if (smoke.seedStart !== 29300001 || smoke.seedEnd !== 29300064) throw new Error('technical smoke seed contract drift');
          if (smoke.scientificSeedUseAuthorized !== false) throw new Error('scientific seed use unexpectedly authorized');
          if (!(smoke.seedEnd < spec.seedBlock.seedStart)) throw new Error('technical/scientific seed overlap');
          NODE

      - name: Run UMSSR Stage 1 tooling smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/local/umssr-stage1-tooling-smoke
          /usr/bin/time -v node tools/experiments/run-umssr-stage1-tooling-smoke.js artifacts/local/umssr-stage1-tooling-smoke \
            2>&1 | tee artifacts-umssr-stage1-tooling-smoke.log

      - name: Preserve tooling smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: umssr-stage1-tooling-smoke-${{ github.sha }}
          path: |
            artifacts/local/umssr-stage1-tooling-smoke/**
            artifacts-umssr-stage1-tooling-smoke.log
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
