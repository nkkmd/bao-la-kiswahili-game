name: LGPML Stage 1 Result Mirror
on:
  push:
    branches: [research/g3-08-local-geometry-persistence-memory-length]
    paths: [doc/local-geometry-persistence-memory-length/authorizations/lgpml-stage1-result-mirror-trigger.txt]
permissions:
  contents: write
  actions: read
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 3}
      - name: Verify trigger-only mirror request
        run: |
          test "$(git diff --name-only HEAD^ HEAD)" = "doc/local-geometry-persistence-memory-length/authorizations/lgpml-stage1-result-mirror-trigger.txt"
          test ! -e doc/local-geometry-persistence-memory-length/results/stage-1/scientific-result.json
      - name: Download exact Stage 1 artifact
        uses: actions/download-artifact@v4
        with:
          name: lgpml-stage1-result-33731577464
          path: recovered
          github-token: ${{ github.token }}
          repository: nkkmd/bao-la-kiswahili-game
          run-id: 33731577464
      - name: Verify recovered payload
        run: |
          test -f recovered/scientific-result.json
          sha256sum recovered/scientific-result.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('recovered/scientific-result.json','utf8'));
          if(x.studyId!=='LGPML-STUDY1'||x.stageId!=='LGPML-S1-DEVELOPMENT-2026-09-03-v1') process.exit(2);
          if(x.actualScientificExecutions!==1||x.seedBlockConsumed!==true||x.protectedDepth10Access!==false) process.exit(3);
          NODE
      - name: Mirror exact bytes to canonical path
        run: |
          mkdir -p doc/local-geometry-persistence-memory-length/results/stage-1
          cp recovered/scientific-result.json doc/local-geometry-persistence-memory-length/results/stage-1/scientific-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/local-geometry-persistence-memory-length/results/stage-1/scientific-result.json
          git commit -m "Mirror exact LGPML Stage 1 scientific result"
          git push origin HEAD:research/g3-08-local-geometry-persistence-memory-length
