name: LGTTCI Stage 1R GitHub Actions execution

on:
  push:
    branches:
      - research/g4-01-transfer-compatibility-instrument
    paths:
      - 'doc/local-game-tree-geometry-transfer-compatibility-instrument/authorizations/STAGE_1R_EXECUTION_AUTHORIZATION.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: lgttci-stage1r-fresh-execution
  cancel-in-progress: false

jobs:
  gate:
    name: Authorization and frozen-matrix gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sfcdf: ${{ steps.matrices.outputs.sfcdf }}
      silgm: ${{ steps.matrices.outputs.silgm }}
      gcld: ${{ steps.matrices.outputs.gcld }}
      measurement: ${{ steps.matrices.outputs.measurement }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Require first creation of final authorization
        shell: bash
        run: |
          set -euo pipefail
          auth='doc/local-game-tree-geometry-transfer-compatibility-instrument/authorizations/STAGE_1R_EXECUTION_AUTHORIZATION.json'
          test -f "$auth"
          if git cat-file -e "${GITHUB_SHA}^:${auth}" 2>/dev/null; then
            echo 'Final authorization already existed in the parent commit; a second fresh workflow run is forbidden.' >&2
            exit 1
          fi
      - name: Verify frozen authorization and binding
        run: node tools/experiments/verify-lgttci-stage1r-actions-authorization.js
      - name: Generate frozen matrices
        id: matrices
        run: node tools/experiments/generate-lgttci-stage1r-actions-matrices.js

  acquire-sfcdf:
    name: SFCDF primary quartet ${{ matrix.s1 }}-${{ matrix.s4 }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.gate.outputs.sfcdf) }}
    steps:
      - uses: actions/checkout@v4
      - id: s1
        continue-on-error: true
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: SFCDF, slot-seed: '${{ matrix.s1 }}', role: PRIMARY }
      - id: s2
        continue-on-error: true
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: SFCDF, slot-seed: '${{ matrix.s2 }}', role: PRIMARY }
      - id: s3
        continue-on-error: true
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: SFCDF, slot-seed: '${{ matrix.s3 }}', role: PRIMARY }
      - id: s4
        continue-on-error: true
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: SFCDF, slot-seed: '${{ matrix.s4 }}', role: PRIMARY }
      - name: Propagate quartet failure after all possible slots
        if: always()
        shell: bash
        run: |
          test '${{ steps.s1.outcome }}' = success && test '${{ steps.s2.outcome }}' = success && test '${{ steps.s3.outcome }}' = success && test '${{ steps.s4.outcome }}' = success

  acquire-silgm:
    name: SILGM primary quartet ${{ matrix.s1 }}-${{ matrix.s4 }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.gate.outputs.silgm) }}
    steps:
      - uses: actions/checkout@v4
      - id: s1
        continue-on-error: true
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: SILGM, slot-seed: '${{ matrix.s1 }}', role: PRIMARY }
      - id: s2
        continue-on-error: true
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: SILGM, slot-seed: '${{ matrix.s2 }}', role: PRIMARY }
      - id: s3
        continue-on-error: true
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: SILGM, slot-seed: '${{ matrix.s3 }}', role: PRIMARY }
      - id: s4
        continue-on-error: true
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: SILGM, slot-seed: '${{ matrix.s4 }}', role: PRIMARY }
      - name: Propagate quartet failure after all possible slots
        if: always()
        shell: bash
        run: |
          test '${{ steps.s1.outcome }}' = success && test '${{ steps.s2.outcome }}' = success && test '${{ steps.s3.outcome }}' = success && test '${{ steps.s4.outcome }}' = success

  acquire-gcld:
    name: GCLD primary quartet ${{ matrix.s1 }}-${{ matrix.s4 }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.gate.outputs.gcld) }}
    steps:
      - uses: actions/checkout@v4
      - id: s1
        continue-on-error: true
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: GCLD, slot-seed: '${{ matrix.s1 }}', role: PRIMARY }
      - id: s2
        continue-on-error: true
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: GCLD, slot-seed: '${{ matrix.s2 }}', role: PRIMARY }
      - id: s3
        continue-on-error: true
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: GCLD, slot-seed: '${{ matrix.s3 }}', role: PRIMARY }
      - id: s4
        continue-on-error: true
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: GCLD, slot-seed: '${{ matrix.s4 }}', role: PRIMARY }
      - name: Propagate quartet failure after all possible slots
        if: always()
        shell: bash
        run: |
          test '${{ steps.s1.outcome }}' = success && test '${{ steps.s2.outcome }}' = success && test '${{ steps.s3.outcome }}' = success && test '${{ steps.s4.outcome }}' = success

  classify-primary:
    name: Classify primary acquisition
    if: ${{ always() && needs.gate.result == 'success' }}
    needs: [gate, acquire-sfcdf, acquire-silgm, acquire-gcld]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      fatal: ${{ steps.classify.outputs.fatal }}
      retry_sfcdf_a: ${{ steps.classify.outputs.retry_sfcdf_a }}
      retry_sfcdf_b: ${{ steps.classify.outputs.retry_sfcdf_b }}
      retry_silgm_a: ${{ steps.classify.outputs.retry_silgm_a }}
      retry_silgm_b: ${{ steps.classify.outputs.retry_silgm_b }}
      retry_silgm_c: ${{ steps.classify.outputs.retry_silgm_c }}
      retry_gcld_a: ${{ steps.classify.outputs.retry_gcld_a }}
      retry_gcld_b: ${{ steps.classify.outputs.retry_gcld_b }}
    steps:
      - uses: actions/checkout@v4
      - name: List immutable artifacts
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[].name' > artifact-names.txt
      - id: classify
        run: node tools/experiments/classify-lgttci-stage1r-actions-artifacts.js --mode primary --names artifact-names.txt --summary primary-classification.json
      - uses: actions/upload-artifact@v4
        with:
          name: lgttci-s1r-primary-classification
          path: primary-classification.json
          retention-days: 90

  retry-sfcdf-a:
    name: Safe pre-read retry SFCDF-A ${{ matrix.slot }}
    needs: classify-primary
    if: ${{ needs.classify-primary.outputs.fatal != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy: { fail-fast: false, max-parallel: 2, matrix: '${{ fromJSON(needs.classify-primary.outputs.retry_sfcdf_a) }}' }
    steps:
      - if: ${{ matrix.slot != 0 }}
        uses: actions/checkout@v4
      - if: ${{ matrix.slot != 0 }}
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: '${{ matrix.block }}', slot-seed: '${{ matrix.slot }}', role: PRIMARY }
  retry-sfcdf-b:
    name: Safe pre-read retry SFCDF-B ${{ matrix.slot }}
    needs: classify-primary
    if: ${{ needs.classify-primary.outputs.fatal != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy: { fail-fast: false, max-parallel: 2, matrix: '${{ fromJSON(needs.classify-primary.outputs.retry_sfcdf_b) }}' }
    steps:
      - if: ${{ matrix.slot != 0 }}
        uses: actions/checkout@v4
      - if: ${{ matrix.slot != 0 }}
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: '${{ matrix.block }}', slot-seed: '${{ matrix.slot }}', role: PRIMARY }
  retry-silgm-a:
    name: Safe pre-read retry SILGM-A ${{ matrix.slot }}
    needs: classify-primary
    if: ${{ needs.classify-primary.outputs.fatal != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy: { fail-fast: false, max-parallel: 2, matrix: '${{ fromJSON(needs.classify-primary.outputs.retry_silgm_a) }}' }
    steps:
      - if: ${{ matrix.slot != 0 }}
        uses: actions/checkout@v4
      - if: ${{ matrix.slot != 0 }}
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: '${{ matrix.block }}', slot-seed: '${{ matrix.slot }}', role: PRIMARY }
  retry-silgm-b:
    name: Safe pre-read retry SILGM-B ${{ matrix.slot }}
    needs: classify-primary
    if: ${{ needs.classify-primary.outputs.fatal != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy: { fail-fast: false, max-parallel: 2, matrix: '${{ fromJSON(needs.classify-primary.outputs.retry_silgm_b) }}' }
    steps:
      - if: ${{ matrix.slot != 0 }}
        uses: actions/checkout@v4
      - if: ${{ matrix.slot != 0 }}
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: '${{ matrix.block }}', slot-seed: '${{ matrix.slot }}', role: PRIMARY }
  retry-silgm-c:
    name: Safe pre-read retry SILGM-C ${{ matrix.slot }}
    needs: classify-primary
    if: ${{ needs.classify-primary.outputs.fatal != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy: { fail-fast: false, max-parallel: 2, matrix: '${{ fromJSON(needs.classify-primary.outputs.retry_silgm_c) }}' }
    steps:
      - if: ${{ matrix.slot != 0 }}
        uses: actions/checkout@v4
      - if: ${{ matrix.slot != 0 }}
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: '${{ matrix.block }}', slot-seed: '${{ matrix.slot }}', role: PRIMARY }
  retry-gcld-a:
    name: Safe pre-read retry GCLD-A ${{ matrix.slot }}
    needs: classify-primary
    if: ${{ needs.classify-primary.outputs.fatal != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy: { fail-fast: false, max-parallel: 2, matrix: '${{ fromJSON(needs.classify-primary.outputs.retry_gcld_a) }}' }
    steps:
      - if: ${{ matrix.slot != 0 }}
        uses: actions/checkout@v4
      - if: ${{ matrix.slot != 0 }}
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: '${{ matrix.block }}', slot-seed: '${{ matrix.slot }}', role: PRIMARY }
  retry-gcld-b:
    name: Safe pre-read retry GCLD-B ${{ matrix.slot }}
    needs: classify-primary
    if: ${{ needs.classify-primary.outputs.fatal != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy: { fail-fast: false, max-parallel: 2, matrix: '${{ fromJSON(needs.classify-primary.outputs.retry_gcld_b) }}' }
    steps:
      - if: ${{ matrix.slot != 0 }}
        uses: actions/checkout@v4
      - if: ${{ matrix.slot != 0 }}
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: '${{ matrix.block }}', slot-seed: '${{ matrix.slot }}', role: PRIMARY }

  classify-post-retry:
    name: Classify after safe pre-read retry
    if: ${{ always() && needs.gate.result == 'success' }}
    needs: [gate, classify-primary, retry-sfcdf-a, retry-sfcdf-b, retry-silgm-a, retry-silgm-b, retry-silgm-c, retry-gcld-a, retry-gcld-b]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      fatal: ${{ steps.classify.outputs.fatal }}
      reserve_matrix: ${{ steps.classify.outputs.reserve_matrix }}
      reserve_count: ${{ steps.classify.outputs.reserve_count }}
    steps:
      - uses: actions/checkout@v4
      - name: List immutable artifacts
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[].name' > artifact-names.txt
      - id: classify
        run: node tools/experiments/classify-lgttci-stage1r-actions-artifacts.js --mode post-retry --names artifact-names.txt --summary post-retry-classification.json
      - uses: actions/upload-artifact@v4
        with:
          name: lgttci-s1r-post-retry-classification
          path: post-retry-classification.json
          retention-days: 90

  reserve:
    name: Paired reserve ${{ matrix.slot }}
    needs: classify-post-retry
    if: ${{ needs.classify-post-retry.outputs.fatal != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.classify-post-retry.outputs.reserve_matrix) }}
    steps:
      - if: ${{ matrix.slot != 0 }}
        uses: actions/checkout@v4
      - if: ${{ matrix.slot != 0 }}
        uses: ./.github/actions/lgttci-stage1r-acquire-slot
        with: { block: '${{ matrix.block }}', slot-seed: '${{ matrix.slot }}', role: PAIRED-RESERVE }

  classify-final:
    name: Final acquisition completeness gate
    if: ${{ always() && needs.gate.result == 'success' }}
    needs: [gate, classify-post-retry, reserve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.classify.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: List immutable artifacts
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[].name' > artifact-names.txt
      - id: classify
        run: node tools/experiments/classify-lgttci-stage1r-actions-artifacts.js --mode final --names artifact-names.txt --summary final-acquisition-classification.json
      - uses: actions/upload-artifact@v4
        with:
          name: lgttci-s1r-final-acquisition-classification
          path: final-acquisition-classification.json
          retention-days: 90

  acquisition-guard:
    name: Require complete fresh acquisition
    needs: classify-final
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed unless all 1536 source artifacts are sealed
        shell: bash
        run: test '${{ needs.classify-final.outputs.ready }}' = true

  bundle-source:
    name: Verify and seal canonical source bundle
    needs: acquisition-guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lgttci-s1r-source-*
          path: raw-source-artifacts
          merge-multiple: false
      - name: Verify complete source population and create bundle
        run: node tools/experiments/bundle-lgttci-stage1r-actions-source.js --input raw-source-artifacts --output artifacts/stage1r
      - uses: actions/upload-artifact@v4
        with:
          name: lgttci-stage1r-source-bundle
          path: artifacts/stage1r
          retention-days: 90
          compression-level: 0

  measurement:
    name: Seed-free measurement ${{ matrix.task }}
    needs: [gate, bundle-source]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.gate.outputs.measurement) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lgttci-stage1r-source-bundle
          path: artifacts/stage1r
      - name: Run seed-free measurement with safe retries
        shell: bash
        env: { TASK: '${{ matrix.task }}' }
        run: |
          set -euo pipefail
          mkdir -p artifacts/stage1r/measurement
          ok=0
          for attempt in 1 2 3; do
            if node tools/experiments/run-lgttci-stage1r-measurement-task.js --task "$TASK" --artifact-root artifacts/stage1r --output "artifacts/stage1r/measurement/${TASK}.json"; then
              ok=1
              break
            fi
            echo "seed-free measurement attempt ${attempt} failed; retry is scientifically safe" >&2
          done
          test "$ok" = 1
      - uses: actions/upload-artifact@v4
        with:
          name: lgttci-s1r-measurement-${{ matrix.task }}
          path: artifacts/stage1r/measurement/${{ matrix.task }}.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  aggregate:
    name: Aggregate Stage 1R compatibility result
    needs: [bundle-source, measurement]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lgttci-stage1r-source-bundle
          path: artifacts/stage1r
      - uses: actions/download-artifact@v4
        with:
          pattern: lgttci-s1r-measurement-*
          path: artifacts/stage1r/measurement
          merge-multiple: true
      - name: Aggregate without fresh seed access
        run: node tools/experiments/run-lgttci-stage1r-aggregate.js --artifact-root artifacts/stage1r --output artifacts/stage1r/STAGE_1R_COMPATIBILITY_RESULT.json
      - name: Write GitHub Actions provenance
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='artifacts/stage1r/STAGE_1R_EXECUTION_PROVENANCE.json';
          fs.writeFileSync(p, JSON.stringify({schemaVersion:1,stageId:'LGTTCI-S1R-COMPATIBILITY-RETEST-2026-09-17-v1',executionRoute:'GITHUB-ACTIONS-IMMUTABLE-ARTIFACT-PIPELINE',runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,commitSha:process.env.GITHUB_SHA,workflow:process.env.GITHUB_WORKFLOW},null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: lgttci-stage1r-final-result
          path: |
            artifacts/stage1r/STAGE_1R_COMPATIBILITY_RESULT.json
            artifacts/stage1r/STAGE_1R_EXECUTION_PROVENANCE.json
            artifacts/stage1r/SOURCE_MANIFEST.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
