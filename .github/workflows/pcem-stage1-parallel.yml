name: PCEM Stage 1 exploratory scientific (closed)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pcem-stage1-parallel.yml'
      - 'doc/practical-comeback-error-inducing-moves/results/STAGE_1_EXPLORATORY_RESULT.json'

permissions:
  contents: read

concurrency:
  group: pcem-stage1-exploratory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closure-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Refuse scientific rerun after canonical closure
        run: |
          test -f doc/practical-comeback-error-inducing-moves/results/STAGE_1_EXPLORATORY_RESULT.json
          node - <<'NODE'
          const r = require('./doc/practical-comeback-error-inducing-moves/results/STAGE_1_EXPLORATORY_RESULT.json');
          if (r.stageId !== 'PCEM-S1-EXPLORATORY-2026-08-25-v1') throw new Error('unexpected stageId');
          if (r.scientificLabel !== 'EXPLORATORY-ONLY') throw new Error('unexpected scientificLabel');
          if (r.promotedCandidateCount !== 0) throw new Error('unexpected promotedCandidateCount');
          if (r.resultHash !== '4c9f7d9c88e6430bd9ec248b7360ba2894c6bfddc57516e7946a0d2d3192da08') throw new Error('unexpected resultHash');
          console.log('PCEM Stage 1 is canonically closed; heavy scientific regeneration is disabled.');
          NODE
