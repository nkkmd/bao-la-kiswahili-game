name: SSGTGE Stage 0 v2 Technical

# Corrective technical-entry version after v1 failed before any Stage 0 output.
# No real development estimator competition and no depth-10/depth-11 outcome generation are authorized.
on:
  push:
    branches:
      - research/g2-12-state-space-game-tree-growth-estimation
    paths:
      - 'doc/state-space-game-tree-growth-estimation/authorizations/STAGE_0_V2_TECHNICAL_EXECUTE.json'

permissions:
  contents: read

jobs:
  technical-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Environment and source integrity
        shell: bash
        run: |
          set -euo pipefail
          node --version
          git rev-parse HEAD
          git rev-parse HEAD^
          git status --short
          node --check tools/experiments/lib/ssgtge-production.js
          node --check tools/experiments/lib/ssgtge-independent.js
          node --check tools/experiments/run-ssgtge-stage0-v2-technical.js
          node --check tools/experiments/verify-ssgtge-stage0-v2-independent.js

      - name: Run production technical validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/local/state-space-game-tree-growth-estimation/stage0-technical-v2
          /usr/bin/time -v node tools/experiments/run-ssgtge-stage0-v2-technical.js \
            artifacts/local/state-space-game-tree-growth-estimation/stage0-technical-v2 \
            2>&1 | tee artifacts-ssgtge-stage0-v2-production.log

      - name: Run structurally independent technical verification
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v node tools/experiments/verify-ssgtge-stage0-v2-independent.js \
            artifacts/local/state-space-game-tree-growth-estimation/stage0-technical-v2 \
            2>&1 | tee artifacts-ssgtge-stage0-v2-independent.log

      - name: Preserve technical-only artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssgtge-stage0-v2-technical-${{ github.sha }}
          path: |
            artifacts/local/state-space-game-tree-growth-estimation/stage0-technical-v2/**
            artifacts-ssgtge-stage0-v2-production.log
            artifacts-ssgtge-stage0-v2-independent.log
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
