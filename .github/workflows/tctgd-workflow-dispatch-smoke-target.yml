name: TCTGD Workflow Dispatch Capability Smoke Target

on:
  workflow_dispatch:
    inputs:
      smoke_nonce:
        description: Non-scientific tooling smoke nonce
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tctgd-workflow-dispatch-capability-smoke
  cancel-in-progress: false

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm non-scientific dispatch capability
        env:
          SMOKE_NONCE: ${{ inputs.smoke_nonce }}
        run: |
          test -n "$SMOKE_NONCE"
          echo "TCTGD_DISPATCH_CAPABILITY_SMOKE=PASS"
          echo "fresh_scientific_evidence=false"
          echo "protected_depth10_access=false"
