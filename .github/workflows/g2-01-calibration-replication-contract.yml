name: G2-01 calibration replication contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'doc/position-evaluation-empirical-outcome-calibration-replication/**'
      - 'doc/research-program-decisions/2026-08-26-g2-01-study-start.md'
      - 'tools/experiments/run-g2-01-calibration-stage0-technical.js'
      - 'tools/experiments/verify-g2-01-calibration-stage0-independent.js'
      - 'tools/experiments/run-g2-01-calibration-stage1.js'
      - 'tools/experiments/verify-g2-01-calibration-stage1-independent.js'
      - 'tools/experiments/analyze-g2-01-calibration-stage1.js'
      - 'tools/experiments/validate-g2-01-calibration-stage1-spec.js'
      - 'tools/experiments/run-g2-01-calibration-stage1-pipeline-smoke.js'
      - 'tools/experiments/lib/g2-01-calibration-stage1-common.js'
      - 'test/g2-01-calibration-replication-contract.test.js'
      - '.github/workflows/g2-01-calibration-replication-contract.yml'
      - '.github/workflows/g2-01-calibration-stage1-generation.yml'

permissions:
  contents: read

jobs:
  contract-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit G2-01 prospective contract
        run: node test/g2-01-calibration-replication-contract.test.js
      - name: Validate Stage 1 frozen spec
        run: node tools/experiments/validate-g2-01-calibration-stage1-spec.js
      - name: Run Stage 0 technical production smoke
        run: node tools/experiments/run-g2-01-calibration-stage0-technical.js
      - name: Independently verify Stage 0 technical smoke
        run: node tools/experiments/verify-g2-01-calibration-stage0-independent.js
      - name: Run Stage 1 end-to-end technical pipeline smoke
        run: |
          mkdir -p artifacts/local/position-evaluation-empirical-outcome-calibration-replication/stage1-preauthorization-v1
          node tools/experiments/run-g2-01-calibration-stage1-pipeline-smoke.js \
            > artifacts/local/position-evaluation-empirical-outcome-calibration-replication/stage1-preauthorization-v1/pipeline-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peocr-stage0-technical-v1
          path: artifacts/local/position-evaluation-empirical-outcome-calibration-replication/stage0-technical-v1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peocr-stage1-preauthorization-v1
          path: artifacts/local/position-evaluation-empirical-outcome-calibration-replication/stage1-preauthorization-v1
          if-no-files-found: error
