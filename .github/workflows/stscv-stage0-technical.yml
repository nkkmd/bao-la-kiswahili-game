name: STSCV Stage 0 Technical Validation

on:
  push:
    branches:
      - research/g2-03-state-transformation-semantics-canonicalization-validation
    paths:
      - "public/engine.js"
      - "tools/experiments/run-stscv-stage0-technical.js"
      - "tools/experiments/lib/stscv-stage0-production.js"
      - "tools/experiments/lib/stscv-stage0-independent.js"
      - "tools/experiments/lib/ssgtc-representation-production.js"
      - "tools/experiments/lib/ssgtc-representation-independent.js"
      - "doc/state-transformation-semantics-canonicalization-validation/preregistration/STAGE_0_TECHNICAL_SPEC.json"
      - ".github/workflows/stscv-stage0-technical.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage0-technical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Engine regression
        run: node test/engine.test.js
      - name: STSCV Stage 0 technical validation
        run: |
          mkdir -p artifacts/local/state-transformation-semantics-canonicalization-validation/stage0-technical-v1
          node tools/experiments/run-stscv-stage0-technical.js \
            --output artifacts/local/state-transformation-semantics-canonicalization-validation/stage0-technical-v1/STAGE_0_TECHNICAL_RESULT.json
      - uses: actions/upload-artifact@v4
        with:
          name: stscv-stage0-technical-v1
          path: artifacts/local/state-transformation-semantics-canonicalization-validation/stage0-technical-v1/STAGE_0_TECHNICAL_RESULT.json
          if-no-files-found: error
