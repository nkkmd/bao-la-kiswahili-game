name: G3-01 post-closure documentation audit

on:
  push:
    branches:
      - research/g3-01-local-game-tree-geometry-measurement-foundation
    paths:
      - .github/workflows/g3-01-post-closure-doc-audit.yml

permissions:
  contents: write

jobs:
  audit-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/g3-01-local-game-tree-geometry-measurement-foundation
          fetch-depth: 0

      - name: Synchronize current-facing documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          branch = 'research/g3-01-local-game-tree-geometry-measurement-foundation'

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = """- [`doc/research-generation-3/PROGRAM_PLAN.md`](doc/research-generation-3/PROGRAM_PLAN.md): Research Generation 3 prospective program plan。局所ゲーム木幾何、effective branching、reply width、transposition、tree/graph divergence、geometry dynamics、search mechanism、protected depth-10 exact holdout、generalization boundaryを`G3-01..G3-12`として計画。scientific Studyは未開始。\n- [`doc/research-generation-3/CURRENT_STATUS.md`](doc/research-generation-3/CURRENT_STATUS.md): Research Generation 3の現在状態。G3-01 formal Study ID未付与、seed未消費、depth 10はG3-11用holdoutとしてsealed。"""
          new = """- [`doc/research-generation-3/PROGRAM_PLAN.md`](doc/research-generation-3/PROGRAM_PLAN.md): Research Generation 3開始前に固定したprospective program plan正本。`G3-01..G3-12`の当初agenda・dependency・protected depth-10 holdout設計を保持する履歴的計画文書であり、現在状態は`CURRENT_STATUS.md`を参照する。\n- [`doc/research-generation-3/CURRENT_STATUS.md`](doc/research-generation-3/CURRENT_STATUS.md): Research Generation 3のcurrent-facing状態。G3-01 / `LGTGMF-STUDY1`は`TECHNICAL-INVALID`でclosed、formal eligible measurement familiesは`[]`、Stage 2は`NOT-AUTHORIZED-NOT-EXECUTED`、G3-02〜G3-08のautomatic startはblocked、depth 10はG3-11用holdoutとしてsealed。\n- [`doc/local-game-tree-geometry-measurement-foundation/STUDY_1_OVERVIEW.md`](doc/local-game-tree-geometry-measurement-foundation/STUDY_1_OVERVIEW.md): Research Generation 3 `G3-01` / `LGTGMF-STUDY1`。Fresh Stage 1では全12 rootsでproduction / independentのroot-level coreとF1〜F5 family digestがexact一致したが、runtime-dependent resource observationsを含むstage-level hash実装欠陥によりformal decisionは`TECHNICAL-INVALID`。eligible familiesは`[]`、Stage 2未実行。"""
          if text.count(old) != 1:
              raise SystemExit(f'README expected block count != 1: {text.count(old)}')
          readme.write_text(text.replace(old, new), encoding='utf-8')

          agenda = Path('doc/FUTURE_RESEARCH_AGENDA.md')
          text = agenda.read_text(encoding='utf-8')
          old = 'Research Generation 3: **Prospective plan / not yet started (2026-08-31)**'
          new = 'Research Generation 3: **Active / dependency reassessment required after G3-01 (2026-08-31)**'
          if text.count(old) != 1:
              raise SystemExit(f'FUTURE_RESEARCH_AGENDA expected header count != 1: {text.count(old)}')
          agenda.write_text(text.replace(old, new), encoding='utf-8')

          # Current-facing consistency assertions.
          checks = {
              'README.md': [
                  'G3-01 / `LGTGMF-STUDY1`は`TECHNICAL-INVALID`でclosed',
                  'formal eligible measurement familiesは`[]`',
                  'G3-02〜G3-08のautomatic startはblocked',
              ],
              'doc/RESEARCH_INDEX.md': [
                  'LGTGMF-STUDY1 = TECHNICAL-INVALID',
                  'formal eligible measurement families = []',
                  'Stage 2 = NOT-AUTHORIZED-NOT-EXECUTED',
              ],
              'doc/FUTURE_RESEARCH_AGENDA.md': [
                  'Research Generation 3: **Active / dependency reassessment required after G3-01 (2026-08-31)**',
                  'Research Generation 3 = ACTIVE / DEPENDENCY REASSESSMENT REQUIRED',
                  'G3-01 = LGTGMF-STUDY1 / CLOSED / TECHNICAL-INVALID',
              ],
              'doc/research-generation-3/README.md': [
                  'G3-01 = LGTGMF-STUDY1 / CLOSED / TECHNICAL-INVALID',
                  'G3-02..G3-08 automatic start = BLOCKED',
              ],
              'doc/research-generation-3/CURRENT_STATUS.md': [
                  'G3-01 = LGTGMF-STUDY1 / CLOSED / TECHNICAL-INVALID',
                  'Current branch main integration = NOT AUTHORIZED / NOT PERFORMED',
              ],
              'doc/local-game-tree-geometry-measurement-foundation/README.md': [
                  '正式判断は **`TECHNICAL-INVALID`**',
                  'Formal eligible measurement families = []',
              ],
              'doc/local-game-tree-geometry-measurement-foundation/CURRENT_STATUS.md': [
                  'Study status = CLOSED / TECHNICAL-INVALID',
                  'Formal eligible measurement families = []',
              ],
              'doc/local-game-tree-geometry-measurement-foundation/STUDY_1_OVERVIEW.md': [
                  '状態: **完了 / `TECHNICAL-INVALID`**',
                  'Stage 2 = NOT-AUTHORIZED-NOT-EXECUTED',
              ],
              'doc/local-game-tree-geometry-measurement-foundation/STUDY_1_FINAL_REPORT.md': [
                  '正式判断: **`TECHNICAL-INVALID`**',
                  'formal eligible measurement families = []',
              ],
          }
          for path, needles in checks.items():
              body = Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in body:
                      raise SystemExit(f'missing expected current-state text in {path}: {needle}')

          root_body = Path('README.md').read_text(encoding='utf-8')
          for stale in ('scientific Studyは未開始。', 'G3-01 formal Study ID未付与、seed未消費'):
              if stale in root_body:
                  raise SystemExit(f'stale root README text remains: {stale}')
          agenda_body = Path('doc/FUTURE_RESEARCH_AGENDA.md').read_text(encoding='utf-8')
          if 'Research Generation 3: **Prospective plan / not yet started (2026-08-31)**' in agenda_body:
              raise SystemExit('stale FUTURE_RESEARCH_AGENDA RG3 header remains')

          # Preserve the prospectively frozen program plan as a historical planning record.
          plan = Path('doc/research-generation-3/PROGRAM_PLAN.md')
          plan_body = plan.read_text(encoding='utf-8')
          if '状態: **PROSPECTIVE PROGRAM PLAN / NOT YET STARTED**' not in plan_body:
              raise SystemExit('PROGRAM_PLAN prospective historical state unexpectedly changed')
          plan_sha = hashlib.sha256(plan.read_bytes()).hexdigest()

          subprocess.run(['git', 'fetch', 'origin', 'main'], check=True)
          main_sha = subprocess.check_output(['git', 'rev-parse', 'origin/main'], text=True).strip()
          audit_input_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()

          checkpoint = Path('doc/local-game-tree-geometry-measurement-foundation/checkpoints/2026-08-31-post-closure-documentation-audit.md')
          checkpoint.write_text(f'''# 2026-08-31 — G3-01 post-closure documentation consistency audit\n\n## Scope\n\nG3-01 / `LGTGMF-STUDY1` closure後、`main`統合前にcurrent-facing documentationの不整合・更新漏れを監査した。scientific result、formal decision、seed、Stage authorization、protected holdoutは変更しない。\n\n## Audit input\n\n```text\nresearch branch = {branch}\naudit input branch HEAD = {audit_input_sha}\nobserved remote main = {main_sha}\nmain integration performed by this audit = false\n```\n\n## Findings\n\n明確なcurrent-facing stale記述を2件検出した。\n\n1. root `README.md`のResearch Generation 3導線がG3-01開始前の状態を保持し、`scientific Studyは未開始`、`G3-01 formal Study ID未付与、seed未消費`と記載していた。\n2. `doc/FUTURE_RESEARCH_AGENDA.md`冒頭metadataが`Research Generation 3: Prospective plan / not yet started`のままだった。\n\n一方、次はclosure stateと整合していた。\n\n- `doc/RESEARCH_INDEX.md`\n- `doc/research-generation-3/README.md`\n- `doc/research-generation-3/CURRENT_STATUS.md`\n- `doc/local-game-tree-geometry-measurement-foundation/README.md`\n- `CURRENT_STATUS.md`\n- `STUDY_1_OVERVIEW.md`\n- `STUDY_1_FINAL_REPORT.md`\n\n## Corrections\n\nroot `README.md`のRG3導線をcurrent stateへ同期し、G3-01 Overviewへの直接入口を追加した。`doc/FUTURE_RESEARCH_AGENDA.md`冒頭のRG3 metadataを`Active / dependency reassessment required after G3-01`へ同期した。\n\n次のcanonical closure stateは変更していない。\n\n```text\nG3-01 = LGTGMF-STUDY1 / CLOSED / TECHNICAL-INVALID\nformal eligible measurement families = []\nStage 2 = NOT-AUTHORIZED-NOT-EXECUTED\nStage 1 seed consumption = 31010001..31010096\nStage 2 seed consumption = NONE\nG3-02..G3-08 automatic start = BLOCKED\nprotected depth-10 exact holdout = SEALED / NOT GENERATED / NOT READ\n```\n\n## Prospective-plan preservation\n\n`doc/research-generation-3/PROGRAM_PLAN.md`はG3-01開始前に固定したprospective planning recordであるため、内部の`PROSPECTIVE PROGRAM PLAN / NOT YET STARTED`表記をcurrent statusへ書き換えていない。current-facing状態は`CURRENT_STATUS.md`および中央索引で示す。\n\n```text\nPROGRAM_PLAN sha256 = {plan_sha}\n```\n\n## Main integration boundary\n\nこのauditはresearch branch上のdocumentation consistency correctionだけを行う。`main` refは更新しない。userの現行指示に従い、G3-01 branchの`main`統合は保留する。\n''', encoding='utf-8')
          PY

      - name: Verify diff and commit
        shell: bash
        run: |
          git diff --check
          git diff -- README.md doc/FUTURE_RESEARCH_AGENDA.md doc/local-game-tree-geometry-measurement-foundation/checkpoints/2026-08-31-post-closure-documentation-audit.md
          git config user.name "Sawa"
          git config user.email "72678394+nkkmd@users.noreply.github.com"
          git add README.md doc/FUTURE_RESEARCH_AGENDA.md doc/local-game-tree-geometry-measurement-foundation/checkpoints/2026-08-31-post-closure-documentation-audit.md
          git commit -m "Synchronize G3-01 post-closure documentation"
          git push origin HEAD:research/g3-01-local-game-tree-geometry-measurement-foundation
