name: GCLD Stage 1 Exact Artifact Mirror

on:
  push:
    branches:
      - research/g3-10-geometry-conditioned-longitudinal-dynamics
    paths:
      - doc/geometry-conditioned-longitudinal-dynamics/authorizations/STAGE1_RESULT_MIRROR_TRIGGER

permissions:
  contents: write
  actions: read

concurrency:
  group: gcld-stage1-exact-mirror-v1
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trigger branch
        uses: actions/checkout@v4
        with:
          ref: research/g3-10-geometry-conditioned-longitudinal-dynamics
          fetch-depth: 0

      - name: Download and verify durable Stage 1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ID=9899355887
          EXPECTED_ZIP_SHA=12a498f8da08adedb8dd8ab758790e3395927dd2580c9d9e8f45e89ac0270ed2
          ZIP=/tmp/gcld-stage1.zip
          OUT=/tmp/gcld-stage1

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$ZIP"
          ACTUAL_ZIP_SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          test "$ACTUAL_ZIP_SHA" = "$EXPECTED_ZIP_SHA"

          rm -rf "$OUT"
          mkdir -p "$OUT"
          unzip -q "$ZIP" -d "$OUT"

          cat > /tmp/expected.sha256 <<'EOF'
          c8496407f38ee2dbbf198bd40c0e74170d9a66dac370b2237d587bc8fdf0a798  STAGE_1_CANDIDATE_MANIFEST.json
          9d869d2f1b967d9a34e7e9ef20e780f149d3a90d3dc430805e43f5f0a73e8d0f  STAGE_1_IDENTITY_EXCLUSION_FOR_STAGE_2.json
          c27831408971ef979064046d405f97c1618242fd18a7e6ef847e6abc6b861fae  STAGE_1_DEVELOPMENT_RESULT.json
          492a11263c51a5f33941b2aa09c9108b3fa11a18014beb0e470820292950cdbd  STAGE_1_LONGITUDINAL_SUMMARIES.json
          e7ec602efc061376056b86982f2f72c396bbef0248f55feb282fe262e2210a5c  STAGE_1_MEASURED_POPULATION.json
          752e91cf541cd9dca4fb0adb13a412cbdc31154359c1e91ab02c9de6b605a8e1  STAGE_1_PREFLIGHT_ELIGIBILITY.json
          6a13940638c9fc92b29dff46f1f9b9c3a564e332a42d3d2f653ecd1a8485e80c  STAGE_1_TRAJECTORY_MEASUREMENTS_INDEPENDENT.json
          6a13940638c9fc92b29dff46f1f9b9c3a564e332a42d3d2f653ecd1a8485e80c  STAGE_1_TRAJECTORY_MEASUREMENTS_PRODUCTION.json
          EOF
          sed -i 's/^          //' /tmp/expected.sha256

          (cd "$OUT" && sha256sum -c /tmp/expected.sha256)

          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/actual-files.txt
          cut -d' ' -f3 /tmp/expected.sha256 | sort > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Mirror exact artifact bytes into repository
        shell: bash
        run: |
          set -euo pipefail
          DEST=doc/geometry-conditioned-longitudinal-dynamics/results/stage-1
          mkdir -p "$DEST"
          cp /tmp/gcld-stage1/* "$DEST"/

          git status --short
          git add "$DEST"
          git diff --cached --quiet && { echo 'No mirror changes detected'; exit 1; }

          CHANGED=$(git diff --cached --name-only)
          while IFS= read -r path; do
            case "$path" in
              doc/geometry-conditioned-longitudinal-dynamics/results/stage-1/*) ;;
              *) echo "Unexpected staged path: $path" >&2; exit 1 ;;
            esac
          done <<< "$CHANGED"

      - name: Commit exact-byte recovery only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mirror exact GCLD Stage 1 canonical artifact"
          git push origin HEAD:research/g3-10-geometry-conditioned-longitudinal-dynamics
