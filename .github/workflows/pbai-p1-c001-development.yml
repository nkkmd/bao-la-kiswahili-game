name: PBAI-P1 C001 isolated premetric safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/ai.js'
      - 'test/pbai-c001-v1.test.js'
      - 'tools/engineering/verify-pbai-c001-premetric.js'
      - '.github/workflows/pbai-p1-c001-development.yml'
      - 'doc/ai-engineering/public-ai-improvement-program-1/candidates/PBAI-C001-v1*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  premetric:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify only authorized public candidate surface changed
        run: |
          changed="$(git diff --name-only origin/main...HEAD -- public/)"
          test "$changed" = "public/ai.js" || {
            echo "Only public/ai.js may change for PBAI-C001-v1; got:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }
          test "$(sha256sum public/engine.js | awk '{print $1}')" = "e6acf1fe4d97db67dbcfadc3a785e802342ae0b0cbaec35f53eb8e77424cfc1c"
          baseline_bytes="$(git show origin/main:public/ai.js | wc -c)"
          candidate_bytes="$(wc -c < public/ai.js)"
          added="$((candidate_bytes - baseline_bytes))"
          echo "baseline_bytes=$baseline_bytes candidate_bytes=$candidate_bytes added=$added"
          test "$added" -le 4096

      - name: Validate frozen C001 and global contracts
        run: |
          node tools/engineering/validate-pbai-p1-gate-spec.js
          node tools/engineering/validate-pbai-c001-predevelopment-support-spec.js
          node tools/engineering/validate-pbai-c001-contract.js
          node test/public-ai-improvement-program1-contract.test.js

      - name: Run C001 routing unit check
        run: node test/pbai-c001-v1.test.js

      - name: Run relevant frozen regressions
        run: |
          node test/engine.test.js
          node test/ai.test.js
          node test/evaluation.test.js
          node test/search.test.js
          node test/ai-config.test.js
          node test/ai-worker.test.js
          node test/tactical.test.js

      - name: Enforce validation and holdout firewall
        run: |
          ! grep -R --line-number -E '3140[0-9]{4}|3150[0-9]{4}' \
            tools/engineering/verify-pbai-c001-premetric.js || {
              echo 'C001 premetric verifier must not contain validation/holdout seed values.' >&2
              exit 1
            }
          ! grep -n -E 'maxDepth[^0-9]*4|topSetAgreement|normalizedRankLoss|catastrophicNewLoss|severeLoss' \
            tools/engineering/verify-pbai-c001-premetric.js || {
              echo 'Premetric verifier must not compute D4 candidate-benefit metrics.' >&2
              exit 1
            }

      - name: Create isolated frozen-baseline worktree
        run: git worktree add baseline-worktree origin/main

      - name: Run C001 premetric trigger and equivalence audit
        run: |
          mkdir -p artifacts/pbai-p1/c001
          node tools/engineering/verify-pbai-c001-premetric.js \
            --baseline-root baseline-worktree \
            --output artifacts/pbai-p1/c001/premetric-safety.json

      - name: Verify premetric result remains outcome-blind
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('artifacts/pbai-p1/c001/premetric-safety.json', 'utf8'));
          if (r.status !== 'PASS') throw new Error('premetric status not PASS');
          if (r.candidateBenefitMetricsObservedBeforePass !== false) throw new Error('benefit leakage');
          if (r.d4ReferenceEvaluated !== false) throw new Error('D4 reference leakage');
          if (r.validationSeedsAccessed !== false || r.releaseHoldoutSeedsAccessed !== false) throw new Error('split firewall breach');
          if (r.selectedTargets !== 64) throw new Error('target selection mismatch');
          if (r.checks.targetTriggerFailures !== 0) throw new Error('target trigger failure');
          if (r.checks.featureOffBaselineMismatches !== 0) throw new Error('feature-off baseline mismatch');
          if (r.checks.targetLegacyRoutingMismatches !== 0) throw new Error('legacy routing mismatch');
          if (r.checks.controlTriggerFailures !== 0 || r.checks.controlEquivalenceMismatches !== 0 || r.checks.controlBaselineMismatches !== 0) throw new Error('control failure');
          console.log(JSON.stringify(r, null, 2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: pbai-c001-premetric-safety
          path: artifacts/pbai-p1/c001/premetric-safety.json
          if-no-files-found: error
