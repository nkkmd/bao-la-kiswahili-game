name: STSCV Stage 2 Formal

on:
  push:
    branches:
      - research/g2-03-state-transformation-semantics-canonicalization-validation
    paths:
      - 'doc/state-transformation-semantics-canonicalization-validation/preregistration/STAGE_2_AUTHORIZATION.json'

jobs:
  stage2-formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine regression
        run: node test/engine.test.js
      - name: Reconstruct frozen production and independent sources
        run: |
          cat tools/experiments/stscv-stage2-formal-parts/run-stscv-stage2-formal.part*.jsfrag > tools/experiments/run-stscv-stage2-formal.generated.js
          cat tools/experiments/stscv-stage2-formal-parts/verify-stscv-stage2-formal.part*.jsfrag > tools/experiments/verify-stscv-stage2-formal.generated.js
          node --check tools/experiments/run-stscv-stage2-formal.generated.js
          node --check tools/experiments/verify-stscv-stage2-formal.generated.js
      - name: Fresh held-out Stage 2 production measurement
        run: |
          mkdir -p artifacts/local/state-transformation-semantics-canonicalization-validation/stage2-formal-v1
          node tools/experiments/run-stscv-stage2-formal.generated.js \
            --output artifacts/local/state-transformation-semantics-canonicalization-validation/stage2-formal-v1/STAGE_2_PRODUCTION_RESULT.json
      - name: Independent Stage 2 verification and frozen decision rule
        run: |
          node tools/experiments/verify-stscv-stage2-formal.generated.js \
            --production artifacts/local/state-transformation-semantics-canonicalization-validation/stage2-formal-v1/STAGE_2_PRODUCTION_RESULT.json \
            --verification artifacts/local/state-transformation-semantics-canonicalization-validation/stage2-formal-v1/STAGE_2_INDEPENDENT_VERIFICATION.json \
            --result artifacts/local/state-transformation-semantics-canonicalization-validation/stage2-formal-v1/STAGE_2_FORMAL_RESULT.json
      - name: Canonical hashes
        run: |
          cd artifacts/local/state-transformation-semantics-canonicalization-validation/stage2-formal-v1
          sha256sum STAGE_2_PRODUCTION_RESULT.json STAGE_2_INDEPENDENT_VERIFICATION.json STAGE_2_FORMAL_RESULT.json > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stscv-stage2-formal-v1
          path: artifacts/local/state-transformation-semantics-canonicalization-validation/stage2-formal-v1/
          if-no-files-found: error
