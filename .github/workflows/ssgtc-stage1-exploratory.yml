name: SSGTC Stage 1 exploratory characterization

on:
  pull_request:
    paths:
      - "public/engine.js"
      - "tools/experiments/run-ssgtc-stage1-exploratory.js"
      - "tools/experiments/verify-ssgtc-stage1-independent.js"
      - "tools/experiments/lib/ssgtc-representation-*.js"
      - "doc/state-space-game-tree-complexity/**"
      - ".github/workflows/ssgtc-stage1-exploratory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage1-exploratory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare outcome-blind corrected execution copy
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path("tools/experiments/run-ssgtc-stage1-exploratory.js")
          dst = Path("tools/experiments/run-ssgtc-stage1-exploratory-exec.js")
          text = src.read_text(encoding="utf-8")

          old_g9 = '    "S1-G9-NO-SYMMETRY": !/symmetry-isomorphic|orisc-transform|canonicalizeState|seatSwap|leftRightReflection/.test(source),'
          new_g9 = '    "S1-G9-NO-SYMMETRY": !source.split("\\n").filter((line) => /^\\s*const\\s+[^=]+?=\\s*require\\(/.test(line)).some((line) => /symmetry|orisc|sip/i.test(line)),'
          if text.count(old_g9) != 1:
              raise SystemExit("expected exactly one frozen G9 line")
          text = text.replace(old_g9, new_g9)

          marker = '  const indegreeValues = Array.from(indegree.values());'
          if text.count(marker) != 1:
              raise SystemExit("expected exactly one completed-layer insertion marker")

          completed_layer_lines = [
              '  // Outcome-blind correction: complete-layer summaries exclude any individually',
              '  // processed parents in a censored partial depth. Raw expansion is unchanged.',
              '  branchingValues.length = 0;',
              '  fullyExpandedNonterminalStates = 0;',
              '  fullyExpandedTerminalStates = 0;',
              '  forcedSingleStates = 0;',
              '  captureForcedStates = 0;',
              '  nonCaptureChoiceStates = 0;',
              '  mixedMoveTypeStates = 0;',
              '  const completedOutgoingByParent = new Map();',
              '  for (const line of fs.readFileSync(transitionsPath, "utf8").split("\\n").filter(Boolean)) {',
              '    const row = JSON.parse(line);',
              '    if (row.parentDepth <= lastFullyExpandedDepth) {',
              '      if (!completedOutgoingByParent.has(row.parentKey)) completedOutgoingByParent.set(row.parentKey, []);',
              '      completedOutgoingByParent.get(row.parentKey).push(row);',
              '    }',
              '  }',
              '  for (const [key, value] of stateByKey.entries()) {',
              '    if (value.depth > lastFullyExpandedDepth) continue;',
              '    if (value.state.winner !== null) {',
              '      fullyExpandedTerminalStates += 1;',
              '      continue;',
              '    }',
              '    const completedEdges = completedOutgoingByParent.get(key) || [];',
              '    ensure(completedEdges.length > 0, `completed-layer nonterminal has no outgoing edge ${key}`);',
              '    fullyExpandedNonterminalStates += 1;',
              '    branchingValues.push(completedEdges.length);',
              '    if (completedEdges.length === 1) forcedSingleStates += 1;',
              '    const completedCaptures = completedEdges.filter((edge) => edge.move.type === "capture").length;',
              '    if (completedCaptures === completedEdges.length) captureForcedStates += 1;',
              '    else if (completedCaptures === 0) nonCaptureChoiceStates += 1;',
              '    else mixedMoveTypeStates += 1;',
              '  }',
          ]
          completed_layer_reaggregation = "\n".join(completed_layer_lines) + "\n"
          text = text.replace(marker, completed_layer_reaggregation + "\n" + marker)
          if text.count(new_g9) != 1:
              raise SystemExit("G9 correction was not singular")
          if text.count("Outcome-blind correction: complete-layer summaries") != 1:
              raise SystemExit("completed-layer correction was not singular")
          dst.write_text(text, encoding="utf-8")
          PY

      - name: Run frozen Stage 1 production expansion
        env:
          SSGTC_STAGE1_OUT: ${{ runner.temp }}/ssgtc-stage1-exploratory-v1
        run: node tools/experiments/run-ssgtc-stage1-exploratory-exec.js

      - name: Run separate-process Stage 1 independent verification
        env:
          SSGTC_STAGE1_OUT: ${{ runner.temp }}/ssgtc-stage1-exploratory-v1
        run: node tools/experiments/verify-ssgtc-stage1-independent.js

      - name: Upload Stage 1 exploratory artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssgtc-stage1-exploratory-v1
          path: ${{ runner.temp }}/ssgtc-stage1-exploratory-v1
          if-no-files-found: warn
