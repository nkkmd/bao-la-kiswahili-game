name: Blunder misvaluation Stage 1 tooling validation

on:
  push:
    branches:
      - research/blunder-misvaluation-patterns
    paths:
      - "public/engine.js"
      - "public/ai.js"
      - "public/ai-weights.js"
      - "tools/benchmark.js"
      - "tools/experiments/lib/position-typology-features.js"
      - "tools/experiments/lib/position-complexity-search-diagnostic.js"
      - "tools/experiments/lib/tactical-motif-features.js"
      - "tools/experiments/lib/tactical-motif-stage1-corpus.js"
      - "tools/experiments/lib/blunder-misvaluation-patterns.js"
      - "tools/experiments/lib/blunder-misvaluation-stage1-contract.js"
      - "tools/experiments/lib/blunder-misvaluation-stage1-discovery.js"
      - "tools/experiments/lib/blunder-misvaluation-stage1-corpus.js"
      - "tools/experiments/validate-blunder-misvaluation-stage1-spec.js"
      - "tools/experiments/run-blunder-misvaluation-stage1-exploratory.js"
      - "tools/experiments/verify-blunder-misvaluation-stage1-exploratory.js"
      - "test/blunder-misvaluation-stage1-contract.test.js"
      - "test/blunder-misvaluation-stage1-tooling.test.js"
      - "doc/blunder-misvaluation-patterns/preregistration/STAGE_1_EXPLORATORY_SPEC.json"
      - ".github/workflows/blunder-misvaluation-stage1-tooling.yml"
  pull_request:
    paths:
      - "tools/experiments/lib/blunder-misvaluation-stage1-*.js"
      - "tools/experiments/run-blunder-misvaluation-stage1-exploratory.js"
      - "tools/experiments/verify-blunder-misvaluation-stage1-exploratory.js"
      - "test/blunder-misvaluation-stage1-*.test.js"
      - "doc/blunder-misvaluation-patterns/preregistration/STAGE_1_EXPLORATORY_SPEC.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/experiments/validate-blunder-misvaluation-stage1-spec.js
      - run: node test/blunder-misvaluation-stage1-contract.test.js
      - run: node test/blunder-misvaluation-stage1-tooling.test.js
      - name: Confirm authorization remains absent at tooling gate
        run: test ! -e doc/blunder-misvaluation-patterns/preregistration/STAGE_1_EXPLORATORY_AUTHORIZATION.json
