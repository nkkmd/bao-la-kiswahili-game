name: G2-02 Search Reliability Stage 0 technical validation

on:
  push:
    branches:
      - research/g2-02-search-reliability-decision-robustness
    paths:
      - "public/engine.js"
      - "public/ai.js"
      - "public/ai-weights.js"
      - "tools/experiments/lib/position-complexity-search-diagnostic.js"
      - "tools/experiments/lib/search-reliability-decision-robustness.js"
      - "tools/experiments/run-search-reliability-stage0.js"
      - "tools/experiments/verify-search-reliability-stage0.js"
      - "test/position-complexity-search-diagnostic.test.js"
      - "test/search-reliability-decision-robustness-stage0.test.js"
      - "doc/search-reliability-decision-robustness/preregistration/STAGE_0_TECHNICAL_SPEC.json"
      - "doc/search-reliability-decision-robustness/preregistration/STAGE_0_AUTHORIZATION.json"
      - ".github/workflows/g2-02-search-reliability-stage0.yml"
  pull_request:
    paths:
      - "public/engine.js"
      - "public/ai.js"
      - "public/ai-weights.js"
      - "tools/experiments/lib/position-complexity-search-diagnostic.js"
      - "tools/experiments/lib/search-reliability-decision-robustness.js"
      - "tools/experiments/run-search-reliability-stage0.js"
      - "tools/experiments/verify-search-reliability-stage0.js"
      - "test/position-complexity-search-diagnostic.test.js"
      - "test/search-reliability-decision-robustness-stage0.test.js"
      - "doc/search-reliability-decision-robustness/preregistration/STAGE_0_TECHNICAL_SPEC.json"
      - "doc/search-reliability-decision-robustness/preregistration/STAGE_0_AUTHORIZATION.json"
      - ".github/workflows/g2-02-search-reliability-stage0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  technical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify frozen Stage 0 source authorization
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const authPath = 'doc/search-reliability-decision-robustness/preregistration/STAGE_0_AUTHORIZATION.json';
          const auth = JSON.parse(fs.readFileSync(authPath, 'utf8'));
          if (auth.technicalExecutionAuthorized !== true) throw new Error('technical execution is not authorized');
          for (const [p, expected] of Object.entries(auth.sourceFileSha256)) {
            const actual = crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
            if (actual !== expected) throw new Error(`source hash mismatch: ${p}: ${actual} != ${expected}`);
          }
          if (auth.scientificInferenceAuthorized !== false || auth.scientificGenerationAuthorized !== false || auth.formalEvidenceAuthorized !== false) {
            throw new Error('scientific authorization firewall violated');
          }
          console.log(JSON.stringify({
            stageId: auth.stageId,
            sourceFilesVerified: Object.keys(auth.sourceFileSha256).length,
            authorizationSha256: crypto.createHash('sha256').update(fs.readFileSync(authPath)).digest('hex'),
            scientificInferenceAuthorized: auth.scientificInferenceAuthorized,
            scientificGenerationAuthorized: auth.scientificGenerationAuthorized,
            formalEvidenceAuthorized: auth.formalEvidenceAuthorized
          }, null, 2));
          NODE
      - name: Validate prerequisite exact-root diagnostic
        run: node test/position-complexity-search-diagnostic.test.js
      - name: Validate G2-02 controlled-search semantics
        run: node test/search-reliability-decision-robustness-stage0.test.js
      - name: Run technical-only Stage 0 fixture audit
        run: node tools/experiments/run-search-reliability-stage0.js --output /tmp/srdr-stage0.json
      - name: Independently verify Stage 0 artifact
        run: node tools/experiments/verify-search-reliability-stage0.js --input /tmp/srdr-stage0.json
      - name: Show compact technical summary
        run: |
          node - <<'NODE'
          const r = require('/tmp/srdr-stage0.json');
          console.log(JSON.stringify({
            stageId: r.stageId,
            resultHash: r.resultHash,
            specSha256: r.specSha256,
            sourceFiles: Object.keys(r.sourceFileSha256).length,
            exactLegacyAgreement: {
              initial: r.exactLegacyAgreement.initial.map(x => ({depth:x.depth, allRootScoresEqual:x.allRootScoresEqual, topSetEqual:x.topSetEqual, bestScoreEqual:x.bestScoreEqual})),
              mtaji: {depth:r.exactLegacyAgreement.mtaji.depth, allRootScoresEqual:r.exactLegacyAgreement.mtaji.allRootScoresEqual, topSetEqual:r.exactLegacyAgreement.mtaji.topSetEqual, bestScoreEqual:r.exactLegacyAgreement.mtaji.bestScoreEqual}
            },
            budgetGrid: r.budgetAudit.grid.map(x => ({id:x.id, budget:x.budget, completedDepth:x.condition.completedDepth, estimable:x.condition.estimable})),
            pvAudit: r.pvAudit,
            scientificSeedConsumed: r.scientificSeedConsumed,
            scientificInferenceAuthorized: r.scientificInferenceAuthorized,
            formalEvidenceAuthorized: r.formalEvidenceAuthorized
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: srdr-stage0-technical-audit
          path: /tmp/srdr-stage0.json
          if-no-files-found: error
          retention-days: 14
