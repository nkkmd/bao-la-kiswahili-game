name: GCLD Stage 2 Exact Artifact Mirror

on:
  push:
    branches:
      - research/g3-10-geometry-conditioned-longitudinal-dynamics
    paths:
      - doc/geometry-conditioned-longitudinal-dynamics/authorizations/STAGE2_RESULT_MIRROR_TRIGGER

permissions:
  contents: write
  actions: read

concurrency:
  group: gcld-stage2-exact-mirror-v1
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact trigger branch
        uses: actions/checkout@v4
        with:
          ref: research/g3-10-geometry-conditioned-longitudinal-dynamics
          fetch-depth: 0

      - name: Download and verify durable Stage 2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ID=9916587217
          EXPECTED_ZIP_SHA=63e55a9a8f5d6c3752c15cee06a01c327fd717606bf7086b3d1242f780126a4f
          ZIP=/tmp/gcld-stage2.zip
          OUT=/tmp/gcld-stage2

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$ZIP"
          ACTUAL_ZIP_SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          test "$ACTUAL_ZIP_SHA" = "$EXPECTED_ZIP_SHA"

          rm -rf "$OUT"
          mkdir -p "$OUT"
          unzip -q "$ZIP" -d "$OUT"

          cat > /tmp/expected.sha256 <<'EOF'
          b46288a8c25c3d00d0cb84500bda8af9adea943cc372cfbde467e05f59a0fb97  STAGE_2_CANDIDATE_MANIFEST.json
          21e287425efd7c58526e51dab8b9fe1867c8de86d6e4d32f8c3444f1a6aa2b76  STAGE_2_FORMAL_INFERENCE.json
          08f31652fb599cf9db9b839cbc07f8aabe06aed69215208ec0556e6ec3a5bf7a  STAGE_2_FORMAL_RESULT.json
          3be240bfdcaadca6bb20d3bd68be7d331402b038982ab45ddc790f3070400d3c  STAGE_2_LONGITUDINAL_SUMMARIES.json
          0f61c17635eadc69c02d55b5222b44e9b6fe60c7764c329b961752eecdd07296  STAGE_2_MEASURED_POPULATION.json
          55323993beefc0854875a9392d19c5043e2b26a246ca78bdc072ede5b8f874e8  STAGE_2_PREFLIGHT_ELIGIBILITY.json
          2adcfe49dcc6b9c9cddd178a28455414e8464c53af59364d2d670cf8f7232e08  STAGE_2_TRAJECTORY_MEASUREMENTS_INDEPENDENT.json
          2adcfe49dcc6b9c9cddd178a28455414e8464c53af59364d2d670cf8f7232e08  STAGE_2_TRAJECTORY_MEASUREMENTS_PRODUCTION.json
          EOF
          sed -i 's/^          //' /tmp/expected.sha256

          (cd "$OUT" && sha256sum -c /tmp/expected.sha256)

          find "$OUT" -maxdepth 1 -type f -printf '%f\n' | sort > /tmp/actual-files.txt
          cut -d' ' -f3 /tmp/expected.sha256 | sort > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Mirror exact artifact bytes into repository
        shell: bash
        run: |
          set -euo pipefail
          DEST=doc/geometry-conditioned-longitudinal-dynamics/results/stage-2
          mkdir -p "$DEST"
          cp /tmp/gcld-stage2/* "$DEST"/

          git status --short
          git add "$DEST"
          git diff --cached --quiet && { echo 'No mirror changes detected'; exit 1; }

          CHANGED=$(git diff --cached --name-only)
          while IFS= read -r path; do
            case "$path" in
              doc/geometry-conditioned-longitudinal-dynamics/results/stage-2/*) ;;
              *) echo "Unexpected staged path: $path" >&2; exit 1 ;;
            esac
          done <<< "$CHANGED"

      - name: Commit exact-byte recovery only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mirror exact GCLD Stage 2 canonical artifact"
          git push origin HEAD:research/g3-10-geometry-conditioned-longitudinal-dynamics
