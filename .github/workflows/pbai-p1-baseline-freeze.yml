name: PBAI-P1 AI-GEN2 baseline freeze

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'tools/engineering/inspect-pbai-ai-gen2-baseline.js'
      - 'doc/ai-engineering/public-ai-improvement-program-1/**'
      - 'test/**'
      - '.github/workflows/pbai-p1-baseline-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialize AI-GEN2 baseline inspection
        run: |
          mkdir -p artifacts/pbai-p1
          node tools/engineering/inspect-pbai-ai-gen2-baseline.js | tee artifacts/pbai-p1/ai-gen2-baseline-inspection.json
      - name: Run AI-GEN2 relevant regression suite
        run: |
          node test/engine.test.js
          node test/ai.test.js
          node test/evaluation.test.js
          node test/search.test.js
          node test/ai-config.test.js
          node test/ai-worker.test.js
          node test/tactical.test.js
          node test/public-ai-improvement-program1-contract.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: pbai-p1-ai-gen2-baseline-inspection
          path: artifacts/pbai-p1/ai-gen2-baseline-inspection.json
          if-no-files-found: error
