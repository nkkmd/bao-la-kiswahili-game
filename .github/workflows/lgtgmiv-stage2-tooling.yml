name: LGTGMIV Stage 2 Non-Scientific Tooling Smoke

on:
  push:
    branches:
      - research/pre-g3-02-local-game-tree-geometry-measurement-instrument-verification
    paths:
      - .github/workflows/lgtgmiv-stage2-tooling.yml
      - tools/experiments/lib/lgtgmiv-stage2-production.js
      - tools/experiments/lib/lgtgmiv-stage2-independent.js
      - tools/experiments/verify-lgtgmiv-stage2-tooling.js

permissions:
  contents: read

concurrency:
  group: lgtgmiv-stage2-tooling-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Stage 2 tooling without fresh holdout access
        run: node tools/experiments/verify-lgtgmiv-stage2-tooling.js
