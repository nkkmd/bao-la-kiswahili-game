name: SSGTC closure consistency audit

on:
  pull_request:
    paths:
      - "doc/RESEARCH_INDEX.md"
      - "doc/FUTURE_RESEARCH_AGENDA.md"
      - "doc/research-program-decisions/2026-08-25-state-space-game-tree-complexity-study1-closure.md"
      - "doc/state-space-game-tree-complexity/**"
      - "tools/experiments/check-ssgtc-closure-consistency.js"
      - "tools/experiments/run-ssgtc-*.js"
      - "tools/experiments/verify-ssgtc-*.js"
      - "tools/experiments/lib/ssgtc-representation-*.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify closure consistency
        run: |
          set +e
          node tools/experiments/check-ssgtc-closure-consistency.js > "$RUNNER_TEMP/ssgtc-closure-audit.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/ssgtc-closure-audit.log"
          exit $status

      - name: Syntax-check SSGTC tooling
        run: |
          node --check tools/experiments/check-ssgtc-closure-consistency.js
          node --check tools/experiments/run-ssgtc-stage0-technical.js
          node --check tools/experiments/verify-ssgtc-stage0-independent.js
          node --check tools/experiments/run-ssgtc-stage1-exploratory.js
          node --check tools/experiments/verify-ssgtc-stage1-independent.js
          node --check tools/experiments/run-ssgtc-stage2-formal.js
          node --check tools/experiments/verify-ssgtc-stage2-independent.js
          node --check tools/experiments/lib/ssgtc-representation-production.js
          node --check tools/experiments/lib/ssgtc-representation-independent.js

      - name: Upload closure audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssgtc-closure-audit-log
          path: ${{ runner.temp }}/ssgtc-closure-audit.log
          if-no-files-found: warn
