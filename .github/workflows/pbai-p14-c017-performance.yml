name: PBAI-C017 performance validation 002

on:
  push:
    branches:
      - engineering/pbai-p14-c017-performance-002
    paths:
      - '.github/workflows/pbai-p14-c017-performance.yml'
      - 'doc/ai-engineering/public-ai-improvement-program-14/C017_PERFORMANCE_002_SPEC.md'
      - 'test/pbai-c017-performance-contract.test.cjs'
      - 'tools/engineering/measure-pbai-c017-performance.cjs'
      - 'tools/engineering/aggregate-pbai-c017-performance.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fetch pinned baseline and candidate commits
        run: |
          git fetch --no-tags --depth=1 origin 22537fb192b6c5bd1e2f3e6bca7488d7baa6f91b
          git fetch --no-tags --depth=1 origin e9e98290d600bc342a748b80d4589473a0b5ac57
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regression and pinned-source tests
        run: node --test test/ai-generation-release.test.js test/pbai-c017-performance-contract.test.cjs
      - name: Syntax and checkpoint timing smoke test
        run: |
          node --check tools/engineering/measure-pbai-c017-performance.cjs
          node --check tools/engineering/aggregate-pbai-c017-performance.cjs
          node tools/engineering/measure-pbai-c017-performance.cjs --preflight /tmp/c017-performance-preflight.json

  performance-shard:
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fetch pinned baseline and candidate commits
        run: |
          git fetch --no-tags --depth=1 origin 22537fb192b6c5bd1e2f3e6bca7488d7baa6f91b
          git fetch --no-tags --depth=1 origin e9e98290d600bc342a748b80d4589473a0b5ac57
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fixed-depth paired timing shard ${{ matrix.shard }}
        run: node tools/engineering/measure-pbai-c017-performance.cjs ${{ matrix.shard }} artifacts/pbai-p14/c017-performance-002/shard-${{ matrix.shard }}.json
      - name: Preserve latest atomic checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbai-p14-c017-performance-002-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: artifacts/pbai-p14/c017-performance-002/shard-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate-performance:
    if: always() && needs.performance-shard.result == 'success'
    needs: [performance-shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download all successful timing shards
        uses: actions/download-artifact@v4
        with:
          pattern: pbai-p14-c017-performance-002-shard-*
          path: artifacts/pbai-p14/c017-performance-002-downloads
      - name: Verify coverage, paired outputs, and frozen speed gate
        run: |
          mkdir -p artifacts/pbai-p14/c017-performance-002-canonical
          node tools/engineering/aggregate-pbai-c017-performance.cjs artifacts/pbai-p14/c017-performance-002-downloads artifacts/pbai-p14/c017-performance-002-canonical/c017-performance-002.json
      - name: Save canonical performance record
        uses: actions/upload-artifact@v4
        with:
          name: pbai-p14-c017-performance-002-${{ github.run_id }}
          path: artifacts/pbai-p14/c017-performance-002-canonical/c017-performance-002.json
          if-no-files-found: error
          retention-days: 90
