name: PBAI-P2 C009 feature-off equivalence

on:
  push:
    branches:
      - engineering/pbai-p2-c009-v1-development
    paths:
      - 'tools/engineering/run-pbai-p2-c009-feature-off-equivalence.js'
      - 'tools/engineering/verify-pbai-p2-c009-feature-off-equivalence-independent.js'
      - '.github/workflows/pbai-p2-c009-feature-off-equivalence.yml'

permissions:
  contents: read

jobs:
  feature-off-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify candidate and frozen technical boundary
        run: |
          test "$(sha256sum public/ai.js | awk '{print $1}')" = "750678ec33c916da35844dc2d999cc3b996c1cc6ec79ad84e12030f0da84517f"
          test "$(sha256sum public/engine.js | awk '{print $1}')" = "e6acf1fe4d97db67dbcfadc3a785e802342ae0b0cbaec35f53eb8e77424cfc1c"
          grep -q 'pbaiC009SingleReplyExtension' public/ai.js
          node --check tools/engineering/run-pbai-p2-c009-feature-off-equivalence.js
          node --check tools/engineering/verify-pbai-p2-c009-feature-off-equivalence-independent.js
          node - <<'NODE'
          const fs=require('node:fs');
          const p='doc/ai-engineering/public-ai-improvement-program-2/candidates/PBAI-C009-v1-feature-off-equivalence-spec.json';
          const s=JSON.parse(fs.readFileSync(p,'utf8'));
          if(s.status!=='FROZEN-BEFORE-CANDIDATE-SOURCE-CHANGE') throw new Error('equivalence spec not frozen');
          if(s.population.seedStart!==43500001||s.population.seedEnd!==43500064||s.population.seedCount!==64) throw new Error('technical population changed');
          if(s.candidateFeatureFlag!=='pbaiC009SingleReplyExtension'||s.candidateFeatureValue!==false) throw new Error('feature-off contract changed');
          if(s.gate.comparisonMismatchesMaximum!==0||s.gate.candidateDiagnosticPresenceMaximum!==0) throw new Error('equivalence gate changed');
          if(s.firewall.developmentSeedBlockMayBeAccessed!==false||s.firewall.validationSeedBlockMayBeAccessed!==false||s.firewall.releaseHoldoutSeedBlockMayBeAccessed!==false) throw new Error('protected split firewall changed');
          if(s.researchGeneration3Influence!==false) throw new Error('G3 firewall changed');
          NODE

      - name: Materialize frozen baseline source
        run: |
          mkdir -p artifacts/pbai-p2/c009/equivalence
          git show 2265fb7ccbf6cf6dde6ab08d5519e44e61b9e972:public/ai.js > artifacts/pbai-p2/c009/equivalence/baseline-ai.js
          test "$(sha256sum artifacts/pbai-p2/c009/equivalence/baseline-ai.js | awk '{print $1}')" = "2823dbcf96c7a47489301ecd768a63975aa8b4e12b62cc4629fc8283ef5dff9e"

      - name: Run production feature-off equivalence
        run: |
          set +e
          node tools/engineering/run-pbai-p2-c009-feature-off-equivalence.js \
            --baseline-ai artifacts/pbai-p2/c009/equivalence/baseline-ai.js \
            --output artifacts/pbai-p2/c009/equivalence/result.json
          echo "production_exit=$?"
          exit 0

      - name: Independently reconstruct feature-off equivalence
        run: |
          set +e
          node tools/engineering/verify-pbai-p2-c009-feature-off-equivalence-independent.js \
            --baseline-ai artifacts/pbai-p2/c009/equivalence/baseline-ai.js \
            --production artifacts/pbai-p2/c009/equivalence/result.json \
            --output artifacts/pbai-p2/c009/equivalence/verification.json
          echo "independent_exit=$?"
          exit 0

      - name: Verify technical reconstruction and firewall
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('artifacts/pbai-p2/c009/equivalence/result.json','utf8'));
          const v=JSON.parse(fs.readFileSync('artifacts/pbai-p2/c009/equivalence/verification.json','utf8'));
          if(v.productionRunnerImported!==false||v.productionSelectedRootsTrustedWithoutReconstruction!==false) throw new Error('independent verifier boundary failed');
          if(v.fullComparisonRowsEquality!==true||v.deterministicCoreEquality!==true) throw new Error('independent reconstruction mismatch');
          if(r.candidateBenefitMetricsComputed!==false||r.developmentSeedsAccessed!==false||r.validationSeedsAccessed!==false||r.releaseHoldoutSeedsAccessed!==false||r.researchGeneration3ArtifactsAccessed!==false) throw new Error('equivalence firewall failed');
          if(r.decision.validationAuthorized!==false||r.decision.releaseHoldoutAuthorized!==false) throw new Error('protected authorization leaked');
          if(!['FEATURE-OFF-EQUIVALENCE-PASS','TECHNICAL-INVALID-REJECT-OR-HOLD'].includes(r.decision.disposition)) throw new Error('unexpected equivalence disposition');
          console.log(JSON.stringify({deterministicCoreSha256:r.deterministicCoreSha256,population:r.population,measurement:r.measurement,decision:r.decision,independentVerification:v},null,2));
          NODE

      - name: Record artifact hashes
        run: |
          sha256sum artifacts/pbai-p2/c009/equivalence/result.json
          sha256sum artifacts/pbai-p2/c009/equivalence/verification.json

      - uses: actions/upload-artifact@v4
        with:
          name: pbai-p2-c009-feature-off-equivalence
          path: |
            artifacts/pbai-p2/c009/equivalence/result.json
            artifacts/pbai-p2/c009/equivalence/verification.json
          if-no-files-found: error
