name: Symmetry Isomorphism Stage 1 Formal

on:
  push:
    branches:
      - research/symmetry-isomorphic-positions
    paths:
      - "doc/symmetry-isomorphic-positions/preregistration/STAGE_1_AUTHORIZATION.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regression and frozen-source syntax checks
        run: |
          node test/engine.test.js
          node test/symmetry-isomorphism-stage0.test.js
          node --check tools/experiments/materialize-symmetry-isomorphism-stage1-domain.js
          node --check tools/experiments/run-symmetry-isomorphism-stage1-formal.js
          node --check tools/experiments/verify-symmetry-isomorphism-stage1-formal.js
      - name: Re-materialize frozen source domain before scientific outcome
        run: |
          node tools/experiments/materialize-symmetry-isomorphism-stage1-domain.js \
            --output doc/symmetry-isomorphic-positions/preregistration/STAGE_1_DOMAIN.json
          ACTUAL=$(sha256sum doc/symmetry-isomorphic-positions/preregistration/STAGE_1_DOMAIN.json | awk '{print $1}')
          EXPECTED=$(node -e "console.log(require('./doc/symmetry-isomorphic-positions/preregistration/STAGE_1_FORMAL_SPEC.json').sourceSha256.domain)")
          test "$ACTUAL" = "$EXPECTED"
      - name: Generate production formal outcomes
        run: |
          node tools/experiments/run-symmetry-isomorphism-stage1-formal.js
      - name: Independent full verification
        run: |
          node tools/experiments/verify-symmetry-isomorphism-stage1-formal.js
      - name: Record workflow provenance
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const hash = (p) => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const out = {
            schemaVersion: 1,
            studyId: 'SIP-STUDY1',
            stageId: 'SIP-S1-FORMAL-2026-08-24-v1',
            workflowRunId: Number(process.env.GITHUB_RUN_ID),
            workflowRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            triggeringCommit: process.env.GITHUB_SHA,
            specSha256: hash('doc/symmetry-isomorphic-positions/preregistration/STAGE_1_FORMAL_SPEC.json'),
            authorizationSha256: hash('doc/symmetry-isomorphic-positions/preregistration/STAGE_1_AUTHORIZATION.json'),
            domainSha256: hash('doc/symmetry-isomorphic-positions/preregistration/STAGE_1_DOMAIN.json'),
            productionResultSha256: hash('doc/symmetry-isomorphic-positions/results/STAGE_1_PRODUCTION_RESULT.json'),
            independentVerificationSha256: hash('doc/symmetry-isomorphic-positions/results/STAGE_1_INDEPENDENT_VERIFICATION.json')
          };
          fs.writeFileSync('doc/symmetry-isomorphic-positions/results/STAGE_1_WORKFLOW_PROVENANCE.json', JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: symmetry-isomorphism-stage1-formal
          path: |
            doc/symmetry-isomorphic-positions/preregistration/STAGE_1_DOMAIN.json
            doc/symmetry-isomorphic-positions/results/STAGE_1_PRODUCTION_RESULT.json
            doc/symmetry-isomorphic-positions/results/STAGE_1_INDEPENDENT_VERIFICATION.json
            doc/symmetry-isomorphic-positions/results/STAGE_1_WORKFLOW_PROVENANCE.json
          if-no-files-found: error
      - name: Materialize verified formal artifacts on research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            doc/symmetry-isomorphic-positions/preregistration/STAGE_1_DOMAIN.json \
            doc/symmetry-isomorphic-positions/results/STAGE_1_PRODUCTION_RESULT.json \
            doc/symmetry-isomorphic-positions/results/STAGE_1_INDEPENDENT_VERIFICATION.json \
            doc/symmetry-isomorphic-positions/results/STAGE_1_WORKFLOW_PROVENANCE.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Research: materialize verified Symmetry Study 1 Stage 1 results"
          git push
