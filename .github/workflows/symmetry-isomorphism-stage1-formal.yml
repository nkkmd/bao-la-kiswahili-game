name: Symmetry Isomorphism Stage 1 — Closed Study Integrity Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closed-study-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify archived formal result is closed and non-estimable
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const formal = JSON.parse(fs.readFileSync('doc/symmetry-isomorphic-positions/results/STAGE_1_FORMAL_RESULT.json'));
          const productionPath = 'doc/symmetry-isomorphic-positions/results/STAGE_1_PRODUCTION_RESULT.json';
          const independentPath = 'doc/symmetry-isomorphic-positions/results/STAGE_1_INDEPENDENT_VERIFICATION.json';
          const hash = (p) => crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          if (formal.studyId !== 'SIP-STUDY1') throw new Error('unexpected studyId');
          if (formal.closed !== true || formal.formalDecision !== 'NON-ESTIMABLE') throw new Error('Study 1 is not in the canonical closed state');
          if (formal.outcomeSummary?.validated !== 0 || formal.outcomeSummary?.notValidated !== 0 || formal.outcomeSummary?.nonEstimable !== 5) throw new Error('canonical outcome summary mismatch');
          if (hash(productionPath) !== formal.formalRun.productionResultSha256) throw new Error('production result hash mismatch');
          if (hash(independentPath) !== formal.formalRun.independentVerificationSha256) throw new Error('independent verification hash mismatch');
          console.log('SIP-STUDY1 archived closure integrity verified. No new scientific outcome is generated by this workflow.');
          NODE

# SIP-STUDY1 is closed. The former formal outcome-generation steps are intentionally
# retired from CI. Frozen runners and preregistration artifacts remain in the repository
# for provenance, but generating a new Study 1 scientific outcome is not authorized.
