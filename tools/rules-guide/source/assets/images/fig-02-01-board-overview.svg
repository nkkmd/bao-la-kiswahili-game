<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">図2-1 Bao盤の全体像</title>
  <desc id="desc">4列8穴の盤。上2列はNorth、下2列はSouthが使い、中央側の2列が前列、外側の2列が後列である。</desc>
  <defs>
    <circle id="pit" r="30" fill="#fff" stroke="#4b5563" stroke-width="3"/>
    <g id="row"><use href="#pit" x="0"/><use href="#pit" x="82"/><use href="#pit" x="164"/><use href="#pit" x="246"/><use href="#pit" x="328"/><use href="#pit" x="410"/><use href="#pit" x="492"/><use href="#pit" x="574"/></g>
  </defs>
  <rect width="960" height="560" fill="#fff"/>
  <text x="480" y="36" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#2563eb">North</text>
  <text x="480" y="540" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#ea580c">South</text>
  <rect x="120" y="65" width="720" height="430" rx="28" fill="#f3f4f6" stroke="#374151" stroke-width="4"/>
  <rect x="145" y="83" width="670" height="180" rx="18" fill="#dbeafe" opacity="0.8"/>
  <rect x="145" y="297" width="670" height="180" rx="18" fill="#ffedd5" opacity="0.8"/>
  <line x1="145" y1="280" x2="815" y2="280" stroke="#111827" stroke-width="3" stroke-dasharray="10 8"/>
  <g transform="translate(193 128)"><use href="#row"/></g>
  <g transform="translate(193 218)"><use href="#row"/></g>
  <g transform="translate(193 342)"><use href="#row"/></g>
  <g transform="translate(193 432)"><use href="#row"/></g>
  <g font-family="sans-serif" font-size="18" font-weight="700" fill="#111827">
    <text x="42" y="134">後列</text><text x="42" y="224">前列</text>
    <text x="42" y="348">前列</text><text x="42" y="438">後列</text>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#374151">
    <text x="850" y="174">North側</text><text x="850" y="390">South側</text>
  </g>
</svg>
