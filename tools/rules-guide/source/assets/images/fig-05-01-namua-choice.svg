<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">図5-1 namuaでの手の選択</title>
  <desc id="desc">namuaでは最初に捕獲可能か確認する。可能なら捕獲が必須で、できない場合だけtakataを行う。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="900" height="420" fill="#fff"/>
  <text x="450" y="40" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700">namua: 最初に捕獲可能か確認する</text>
  <rect x="315" y="80" width="270" height="70" rx="16" fill="#fef3c7" stroke="#92400e" stroke-width="3"/>
  <text x="450" y="122" text-anchor="middle" font-family="sans-serif" font-size="20">捕獲可能な穴がある？</text>
  <line x1="365" y1="150" x2="210" y2="235" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="535" y1="150" x2="690" y2="235" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="285" y="190" font-family="sans-serif" font-size="18" fill="#166534">ある</text>
  <text x="600" y="190" font-family="sans-serif" font-size="18" fill="#991b1b">ない</text>
  <rect x="75" y="245" width="275" height="100" rx="18" fill="#dcfce7" stroke="#166534" stroke-width="4"/>
  <text x="212" y="282" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">捕獲手を選ぶ</text>
  <text x="212" y="317" text-anchor="middle" font-family="sans-serif" font-size="17">捕獲は必須</text>
  <rect x="550" y="245" width="275" height="100" rx="18" fill="#fee2e2" stroke="#991b1b" stroke-width="3"/>
  <text x="687" y="282" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">takataを行う</text>
  <text x="687" y="317" text-anchor="middle" font-family="sans-serif" font-size="17">開始穴の制約を確認</text>
  <text x="450" y="390" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b5563">捕獲できるのにtakataを選ぶことはできない。</text>
</svg>
