<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">図6-1 mtajiの手の開始</title>
  <desc id="desc">mtajiでは2個以上ある合法な開始穴を選び、その穴のketeをすべて取り上げ、選んだ方向へ1個ずつ蒔く。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="960" height="400" fill="#fff"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700">mtaji: 穴の中身をすべて取って始める</text>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="160" y="90" font-size="19" font-weight="700">1. 開始穴を選ぶ</text>
    <circle cx="160" cy="180" r="58" fill="#fef3c7" stroke="#92400e" stroke-width="4"/><text x="160" y="188" font-size="30" font-weight="700">4</text>
    <text x="480" y="90" font-size="19" font-weight="700">2. すべて取り上げる</text>
    <circle cx="480" cy="180" r="58" fill="#fff" stroke="#6b7280" stroke-width="3"/><text x="480" y="188" font-size="25">0</text>
    <g fill="#ea580c"><circle cx="450" cy="285" r="10"/><circle cx="475" cy="285" r="10"/><circle cx="500" cy="285" r="10"/><circle cx="525" cy="285" r="10"/></g>
    <text x="800" y="90" font-size="19" font-weight="700">3. 1個ずつ蒔く</text>
    <g fill="#fff" stroke="#6b7280" stroke-width="3"><circle cx="655" cy="180" r="30"/><circle cx="745" cy="180" r="30"/><circle cx="835" cy="180" r="30"/><circle cx="925" cy="180" r="30"/></g>
    <text x="655" y="188" font-size="24">1</text><text x="745" y="188" font-size="24">1</text><text x="835" y="188" font-size="24">1</text><text x="925" y="188" font-size="24">1</text>
  </g>
  <line x1="230" y1="180" x2="398" y2="180" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="550" y1="180" x2="625" y2="180" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="370" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b5563">図の「4」は手順説明用の例。合法手の優先順位は本文で確認する。</text>
</svg>
