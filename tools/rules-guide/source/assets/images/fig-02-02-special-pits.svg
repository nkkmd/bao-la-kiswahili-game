<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">図2-2 nyumba、kichwa、kimbiの位置</title>
  <desc id="desc">各前列の両端がkichwa、その隣がkimbi。SouthのA5とNorthのa5がnyumbaである。kichwaは太い二重枠、kimbiは点線、nyumbaは黄色い正方形で示す。</desc>
  <defs>
    <circle id="pit" r="29" fill="#fff" stroke="#6b7280" stroke-width="2"/>
    <g id="plain-row"><use href="#pit" x="0"/><use href="#pit" x="82"/><use href="#pit" x="164"/><use href="#pit" x="246"/><use href="#pit" x="328"/><use href="#pit" x="410"/><use href="#pit" x="492"/><use href="#pit" x="574"/></g>
  </defs>
  <rect width="960" height="620" fill="#fff"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">特別な穴の位置</text>
  <rect x="120" y="70" width="720" height="410" rx="28" fill="#f3f4f6" stroke="#374151" stroke-width="4"/>
  <g transform="translate(193 125)"><use href="#plain-row"/></g>
  <g transform="translate(193 215)"><use href="#plain-row"/></g>
  <g transform="translate(193 335)"><use href="#plain-row"/></g>
  <g transform="translate(193 425)"><use href="#plain-row"/></g>
  <g fill="none" stroke="#111827">
    <circle cx="193" cy="215" r="34" stroke-width="5"/><circle cx="767" cy="215" r="34" stroke-width="5"/>
    <circle cx="193" cy="335" r="34" stroke-width="5"/><circle cx="767" cy="335" r="34" stroke-width="5"/>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="8 5">
    <circle cx="275" cy="215" r="35"/><circle cx="685" cy="215" r="35"/>
    <circle cx="275" cy="335" r="35"/><circle cx="685" cy="335" r="35"/>
  </g>
  <rect x="410" y="186" width="58" height="58" rx="9" fill="#fef08a" stroke="#92400e" stroke-width="4"/>
  <rect x="492" y="306" width="58" height="58" rx="9" fill="#fef08a" stroke="#92400e" stroke-width="4"/>
  <g font-family="sans-serif" font-size="15" text-anchor="middle" dominant-baseline="middle">
    <text x="439" y="215">a5</text><text x="521" y="335">A5</text>
  </g>
  <g font-family="sans-serif" font-size="18" fill="#111827">
    <text x="155" y="535">太い二重枠: kichwa</text>
    <line x1="125" y1="530" x2="145" y2="530" stroke="#111827" stroke-width="6"/>
    <text x="420" y="535">青い点線: kimbi</text>
    <line x1="380" y1="530" x2="410" y2="530" stroke="#2563eb" stroke-width="4" stroke-dasharray="8 5"/>
    <text x="690" y="535">黄色い正方形: nyumba</text>
    <rect x="650" y="515" width="26" height="26" rx="4" fill="#fef08a" stroke="#92400e" stroke-width="3"/>
  </g>
  <text x="480" y="585" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b5563">上2列がNorth、下2列がSouth。特別な穴は前列にある。</text>
</svg>
