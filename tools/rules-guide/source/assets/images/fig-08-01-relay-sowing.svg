<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">図8-1 relay sowingの流れ</title>
  <desc id="desc">2個ある穴へ最後の1個を置いて3個にする。捕獲や特別な停止がなければ全3個を取り、同じ方向の次の3穴に各1個を置く。空だった終点で停止する。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="960" height="430" fill="#fff"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700">relay sowing: 占有穴から蒔きを続ける</text>
  <g font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="700"><text x="170" y="88">1. 最後の1個で2→3</text><text x="490" y="88">2. 全3個を取り上げる</text><text x="800" y="88">3. 次の3穴へ蒔く</text></g>
  <g fill="#fff" stroke="#6b7280" stroke-width="3">
    <circle cx="70" cy="185" r="30"/><circle cx="140" cy="185" r="30"/><circle cx="210" cy="185" r="30"/><circle cx="280" cy="185" r="30"/>
    <circle cx="385" cy="185" r="30"/><circle cx="455" cy="185" r="30"/><circle cx="525" cy="185" r="30"/><circle cx="595" cy="185" r="30"/>
    <circle cx="695" cy="185" r="30"/><circle cx="765" cy="185" r="30"/><circle cx="835" cy="185" r="30"/><circle cx="905" cy="185" r="30"/>
  </g>
  <g font-family="sans-serif" font-size="24" text-anchor="middle">
    <text x="70" y="193">3</text><text x="140" y="193">0</text><text x="210" y="193">0</text><text x="280" y="193">0</text>
    <text x="385" y="193">0</text><text x="455" y="193">0</text><text x="525" y="193">0</text><text x="595" y="193">0</text>
    <text x="695" y="193">0</text><text x="765" y="193">1</text><text x="835" y="193">1</text><text x="905" y="193">1</text>
  </g>
  <path d="M100 115 L76 147" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)"/>
  <g fill="#ea580c"><circle cx="450" cy="285" r="9"/><circle cx="480" cy="285" r="9"/><circle cx="510" cy="285" r="9"/></g>
  <line x1="310" y1="185" x2="342" y2="185" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/><line x1="625" y1="185" x2="654" y2="185" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M725 260 L915 260" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="800" y="305" text-anchor="middle" font-family="sans-serif" font-size="16">空だった終点に1個入り停止</text>
  <text x="480" y="395" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#4b5563">部分局面。捕獲とnyumbaなどの特別な停止条件はないものとする。</text>
</svg>
