<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Bao盤面座標の作業図</title>
  <desc id="desc">上側をNorth、下側をSouthとし、4列8穴の番号、nyumba、kichwa、kimbiの位置を示す。</desc>
  <style>
    text { font-family: sans-serif; fill: #111827; }
    .pit { fill: #fff; stroke: #4b5563; stroke-width: 2; }
    .house { fill: #fef3c7; stroke: #92400e; stroke-width: 3; }
    .head { stroke: #111827; stroke-width: 5; }
    .kimbi { stroke-dasharray: 7 5; }
    .north { fill: #2563eb; font-weight: 700; }
    .south { fill: #ea580c; font-weight: 700; }
    .row-label { font-size: 18px; font-weight: 700; }
    .pit-label { font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
  </style>
  <rect x="80" y="60" width="760" height="380" rx="24" fill="#f3f4f6" stroke="#374151" stroke-width="3"/>
  <text x="460" y="35" text-anchor="middle" class="north">North</text>
  <text x="460" y="480" text-anchor="middle" class="south">South</text>
  <text x="110" y="125" class="row-label">b</text>
  <text x="110" y="215" class="row-label">a</text>
  <text x="110" y="305" class="row-label">A</text>
  <text x="110" y="395" class="row-label">B</text>

  <g id="north-back">
    <circle class="pit" cx="190" cy="120" r="31"/><circle class="pit" cx="270" cy="120" r="31"/><circle class="pit" cx="350" cy="120" r="31"/><circle class="pit" cx="430" cy="120" r="31"/>
    <circle class="pit" cx="510" cy="120" r="31"/><circle class="pit" cx="590" cy="120" r="31"/><circle class="pit" cx="670" cy="120" r="31"/><circle class="pit" cx="750" cy="120" r="31"/>
    <text class="pit-label" x="190" y="120">b8</text><text class="pit-label" x="270" y="120">b7</text><text class="pit-label" x="350" y="120">b6</text><text class="pit-label" x="430" y="120">b5</text>
    <text class="pit-label" x="510" y="120">b4</text><text class="pit-label" x="590" y="120">b3</text><text class="pit-label" x="670" y="120">b2</text><text class="pit-label" x="750" y="120">b1</text>
  </g>
  <g id="north-front">
    <circle class="pit head" cx="190" cy="210" r="31"/><circle class="pit kimbi" cx="270" cy="210" r="31"/><circle class="pit" cx="350" cy="210" r="31"/>
    <rect class="house" x="399" y="179" width="62" height="62" rx="10"/><circle class="pit" cx="510" cy="210" r="31"/><circle class="pit" cx="590" cy="210" r="31"/><circle class="pit kimbi" cx="670" cy="210" r="31"/><circle class="pit head" cx="750" cy="210" r="31"/>
    <text class="pit-label" x="190" y="210">a8</text><text class="pit-label" x="270" y="210">a7</text><text class="pit-label" x="350" y="210">a6</text><text class="pit-label" x="430" y="210">a5</text>
    <text class="pit-label" x="510" y="210">a4</text><text class="pit-label" x="590" y="210">a3</text><text class="pit-label" x="670" y="210">a2</text><text class="pit-label" x="750" y="210">a1</text>
  </g>
  <g id="south-front">
    <circle class="pit head" cx="190" cy="300" r="31"/><circle class="pit kimbi" cx="270" cy="300" r="31"/><circle class="pit" cx="350" cy="300" r="31"/><circle class="pit" cx="430" cy="300" r="31"/>
    <rect class="house" x="479" y="269" width="62" height="62" rx="10"/><circle class="pit" cx="590" cy="300" r="31"/><circle class="pit kimbi" cx="670" cy="300" r="31"/><circle class="pit head" cx="750" cy="300" r="31"/>
    <text class="pit-label" x="190" y="300">A1</text><text class="pit-label" x="270" y="300">A2</text><text class="pit-label" x="350" y="300">A3</text><text class="pit-label" x="430" y="300">A4</text>
    <text class="pit-label" x="510" y="300">A5</text><text class="pit-label" x="590" y="300">A6</text><text class="pit-label" x="670" y="300">A7</text><text class="pit-label" x="750" y="300">A8</text>
  </g>
  <g id="south-back">
    <circle class="pit" cx="190" cy="390" r="31"/><circle class="pit" cx="270" cy="390" r="31"/><circle class="pit" cx="350" cy="390" r="31"/><circle class="pit" cx="430" cy="390" r="31"/>
    <circle class="pit" cx="510" cy="390" r="31"/><circle class="pit" cx="590" cy="390" r="31"/><circle class="pit" cx="670" cy="390" r="31"/><circle class="pit" cx="750" cy="390" r="31"/>
    <text class="pit-label" x="190" y="390">B1</text><text class="pit-label" x="270" y="390">B2</text><text class="pit-label" x="350" y="390">B3</text><text class="pit-label" x="430" y="390">B4</text>
    <text class="pit-label" x="510" y="390">B5</text><text class="pit-label" x="590" y="390">B6</text><text class="pit-label" x="670" y="390">B7</text><text class="pit-label" x="750" y="390">B8</text>
  </g>
</svg>
