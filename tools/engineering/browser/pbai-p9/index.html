<h1>Bao 論理ゲート評価器の動作検証</h1>
<p>既知の9局面で、AI-GEN3と候補PBAI-C015-v1の互換性を確認します。公開AIの切替や、新しい対局データの生成は行いません。</p>
<p>Workerを毎回作成する60件と、直接実行18件を順番に検証します。標準・低・高の設定は思考時間の違いです。このページをPCで実行してもスマートフォンの性能検証にはなりません。</p>
<button id="run">検証を実行</button><button id="save" disabled>結果を保存</button>
<p id="status" role="status">未実行</p><pre id="result">検証中はこのタブを前面に置いてください。所要時間は端末により異なります。</pre>
